claims:
  40c93e69d470_1:
    quotes:
    - exact: conducted in 2015 by the Coronary ARtery DIsease Genome wide Replication and Meta-analysis
        plus The Coronary Artery Disease Genetics (CARDIoGRAM plus C4D) consortium [11]. Specifically,
        the study is a GWAS meta-analysis of 60,801 CHD patients and 123,504 control patients obtained
        from 48 studies.
  aa498a6460d5_1:
    quotes:
    - exact: Given the gravity of MI, summary data on MI were extracted from this GWAS meta-analysis for
        subsequent MR analysis. The summary GWAS data for MI included 43,676 MI patients and 128,199 controls.
