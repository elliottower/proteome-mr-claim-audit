    - exact: we analyzed imputed data from nine studies not previously included in genome-wide association
        study (GWAS) meta-analyses (86,847 cases and 417,789 controls) and combined results with data
        from UK Biobank, the CARDIoGRAMplusC4D Consortium and Biobank Japan, achieving a total sample
        of 210,842 CAD cases among 1,378,170 participants
