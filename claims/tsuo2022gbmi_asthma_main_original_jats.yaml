claims:
  discovery-18:
    quotes:
    - exact: 'We performed fixed-effects meta-analysis with inverse variance weighting for 18 biobanks
        in GBMI: China Kadoorie Biobank (CKB), Generation Scotland (GS), Lifelines, QSKIN, East London
        Genes & Health (GNH), HUNT, UCLA Precision Health Biobank (UCLA), Colorado Center for Personalized
        Medicine (CCPM), Mass General Brigham (MGB), BioVU, BioMe, Michigan Genomics Initiative (MGI),
        BioBank Japan (BBJ), Estonian Biobank (ESTBB), deCODE Genetics (DECODE), FinnGen, Taiwan Biobank
        (TWB), and UK Biobank (UKBB).'
      section: 'STAR Methods: Meta-analysis'
  discovery-n:
    quotes:
    - exact: Altogether, these cohorts had a total sample size of 153,763 cases and 1,647,022 controls
        (Table S1).
      section: 'STAR Methods: Meta-analysis'
  replication-4:
    quotes:
    - exact: 'We also performed fixed-effects meta-analysis with inverse variance weighting for 4 additional
        biobanks that served as independent replication studies: Canadian Partnership for Tomorrow’s Health
        (CanPath), Qatar Biobank (QBB), Biobank of the Americas (BBofA), and Penn Medicine Biobank (PMBB).'
      section: STAR Methods
