claims:
  bbj-12-institutions:
    quotes:
    - exact: BBJ is a prospective biobank that collaboratively collected DNA and serum samples from 12
        medical institutions in Japan
      section: 'Methods: GWAS of 220 traits in BBJ'
  bbj-n:
    quotes:
    - exact: we analyzed 178,726 participants of East Asian ancestry
      section: 'Methods: GWAS of 220 traits in BBJ'
  ukb-finngen-gwas:
    quotes:
    - exact: We conducted the GWASs harmonized with BBJ in UKB and in FinnGen.
      section: Methods
  finngen-r3:
    quotes:
    - exact: For GWASs, we used the summary statistics of FinnGen release 3 data
      section: Methods
  meta-procedure:
    quotes:
    - exact: First, we performed intra-European meta-analysis when summary statistics of both UKB and
        FinnGen were available, and then performed cross-population meta-analysis across three or two
        cohorts
      section: 'Methods: Meta-analysis'
  release:
    quotes:
    - exact: The summary statistics of GWASs in this study (BioBank Japan, European, and cross-population
        meta-analyses) are also deposited at the National Bioscience Database Center (NBDC) Human Database
      section: Data availability
