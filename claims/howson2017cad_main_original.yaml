claims:
  design:
    quotes:
    - exact: we genotyped 56,309 participants using a targeted gene array derived from earlier GWAS results
        and meta-analysed results with 194,427 participants previously genotyped to give a total of 88,192
        CAD cases and 162,544 controls
      section: Abstract
  denovo-studies:
    quotes:
    - exact: the European (EUR) studies comprised 16,093 CAD cases and 16,616 controls from EPIC-CVD (a
        case-cohort study embedded in the pan-European EPIC prospective study), the Copenhagen City Heart
        Study (CCHS), the Copenhagen Ischemic Heart Disease Study (CIHDS) and the Copenhagen General Population
        Study (CGPS) all recruited within Copenhagen, Denmark.
      section: Online Methods
  denovo-sas:
    quotes:
    - exact: The South Asian (SAS) studies comprised up to 7,654 CAD cases and 7,014 controls from the
        Pakistan Risk of Myocardial Infarction Study (PROMIS) a case-control study that recruited samples
        from 9 sites in Pakistan, and the Bangladesh Risk of Acute Vascular Events (BRAVE) study based
        in Dhaka, Bangladesh.
      section: Online Methods
  denovo-eas:
    quotes:
    - exact: The East Asian (EA) studies comprised 4,129 CAD cases and 6,369 controls recruited from 7
        studies across Taiwan that collectively comprise the TAIwan metaboCHIp (TAICHI) Consortium.
      section: Online Methods
  denovo-aa:
    quotes:
