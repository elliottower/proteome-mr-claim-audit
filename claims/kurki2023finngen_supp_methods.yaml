claims:
  legacy-def:
    quotes:
    - exact: The FinnGen cohort consists of (a) legacy samples recruited by specific research projects,
        collected based on study-specific consents (Supplementary Table 2) and later transferred to a
        biobank according to the Finnish Biobank Act 13 § (mainly from the Biobank of the Finnish Institute
        for Health and Welfare (THL))
      section: Section 2
  r5-biobanks:
    quotes:
    - exact: 'from the following biobanks: Auria Biobank, Helsinki Biobank, Biobank of Eastern Finland,
        Central Finland Biobank, Northern Finland Biobank Borealis, Finnish Clinical Biobank Tampere,
        THL Biobank, Blood Service Biobank, and Terveystalo Biobank.'
      section: Section 2
  legacy-chips:
    quotes:
    - exact: 70,023 individuals from legacy collections genotyped with non-custom genotyping arrays
      section: Section 3
