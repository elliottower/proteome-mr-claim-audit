claims:
  primary-dataset:
    quotes:
    - exact: We obtained genome-wide genotype data from which we constructed 49 ancestry matched, non-overlapping
        case-control samples (46 of European and three of East Asian ancestry, 34,241 cases and 45,604
        controls) and 3 family-based samples of European ancestry (1,235 parent affected-offspring trios)
        (Supplementary Table 1 and Supplementary text). These comprise the primary PGC GWAS dataset.
      section: 'Results: 128 Independent Associated Loci'
  decode-top-snps:
    quotes:
    - exact: For the subset of LD (linkage disequilibrium)-independent SNPs with P < 1×10−6 in the meta-analysis,
        we next obtained results from deCODE genetics (1,513 cases and 66,236 controls of European ancestry).
      section: 'Results: 128 Independent Associated Loci'
  decode-combined:
    quotes:
    - exact: The deCODE data were then combined with those from the primary GWAS to give a dataset of
        36,989 cases and 113,075 controls.
      section: 'Results: 128 Independent Associated Loci'
  download-url:
    quotes:
    - exact: Results can be downloaded from the Psychiatric Genomics Consortium website (http://pgc.unc.edu)
      section: URLs
