        initiative)
  ukb-controls:
    quotes:
    - exact: Participants without a stroke diagnosis were included as controls.
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  bbj-controls:
    quotes:
    - exact: For GWAS, individuals without any stroke or intracranial aneurysm were selected as controls
        ( n=159,610).
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  decode-controls:
    quotes:
    - exact: Control comprised 254,176 individuals recruited through different genetic projects at at
        deCODE.
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  cadisp-cng:
    quotes:
    - exact: The majority of controls (N=9,046, of which 74 Finns and 8,972 non-Finnish Europeans) were
