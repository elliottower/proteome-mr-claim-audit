      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  glasgow-controls-b58c:
    quotes:
    - exact: Controls were drawn from shared WTCCC controls obtained from the 1958 Birth Cohort.
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  sifap-controls-kora:
    quotes:
    - exact: Controls free of cardiovascular diseases were selected from the KORA Study previously genotyped
        at CIDR in the same platform.
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  race-controls-promis:
