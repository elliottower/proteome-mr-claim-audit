    - exact: Control participants were individuals enrolled in the Pakistan Risk of Myocardial Infarction
        Study (PROMIS)
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  compass-handls:
    quotes:
    - exact: controls from the Healthy Aging in Neighborhoods of Diversity across the Life Span study
        (HANDLS) study were used for the VISP and SWISS-ISGS case-control analyses
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  compass-signet:
    quotes:
    - exact: The subset of REGARDS participants genotyped under SIGNET are referred to as SIGNET-REGARDS.
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  compass-isgs:
    quotes:
    - exact: Ischemic Stroke Genetic Study (ISGS)-African Americans
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  compass-swiss:
    quotes:
    - exact: Siblings with Ischemic Stroke Study (SWISS) – African Americans
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  compass-whi:
    quotes:
    - exact: Women’s Health Initiative (WHI) – African Americans
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  ich-gocha:
    quotes:
    - exact: Genetics of Cerebral Hemorrhage with Anticoagulation13 (GOCHA) study
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  ich-gerfhs:
    quotes:
    - exact: Genetic and Environmental Risk Factors for Hemorrhagic Stroke (GERFHS) studies I and II in
