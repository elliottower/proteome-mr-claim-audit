    quotes:
    - exact: SiGN- Group 4 consists of AA subjects from the GASROS, GCNKSS, ISGS, MCISS, MIAMISR, NOMAS,
        REGARDS, SPS3, SWISS, WHI, and WUSTL studies.
      section: Supplementary Information acknowledgements (SiGN)
  german-proscis-b:
    quotes:
    - exact: Prospective Cohort with Incident Stroke study (PROSCIS-B)
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  german-munich:
    quotes:
    - exact: Cases were consecutive European Caucasians recruited from a single tertiary level stroke
        center at LMU Hospital
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  german-sicfail:
    quotes:
    - exact: The Stroke-Induced Cardiac FAILure in mice and men (SICFAIL) study is a prospective hospital-based
        cohort study
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  german-controls-kora:
    quotes:
    - exact: For the German (Munich/Berlin/Würzburg) samples, independent control groups were selected
