      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  generacion-genisis:
    quotes:
    - exact: Genetics of Early Neurological Instability after Ischemic Stroke (GENISIS) is an international
        study
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  generacion-gods:
    quotes:
    - exact: The Genetic contribution to functional Outcome and Disability after Stroke (GODS) project
        is a study
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
