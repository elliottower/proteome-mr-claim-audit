      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  dutch-future:
    quotes:
    - exact: The FUTURE study (“Follow-Up of Transient ischemic attack and stroke patients and Unelucidated
        Risk factor Evaluation” study)
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  dutch-psi:
    quotes:
    - exact: The Dutch Parelsnoer initiative (PSI) Cerebrovascular Disease Study is a large prospective
        cohort study
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  dutch-odyssey:
    quotes:
    - exact: This study is part of the Observational Dutch Young Symptomatic StrokE studY (ODYSSEY)
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
  dutch-controls-als:
    quotes:
    - exact: The Dutch control subjects were population based controls from the Prospective amyotrophic
        lateral sclerosis (ALS) Study
      section: Supplementary Information section 2 (Description of study populations in the GIGASTROKE
        initiative)
