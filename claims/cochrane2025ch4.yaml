claims:
  thorough:
    quotes:
    - exact: Systematic reviews require a thorough, objective and reproducible search of a range of sources
        to identify as many eligible studies as possible (within resource limits).
      section: 4.2.2 Minimizing bias
  medline-alone:
    quotes:
    - exact: A search of MEDLINE alone is not considered adequate.
      section: 4.2.2 Minimizing bias
  unrepresentative:
    quotes:
    - exact: Relying exclusively on a MEDLINE search may retrieve a set of reports unrepresentative of
        all reports
      section: 4.2.2 Minimizing bias
