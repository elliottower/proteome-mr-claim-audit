claims:
  IARC-GWAS:
    quotes:
    - exact: 'The IARC-GWAS 2 comprised 3,062 lung cancer cases and 4,455 controls derived from five case-control
        studies: (i) Carotene and Retinol Efficacy Trial (CARET) cohort 38 ; (ii) The Central Europe multicenter
        hospital-based case-control 39 , 40 ; (iii) The hospital-based case-control study from France
        40 ; (iv) The hospital based case-control lung cancer study from Estonia 41 , 42 ; and (v) The
        population-based HUNT2/Tromsø IV lung cancer studies 43 .'
      section: 'Online Methods: IARC-GWAS'
  NCI-GWAS:
    quotes:
    - exact: 'Briefly, the study comprised samples from four series: (i) The Environment and Genetics
        in Lung cancer Etiology (EAGLE)'
      section: 'Online Methods: NCI-GWAS'
  CPS_II:
    quotes:
    - exact: (iv) The Cancer Prevention Study II Nutrition Cohort (CPS-II), a cohort study of approximately
        184,000 individuals enrolled by the American Cancer Society
      section: 'Online Methods: NCI-GWAS'
  PLCO:
    quotes:
    - exact: (iii) The Prostate, Lung, Colon, Ovary Screening Trial (PLCO)
      section: 'Online Methods: NCI-GWAS'
  ATBC:
    quotes:
    - exact: (ii) The Alpha-Tocopherol, Beta-Carotene Cancer Prevention Study (ATBC)
      section: 'Online Methods: NCI-GWAS'
  GELCAPS:
    quotes:
    - exact: ascertained through the Genetic Lung Cancer Predisposition Study (GELCAPS) conducted between
        March 1999 and July 2004
      section: 'Online Methods: ICR-GWAS'
  B58C_UKBS:
    quotes:
    - exact: Genotype frequencies were compared with publicly accessible data generated by the UK Wellcome
        Trust Case-Control Consortium 2 (WTCCC2) study 49 of individuals from the 1958 British Birth Cohort
        (58BC) and blood service
      section: 'Online Methods: ICR-GWAS'
  DECODE-controls:
    quotes:
    - exact: The controls used in this study consisted of individuals from other GWASs, age and sex-matched
        to cases
      section: 'Online Methods: deCODE'
  HARVARD-controls:
    quotes:
    - exact: Controls were healthy non-blood-related family members and friends of patients with cancer
        or with cardiothoracic conditions undergoing surgery.
      section: 'Online Methods: Harvard'
  MDACC-controls:
    quotes:
