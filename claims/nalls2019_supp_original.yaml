claims:
  three_sources:
    quotes:
    - exact: Three primary sources of data were used for discovery analyses, these include three previously
        published studies, 13 new datasets, and proxy-case data from the UK BioBank (UKB).
      section: Supplementary appendix, Methods supplement
  previous_studies:
    quotes:
    - exact: Previous studies include summary statistics from the meta-analyses of GWAS published in Nalls
        et al. 2014, GWAS summary statistics from the 23andMe Web-Based Study of Parkinson's Disease (PDWBS)
        cohort described in Chang et al. 2017, and the publicly available NeuroX dataset
      section: Supplementary appendix, Methods supplement
  seventeen_sets:
    quotes:
    - exact: variants seen in at least five of the 17 sets of summary statistics
      section: Supplementary appendix, Methods supplement
  table_s1_caption:
    quotes:
    - exact: 'Table S1: Descriptive statistics and quality control summaries for meta-analyzed genome-wide
        association studies.'
      section: Supplementary appendix, Table S1 caption
  post_chang_23andme:
    quotes:
    - exact: In the most recent dataset from 23andMe (post-Chang et al.) cases were ascertained via the
        criteria of self-report of diagnosis
      section: Supplementary appendix, Methods supplement
  sgpd:
    quotes:
    - exact: the System Genomics of Parkinson's Disease (SGPD) which utilized mixed modeling
      section: Supplementary appendix, Methods supplement
  ukb_proxy:
    quotes:
    - exact: UKB proxy-cases were defined as the report of a first degree relative with PD
      section: Supplementary appendix, Methods supplement
  myers_faroud:
