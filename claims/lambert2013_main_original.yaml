  stage1_four_consortia:
    quotes:
    - exact: 'In the stage 1 meta-analysis, we used data from four consortia: the Alzheimer’s Disease
        Genetic Consortium (ADGC), the Cohorts for Heart and Aging Research in Genomic Epidemiology (CHARGE)
        Consortium, the European Alzheimer’s Disease Initiative (EADI) and the Genetic and Environmental
        Risk in Alzheimer’s Disease (GERAD) Consortium'
