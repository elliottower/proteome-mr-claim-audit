    - exact: We used only the sentinel cis-pQTL with the lowest P value (P<1.7×10−11) from the complete
        UKB-PPP cohort for each protein as IVs
  905f30aa36b5_1:
    quotes:
    - exact: Outcome data on CHD and myocardial infarction from the CARDIoGRAMplusC4D 1000 Genomes project
        have been contributed by CARDIoGRAMplusC4D investigators and have been downloaded from www.CARDIOGRAMPLUSC4D.ORG,
        including 60 801 cases and 123 504 controls.
  905f30aa36b5_2:
    quotes:
    - exact: Causal estimates of association between genetic determinants of proteins and myocardial infarction
        from CARDIoGRAMplusC4D and FinnGen R10 outcome data were subsequently combined in meta-analysis
        using a fixed-effects model.
