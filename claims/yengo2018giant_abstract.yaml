claims:
  combine:
    quotes:
    - exact: Recent genome-wide association studies (GWAS) of height and body mass index (BMI) in ∼250000
        European participants have led to the discovery of ∼700 and ∼100 nearly independent single nucleotide
        polymorphisms (SNPs) associated with these traits, respectively. Here we combine summary statistics
        from those two studies with GWAS of height and BMI performed in ∼450000 UK Biobank participants
        of European ancestry.
      section: Abstract
