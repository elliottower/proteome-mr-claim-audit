claims:
  design:
    quotes:
    - exact: 'Our study comprised 7,219 cases and 15,991 controls of European ancestry: a new GWAS, meta-analysis
        with a published GWAS and a replication study.'
      section: Abstract
  gwas-hrs:
    quotes:
    - exact: These data were combined with the genotypes of 5,727 healthy controls taken from the University
        of Michigan Health and Retirement Study (HRS)
      section: Results
  gwas-n:
    quotes:
    - exact: our data comprised 4,036 SLE cases and 6,959 controls (1,260 controls mainly from southern
        Europe genotyped using the Omni1-Quad chip and 5,699 controls from the HRS cohort)
      section: Results
  hom-cgems:
    quotes:
    - exact: We used a further 2,107 previously genotyped controls from the NIH CGEMS study
      section: 'Online Methods: Data: Hom et al. study'
  replication-controls:
    quotes:
    - exact: The control data for the replication study comprised 3,672 subjects from the HRS cohort (independent
        of those used in the GWAS), 3,102 subjects from a study of melanoma and 1,202 subjects from a
        study of blood clotting.
      section: 'Online Methods: Data: replication study'
  biolupus-network:
    quotes:
    - exact: The following samples were obtained via the BIOLUPUS network coordinated by MEAR
      section: Acknowledgements
