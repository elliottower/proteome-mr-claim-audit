claims:
  826651bd2f08_1:
    quotes:
    - exact: We used GWAS data from the discovery cohort which were restricted to participants of European
        ancestry (n = 34,557).
  820e99772f92_1:
    quotes:
    - exact: Specifically, we obtained genetic associations with proteins from deCODE genetics, conducted
        in 35,559 Icelanders
  2b13ce54cdc6_1:
    quotes:
    - exact: GWAS summary statistics for CAD were obtained from a GWAS meta-analysis in CARDIoGRAMplusC4D
        (including UK Biobank), which involved 122,733 cases and 424,528 controls, primarily of European
        ancestry
  4ee4b677d82b_1:
    quotes:
    - exact: We also obtained genetic associations with the risk of CAD from FinnGen Biobank, which involved
        21,012 CAD cases and 197,780 controls.
