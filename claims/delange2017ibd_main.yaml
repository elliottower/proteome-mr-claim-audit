source:
  citation: delange2017ibd_main
  local: sources/delange2017ibd_main.txt
  sha256: d3e2fcc554e8e53801126fae27610e1c69e5befd3b67a5623f67c91a4e87f86d
  doi: 10.1038/ng.3760
  note: Main text of de Lange KM et al. 2017 Nat Genet 49:256-261 (PMC5289481, author manuscript), Europe
    PMC fullTextXML with tags stripped by a local script (one paragraph per line, table cells separated
    by " | ").
claims:
  new-gwas:
    quotes:
    - exact: we carried out a GWAS of 12,160 IBD cases and 13,145 population controls of European ancestry
        that had not been included in any genome-wide meta-analysis of IBD to date
      section: Results
  meta-with-iibdgc:
    quotes:
    - exact: We meta-analyzed our new GWAS data with previously published summary statistics from 12,882
        IBD cases and 21,770 population controls imputed using the 1000 Genomes Project reference panel1
      section: Results
  ref1-liu2015:
    quotes:
    - exact: 1LiuJZAssociation analyses identify 38 susceptibility loci for inflammatory bowel disease
      section: References
  uk-cases-humancoreexome:
    quotes:
    - exact: 11,768 British IBD cases, diagnosed using accepted endoscopic, histopathological and radiological
        criteria, were consented into the study and genotyped on the Human Core Exome v12.1
      section: 'Online Methods: GWAS'
  controls-understanding-society:
    quotes:
    - exact: 10,484 population control samples genotyped on the Human Core Exome v12.0 were obtained from
        the Understanding Society Project
      section: 'Online Methods: GWAS'
  wgs-ukibdgc-uk10k:
    quotes:
    - exact: We generated low-coverage whole genome sequences for 4,686 IBD cases and 3,781 population
        controls from the UK IBD Genetics Consortium (UKIBDGC) and UK10K Consortium, respectively
      section: 'Online Methods: sequencing'
  metal-iibdgc:
    quotes:
    - exact: meta-analysis of our sequencing and GWAS cohorts with the publicly available International
        Inflammatory Bowel Disease Genetics Consortium (IIBDGC) meta-analysis summary statistics1
      section: 'Online Methods: meta-analysis'
  ukhls-ack:
    quotes:
    - exact: The UK Household Longitudinal Study is led by the Institute for Social and Economic Research
        at the University of Essex
      section: Acknowledgements
