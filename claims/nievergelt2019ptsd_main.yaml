claims:
  pgc15-without-ukb:
    quotes:
    - exact: the PGC2 data without the UK Biobank (referred to as PGC1.5) and the UK Biobank (UKB) by
        itself, which comprises a large proportion of PGC2
      section: Results, heritability
  sixty-cohorts:
    quotes:
    - exact: The PGC-PTSD combined data from 60 multi-ethnic cohorts (PGC1.5) and the UK Biobank (PGC2)
        achieved a sample size of 206,655 participants with 32,428 PTSD cases
      section: Discussion
  data-availability:
    quotes:
    - exact: The full meta-analyses summary statistics are available for download from the Psychiatric
        Genomics Consortium at https://www.med.unc.edu/pgc/results-and-downloads/.
      section: Data availability
  eua-sumstats:
    quotes:
    - exact: Summary statistics for PTSD studies were restricted to the EUA meta-analysis, including UKB
        subjects (23,212 cases, 151,447 controls)
      section: Methods, genetic correlation
  mvp-replication:
    quotes:
    - exact: In an attempt to replicate our genomics findings in an adequately-powered external study
        we used the large MVP cohort
      section: Results, replication
