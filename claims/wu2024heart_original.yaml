    quotes:
    - exact: Protein-­disease pairs with ≥2 non-­overlapping reports were included.
      section: Methods, Statistical analysis
  drug-dev:
    quotes:
    - exact: Of the 245 potentially causal proteins (291 protein-­disease pairs), 3 pairs were validated
        by evidence of drug development from existing drug databases, 288 pairs lacked evidence of drug
        development and 66 proteins were drug targets approved for other indications.
      section: Abstract, Results
  mr-obs:
    quotes:
    - exact: Of 1731 protein-­disease pairs investigated in both of observational and MR pooled analyses,
        only 22 pairs showed directionally consistent associations
      section: Results, Genetic associations between proteins and CMD
  pleio:
    quotes:
    - exact: we identified 23 tier 1 and 2 proteins associated with risk of two or more CMDs, referred
        to as ‘pleiotropic protein’
      section: Results
  cis:
    quotes:
    - exact: 29 studies (82.9%) restricted instrumental variables to cis-­pQTLs
      section: Results, Quality assessment
  mr-pairs:
    quotes:
    - exact: The evaluation of MR evidence included 35 studies assessing circulating proteins as possible
        causal biomarkers for CMDs, with 10 531 protein-­disease pairs reported and 1614 pairs eligible
        for meta-­analysis.
      section: Results, Genetic associations between proteins and CMD
