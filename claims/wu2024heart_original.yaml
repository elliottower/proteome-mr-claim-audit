    - exact: Moderate heterogeneity was observed for MR pooled results, and 14.2% pairs had I2≥80%.
      section: Results, Genetic associations between proteins and CMD
  searched:
    quotes:
    - exact: We searched PubMed, Web of Science and Embase from database inception to July 2023
