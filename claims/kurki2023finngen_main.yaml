    quotes:
    - exact: FinnGen is a public–private partnership research project that combines imputed genotype data
        generated from newly collected and legacy samples from Finnish biobanks
      section: Introduction
  legacy-70023:
    quotes:
    - exact: Data on 70,023 additional individuals were derived from legacy collections (Supplementary
        Table 2)
      section: Results
  legacy-prospected:
    quotes:
    - exact: Samples in the FinnGen study include legacy samples (prospected number 200,000) from previous
        research cohorts (often disease-specific) that have been transferred to the Finnish biobanks
      section: 'Methods: Biobank samples'
