  all-52-meta:
    quotes:
    - exact: We tested all 52 GWAS datasets separately for association under an additive logistic regression
        model using PLINK and the derived principal components as covariates51, and then conducted a meta-analysis
        of the 52 sets of results using an inverse-weighted fixed effects model.
      section: 'Supplementary Text: Quality Control, Imputation and Association Analysis'
  decode-top-snps:
    quotes:
    - exact: We obtained summary association results for SNPs surpassing P < 1x10-6 in the discovery meta-analysis
        from deCODE
      section: 'Supplementary Text: Quality Control, Imputation and Association Analysis'
  ctrl-betula:
    quotes:
    - exact: Controls were recruited from the Betula study, an on-going longitudinal, prospective, population-based
        study from the same geographic area (North Sweden)
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-top:
    quotes:
    - exact: Healthy control subjects were randomly selected from statistical records of persons from
        the same catchment area as the patient groups.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-edin:
    quotes:
    - exact: Cases and controls were recruited from the southeast of Scotland
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-dnsb:
    quotes:
    - exact: DNA samples for all subjects were collected from blood spots systematically collected by
        the Danish Newborn Screening Biobank)
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-peic:
    quotes:
    - exact: all participants (including controls and unaffected family members) underwent a structured
        clinical interview
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-msaf:
    quotes:
    - exact: Samples contributed by Mount Sinai were derived from three cohorts.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-ibts-dubl:
    quotes:
    - exact: The controls were recruited, from the same region through the Irish Blood Transfusion Services.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-ibts-irwt:
    quotes:
    - exact: Controls were blood donors from the Irish Blood Transfusion Service
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-gras:
    quotes:
    - exact: Controls were unscreened blood donors recruited at the Georg-August-University according
        to national blood donation guidelines.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-egcut:
    quotes:
    - exact: Controls were drawn from a larger pool of genotyped biobank samples by matching on gender,
        age and genetic ancestry.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-egcut-jr:
    quotes:
    - exact: Most of the Eastern European controls were from the Estonian Biobank project (EGCUT)
      section: 'Supplementary Text: Details of individual participating studies'
  cases-jnj-roche:
    quotes:
    - exact: Cases were collected by Johnson and Johnson (J&J) and Roche as part of clinical collaborations
        with hospitals and outpatient centers.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-mgs:
    quotes:
    - exact: A survey company (Knowledge Networks, under MGS guidance) collected the European ancestry
        control sample
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-ucl:
    quotes:
    - exact: All cases and controls were collected by University College London
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-hubin:
    quotes:
    - exact: Controls were recruited either among subjects previously participating in biological research
        at the Karolinska Institute or drawn from a representative register of the population of Stockholm
        County.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-bulgaria:
    quotes:
    - exact: Controls were recruited from the two largest cities in Bulgaria as previously described.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-migen:
    quotes:
    - exact: ancestrally-matched controls were chosen from the Myocardial Infarction Genetics Consortium
        (MIGen, dbGaP ID phs000294.v1.p1)
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-hugr:
    quotes:
    - exact: Cases and controls were sampled from an Ashkenazi Jewish repository (Hebrew University Genetic
        Resource, http://hugr.huji.ac.il).
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-israeli-blood-bank:
    quotes:
    - exact: Controls were sampled through the Israeli Blood Bank
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-wtccc-lacw:
    quotes:
    - exact: using independent controls, matched by ancestry and genotyping array, from the Wellcome Trust
        Case Control Consortium.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-zhh:
    quotes:
    - exact: The case and control subjects were recruited in the New York metropolitan area
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-asrb:
    quotes:
    - exact: These subjects were part of the Australian Schizophrenia Research Bank.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-caws-b58c-ukbs:
    quotes:
    - exact: but included similar numbers of individuals from the 1958 British Birth Cohort and a panel
        of consenting blood donors (UK Blood Service)
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-clozuk-wtccc2:
    quotes:
    - exact: The controls were drawn from the WTCCC2 control samples (~3,000 from the 1958 British Birth
        Cohort and ~3,000 samples from the UK Blood Service Control Group).
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-clozuk-nbs:
    quotes:
    - exact: An additional 900 controls, held by Cardiff University, were recruited from the UK National
        Blood Transfusion Service.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-utrecht:
    quotes:
    - exact: Controls came from the University Medical Centre Utrecht and were volunteers with no psychiatric
        history.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-health2000:
    quotes:
    - exact: The control sample was derived from the Finnish Health 2000 survey.
      section: 'Supplementary Text: Details of individual participating studies'
  cases-finnish-families:
    quotes:
    - exact: Finnish cases were drawn from a nationwide collection of families with schizophrenia spectrum
        disorders.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-portugal:
    quotes:
    - exact: Cases and controls lived in Portugal, the Azorean and Madeiran islands
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-cidar:
    quotes:
    - exact: Controls were ascertained through local advertisements from the same geographical area.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-boco-popgen-kora-hnr:
    quotes:
    - exact: Controls were drawn from three population-based epidemiological studies (PopGen), 27 the
        Cooperative Health Research in the Region of Augsburg (KORA) study, 28 and the Heinz Nixdorf Recall
        (HNR) study.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-boco-munich-community:
    quotes:
    - exact: Additional controls were randomly selected from a Munich-based community sample
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-munich:
    quotes:
    - exact: The controls were unrelated volunteers randomly selected from the general population of Munich.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-aberdeen:
    quotes:
    - exact: Ascertainment and inclusion/exclusion criteria for cases and controls have been previously
        described.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-catie-mgs:
    quotes:
    - exact: The control subjects were collected by MGS (described above)
      section: 'Supplementary Text: Details of individual participating studies'
  cases-catie:
    quotes:
    - exact: Cases were collected as part of the Clinical Antipsychotics Trials of Intervention Effectiveness
        (CATIE) project
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-sweden:
    quotes:
    - exact: Controls were selected at random from Swedish population registers
      section: 'Supplementary Text: Details of individual participating studies'
  cases-coguk:
    quotes:
    - exact: Cases were recruited from community mental health teams in Wales and England
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-nimh-cbdb:
    quotes:
    - exact: Subjects were recruited from the Clinical Brain Disorders Branch of the NIMH ‘Sibling Study’
        as previously described.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-pfizer:
    quotes:
    - exact: The controls (A9011027) were recruited in a multi-site, cross-sectional, non-treatment prospective
        trial
      section: 'Supplementary Text: Details of individual participating studies'
  cases-pfizer:
    quotes:
    - exact: Pfizer contributed anonymized individual genotypes for cases from seven multi-center randomized,
        double-blind efficacy and safety clinical trials
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-denmark-aarhus:
    quotes:
    - exact: The controls were collected at the University of Aarhus, and included 500 medical students
      section: 'Supplementary Text: Details of individual participating studies'
  trio-bulgaria:
    quotes:
    - exact: Families from Bulgaria were recruited if a proband had schizophrenia or schizoaffective disorder,
        both parents were available
      section: 'Supplementary Text: Details of individual participating studies'
  trio-levinson:
    quotes:
    - exact: Schizophrenia cases were included from the family sample of European-ancestry pedigrees described
        by Levinson et al.
      section: 'Supplementary Text: Details of individual participating studies'
  trio-uk:
    quotes:
    - exact: All cases and parents were recruited from UK and had a history of hospitalization for treatment
        of schizophrenia.
      section: 'Supplementary Text: Details of individual participating studies'
  asn-japan:
    quotes:
    - exact: Case and control participants were recruited from the Tokai area of mainland Japan and self-identified
        as Japanese.
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-sp2:
    quotes:
    - exact: The controls were from the Singapore Prospective Study Program 11
      section: 'Supplementary Text: Details of individual participating studies'
  ctrl-hk-convenience:
    quotes:
    - exact: The control group was a convenience sample gathered from several sources - subjects from
        a GWAS on bone mineral density, 43 the control subjects from a GWAS on hypertension, 44 and on
        liver cancer. 45, and healthy control subjects recruited from Sichuan and Taiwan.
      section: 'Supplementary Text: Details of individual participating studies'
  cases-hk-sichuan:
    quotes:
    - exact: The case sample include patients with DSM-IV schizophrenia recruited in Hong Kong and Sichuan
        China described previously.
      section: 'Supplementary Text: Details of individual participating studies'
  decode-replication-iceland:
    quotes:
    - exact: The Icelandic sample consisted of cases and controls who were recruited and diagnosed in
        Iceland as previously described.
      section: 'Supplementary Text: Replication, European ancestry, case-control design'
  sample-size-summary:
    quotes:
    - exact: Replication samples (European ancestry, case-control), 1,513 cases and 66,236 controls
      section: 'Supplementary Text: Sample size summary'
