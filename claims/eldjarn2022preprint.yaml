claims:
  cis-both-616:
    quotes:
    - exact: Of the 1,097 proteins targeted with both SomaScan v4 and Olink Explore, 616 (56%) had a cis
        pQTL detected using the two platforms.
      section: Results
  ld-248:
    quotes:
    - exact: For 248 of these 616 proteins (40%), the sentinel cis pQTLs detected using SomaScan v4 and
        Olink Explore were in high LD (r2>0.80)
      section: Results
  ukb-47151:
    quotes:
    - exact: Olink Explore 1536 (1,459 immunoassays) in 47,151 European participants from the UK Biobank
      section: Summary
  counts-541-519:
    quotes:
    - exact: this is based on 541 replicating and 85 non-replicating pQTLs, while for cis pQTLs detected
        using the Olink Explore platform and replicated using the SomaScan v4 platform, this is based
        on 519 replicating and 238 non-replicating pQTLs.
      section: Supplementary note text / Figure 3 legend area
