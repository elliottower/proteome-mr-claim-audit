source:
  citation: eldjarn2023
  local: sources/eldjarn2023.txt
  sha256: a5ebcb9d2e9b7c7cdf1e50cea9f28b37dfd0ee7b3599b3c2c617578ed85a407a
  doi: 10.1038/s41586-023-06563-x
  note: Full text from Europe PMC fullTextXML (PMC10567571), tags stripped. Eldjarn GH, Ferkingstad E,
    Lund SH, et al. (33 authors; full list in OpenAlex W4387344358). Large-scale plasma proteomics comparisons
    through genetics and disease associations. Nature 2023;622:348-358. PMID 37794188.
claims:
  design:
    quotes:
    - exact: Here we compare two affinity-based platforms, Olink Explore 3072 using data from the UK Biobank
        (UKB) generated by the UKB Pharma Proteomics Project (UKB-PPP) and SomaScan v4 generated in Iceland
      section: Introduction
  iceland-olink-1514:
    quotes:
    - exact: We analysed SomaScan v4 data for plasma samples from 35,892 Icelanders, where 1,514 of the
        samples were also measured using the Olink Explore 3072 platform.
      section: Introduction
  corr-ukb-to-iceland:
    quotes:
    - exact: In the UKB-BI Olink data, 581 (40%) out of 1,468 sentinel cis pQTL signals had a corresponding
        pQTL in the Icelandic SomaScan data, and in 434 cases (30%) the pQTL was the sentinel signal at
        the locus.
      section: 'Results: Relationship of pQTLs between platforms'
  corr-iceland-to-ukb:
    quotes:
    - exact: In the SomaScan data, 559 (48%) out of 1,164 sentinel cis pQTL signals had a corresponding
        pQTL in the UKB-BI Olink data, and in 449 cases (39%) the pQTL was the sentinel signal at the
        locus.
      section: 'Results: Relationship of pQTLs between platforms'
  not-same:
    quotes:
    - exact: Thus, even when pQTLs for a protein are detected on both platforms, they are not necessarily
        the same.
      section: 'Results: Relationship of pQTLs between platforms'
  low-ld-half:
    quotes:
    - exact: Even where cis pQTLs provide evidence that both platforms are measuring the targeted protein,
        in more than half of the cases, the top associated variants were in low LD.
      section: Discussion
  nfl-opposite:
    quotes:
    - exact: Of note, NFL levels measured with both the Olink and SomaScan platforms correlate strongly
        with Alzheimer’s disease, but with opposite directions of effect.
      section: 'Results: Protein–phenotype associations'
