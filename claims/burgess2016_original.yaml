claims:
  linear:
    quotes:
    - exact: For a continuous outcome, bias due to sample overlap is a linear function of the proportion
        of overlap between the samples.
      section: Abstract
  null-direction:
    quotes:
    - exact: is less biased and any bias is in the direction of the null
      section: Abstract
  larger-dataset:
    quotes:
    - exact: If the datasets are of different size, then the percentage overlap in these formulae should
        be taken with respect to the larger dataset
      section: Section 6.1 Overlap with datasets of different size
  binary-controls:
    quotes:
    - exact: With a binary outcome, provided that the IV–risk factor associations are estimated in the
        control participants only, bias due to sample overlap is negligible and Type 1 error rates are
        at nominal levels.
      section: Section 6 Discussion
