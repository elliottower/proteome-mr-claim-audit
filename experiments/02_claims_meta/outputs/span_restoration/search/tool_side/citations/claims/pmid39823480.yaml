claims:
  c000:
    quotes:
    - exact: The affinity between drug targets and SLE targets was confirmed by molecular
        docking. In the preliminary analysis, we identified four key proteins as possible
        drug targets in CSF and plasma proteins, included ICAM-1(P = 4.62E-05, OR
        = 0.90(0.86, 0.95)), sICAM-1(P = 4.62E-05, OR = 0.49(0.35, 0.69)), FCG2B (P
        = 7.63E-11, OR = 0.57(0.48, 0.67)), PPP3CA; PPP3R1 (P = 5.47E-07, OR = 0.66(0.57,
        0.78)).
