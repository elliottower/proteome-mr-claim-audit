    quotes:
    - exact: Notably, approximately half of these proteins (including PCSK1, PPY,
        and VWF) were recognized as druggable or existing drug targets. This study
        identified proteins causally linked to RG, emphasizing their potential role
        in the development of therapeutic interventions for metabolic disorders, particularly
        those involving glucose regulation.
