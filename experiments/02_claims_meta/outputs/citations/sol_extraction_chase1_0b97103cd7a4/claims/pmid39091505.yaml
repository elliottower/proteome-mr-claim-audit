  c000:
    quotes:
    - exact: Genetically determined levels of CXCL11 (OR = 0.91, 95% CI = 0.85-0.98, P = 0.008, PFDR =
        0.119), IL-18 (OR = 0.88, 95% CI = 0.83-0.94, P = 8.66×10-5, PFDR = 0.008), and LIF (OR = 0.86,
        95% CI = 0.76-0.96, P = 0.008, PFDR = 0.119) were linked to a reduced risk of OP.
