claims:
  c000:
    quotes:
    - exact: Higher methylation levels of TAGLN2 at specific Cytosine-phosphate-Guanine sites were negatively
        correlated with its gene expression and associated with a lower risk of CAD, whereas higher circulating
        TAGLN2 protein levels were positively associated with CAD risk (odds ratio,1.66 [95% CI, 1.32-2.08).
  c001:
    quotes:
    - exact: In contrast, APOB and GIP showed positive associations with CAD risk, whereas DHX58 (DExH-box
        helicase 58) and SWAP70 (Switch-associated protein 70) were associated with decreased risk.
