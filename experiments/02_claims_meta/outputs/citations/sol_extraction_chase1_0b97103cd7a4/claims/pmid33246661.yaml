claims:
  c000:
    quotes:
    - exact: We identified 26 proteins whose genetically predicted circulating levels were associated
        with EOC risk at false discovery rate < 0.05. The 26 proteins included MFAP2, SEMG2, DLK1, and
        NTNG1 and a group of 22 proteins whose plasma levels were predicted by variants at chromosome
        9q34.2.
