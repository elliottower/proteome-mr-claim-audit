    - exact: The 26 proteins included MFAP2, SEMG2, DLK1, and NTNG1 and a group of 22 proteins whose plasma
        levels were predicted by variants at chromosome 9q34.2. All 26 protein association signals identified
        were driven by association with the high-grade serous histotype that comprised 58% of the EOC
        cases in OCAC.
