claims:
  c000:
    quotes:
    - exact: Of these 621 associations, there was further support from cis -pQTL analyses for the etiological
        role of TNFRSF14 in risk of non-Hodgkin lymphoma (NHL), and from whole exome protein score (exGS)
        analyses for 28 other protein-cancer associations, including SRP14 and risk of leukemia.
  c001:
    quotes:
    - exact: Of these 621 associations, there was further support from cis -pQTL analyses for the etiological
        role of TNFRSF14 in risk of non-Hodgkin lymphoma (NHL), and from whole exome protein score (exGS)
        analyses for 28 other protein-cancer associations, including SRP14 and risk of leukemia.
  c002:
    quotes:
    - exact: Proteins with directionally concordant evidence from long time-to-diagnosis analyses and
        from both cis -pQTL and exGS analyses were SFTPA2 for lung cancer, TNFRSF1B and CD74 for NHL,
        and ADAM8 for leukemia.
