  c000:
    quotes:
    - exact: The IVW method indicated that interleukin 9 (IL9) had a positive causal relationship with
        periodontitis [odds ratio (OR) = 1.199, 95% confidence interval (CI) = 1.049-1.372, p = 0.008],
        and interleukin 17 (IL17) had a negative causal relationship with periodontitis (OR = 0.847, 95%
        CI = 0.735-0.976, p = 0.022).
