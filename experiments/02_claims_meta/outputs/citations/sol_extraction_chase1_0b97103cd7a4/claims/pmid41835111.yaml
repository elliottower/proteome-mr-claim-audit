claims:
  c000:
    quotes:
    - exact: MR identified CCL5 as a pro-tumorigenic cytokine with a significant causal association with
        osteosarcoma (OR > 15).
  c001:
    quotes:
    - exact: Four immune traits were causally linked to osteosarcoma, including CD86 expression on monocytes
        and CD127 expression on CD4+ T cells (risk factors), and CD8dim T cell and terminally differentiated
        CD4+ T cell counts (protective factors).
  c002:
    quotes:
    - exact: Four immune traits were causally linked to osteosarcoma, including CD86 expression on monocytes
        and CD127 expression on CD4+ T cells (risk factors), and CD8dim T cell and terminally differentiated
        CD4+ T cell counts (protective factors).
  c003:
    quotes:
    - exact: CCL5 expression positively correlated with infiltration of CD8+ T cells, Tregs, and M1 macrophages,
        and was associated with advanced tumor stage.
  c004:
    quotes:
    - exact: CCL5 expression positively correlated with infiltration of CD8+ T cells, Tregs, and M1 macrophages,
        and was associated with advanced tumor stage.
