  c007:
    quotes:
    - exact: Co-culture assays confirmed that tumor-associated macrophages with high CCL5 expression enhanced
        osteosarcoma cell proliferation and colony formation.
  c008:
    quotes:
    - exact: Co-culture assays confirmed that tumor-associated macrophages with high CCL5 expression enhanced
        osteosarcoma cell proliferation and colony formation.
  c009:
    quotes:
    - exact: CCL5 plays a central role in shaping the immune landscape of osteosarcoma and promoting tumor
        progression. Its spatial association with immune markers such as CD127 and CD86 further supports
        its regulatory role.
