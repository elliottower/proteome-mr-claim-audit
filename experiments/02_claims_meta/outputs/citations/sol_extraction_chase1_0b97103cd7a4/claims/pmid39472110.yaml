claims:
  c000:
    quotes:
    - exact: IVW results revealed that elevated levels of Tumor Necrosis Factor Alpha (TNF-α), Macrophage
        Inflammatory Protein-1a (MIP1a), and Monokine Induced by Gamma Interferon (MIG) were associated
        with higher RP risk (OR = 2.358, p = 0.050; OR = 2.583, p = 0.013; OR = 1.851, p = 0.015), while
        elevated levels of Interleukin-16 (IL-16) were associated with reduced RP risk (OR = 0.723, p
        = 0.019).
