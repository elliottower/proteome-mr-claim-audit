claims:
  c000:
    quotes:
    - exact: 'Our results suggested that higher levels of monocyte-specific chemokine-3 (IVW estimate
        odds ratio [ORIVW ] per SD genetic cytokines change: 1.24; 95% confidence interval [CI]: 1.03-1.49;
        P = .02), vascular endothelial growth factor (1.14, 1.03-1.27; P = .02), interleukin-10 (1.33,
        1.01-1.75; P = .04) and interleukin-7 (1.24, 1.03-1.48; P = .02) were associated with increased
        risk of MM, while lower levels of tumor necrosis factor-β (0.84, 0.74-0.92; P < .001) was strongly
        associated with an increased risk of MM.'
