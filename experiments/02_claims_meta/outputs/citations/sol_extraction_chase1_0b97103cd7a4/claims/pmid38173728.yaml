claims:
  c000:
    quotes:
    - exact: 'After Bonferroni correction, circulating levels of Cutaneous T-cell attracting (CTACK) and
        Monocyte specific chemokine 3 (MCP-3) were positively associated with a higher risk of AS (odds
        ratio [OR]: 1.224, 95% confidence interval [95% Cl]: 1.022 ~ 1.468, P = 0.028; OR: 1.250, 95%
        Cl: 1.016 ~ 1.539, P = 0.035).'
