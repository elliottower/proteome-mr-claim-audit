        Cl: 1.016 ~ 1.539, P = 0.035).'
  c002:
    quotes:
    - exact: In addition, elevated circulating levels of Basic fibroblast growth factor (FGF-basic), Granulocyte
        colony-stimulating factor (G-CSF) and MCP-3 was considered a consequence of AS disease (β = 0.023,
        P = 0.017; β = 0.017, P = 0.025; β = 0.053, P = 0.025).
