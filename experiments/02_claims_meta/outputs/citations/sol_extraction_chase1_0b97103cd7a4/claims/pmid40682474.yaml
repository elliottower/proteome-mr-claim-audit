  c000:
    quotes:
    - exact: MR analysis showed that TGFB1 and CCL11 were positively correlated with NSCLC risk (OR =
        1.173, p = 0.020; OR = 1.192, p = 0.003), while CD40 and CCL4 demonstrated protective effects
