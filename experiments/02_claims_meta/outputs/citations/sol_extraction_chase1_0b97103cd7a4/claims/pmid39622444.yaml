  c004:
    quotes:
    - exact: In order to explore the differences between 5 intrinsic subtypes, we found 29 actionable
        druggable genes for Luminal A breast cancer, 2 genes (IGF2 and TNNT3) for Luminal B breast cancer,
        1 gene (FAAH) for Luminal B HER2 negative breast cancer, and 3 genes (CASP8, KCNN4, and TP53)
        for triple-negative breast cancer.
