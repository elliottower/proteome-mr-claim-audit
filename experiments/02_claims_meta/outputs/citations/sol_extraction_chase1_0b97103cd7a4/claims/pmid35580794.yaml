  c007:
    quotes:
    - exact: 'A 1 SD increase in concentration of Eotaxin (IVW: OR = 1.05 95% CI: 0.98 to 1.13, p = 0.14),
        IL-8 (OR = 1.21 95% CI: 1.07 to 1.37, p = 0.003) and MCP1 (OR = 1.07 95% CI: 1.03 to 1.13, p =
        0.003) were associated with lower fluid intelligence, and IL-4 (OR = 0.86 95%CI: 0.79 to 0.98,
        p = 0.02) with higher.'
