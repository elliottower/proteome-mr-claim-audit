claims:
  c000:
    quotes:
    - exact: 'Evidence suggest that 1 standard deviation (SD) increase in levels of CTACK (CCL27) (OR
        = 1.09 95%CI: 1.01 to 1.19, p = 0.03) increased risk of Alzheimer''s disease.'
  c001:
    quotes:
    - exact: 'There was weak evidence of a causal effect of MIP-1b (CCL4) (OR = 1.04 95% CI: 0.99 to 1.09,
        p = 0.08), Eotaxin (OR = 1.08 95% CI: 0.99 to 1.17, p = 0.10), GROa (CXCL1) (OR = 1.04 95% CI:
        0.99 to 1.10, p = 0.15), MIG (CXCL9) (OR = 1.17 95% CI: 0.97 to 1.41, p = 0.10), IL-8 (Wald ratio:
        OR = 1.21 95% CI: 0.97 to 1.51, p = 0.09) and IL-2 (Wald Ratio: OR = 1.21 95% CI: 0.94 to 1.56,
        p = 0.14) on Alzheimer''s disease risk.'
