claims:
  c000:
    quotes:
    - exact: For each IL1RN minor allele inherited, serum concentrations of IL-1Ra increased by 0.22 SD
        (95% CI 0.18-0.25; 12.5%; p = 9.3 × 10(-33)), concentrations of interleukin 6 decreased by 0.02
        SD (-0.04 to -0.01; -1.7%; p = 3.5 × 10(-3)), and concentrations of C-reactive protein decreased
        by 0.03 SD (-0.04 to -0.02; -3.4%; p = 7.7 × 10(-14)).
  c001:
    quotes:
    - exact: For each IL1RN minor allele inherited, serum concentrations of IL-1Ra increased by 0.22 SD
        (95% CI 0.18-0.25; 12.5%; p = 9.3 × 10(-33)), concentrations of interleukin 6 decreased by 0.02
        SD (-0.04 to -0.01; -1.7%; p = 3.5 × 10(-3)), and concentrations of C-reactive protein decreased
        by 0.03 SD (-0.04 to -0.02; -3.4%; p = 7.7 × 10(-14)).
  c002:
    quotes:
    - exact: For people who carried four IL-1Ra-raising alleles, the odds ratio for coronary heart disease
        was 1.15 (1.08-1.22; p = 1.8 × 10(-6)) compared with people who carried no IL-1Ra-raising alleles;
        the per-allele odds ratio for coronary heart disease was 1.03 (1.02-1.04; p = 3.9 × 10(-10)).
  c003:
    quotes:
    - exact: For people who carried four IL-1Ra-raising alleles, the odds ratio for coronary heart disease
        was 1.15 (1.08-1.22; p = 1.8 × 10(-6)) compared with people who carried no IL-1Ra-raising alleles;
        the per-allele odds ratio for coronary heart disease was 1.03 (1.02-1.04; p = 3.9 × 10(-10)).
        Per-allele odds ratios were 0.97 (0.95-0.99; p = 9.9 × 10(-4)) for rheumatoid arthritis, 0.99
        (0.97-1.01; p = 0.47) for type 2 diabetes, 1.00 (0.98-1.02; p = 0.92) for ischaemic stroke, and
        1.08 (1.04-1.12; p = 1.8 × 10(-5)) for abdominal aortic aneurysm.
