claims:
  c000:
    quotes:
    - exact: In the CCHS, multivariable-adjusted hazard ratios (HRs) for MI for elevated lipoprotein(a)
        levels were 1.2 (95% confidence interval [CI], 0.9-1.6; events/10,000 person-years, 59) for levels
        between the 22nd and 66th percentile, 1.6 (95% CI, 1.1-2.2; events/10,000 person-years, 75) for
        the 67th to 89th percentile, 1.9 (95% CI, 1.2-3.0; events/10,000 person-years, 84) for the 90th
        to 95th percentile, and 2.6 (95% CI, 1.6-4.1; events/10,000 person-years, 108) for levels greater
        than the 95th percentile, respectively, vs levels less than the 22nd percentile (events/10,000
        person-years, 55) (trend P < .001).
