        µg/ml, 95 % confidence interval 0.80 to 0.90, but had no such negative association with lipids
        or diabetes. Results were similar for the SNP rs867186 functionally relevant to protein C, and
        including additional potentially pleiotropic SNPs (rs1260326 (GCKR), rs17145713 (BAZ1B) and rs4321325
        (CYP27C1)).
