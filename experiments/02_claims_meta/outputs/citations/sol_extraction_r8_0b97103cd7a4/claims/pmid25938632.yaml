  c006:
    quotes:
    - exact: For aortic valve stenosis, a 1-SD increase in lipoprotein(a) levels was associated observationally
        with a multifactorially adjusted hazard ratio of 1.23 (95% CI, 1.06-1.41), with corresponding
        causal risk ratios of 1.38 (1.23-1.55) based on LPA SNPs and of 1.21 (1.06-1.40) based on LPA
        KIV-2 genotype. For myocardial infarction, corresponding values were 1.20 (1.10;1.31) observationally,
