claims:
  outcome_1:
    quotes:
    - exact: Methods and results We first performed a GWAS of ICD-code defined DCM (N=1472 cases) from
        two large biobank datasets (UK Biobank and Mass General Brigham Biobank), and found good genetic
        correlation (rg=0.82, SE=0.22) and similar heritability estimates (h2=0.12, SE=0.03 vs. h2=0.14,
        SE=0.03) when compared with a previously published GWAS of recruited DCM cases.
