  c010:
    quotes:
    - exact: Several proteins with pQTLs linked to CHD, however, are not known drug targets, particularly
        those from genetic loci not previously linked to CHD risk pathways (e.g., BCHE, CXCL16, MCAM,
        and sRAGE).
  c011:
    quotes:
    - exact: Several proteins with pQTLs linked to CHD, however, are not known drug targets, particularly
        those from genetic loci not previously linked to CHD risk pathways (e.g., BCHE, CXCL16, MCAM,
        and sRAGE).
  c012:
    quotes:
    - exact: Several proteins with pQTLs linked to CHD, however, are not known drug targets, particularly
        those from genetic loci not previously linked to CHD risk pathways (e.g., BCHE, CXCL16, MCAM,
        and sRAGE).
  c013:
    quotes:
    - exact: We applied MR testing using pruned cis-pQTL variants (LD r2 < 0.1) as instrumental variables
        for circulating protein levels in order to identify proteins that were causal for CHD. MR testing
        was conducted for all 40 proteins with cis-pQTLs and causally implicated LPA, BCHE, PON1, MCAM,
        MPO, and cystatin C (P < 0.05; MR test; Supplementary Data 15).
  c014:
    quotes:
    - exact: Our protein-trait analyses similarly demonstrated inverse associations between plasma BCHE
        and long-term cardiovascular outcomes, and MR analyses revealed lower BCHE to be causal for CHD.
  c015:
    quotes:
    - exact: Our protein-trait analyses similarly demonstrated an inverse association between PON1 levels
        and long-term cardiovascular outcomes, but MR revealed that higher PON1 levels are causal for
        CHD (Table 2).
  c016:
    quotes:
    - exact: MCAM, or CD146, was causally associated with CHD risk in an inverse manner by MR.
  c017:
    quotes:
    - exact: We applied MR testing using pruned cis-pQTL variants (LD r2 < 0.1) as instrumental variables
        for circulating protein levels in order to identify proteins that were causal for CHD. MR testing
        was conducted for all 40 proteins with cis-pQTLs and causally implicated LPA, BCHE, PON1, MCAM,
