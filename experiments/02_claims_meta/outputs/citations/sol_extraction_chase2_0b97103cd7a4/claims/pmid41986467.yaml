claims:
  c000:
    quotes:
    - exact: Among immune traits, tumor necrosis factor receptor 1 (sTNF-R1) showed a protective effect
        (OR = 0.83, p = 0.047), whereas regulatory T cell (Treg) counts increased the risk of SCZ (OR
        = 1.05, p = 0.006).
  c001:
    quotes:
    - exact: Multivariate MR confirmed the independent effects of Desulfovibrio, Gordonibacter, and sTNF-R1
        after adjusting for other traits. The identified bacterial genera and immune measures exhibit
        biological relevance to the pathogenesis of SCZ.
