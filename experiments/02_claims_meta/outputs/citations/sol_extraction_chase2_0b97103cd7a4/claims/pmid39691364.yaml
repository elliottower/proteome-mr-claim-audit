claims:
  c000:
    quotes:
    - exact: The IVW method revealed that the inflammatory proteins IFN-γ (p-value = 0.037, OR = 1.396,
        95% CI = 1.020-1.910) and CCL7 (p-value = 0.033, OR = 1.294, 95% CI = 1.021-1.641) were associated
        with an increased risk of PCOS, while IL-6 (p-value = 0.015, OR = 0.678, 95% CI = 0.495-0.929)
        and MMP-10 (p-value = 0.025, OR = 0.753, 95% CI = 0.587-0.967) were associated with a decreased
        risk.
