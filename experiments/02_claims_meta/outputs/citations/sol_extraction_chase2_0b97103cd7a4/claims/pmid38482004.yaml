claims:
  c000:
    quotes:
    - exact: 'After Bonferroni correction, MR analysis revealed that the Interleukin-5 (IL-5) cycle level
        was associated with a reduced risk of SSc [odds ratio (OR)=0.48,95% confidence interval (CI):
        0.27-0.84, P=0.01].'
  c001:
    quotes:
    - exact: 'It also indicated that the Stem cell growth factor beta (SCGF-β) cycling level might elevate
        the risk of SSc (OR = 1.36, 95% CI: 1.01-1.83, P = 0.04).'
