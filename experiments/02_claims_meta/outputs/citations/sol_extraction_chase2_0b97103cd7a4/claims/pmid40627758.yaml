    - exact: MR analysis identified three proteins-programmed cell death 1 ligand 1 (PD-L1), eotaxin,
        and neurturin (NRTN)-with protective roles against periodontitis, alongside three proteins-protein
        S100-A12 (S100A12), C-X-C motif chemokine ligand (CXCL) 11, and sulfotransferase 1A1 (SULT1A1)-identified
        as risk factors.
