claims:
  c000:
    quotes:
    - exact: 'The evidence supporting the association of genetically predicted circulating levels with
        the increased risk of CRC was revealed; these included vascular endothelial growth factor (OR
        = 1.352, 95% CI: 1.019-1.315, P = 0.024), interleukin-12p70 (OR = 1.273, 95% CI: 1.133-1.430,
        P = 4.68×10-5), interleukin-13 (OR = 1.149, 95% CI: 1.012-1.299, P = 0.028), interleukin-10 (OR
        = 1.230, 95% CI: 1.013-1.493, P = 0.037), and interleukin-7 (OR = 1.191, 95% CI: 1.023-1.386 P
        = 0.024).'
