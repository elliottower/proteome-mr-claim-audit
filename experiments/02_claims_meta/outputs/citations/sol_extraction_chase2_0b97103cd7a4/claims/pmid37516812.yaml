claims:
  c000:
    quotes:
    - exact: In directional MR, it suggested that several CCs were nominally correlated with the risk
        of ANDDs, with a causal odds ratio (OR) of Interleukin (IL)-5 of 0.909 for AD; OR of IL-2 of 1.169
        for PD; and OR of Beta nerve growth factor of 1.142 for ALS).
