  c003:
    quotes:
    - exact: In reverse MR, there were some suggestively causal effects of ANDDs on CCs (AD on increased
        Basic fibroblast growth factor and IL-12 and decreased Stem cell growth factor beta; PD on decreased
        Monokine induced by interferon-gamma; ALS on decreased Basic fibroblast growth factor and IL-17).
