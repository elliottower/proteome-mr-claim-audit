  pqtl_2:
    quotes:
    - exact: From these SNPs, only those with a minor allele frequency of ≥1% that were genome-wide significance
        (P<5 × 10–8) and considered independent (linkage disequilibrium r2 <0.1 in 1000G) were retained.
        deCODE Genetics conducted proteomic profiling on blood plasma samples from 35,559 Icelanders using
        the SomaScan platform and collected data on 4907 aptamers (Ferkingstad et al., 2021).
