  outcome_2_c2:
    quotes:
    - exact: All participants in the IIBDGC study were of European ancestry and included 25,042 cases
        and 34,915 controls for IBD, 12,194 cases and 28,072 controls for CD, and 12,366 cases and 33,609
        controls for UC.
  outcome_3_c2:
    quotes:
    - exact: Summary statistics of genetic associations with IBD in the UK Biobank were extracted from
        a GWAS conducted by the Lee Lab.9 The IBD diagnoses were defined according to the International
        Classification of Diseases, 9th Revision (ICD-9) and ICD-10.
