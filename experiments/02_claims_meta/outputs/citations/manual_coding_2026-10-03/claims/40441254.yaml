claims:
  outcome_2_a3:
    quotes:
    - exact: The GWAS data of the of mtDNA-CN genetic data were obtained from the IEU Open GWAS database,
        which is an open access database for genome-wide association studies. mtDNA-CN has a GWAS ID of
        ebi-a-GCST90026371, a sample size of 383,476 cases, and a number of 24,195,431 SNPs.
  pqtl_1_a3:
    quotes:
    - exact: Genetic data on mitochondria-associated proteins were obtained from The IEU Open GWAS database,
        a project that provides publicly available summary statistics on 66 mitochondria-associated proteins
        from 3301 healthy blood donors of European ancestry in the INTERVAL study.[21] All participants
        provided informed consent in accordance with national research ethics, and demographic characteristics
        were extensively investigated, including age, sex, anthropometric measures such as height and
        weight, lifestyle factors (e.g., alcohol consumption and smoking), and dietary habits.
