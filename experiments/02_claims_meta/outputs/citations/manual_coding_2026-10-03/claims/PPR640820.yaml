claims:
  pqtl_1:
    quotes:
    - exact: To comprehensively identify circulating proteins with a causal role in breast cancer we measured
        2,929 unique proteins in plasma from 598 women selected from the Karolinska Mammography Project
        and explored associations between proteins levels, clinical characteristics, and gene variants.
