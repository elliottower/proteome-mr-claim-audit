    quotes:
    - exact: Then we obtained the genetic associations with IHD, using a GWAS meta-analysis from Coronary
        ARtery DIsease Genome wide Replication and Meta-analysis (CARDIoGRAM) plus The Coronary Artery
        Disease (C4D) Genetics (CARDIoGRAMplusC4D) including UK Biobank SOFT CAD GWAS (10,801cases and
        137,371 controls), CARDIoGRAMplusC4D 1000 Genomes-based GWAS (60,801 CAD cases and 123,504 controls)
        and the Myocardial Infarction Genetics and CARDIoGRAM Exome (42,335 cases and 78,240 controls)24.
  pqtl_2:
