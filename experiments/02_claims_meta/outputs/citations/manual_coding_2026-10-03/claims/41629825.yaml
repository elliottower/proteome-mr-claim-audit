claims:
  outcome_1:
    quotes:
    - exact: 'Sepsis genome-wide association study (GWAS) summary statistics were downloaded from the
        IEU OpenGWAS platform (https://gwas.mrcieu.ac.uk/), including a sepsis study containing 11,643
        cases and 474,841 controls (GWAS ID: ieu-b-4980), and a 28-day sepsis study containing 1,896 cases
        and 484,588 controls (GWAS ID: ieu-b-5086).'
  outcome_2:
    quotes:
    - exact: 'Sepsis genome-wide association study (GWAS) summary statistics were downloaded from the
        IEU OpenGWAS platform (https://gwas.mrcieu.ac.uk/), including a sepsis study containing 11,643
        cases and 474,841 controls (GWAS ID: ieu-b-4980), and a 28-day sepsis study containing 1,896 cases
        and 484,588 controls (GWAS ID: ieu-b-5086).'
  pqtl_1:
    quotes:
    - exact: 'Plasma protein quantitative trait loci (cis-pQTLs) were curated from two large-scale proteomics
        research cohorts: (1) The Decode cohort (https://www.decode.com/summarydata/), which includes
        data on 4,907 plasma proteins from 35,559 participants [15] and (2) the UK Biobank Pharma Proteomics
        Project (UKB-PPP) (https://www.synapse.org/Synapse:syn51364943/wiki/622119), which includes data
        on 2,923 plasma proteins from 54,219 participants [16].'
