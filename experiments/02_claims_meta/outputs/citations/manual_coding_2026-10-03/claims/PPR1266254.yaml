        statistics from the International PD Genetics Consortium (IPDGC; 12,054 male cases/11,999 controls;
        7,384 female cases/12,389 controls) for sex-stratified analyses and Global Parkinson’s Genetics
        Program (GP2; 34,933 cases/31,009 controls) for sex-combined analyses.
