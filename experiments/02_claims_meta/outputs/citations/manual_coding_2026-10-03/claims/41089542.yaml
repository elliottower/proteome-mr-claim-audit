  outcome_1_a3:
    quotes:
    - exact: 'Specifically, these data were represented by the following FinnGen identifiers: vitamin
        D deficiency (finn-b-E4_VIT_D_DEF), cancer (finn-b-C3_CANCER), and diabetes (finn-b-E4_DIABETES).'
  outcome_2_a3:
    quotes:
    - exact: These GWAS data can also be retrieved from the IEU Open GWAS repository, under accession
        code ieu-b-4980, which covers a population of 486,484 participants, including 11,643 sepsis cases.
  pqtl_1_a3:
    quotes:
    - exact: The data used in this study come from the plasma protein pQTL data of the deCODE database
        version 2021,4 which describes a GWAS study of 35,559 Europeans that measured plasma protein levels
        using 4907 aptamers; (the pQTL instrumental variables included in the analysis are provided in
        the appendix pQTL_drug_exposure.txt; 10.5281/zenodo.17283362).
