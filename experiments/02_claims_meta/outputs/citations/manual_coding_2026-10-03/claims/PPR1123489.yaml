    quotes:
    - exact: We systematically mapped cis -vQTLs for 2,923 plasma proteins in 52,706 UK Biobank participants
        of European (EUR, N = 45,486), African (AFR, N = 1,336), and Central/South Asian (CSA, N = 934)
        ancestries, identifying 2,162 vQTLs (P VE < 5 x 10 -8 ) for 781 proteins.
