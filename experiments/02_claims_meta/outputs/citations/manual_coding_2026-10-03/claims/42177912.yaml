claims:
  outcome_1_c2:
    quotes:
    - exact: 'METHODS: We performed longitudinal cohort analyses using the UK Biobank and additionally
        incorporated three independent external datasets-the International IBD Genetics Consortium GWAS
        dataset, the FinnGen psoriasis GWAS dataset, and the plasma proteome dataset reported by Sun et
        al. to conduct Mendelian randomization and proteomic mediation analyses, thereby investigating
        the association between inflammatory bowel disease and psoriasis and exploring potential underlying
        mechanisms.'
