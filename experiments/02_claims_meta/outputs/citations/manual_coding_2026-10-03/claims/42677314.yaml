        reported by Pietzner et al23 and from the FinnGen DF10 public release;24 and
        TCGA-BRCA gene expression data were downloaded from the UCSC Xena platform.'
      prefix: FinnGen (https://www.finngen.fi/en), and published literature, while
        gene expression data are available from the UCSC Xena platform (https://xenabrowser.net/).
