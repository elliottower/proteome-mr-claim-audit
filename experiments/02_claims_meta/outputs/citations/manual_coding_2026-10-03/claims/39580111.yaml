  outcome_1:
    quotes:
    - exact: Significant protein signatures were annotated functionally and validated externally in 740
        Framingham Heart Study (FHS) participants.
  outcome_1_a2:
    quotes:
    - exact: Significant protein signatures were annotated functionally and validated externally in 740
        Framingham Heart Study (FHS) participants.
  outcome_2_a3:
    quotes:
    - exact: 'STUDY DESIGN AND METHODS: We analyzed plasma levels of 2,922 proteins in 32,493 UK Biobank
        participants (53% female; mean [SD] age, 57 [8] years) to investigate their associations with
        spirometry measures of lung function (FEV1, FVC, FEV1 to FVC ratio), and with obstructive (n =
        4,713) and restrictive (n = 3,886) spirometry patterns.'
