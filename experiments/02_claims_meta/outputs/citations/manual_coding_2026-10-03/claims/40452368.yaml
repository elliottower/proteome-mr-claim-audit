  outcome_1_c2:
    quotes:
    - exact: We extracted genetic instruments for plasma proteins from these studies and utilized AD summary
        statistics from European Bioinformatics Institute GWAS Catalog.
  pqtl_1_c2:
    quotes:
    - exact: 'BackgroundAlzheimer''s disease (AD) is a major neurodegenerative disorder with limited treatment
        options.ObjectiveThis study aimed to identify novel therapeutic targets for AD using proteome-wide
        Mendelian randomization (MR) and colocalization analyses.MethodsWe conducted a large-scale, proteome-wide
        MR analysis using data from two extensive genome-wide association studies (GWASs) of plasma proteins:
        the UK Biobank Pharma Proteomics Project (UKB-PPP) and the deCODE Health Study.'
