claims:
  outcome_1_c2:
    quotes:
    - exact: We tested potential causal effects of 308 plasma proteins (measured in 4,994 blood donors
        from the INTERVAL study) on stroke outcomes (derived from the MEGASTROKE GWAS) in a two-sample
        MR framework and assessed whether these associations could be mediated by cardiovascular risk
        factors.
