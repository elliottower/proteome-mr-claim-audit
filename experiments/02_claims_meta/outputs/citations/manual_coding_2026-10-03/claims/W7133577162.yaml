claims:
  outcome_1_c2:
    quotes:
    - exact: 'This study aimed to identify plasma proteins causally associated with cellulitis, erysipelas,
        cutaneous abscess, furuncle, and carbuncle through Mendelian randomization (MR) analysis.Methods:
        We analyzed genetic instruments of 4907 proteins derived from the Icelandic population together
        with genome-wide association study (GWAS) data from the FinnGen project to investigate circulating
        plasma proteins involved in bacterial infectious skin diseases.'
