claims:
  outcome_1:
    quotes:
    - exact: Triangulation of observational and genetic evidence identified five proteins (B4GAT1, DNER,
        ENO3, HMOX2, OMG) potentially affecting T2D in UKB_EUR, one (ENTR1) in CKB-EAS, and three (RTBDN,
        TSPAN8, NCR3LG1) in both populations.
