claims:
  outcome_1:
    quotes:
    - exact: Regarding the genetic instrument for OA, genetic data for OA were obtained from a large meta-analysis
        of genome-wide association studies (GWASs) from the United Kingdom Biobank (UKB) (Zengini et al.,
        2018); genotype data is consistent with 16.5 million variants from the United Kingdom Biobank
        resource, including 345,169 subjects of European ancestry in total, precisely 66,031 OA cases
        and 279,138 controls.
