  pqtl_1_c2:
    quotes:
    - exact: 'METHODS: Leveraging the MRC IEU OpenGWAS data infrastructure, we extracted 1254 peripheral
        immune systems and 792 BBB biomarkers as genetic instruments for exposure.'
  pqtl_2_c2:
    quotes:
    - exact: 'Drug-targeted MR analysis indicated potential therapeutic benefits in reducing MS risk for
        CD40 (OR = 0.71, P = 7.24E-13, PPH4 = 97.6 %), AHSG (OR = 0.88, P = 2.91E-05, PPH4 = 94.4 %),
        and FCRL3 (Sun BB et al.: OR = 0.83, P = 8.93E-09, PPH4 = 94.2 %, Suhre K et al.: OR = 0.88, P
        = 5.20E-08, PPH4 = 99.2 %).'
