claims:
  pqtl_2:
    quotes:
    - exact: 'Identification of novel therapeutic targets through integration of genetic causality inference
        and functional validation is urgently needed.Methods: Plasma protein quantitative trait loci (pQTL)
        from the Fenland cohort (~10,700 individuals) and the FinnGen R10 SomaScan subset (n = 828) were
        integrated with breast cancer genome-wide association study data from the Breast Cancer Association
        Consortium (122,977 cases and 105,974 controls).'
