claims:
  outcome_1:
    quotes:
    - exact: In the FinnGen study, the phenocodes “I9_HEARTFAIL_ALLCAUSE,” “I9_HEARTFAIL_AND_CHD,” and
        “I9_HEARTFAIL_AND_ANTIHYPERT” correspond to all-cause HF with 26,872 cases and 349,361 controls,
        HF in patients with CHD with 12,872 cases and 333,759 controls, and HF in patients receiving antihypertensive
        medication with 25,827 cases and 177,731 controls, respectively (Version R9).
  pqtl_1:
    quotes:
    - exact: In the discovery stage, the pQTLs associated with 4,657 circulating proteins were extracted
        from the Atherosclerosis Risk in Communities (ARIC) study, which included 7,213 individuals of
        European American descent [30].
  pqtl_2:
    quotes:
    - exact: In the replication stage, the pQTL associated with circulating PCSK9 was obtained from an
        independent large-scale pQTL study conducted in 35,559 individuals of Icelandic descent, which
        was part of the deCODE study [31].
