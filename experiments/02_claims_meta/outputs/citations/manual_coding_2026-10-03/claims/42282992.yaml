claims:
  outcome_1:
    quotes:
    - exact: PC GWAS summary statistics were obtained from FinnGen release R12 [27], comprising approximately
        3100 PC cases and 378,000 controls of European descent.
  pqtl_2:
    quotes:
    - exact: Genetic association summary statistics for plasma protein levels were extracted from the
        Icelandic deCODE plasma proteome GWAS [14], which measured 4900 plasma proteins in 35,559 participants
        and identified extensive pQTL signals.
  outcome_1_a2:
    quotes:
    - exact: For Step 2, we identified instruments for the mediator protein from the deCODE pQTL data
        and retrieved the SNP‐to‐outcome (PC) association estimates from FinnGen R12, then performed MR
        to estimate the effect of the mediator protein on PC risk.
