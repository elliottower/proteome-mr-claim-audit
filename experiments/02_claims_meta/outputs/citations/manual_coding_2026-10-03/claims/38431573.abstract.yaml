claims:
  outcome_2:
    quotes:
    - exact: 'METHODS: Using plasma cis-pQTLs data from a previous GWAS study (3,606 Pqtls associated
        with 2,656 proteins) and a GWAS dataset of telomere length (sample size: 472,174; GWAS ID: ieu-b-4879)
        from UK Biobank, using MR, external validation, and reverse causality testing, we identified essential
        drug target proteins for telomere length.'
