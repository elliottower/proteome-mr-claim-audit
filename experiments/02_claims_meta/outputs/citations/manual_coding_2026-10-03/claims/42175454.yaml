claims:
  outcome_1:
    quotes:
    - exact: 'The primary set originated from the FinnGen consortium (release R10), comprising 6340 cases
        and 314,193 controls for LC, along with subtypes: LUAD (1590 cases), LUSC (1510 cases), and SCLC
        (717 cases), each with 314,193 controls.[21,22] Replication relied on the TRICL-ILCCO meta-analysis,
        including 29,266 cases and 56,450 controls for LC, with subtypes: LUAD (11,273 cases, 55,483 controls),
        LUSC (7426 cases, 55,627 controls), and SCLC (2664 cases, 21,444 controls).[23] All analyses utilized
        publicly available GWAS summary statistics from European-ancestry populations, with details summarized
        in Table 1.'
