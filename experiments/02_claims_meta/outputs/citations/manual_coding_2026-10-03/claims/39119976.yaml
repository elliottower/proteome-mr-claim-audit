claims:
  outcome_1:
    quotes:
    - exact: For the purpose of this MR study, we used ancestry‐specific pQTL summary‐level data for South
        Asian populations obtained from the UKBPPP. 4 Genetic associations of 2922 circulating plasma
        proteins were obtained from the UKBPPP for individuals of Central/South Asian (CSA) ancestry (N=920)
        and European ancestry (N=34 557). 4 Summary statistics of GWAS, respectively, for individuals
        of CSA ancestry and European ancestry on stroke (NCSA=3640 cases and 7672 controls; NEURopean
        =73 652 cases and 1 234 808 controls) and 4 subtypes including ischemic stroke (NCSA=3462 cases
        and 7672 controls, NEUROPEAN=62 100 cases and 1 234 808 controls), cardioembolic stroke (NCSA=596
        cases and 7672 controls, NEUROPEAN=10 804 cases and 1 234 808 controls), large artery stroke (NCSA=705
        cases and 7672 controls, NEUROPEAN=6399 cases and 1 234 808 controls), and small vessel stroke
        (NCSA=647 cases and 7672 controls, NEUROPEAN=6811 cases and 1 234 808 controls) were obtained
        from the GIGASTROKE consortium. 9 The studies used in our analysis were approved by their respective
        institutional review boards, and informed consent was provided by all participants.
