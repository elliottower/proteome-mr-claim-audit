  outcome_1_c2:
    quotes:
    - exact: Clustering of Mendelian randomization (MR) estimates, computed using T2D data from DIAGRAM
        (74,124 cases and 824,006 controls), identified four clusters of SNPs.
  pqtl_1_c2:
    quotes:
    - exact: Cluster-specific MR analyses identified 212, out of 2922 protein measurements from the UK
        Biobank (N=54,219), to be causally affected by any of the clusters.
