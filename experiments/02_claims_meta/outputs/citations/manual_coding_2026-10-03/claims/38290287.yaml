claims:
  outcome_2:
    quotes:
    - exact: Association estimates provided for the analysis did not include UK Biobank study participants
        to avoid potential overlap between protein and colorectal cancer summary statistics.34 Association
        estimates for liver cancer were obtained from a GWAS of liver cancer (specifically hepatocyte
        carcinoma) conducted in up to 648 cases and 259,583 controls in FinnGen.35 Summary genetic data
        for pancreas cancer were obtained from a GWAS of 1249 cases and 259,583 controls in FinnGen.35
        Summary genetic association data were obtained for breast cancer from a GWAS of 133,384 cases
        and 113,789 controls of European ancestry.36 Summary genetic association data were obtained for
        endometrial cancer from a GWAS of 12,906 cases and 108,979 controls of European ancestry.37 Summary
        genetic data for gallbladder cancer were obtained from the UK Biobank, which included 195 cases
        and 456,134 controls of European ancestry.38 In the Mendelian randomization analysis of protein
        levels and gallbladder cancer, both GWAS were obtained using UK Biobank participants.
