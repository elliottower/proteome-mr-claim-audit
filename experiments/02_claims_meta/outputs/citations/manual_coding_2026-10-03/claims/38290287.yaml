  outcome_1_c2:
    quotes:
    - exact: Sample overlap in two sample Mendelian randomization analyses can bias estimates towards
        the confounded observational estimate in the presence of weak instrument bias.39 Any analyses
        with at least weak evidence for an effect of protein levels on gallbladder cancer (P < 0.05) were
        repeated using an alternative GWAS of gallbladder performed in FinnGen participants (84 cases,
        259,584 controls), avoiding any sample overlap.40
