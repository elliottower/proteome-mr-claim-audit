claims:
  outcome_1:
    quotes:
    - exact: '(2) Outcome data for vitiligo: participants in the outcome-related genome-wide association
        studies (GWAS) studies included were mainly people of European ancestry who were included in the
        EBI database (GCST90436590), including 60 cases and 402,672 controls, and the UK Biobank database
        (ukb-a-115), including 95 cases and 337,064 controls.'
  pqtl_2:
    quotes:
    - exact: This study selected data from the baseline cohort, which described pQTLs in 34,557 participants
        of European ancestry.
