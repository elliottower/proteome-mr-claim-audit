claims:
  outcome_1_a3:
    quotes:
    - exact: 'Genetic variant information for IVDD, sciatica, LBP, and CHD was sourced from the FinnGen
        consortium (https://www.finngen.fi) with the following accession numbers: finn-b-M13_SCIATICA,
        which included 9,917 European-descent patients and 134,889 control participants; finn-b-M13_INTERVERTEB,
        with 6,827 European-descent patients and 134,889 control participants; and finn-b-M13_LOWBACKPAIN,
        comprising 15,565 European-descent patients and 134,889 control participants (Supplementary Table
        1).'
