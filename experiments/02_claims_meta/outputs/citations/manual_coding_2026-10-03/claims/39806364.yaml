claims:
  outcome_1:
    quotes:
    - exact: The summarized data of SS (finngen_R10_M13_SJOGREN) was derived from a dataset contained
        in the latest documentation of the FinnGen study, recently updated on December 18, 2023, which
        can be accessed through the publicly available website of FinnGen consortiums (https://finngen.gitbook.io/documentation/).
  outcome_2:
    quotes:
    - exact: Additionally, the dataset for inflammatory cytokines was the meta-analysis summary statistics
        obtained from a GWAS study of the University of Bristol (https://data.bris.ac.uk/data/dataset),
        which involves 41 traits of circulating inflammatory cytokines from 8,293 Finnish individuals
        within three cohorts [14, 15].
