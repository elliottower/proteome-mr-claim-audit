  outcome_1:
    quotes:
    - exact: '[Table 1. Data sources for circulating proteins, obesity measures, lifestyle factors, and
        coronary artery disease] Trait: CAD (Consortia) | Participants: 60,801 cases; 123,504 controls
        | Ancestry: ~80% European | Unit: Odds ratio | PMID: 26343387'
  outcome_2:
    quotes:
    - exact: For the current investigation, the R8 release of results of genome-wide association analysis
        was utilized, which encompassed 39,036 CAD cases (defined by the code 410|4110 in International
        Classification of Diseases (ICD)-Eighth Revision and the code 410|4110 in ICD-Ninth Revisions
        and the code I20.0, I21, or I22 in ICD-Tenth Revision) and 303,463 non-cases.
  outcome_1_c2:
    quotes:
    - exact: Genetic associations with CAD were obtained from the CARDIoGRAMplusC4D (Coronary ARtery DIsease
        Genome wide Replication and Meta-analysis (CARDIoGRAM) plus The Coronary Artery Disease (C4D)
        Genetics) consortium and the FinnGen study R8 (Table 1) [22, 23].
  outcome_2_c2:
