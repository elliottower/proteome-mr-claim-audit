claims:
  pqtl_1:
    quotes:
    - exact: Cardiovascular disease (CVD) is a major health burden worldwide, and therefore is an important
        outcome for which to establish and prioritise potential therapeutic targets. <h4>Methods:</h4>
        In this study, we utilised generalised summary-data-based MR (GSMR) with novel mass-spectrometry-based
        isoform-specific protein groups measured from peripheral-blood mononuclear cells (PBMCs) obtained
        from Generation Scotland and antibody-based plasma protein measures from UK Biobank as exposures,
        and two CVD and three CVD-related risk-factors from UK Biobank as outcomes.
