  sha256: 90763ddb29551b65abb9086328d4f2ca3d64b5ea9ff9cf3e1d1e56218d97621c
  url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11905629/fullTextXML
  note: body as scripts/fetch_fulltext.py rendered it
claims:
  outcome_1:
    quotes:
    - exact: We used protein QTL (pQTL) in the deCODE and UK Biobank Pharma Proteomics Project (UKB-PPP)
        cohort for discovery study and then the cohort of Atherosclerosis Risk in Communities (ARIC) study
        for replication validation.11–13 In addition, we used cis-expression QTL(eQTL) summary statistics
        from the eQTLGen Consortium.14 We used microbiota quantitative trait loci (mbQTL) of genus Senegalimassilia
        from the MiBioGen consortium.15,16 We obtained GWAS summary statistics about XFG, POAG, ARC, and
        other cataracts from the DF9 release of the FinnGen Study.17 More details are described in the
        Supplementary Methods.
