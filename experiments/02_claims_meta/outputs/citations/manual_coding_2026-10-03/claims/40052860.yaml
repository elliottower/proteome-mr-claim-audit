  outcome_3:
    quotes:
    - exact: The UK Biobank data supplied 1403 electronic health record (EHR)-derived International Classification
        of Diseases (ICD)-based phenotypes for 20 million imputed variants in 400,000 White British individuals
        (https://pheweb.org/UKB-SAIGE/).21 In addition, the FinnGen data (R9) supplied 2272 phenotypes.
