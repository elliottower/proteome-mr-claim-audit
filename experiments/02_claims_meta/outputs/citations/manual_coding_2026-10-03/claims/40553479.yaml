claims:
  pqtl_1:
    quotes:
    - exact: We used summary results from GWAS published by (i) Sun and colleagues (19) on up to 2,922
        plasma proteins measured with the Olink Explore 3072 platform in a subcohort of 52,363 UK Biobank
        participants of European ancestry; (ii) Ferkingstad and colleagues (6) on up to 4,907 aptamers
        for 4,719 plasma proteins measured with the SomaScan multiplex aptamer assay (version 4) in 35,559
        Icelanders from deCODE; (iii) O’Mara and colleagues (20) on endometrial cancer (12,270 cases and
        46,126 controls), endometrioid cancer subtype (8,758 cases and 46,126 controls), and nonendometrioid
        cancer subtype (1,230 cases and 35,447 controls of European ancestry) from the meta-analyzed Endometrial
        Cancer Association Consortium and Epidemiology of Endometrial Cancer Consortium data, excluding
        UK Biobank participants; (iv) Pulit and colleagues (21) on female-specific BMI, which includes
        434,794 women of European ancestry from the GIANT consortium and UK Biobank.
