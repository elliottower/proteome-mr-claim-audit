claims:
  outcome_1:
    quotes:
    - exact: 'In this study, we included data from three large-scale studies of BC datasets: ieu-b-4874,
        ukb-b-8193 from the MRC IEU openGWAS database (https://gwas.mrcieu.ac.uk/) [25, 26]; FinnGen_R11_C3_
        BLADDER_EXALL from the FinnGen database (https://www.finngen.fi/en) [27].'
  outcome_2:
    quotes:
    - exact: 'In this study, we included data from three large-scale studies of BC datasets: ieu-b-4874,
        ukb-b-8193 from the MRC IEU openGWAS database (https://gwas.mrcieu.ac.uk/) [25, 26]; FinnGen_R11_C3_
        BLADDER_EXALL from the FinnGen database (https://www.finngen.fi/en) [27].'
  outcome_1_a2:
    quotes:
    - exact: The BC datasets from three large-scale studies, ieu-b-4874, ukb-b-8193, and FinnGen_R11_C3_BLADDER_EXALL,
        were used as the outcome variables, respectively.
  outcome_2_a2:
    quotes:
    - exact: Of these, the ieu-b-4874 dataset has 1279 BC patients and 372,016 normal controls of European
        ancestry; the ukb-b-8193 data from the UKBB [28] database, stored in the openGWAS database, has
        1101 cancer cases and 461,832 normal controls of European ancestry; FinnGen_ R11_C3_BLADDER_EXALL
        dataset contains 2574 cases and 345,118 controls of European ancestry [27].
