        in the J-Kidney-Biobank and 3471 controls participating in the TMM Comm-Cohort Study (JKB-ToMMo)).'
  pqtl_1:
    quotes:
    - exact: First, we performed two-sample MR analyses to explore the causal relationship between serum
        proteins, which come from GWAS data, for levels of 304 proteins in four sub-cohorts of the GNHS
        [56].
