claims:
  outcome_1:
    quotes:
    - exact: 'We replicated the results of the primary analysis in two independent datasets: Biobank Japan
        (BBJ) [53] (2117 cases and 174,345 controls) and J-Kidney-Biobank (JKB) [54] (382 cases of CKD
        in the J-Kidney-Biobank and 3471 controls participating in the TMM Comm-Cohort Study (JKB-ToMMo)).'
  outcome_2:
    quotes:
    - exact: For the primary analysis, we used summary statistics from the largest GWAS of CKD conducted
        in individuals of Chinese ancestry to date, comprising 489 cases and 75,531 controls from the
        China Kadoorie Biobank (CKB) [52].
  outcome_3:
    quotes:
