claims:
  outcome_1:
    quotes:
    - exact: The publicly available R10 data from the FinnGen study comprised 4620 patients with VTE and
        356,574 healthy controls.[21] In contrast, the VTE-related GWAS data from the UK Biobank, obtained
        from Neale labs, consisted of 4620 cases and 356,574 controls, encompassing 11,901,177 SNPs, and
        utilizing the disease code ukb-d-I9_VTE (https://gwas.mrcieu.ac.uk/).
