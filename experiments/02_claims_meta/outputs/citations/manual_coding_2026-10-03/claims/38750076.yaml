  outcome_1_a3:
    quotes:
    - exact: In all exome-wide analyses, variants were oriented to the protein-increasing allele and exGS
        were calculated by summing the number of independent (clumping r2 < 0.05, 10,000KB) protein-increasing
        alleles, weighted by betas reported in Dhindsa et al., and projected in up to 337,543 European
        UK Biobank participants with exome-sequencing (Supplementary Data 10) using PLINK252.
  outcome_1_a4:
    quotes:
    - exact: 'Here, we use an integrated multi-omics approach combining prospective cohort and exome-variant
        study designs to identify proteins with a role in cancer aetiology: we describe the association
        of 1463 protein biomarkers quantified using the Olink platform with the risk of 19 common cancers
        and 9 cancer subsites in 44,645 UK Biobank participants, overall and by time to diagnosis.'
  pqtl_1_a4:
