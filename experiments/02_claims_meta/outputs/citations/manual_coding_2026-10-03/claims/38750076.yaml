  pqtl_1_c2:
    quotes:
    - exact: We extracted 27,335 exome variants associated with circulating protein concentrations on
        the Olink Explore panel at p < 5 × 10−8 reported by Dhindsa et al. for 50,829 UK Biobank participants44.
