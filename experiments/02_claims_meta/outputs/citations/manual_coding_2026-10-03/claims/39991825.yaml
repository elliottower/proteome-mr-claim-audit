claims:
  pqtl_1_c2:
    quotes:
    - exact: 'The following criteria were applied to prepare the genetic instruments for MR: (i) pQTL
        summary-level data were downloaded from the UKB-PPP database (https://doi.org/10.7303/syn51364943);
        (ii) significant SNPs were selected (P < 5e−8); (iii) to address linkage disequilibrium, PLINK
        1.9 (NITRC; RRID:SCR_001757) on the Linux system was employed, with parameters set to clump SNPs
        within 10,000 kb and r2 < 0.001; and (iv) SNPs on the X chromosome were excluded.'
