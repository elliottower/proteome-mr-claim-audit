claims:
  outcome_1_a2:
    quotes:
    - exact: The work described herein was approved by the UK Biobank under application 23652.
  outcome_1_a3:
    quotes:
    - exact: 'The case definition of rheumatoid arthritis in the UK Biobank cohort was based on any of
        three criteria: (1) hospital discharge or death certificate with an International Classification
        of Diseases diagnostic code for rheumatoid arthritis; (2) any primary care diagnosis of rheumatoid
        arthritis; or (3) self‐reported diagnosis of rheumatoid arthritis supported by prescription of
        a disease‐modifying antirheumatic drug at baseline or during follow‐up.'
