claims:
  pqtl_1:
    quotes:
    - exact: To identify genetic instruments for plasma protein levels, we used the results of genome-wide
        protein quantitative trait locus (pQTL) mapping for 2,922 unique proteins performed by the UKB-PPP
        consortium.15 These analyses were restricted to the subset of the UKB-PPP who were of EUR ancestry
        and selected at random from the UKB (n = 34,557) rather than on the basis of phenotype (as previously
        described15).
