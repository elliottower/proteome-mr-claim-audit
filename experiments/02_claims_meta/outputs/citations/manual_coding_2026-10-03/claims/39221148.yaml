claims:
  outcome_1:
    quotes:
    - exact: The summary-level GWAS data for POAG were extracted from the latest Round 10 release of the
        FinnGen consortium (8,530 cases and 391,275 controls) (https://r10.finngen.fi/) and the UK Biobank
        (4,737 cases and 458,196 controls), respectively.
  pqtl_1:
    quotes:
    - exact: DeCODE reported the pQTL data of 4,907 plasma proteins measured in 35,559 Icelanders with
        SomaScan version four and UKB-PPP presented comprehensive pQTL mapping of 2,923 proteins measured
        from 54,219 UK Biobank participants using the Olink platform (Ferkingstad et al., 2021; Sun et
        al., 2023).
