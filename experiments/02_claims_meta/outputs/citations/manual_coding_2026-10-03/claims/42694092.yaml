claims:
  outcome_1:
    quotes:
    - exact: 'Validation analyses were conducted using GWAS summary statistics from the FinnGen R12 release,
        including the six sepsis-related phenotypes available in this release: “Other septicemia”, “Streptococcal
        septicemia”, “Puerperal sepsis”, “Bacterial sepsis of newborn”, “Pneumococcal septicemia”, and
        “Hemophilus septicemia”.'
  outcome_1_a2:
    quotes:
    - exact: 'Validation analyses were conducted using GWAS summary statistics from the FinnGen R12 release,
        including the six sepsis-related phenotypes available in this release: “Other septicemia”, “Streptococcal
        septicemia”, “Puerperal sepsis”, “Bacterial sepsis of newborn”, “Pneumococcal septicemia”, and
        “Hemophilus septicemia”.'
  outcome_1_a3:
    quotes:
    - exact: Additional analyses were conducted using sepsis-related GWAS phenotypes from the FinnGen
        R12 release.
  outcome_2_a3:
    quotes:
    - exact: The primary discovery analysis used the UK Biobank cohort, which included 11,643 individuals
        with sepsis and 474,841 controls of European ancestry.
  outcome_1_a4:
    quotes:
    - exact: 'Validation analyses were conducted using GWAS summary statistics from the FinnGen R12 release,
        including the six sepsis-related phenotypes available in this release: “Other septicemia”, “Streptococcal
        septicemia”, “Puerperal sepsis”, “Bacterial sepsis of newborn”, “Pneumococcal septicemia”, and
        “Hemophilus septicemia”.'
  outcome_1_c2:
    quotes:
    - exact: 'Validation analyses were conducted using GWAS summary statistics from the FinnGen R12 release,
        including the six sepsis-related phenotypes available in this release: “Other septicemia”, “Streptococcal
        septicemia”, “Puerperal sepsis”, “Bacterial sepsis of newborn”, “Pneumococcal septicemia”, and
        “Hemophilus septicemia”.'
  outcome_2_c2:
    quotes:
    - exact: Sepsis cases were identified from linked hospital episode records using ICD-10 codes A02,
        A39, A40, and A41 in the primary or secondary diagnostic position, with self-reported cases and
        those recorded only in primary care excluded; the remaining cohort served as controls, and genetic
        associations were estimated with adjustment for age, sex, genotyping chip, and the first ten genetic
        principal components (15).
  outcome_2_r:
    quotes:
    - exact: The primary discovery analysis used the UK Biobank cohort, which included 11,643 individuals
        with sepsis and 474,841 controls of European ancestry.
