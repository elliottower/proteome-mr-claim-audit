        randomization study using Genotype-Tissue Expression lung cis-expression quantitative trait locus
        summary data as genetic proxies for GLP-1R expression and FinnGen R5 summary data (1028 cases
        and 196,986 controls; n = 198,014) for idiopathic pulmonary fibrosis.
