claims:
  pqtl_1:
    quotes:
    - exact: ObjectiveTo evaluate the association between genetically predicted GLP-1R expression and
        idiopathic pulmonary fibrosis and to explore potential mediation through JAKMIP3 and pulmonary-function
        traits using Mendelian randomization.MethodsWe conducted a two-sample drug-target cis-Mendelian
        randomization study using Genotype-Tissue Expression lung cis-expression quantitative trait locus
        summary data as genetic proxies for GLP-1R expression and FinnGen R5 summary data (1028 cases
        and 196,986 controls; n = 198,014) for idiopathic pulmonary fibrosis.
  pqtl_1_c2:
