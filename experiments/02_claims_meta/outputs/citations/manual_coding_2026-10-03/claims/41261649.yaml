claims:
  outcome_1:
    quotes:
    - exact: 'For the primary analysis, we retrieved GWAS summary statistics for sepsis (ICD-10 code:
        A41) from the FinnGen consortium (Round 9), including 12,301 sepsis cases and 332,343 controls
        of European descent.[16] As external validation, we obtained independent GWAS data from the UK
        Biobank (2811 cases and 406,150 controls).[17] All datasets used were publicly available and approved
        for secondary analysis; therefore, no additional ethical approval was required.'
  pqtl_1:
    quotes:
    - exact: To validate findings, we extracted additional pQTL data from the Fenland Study, which includes
        measurements of 4775 proteins in 10,708 individuals of European ancestry.[15] The same filtering
        criteria were applied.
