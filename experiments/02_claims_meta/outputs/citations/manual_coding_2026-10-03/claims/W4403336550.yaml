claims:
  outcome_1_c2:
    quotes:
    - exact: In this study, we used the inverse-variance weighted (IVW) model as the major analysis method
        to perform hypothesis-free Mendelian randomization (MR) analysis on the data from MRC IEU OpenGWAS
        (18,097 exposure traits and 16 AD outcome traits), and conducted sensitivity analysis with six
        models, to assess the robustness of the IVW results, to identify various classes of risk or protective
        factors for AD, early-onset AD, and late-onset AD.
