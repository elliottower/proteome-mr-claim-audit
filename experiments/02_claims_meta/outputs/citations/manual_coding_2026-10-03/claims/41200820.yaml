claims:
  outcome_1:
    quotes:
    - exact: Outcome data on CHD and myocardial infarction from the CARDIoGRAMplusC4D 1000 Genomes project
        have been contributed by CARDIoGRAMplusC4D investigators and have been downloaded from www.CARDIOGRAMPLUSC4D.ORG,
        including 60 801 cases and 123 504 controls.15
  outcome_2:
    quotes:
    - exact: Furthermore, outcome data on myocardial infarction were also retrieved from the FinnGen R10
        populations study release, including 26 060 cases and 360 108 controls.16
  pqtl_1:
    quotes:
    - exact: We used only the sentinel cis-pQTL with the lowest P value (P<1.7×10−11) from the complete
        UKB-PPP cohort for each protein as IVs to reduce the risk of horizontal pleiotropy.
