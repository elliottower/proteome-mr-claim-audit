  outcome_2_c2:
    quotes:
    - exact: 'Replication GWAS data for AKI were obtained from the IEU Open GWAS database (ID: ebi-a-GCST90018790),
        including 482,266 individuals and 24,187,658 SNPs.21'
  pqtl_1_c2:
    quotes:
    - exact: The plasma protein quantitative trait loci (pQTL) data used in this study were obtained from
        the UK Biobank Pharma Proteomics Project (UKB-PPP), which comprises large-scale genetic and proteomic
        data from 54,219 European participants.A total of 2,940 plasma proteins were quantified and analyzed
        using a high-throughput proteomics platform, generating genome-wide pQTL association results.18
        The replication plasma proteomic dataset was derived from deCODE Genetics, which utilized large-scale
        plasma proteomics data in GWAS, encompassing genetic and phenotypic information from 35,559 Icelandic
        individuals.
