claims:
  outcome_1:
    quotes:
    - exact: 'GWAS summary statistics for AKI in the discovery cohort were obtained from the FinnGen database
        (version R12, https://r12.finngen.fi/, GWAS ID: finngen_R12_N14_ACUTERENFAIL), comprising 8,383
        cases (3,194 females and 5,450 males) and 480,448 controls, with a total of 20,112,606 SNPs.'
  outcome_1_a2:
