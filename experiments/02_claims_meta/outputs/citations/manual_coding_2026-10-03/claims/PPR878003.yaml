    quotes:
    - exact: However, the causal relationship between them is still unclear. <h4>Methods</h4> We collected
        genome-wide association study (GWAS) summary statistics of plasma protein levels from the UK Biobank
        Pharma Proteomics Project (UKB-PPP, 9,216 to 34,090 participants) and plasma metabolites from
        the GWAS Catalog (3,441 to 8,299 participants), paired with summary statistics of 99 types of
        cancers from FinnGen database (131,348 to 412,181 participants).
