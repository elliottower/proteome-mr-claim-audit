    - exact: The association between circulating protein levels and genetic variants was assessed in 35
        571 participants in the UK Biobank using the Olink Explore 3072 platform, measuring 2941 protein
        analytes, capturing 2923 unique proteins,26 and in 35 559 participants in the Icelandic Cancer
        Project and deCODE Health Study using the SomaScan version 4 platform, measuring 4907 aptamers,
        capturing 4719 proteins.27
