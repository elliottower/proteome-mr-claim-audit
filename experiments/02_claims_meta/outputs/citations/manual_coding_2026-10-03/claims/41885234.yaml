claims:
  outcome_1:
    quotes:
    - exact: As an external validation cohort, we analyzed gout summary statistics from the UK Biobank
        Whole-Genome Sequencing (WGS) Consortium, restricted to non-Finnish European ancestry (19,142
        cases and 439,298 controls), ensuring ancestry consistency with the primary datasets to minimize
        population stratification bias and enhance comparability across analyses.
  pqtl_1:
    quotes:
    - exact: For external validation, data from the deCODE Genetics database, profiling approximately
        35,000 Icelandic participants of European ancestry using SomaScan v4 (~4700 plasma protein aptamers),
        were used, applying the same pQTL selection criteria (https://www.decode.com/).
