  outcome_1_c2:
    quotes:
    - exact: Senile cataract cases were ascertained from electronic health record (EHR) data using the
        All of Us Cohort Builder, based on Systematised Nomenclature of Medicine-Clinical Terms (SNOMED)
        standard concept identifiers descending from the parent concept “Senile cataract” together with
        the corresponding mapped source codes from the International Classification of Diseases, Ninth
        and Tenth Revisions (ICD-9 and ICD-10).
  pqtl_1_c2:
    quotes:
