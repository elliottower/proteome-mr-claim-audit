    quotes:
    - exact: Objective To evaluate the causal relationship between plasma proteins and restless legs syndrome
        (RLS) by proteome-wide Mendelian randomization (MR) and to explore new therapeutic targets for
        RLS.Methods Genome-wide association studies (GWAS) data of plasma proteins were obtained from
        the UK Biobank, and GWAS data of RLS were extracted from the FinnGen R11 database.
