claims:
  outcome_1:
    quotes:
    - exact: For the outcome data, we used summary-level statistics for COPD from the FinnGen consortium
        (https://www.finngen.fi/en), specifically from the most recent data release (R10).[14] This dataset
        includes 20,066 COPD cases (coded as R10_J10_COPD based on international classification of diseases
        criteria) and 338,303 controls, with diagnoses derived from nationwide Finnish health registries.
