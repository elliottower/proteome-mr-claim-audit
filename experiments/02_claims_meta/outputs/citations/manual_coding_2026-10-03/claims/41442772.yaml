    - exact: 'METHOD: In this study, we applied a nonlinear modeling approach, combining two-stage sliced
        inverse regression (2SIR) with nonlinear transformations via adjusted inverse regression (AIR),
        to investigate associations between genetically predicted protein concentrations and AD risk by
        integrating data from the INTERVAL study, which contains both blood proteome and genome data,
        and the summary statistics of large genome-wide association study of AD.'
