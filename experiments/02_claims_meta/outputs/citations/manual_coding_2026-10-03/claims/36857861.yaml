claims:
  outcome_1:
    quotes:
    - exact: We also obtain summary-level data on IBD and its subtype from the R6 data release of the
        FinnGen study.8 Cases were defined by International Classification of Disease (ICD) codes (ICD-8
        (5630), ICD-9 (555), and ICD-10 (K50) for 2532 CD cases; ICD-8 (5631, 569), ICD-9 (556), ICD-10
        (K51) for 5349 UC cases.
  outcome_3:
    quotes:
    - exact: In this study, summary-level statistics of genetic associations with IBD were extracted from
        a GWAS conducted by Wu et al.9 IBD diagnoses were derived from records of death register, self-reported,
        hospital admission or primary care record, resulting in a total of 7045 cases and 449,282 controls.
