claims:
  outcome_1:
    quotes:
    - exact: This dataset originated from the European ancestry segment of a recent multi-ancestry GWAS
        on T2DM, comprising 242,283 cases and 1,569,734 controls (23).
  outcome_2:
    quotes:
    - exact: 'For summary-level GWAS data related to T2DM complications, the datasets were collected from
        the FinnGen R9 database (https://r9.finngen.fi/) (24), including T2DM with coma (ICD-10: E11.0),
        ketoacidosis (ICD-10: E11.1), kidney complications (ICD-10: E11.2), retinal complications (ICD-10:
        E11.3), neuropathy (ICD-10: E11.4), and peripheral circulatory complications (ICD-10: E11.5).'
