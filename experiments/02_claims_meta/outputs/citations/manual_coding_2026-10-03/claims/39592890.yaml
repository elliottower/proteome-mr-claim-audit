claims:
  outcome_1:
    quotes:
    - exact: Summary‐level data on these outcomes were obtained from the UK Biobank and FinnGen R9 release.
  pqtl_1:
    quotes:
    - exact: The discovery analysis was based on the deCODE protein genetic database that assessed genetic
        variants' associations with 4719 unique plasma proteins measured in 35 559 Icelanders. 27 We further
        used two replication data sources from the UK Biobank Pharma Proteomics Project (UKB‐PPP) where
        2923 unique proteins were profiled in 54 219 participants 28 as well as from the Fenland study
        where genetic associations were calculated for 4775 proteins in 10 708 Caucasian. 29 Both the
        deCODE and Fenland studies profiled blood protein data using the SomaScan version 4 assay (SomaLogic)
        while the UKB‐PPP used Olink Explore 3072 PEA.
