claims:
  pqtl_1_c2:
    quotes:
    - exact: 'METHODS AND RESULTS: We leveraged cis-protein quantitative trait loci (pQTLs) for 5813 unique
        proteins from the UK Biobank (UKB) Pharma Proteomics Project (N = 54 219) and deCODE genetics
        (N = 35 559) and assessed the association with five arteriosclerotic/atherosclerotic markers,
        as well as eight cardiovascular events, using Bayesian co-localization and bidirectional MR.'
