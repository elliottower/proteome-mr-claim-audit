claims:
  outcome_1:
    quotes:
    - exact: To ensure consistency in population, we only selected 449,042 participants of European ancestry
        for analysis.15 The GWAS summary statistics for AD were obtained from the 12th release of the
        FinnGen study.
  outcome_2:
    quotes:
    - exact: Using the SomaScan version 4 assay (SomaLogic), deCODE measured 4,907 plasma proteins in
        35,559 Icelandic individuals from the Icelandic Cancer Project and various genetic programs at
        deCODE genetics, thereby identifying genetic variants associated with distinct plasma proteins.12
        The GWAS summary statistics for BP traits were derived from the UK Biobank (UKB) (discovery cohort)
        and Million Veteran Program (MVP) (replication cohort) studies, which were stored in GWAS Catalog.13
        The whole-genome sequencing of 490,640 participants from the UKB produced GWAS datasets encompassing
        763 binary and 71 quantitative phenotypes.
