claims:
  outcome_1_c2:
    quotes:
    - exact: These were used as instrumental variables for Mendelian randomisation (MR), summary-data-based
        Mendelian randomization (SMR) and colocalisation analysis, to systematically screen for multi-omics
        genetic signals in mitochondrial genes associated with cardiac arrest (from FinnGen).
  pqtl_1_c2:
    quotes:
    - exact: Methods The study utilised mitochondrial genes from MitoCarta 3.0, obtaining corresponding
        methylation quantitative trait loci (mQTL) from GoDMC, gene expression quantitative trait loci
        (eQTL) from eQTLGen and GTEx, and protein quantitative trait loci (pQTL) from UKB-PPP and deCODE.
  pqtl_2_c2:
