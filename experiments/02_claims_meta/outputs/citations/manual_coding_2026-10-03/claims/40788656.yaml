claims:
  pqtl_1_c2:
    quotes:
    - exact: 'We used publicly available regression coefficients for the association of genome-wide SNP
        data with protein levels (pQTL GWAS summary statistics) from three proteomics studies to construct
        vectors of weights for SNPs associated with plasma proteins: 2,994 proteins on the SomaLogic panel
        measured in 3,301 participants in the INTERVAL (To Determine Whether the Interval Between Blood
        Donations in England Can be Safely and Acceptably Decreased) study (12), 4,719 proteins on the
        SomaLogic v4 panel in 35,559 participants in the deCODE genetics study (13), and 2,923 proteins
        on the Olink Explore panel in 54,219 UK Biobank participants—the UKB-PPP (6).'
