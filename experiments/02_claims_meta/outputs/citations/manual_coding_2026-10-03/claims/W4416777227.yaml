claims:
  outcome_1_c2:
    quotes:
    - exact: 'Objectives: Multiple sclerosis (MS) is a chronic inflammatory demyelinating illness of the
        CNS that requires novel therapeutic targets and safety evaluations.This study aims to identify
        novel therapeutic protein targets for multiple sclerosis and evaluate possible side effects of
        druggable proteins.Methods: Causal links between MS risk and plasma proteins were explored by
        conducting a comprehensive proteome-wide MR analysis.The proteomic data were taken from the UK
        Biobank Pharma Proteomics Project (UKBPPP) and included 2,940 plasma proteins.Genetic data for
        MS were obtained from the Finnish database and the International Multiple Sclerosis Genetics Consortium
        (IMSGC).Colocalisation analysis was performed to identify shared causal variants between MS and
        plasma proteins.A phenome-wide association study (PheWAS) using the Finnish database was conducted
        to evaluate the potential side effects of the druggable proteins.Single-cell RNA sequencing (scRNA-seq)
        data from the GSE138266 dataset was also used to explore gene expression patterns across different
        cell types.Results: Six plasma proteins were identified with significant genetic correlations
        to an increased risk of MS and it was found that five of them -AIF1, AGER, TNFRSF14, CD58 and
        EVI5 -shared genetic variants with MS.This suggests their potential as direct therapeutic targets.PheWAS
        indicated the ability for these proteins to have adverse effects on other phenotypes (Pfdr < 0.05).ROC
        analysis of gene expression data from the GEO datasets (GSE131282, GSE21942) showed these proteins
        to have high diagnostic value, with AGER, AIF1, EVI5 and TNFRSF14 all displaying AUC values that
        were greater than 0.7.Single-cell RNA sequencing analysis revealed differential expressions of
        these key genes across various immune cell types, thereby highlighting their involvement in MS
        immunoregulation.Conclusions: This study explored the causal connections between MS and five plasma
        proteins, identifying possible treatment targets.'
