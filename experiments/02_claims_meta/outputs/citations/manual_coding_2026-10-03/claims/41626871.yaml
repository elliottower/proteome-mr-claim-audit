claims:
  outcome_1:
    quotes:
    - exact: Independence was determined using the OpenGWAS Database API within the ieugwasr R package
        by excluding linkage disequilibrium (LD) (r2 < 0.001, clumping window > 10,000 kb).26–28 Glaucoma
        and subtypes (POAG and PACG) data were cross-referenced from FinnGen Release 1024 and the Million
        Veteran Program.29 The GWAS summary statistics for IOP metrics,30 retinal imaging biomarkers,30
        gut microbiota,31 inflammatory factors,32 and lipidome,33 were obtained from the GWAS catalog.
