claims:
  outcome_1_c2:
    quotes:
    - exact: 'In this study, we conducted a large-scale proteomic analysis in UK Biobank participants
        with four aims: (1) to identify plasma proteins associated with kidney diseases including CKD
        and ESKD, and CVD including coronary heart disease (CHD), stroke, and heart failure (HF), highlighting
        shared and disease-specific proteins and evaluating potential causal relationships using Mendelian
        randomization (MR); (2) to assess effect modifications by age, sex, and comorbidities (hypertension,
        dyslipidemia, and diabetes); (3) to infer potential biological pathways of disease-associated
        proteins; and (4) to develop predictive models based on proteins and conventional risk factors
        (Fig. 1).Fig. 1Study overview.'
