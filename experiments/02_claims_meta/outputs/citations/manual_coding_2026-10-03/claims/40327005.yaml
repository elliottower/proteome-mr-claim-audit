claims:
  pqtl_2:
    quotes:
    - exact: One set of pQTL data encompassed 2940 circulating proteins, drawing from protein genomics
        profiles obtained from 54,219 participants in the UK Biobank.27 The second set of pQTL data was
        gathered from the deCODE database, incorporating plasma protein genomes from 4907 Icelanders (35,559
        plasma samples).28 The GWAS data on 1400 plasma metabolites were primarily derived from a Canadian
        cohort consisting of over 8000 participants of European ancestry.29 To enhance the credibility
        of the study results and extend the exploration of the genetic association between circulating
        proteins and plasma metabolites in the human body and AMD on a broader scale, AMD-related GWAS
        data were selected from two distinct sources.
