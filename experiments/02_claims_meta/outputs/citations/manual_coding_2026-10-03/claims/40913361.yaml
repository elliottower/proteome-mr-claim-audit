  outcome_1_c2:
    quotes:
    - exact: Rigorous validation, using periodontitis GWAS obtained from the Gene‐Lifestyle Interactions
        in Dental Endpoints (GLIDE) consortium, colocalisation and sensitivity analyses, was conducted
        to confirm causal associations and address potential confounding due to linkage disequilibrium
        (LD) or reverse causation.
