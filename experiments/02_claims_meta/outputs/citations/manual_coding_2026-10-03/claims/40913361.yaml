claims:
  outcome_2:
    quotes:
    - exact: Using summary statistics from a large‐scale protein quantitative trait loci (pQTL) study
        of 4719 circulating proteins in Icelandic individuals (Ferkingstad et al. 2021) and GWAS data
        for periodontitis from the Veterans Affairs Million Veteran Program (VA‐MVP), we aimed to gain
        genetic insights into protein targets involved in the pathogenesis of periodontitis.
