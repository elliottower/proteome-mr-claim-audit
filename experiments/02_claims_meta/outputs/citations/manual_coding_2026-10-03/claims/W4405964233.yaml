  outcome_2_a4:
    quotes:
    - exact: Undertaking a data-driven, proteome-wide approach to understand the protein signatures in
        dementia, this study used the English Longitudinal Study of Ageing (ELSA) as the discovery cohort,
        and subsequently the UK Biobank (UKB) as the validation cohort, to estimate the associations between
        proteins and the risk of incident all-cause dementia (ACD), and dementia subtypes.
  outcome_1_c2:
    quotes:
    - exact: Of the 276 proteins in 3249 samples from ELSA (229 incident ACD, 89 Alzheimer’s disease (AD),
        41 vascular dementia (VAD)), over a median 9.8-year follow-up, two proteins (NEFL, RPS6KB1) were
        significant after full adjustments, using Cox Proportional Hazard regression models, with False
        Discovery Rate p-value set at 0.05 to indicate statistical significance.
  outcome_2_c2:
    quotes:
    - exact: All associations were replicated in UKB in 52,745 participants (1506 ACD, 732 AD, 281 VAD)
        over median 13.7-year follow-up.
