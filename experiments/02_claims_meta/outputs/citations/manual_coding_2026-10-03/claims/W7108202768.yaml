claims:
  outcome_2:
    quotes:
    - exact: 'Methods: Using cis-acting plasma protein quantitative-trait loci for 2,478 circulating proteins,
        we performed two-sample Mendelian randomization (MR) against a composite kidney-function trait
        integrating baseline eGFR, incident chronic kidney disease, end-stage kidney disease, and annualized
        eGFR slope estimated using linear mixed-effects modeling from 464,631 Veterans Affairs Million
        Veteran Program (MVP) participants.'
