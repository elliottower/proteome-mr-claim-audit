claims:
  outcome_1_a3:
    quotes:
    - exact: This study aimed to investigate the genetic architecture and potential causal protein mediators
        of these rare cardiovascular diseases using integrated genomic and proteomic analyses. <h4>Methods</h4>
        Genome-wide association analyses were performed within the UK Biobank cohort for Brugada syndrome,
        takotsubo cardiomyopathy, and pulmonary arterial hypertension.
