claims:
  outcome_1_c2:
    quotes:
    - exact: <title>Abstract</title> <p><bold>Background:</bold> Leukemia is a type of malignant hematological
        disease, for which conventional treatments have limited efficacy, and there is an urgent need
        for novel therapeutic targets.This study investigates the causal effects of gene expression and
        plasma proteins on four subtypes of leukemia using a multi-omics integration strategy. <bold>Methods:</bold>
        Based on publicly available GWAS data from European populations, two-sample Mendelian randomization
        (MR) was employed to analyze the causal relationships between cis-expression quantitative trait
        loci (cis-eQTL, eQTLGen consortium, n=31,684) and cis-plasma protein quantitative trait loci (cis-pQTL,
        deCODE consortium, n=4,907) with four types of leukemia (FinnGen database, n≈345,000).
