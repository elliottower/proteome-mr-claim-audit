claims:
  outcome_1:
    quotes:
    - exact: Instrumental variables for each protein were then extracted from the Endometrial Cancer Association
        Consortium (ECAC) GWAS summary data excluding UK Biobank participants (12,270 cases and 46,126
        controls of European ancestry).21 We used either inverse variance weighted (IVW) models for proteins
        instrumented with ≥2 variants or the Wald ratio for proteins instrumented with one variant to
        estimate the association between protein biomarkers and endometrial cancer risk.
  pqtl_1:
    quotes:
    - exact: Genetic variants associated with proteins were identified from the UKB-PPP GWAS summary data
        (n = 52,363 individuals, 95% European ancestries).13 We selected variants within the gene region
        encoding each protein (cis variants).
