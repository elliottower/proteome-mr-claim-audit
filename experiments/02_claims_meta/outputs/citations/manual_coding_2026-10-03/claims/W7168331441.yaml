claims:
  outcome_1_c2:
    quotes:
    - exact: 'This study aimed to systematically identify genetically supported candidate proteins associated
        with AKI and to explore potential biological pathways and phenotypic associations.Methods: Using
        data from the UK Biobank Pharma Proteomics Project (UKB-PPP), FinnGen, IEU Open GWAS, and other
        large-scale databases, we applied summary-data Mendelian randomization (SMR), Bayesian colocalization
        analysis, two-sample Mendelian randomization (MR), mediation analysis, and phenome-wide association
        study (PheWAS) to assess the causal relationships and mechanisms linking plasma proteins to AKI
        risk.We collected blood samples undergoing cardiac surgery with cardiopulmonary bypass to measure
        the levels of CX3CL1 and UMOD in the plasma and compare them with indicators such as serum creatinine
        and urinary [TIMP2]*[IGFBP7], to evaluate the efficacy of CX3CL1 and UMOD in diagnosing AKI.Results:
        Two plasma proteins, CX3CL1 and uromodulin (UMOD), were identified as significantly and positively
        causally associated with AKI risk, supported by genetic colocalization evidence.'
