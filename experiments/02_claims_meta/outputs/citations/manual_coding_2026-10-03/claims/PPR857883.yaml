claims:
  outcome_1_c2:
    quotes:
    - exact: <title>Abstract</title> <p><bold>Objective</bold> Despite the lack of a genetic explanation
        for the causal link between multiple sclerosis (MS) and neuropathic bladder (NPB), our study aims
        to explore this causality and underlying mechanisms using Mendelian Randomization (MR), aiming
        to identify novel protein targets for future therapeutic interventions.<bold>Methods</bold> Data
        pertaining to MS, demyelinating diseases (DD), neurogenic bladder, and plasma proteins were sourced
        from the IEU Open GWAS Project and encompassed a diverse population.
