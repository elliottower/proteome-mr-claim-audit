claims:
  outcome_1_a3:
    quotes:
    - exact: For genetic and PRS analyses, we used UK Biobank genotype data after central sample-level
        quality control and additionally restricted analyses to participants of European genetic ancestry
        with complete genotype information, excluding individuals flagged for sex discordance, excess
        heterozygosity or missingness, close relatedness or missing genotype data.
  outcome_1_a4:
    quotes:
    - exact: We then leveraged the UK Biobank data to perform multivariable Cox proportional hazards regression,
        estimating the associations of single psychiatric disorder, co-occurring psychiatric disorder
        status and the weighted composite psychiatric disorder score with incident AD.
  outcome_1_c2:
    quotes:
    - exact: The data in this research were available with permission via application number 224336.
