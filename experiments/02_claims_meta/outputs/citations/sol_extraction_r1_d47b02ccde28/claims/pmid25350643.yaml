claims:
  c000:
    quotes:
    - exact: DBP had a strong observational and causal association with 25OHD levels (p = 3.2 × 10(-19)).
  c001:
    quotes:
    - exact: While DBP levels were observationally associated with calcium and body mass index (BMI),
        these associations were not supported by causal analyses.
  c002:
    quotes:
    - exact: While DBP levels were observationally associated with calcium and body mass index (BMI),
        these associations were not supported by causal analyses.
  c003:
    quotes:
    - exact: 'While DBP levels were observationally associated with calcium and body mass index (BMI),
        these associations were not supported by causal analyses. Despite well-powered sample sizes from
        consortia, there were no associations of rs2282679 with any other traits and diseases: fasting
        glucose (0.00 mmol/l [95% CI -0.01, 0.01]; p = 1.00; n = 46,186); fasting insulin (0.01 pmol/l
        [95% CI -0.00, 0.01,]; p = 0.22; n = 46,186); BMI (0.00 kg/m(2) [95% CI -0.01, 0.01]; p = 0.80;
        n = 127,587); bone mineral density (0.01 g/cm(2) [95% CI -0.01, 0.03]; p = 0.36; n = 32,961);
        mean arterial pressure (-0.06 mm Hg [95% CI -0.19, 0.07]); p = 0.36; n = 28,775); ischemic stroke
        (odds ratio [OR] = 1.00 [95% CI 0.97, 1.04]; p = 0.92; n = 12,389/62,004 cases/controls); coronary
        artery disease (OR = 1.02 [95% CI 0.99, 1.05]; p = 0.31; n = 22,233/64,762); or type 2 diabetes
        (OR = 1.01 [95% CI 0.97, 1.05]; p = 0.76; n = 9,580/53,810).'
