claims:
  c000:
    quotes:
    - exact: 'A doubling in plasma CRP yielded an observed odds ratio (OR) of 1.28 (95% confidence interval
        [CI]: 1.23-1.33) for hospitalization or death with depression, whereas for genetically elevated
        CRP, the causal OR was .79 (95% CI: .51-1.22; observed vs. causal estimate, p = .03).'
  c001:
    quotes:
    - exact: 'A doubling in plasma CRP yielded an observed odds ratio (OR) of 1.28 (95% confidence interval
        [CI]: 1.23-1.33) for hospitalization or death with depression, whereas for genetically elevated
        CRP, the causal OR was .79 (95% CI: .51-1.22; observed vs. causal estimate, p = .03). For prescription
        antidepressant medication use, corresponding ORs were 1.12 (1.11-1.15) and .98 (.83-1.15; p =
        .08).'
  c002:
    quotes:
    - exact: This indicates that CRP per se is not a causal risk factor for depression.
