claims:
  c000:
    quotes:
    - exact: One microgram per milliliter increase in genetically determined CETP concentration strongly
        decreased high-density lipoprotein cholesterol (-0.23 mmol/L; 95% confidence interval, -0.26 to
        -0.20), moderately increased low-density lipoprotein cholesterol (0.08 mmol/L; 95% confidence
        interval, 0.00-0.16), and was associated with an odds ratio of 1.08 (95% confidence interval,
        0.94-1.23) for CAD risk.
