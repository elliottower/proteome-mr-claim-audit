    - exact: By contrast, for every copy of 358Ala inherited, mean concentration of IL6R increased by
        34·3% (95% CI 30·4-38·2) and of interleukin 6 by 14·6% (10·7-18·4), and mean concentration of
        C-reactive protein was reduced by 7·5% (5·9-9·1) and of fibrinogen by 1·0% (0·7-1·3). For every
        copy of 358Ala inherited, risk of coronary heart disease was reduced by 3·4% (1·8-5·0).
