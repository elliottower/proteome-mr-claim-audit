claims:
  c000:
    quotes:
    - exact: A high circulating concentration of interleukin 6 is associated with increased risk of coronary
        heart disease.
  c001:
    quotes:
    - exact: Blockade of the interleukin-6 receptor (IL6R) with a monoclonal antibody (tocilizumab) licensed
        for treatment of rheumatoid arthritis reduces systemic and articular inflammation.
  c002:
    quotes:
    - exact: In 40 studies including up to 133,449 individuals, an IL6R SNP (rs7529229) marking a non-synonymous
        IL6R variant (rs8192284; p.Asp358Ala) was associated with increased circulating log interleukin-6
        concentration (increase per allele 9·45%, 95% CI 8·34-10·57) as well as reduced C-reactive protein
        (decrease per allele 8·35%, 95% CI 7·31-9·38) and fibrinogen concentrations (decrease per allele
        0·85%, 95% CI 0·60-1·10).
  c003:
    quotes:
    - exact: In 40 studies including up to 133,449 individuals, an IL6R SNP (rs7529229) marking a non-synonymous
        IL6R variant (rs8192284; p.Asp358Ala) was associated with increased circulating log interleukin-6
        concentration (increase per allele 9·45%, 95% CI 8·34-10·57) as well as reduced C-reactive protein
        (decrease per allele 8·35%, 95% CI 7·31-9·38) and fibrinogen concentrations (decrease per allele
        0·85%, 95% CI 0·60-1·10).
  c004:
    quotes:
    - exact: In 40 studies including up to 133,449 individuals, an IL6R SNP (rs7529229) marking a non-synonymous
        IL6R variant (rs8192284; p.Asp358Ala) was associated with increased circulating log interleukin-6
        concentration (increase per allele 9·45%, 95% CI 8·34-10·57) as well as reduced C-reactive protein
        (decrease per allele 8·35%, 95% CI 7·31-9·38) and fibrinogen concentrations (decrease per allele
        0·85%, 95% CI 0·60-1·10).
  c005:
    quotes:
    - exact: In 25,458 coronary heart disease cases and 100,740 controls, the IL6R rs7529229 SNP was associated
        with a decreased odds of coronary heart disease events (per allele odds ratio 0·95, 95% CI 0·93-0·97,
        p=1·53×10(-5)).
