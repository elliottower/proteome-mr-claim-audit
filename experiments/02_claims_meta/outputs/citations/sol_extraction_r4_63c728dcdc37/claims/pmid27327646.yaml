  c012:
    quotes:
    - exact: We observed nominal evidence at an observed p < 0.05 using either GRSCRP or GRSGWAS-with
        persistence after correction for heterogeneity-for a causal relationship of elevated CRP levels
        with psoriatic osteoarthritis, rheumatoid arthritis, knee osteoarthritis, systolic blood pressure,
        diastolic blood pressure, serum albumin, and bipolar disorder.
