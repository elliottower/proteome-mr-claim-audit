claims:
  c000:
    quotes:
    - exact: CRP GRSGWAS showed a statistically significant protective relationship of a 10% genetically
        elevated CRP level with the risk of schizophrenia (odds ratio [OR] 0.86 [95% CI 0.79-0.94]; p
        < 0.001).
  c001:
    quotes:
    - exact: The CRP GRSGWAS showed that a 10% increase in genetically determined CRP level was significantly
        associated with coronary artery disease (OR 0.88 [95% CI 0.84-0.94]; p < 2.4 × 10-5) and was nominally
        associated with the risk of inflammatory bowel disease (OR 0.85 [95% CI 0.74-0.98]; p < 0.03),
        Crohn disease (OR 0.81 [95% CI 0.70-0.94]; p < 0.005), psoriatic arthritis (OR 1.36 [95% CI 1.00-1.84];
        p < 0.049), knee osteoarthritis (OR 1.17 [95% CI 1.01-1.36]; p < 0.04), and bipolar disorder (OR
        1.21 [95% CI 1.05-1.40]; p < 0.007) and with an increase of 0.72 (95% CI 0.11-1.34; p < 0.02)
        mm Hg in systolic blood pressure, 0.45 (95% CI 0.06-0.84; p < 0.02) mm Hg in diastolic blood pressure,
        0.01 ml/min/1.73 m2 (95% CI 0.003-0.02; p < 0.005) in estimated glomerular filtration rate from
        serum creatinine, 0.01 g/dl (95% CI 0.0004-0.02; p < 0.04) in serum albumin level, and 0.03 g/dl
        (95% CI 0.008-0.05; p < 0.009) in serum protein level.
