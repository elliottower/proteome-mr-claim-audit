claims:
  c000:
    quotes:
    - exact: Observationally, CRP increased by 29% (95% confidence interval [CI], 23-34) per 50-mg/dL
        increase in lipoprotein(a). However, two LPA single nucleotide polymorphisms (SNPs) and the kringle
        IV type 2 (KIV-2) genotype that were associated with 98, 95, and 68 mg/dL higher lipoprotein(a)
        levels were not causally associated with increased CRP levels.
  c001:
    quotes:
    - exact: Elevated levels of lipoprotein(a) were not causally associated with increased low-grade inflammation
        as measured through CRP despite a causal association with increased risk of aortic valve stenosis
        and MI.
  c002:
    quotes:
    - exact: For aortic valve stenosis, a 1-SD increase in lipoprotein(a) levels was associated observationally
        with a multifactorially adjusted hazard ratio of 1.23 (95% CI, 1.06-1.41), with corresponding
        causal risk ratios of 1.38 (1.23-1.55) based on LPA SNPs and of 1.21 (1.06-1.40) based on LPA
        KIV-2 genotype.
  c003:
    quotes:
    - exact: Elevated levels of lipoprotein(a) were not causally associated with increased low-grade inflammation
        as measured through CRP despite a causal association with increased risk of aortic valve stenosis
        and MI.
