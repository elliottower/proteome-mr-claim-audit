claims:
  c000:
    quotes:
    - exact: 'Variants in PCSK9 and HMGCR were associated with nearly identical protective effects on
        the risk of cardiovascular events per decrease of 10 mg per deciliter (0.26 mmol per liter) in
        the LDL cholesterol level: odds ratio for cardiovascular events, 0.81 (95% confidence interval
        [CI], 0.74 to 0.89) for PCSK9 and 0.81 (95% CI, 0.72 to 0.90) for HMGCR.'
  c001:
    quotes:
    - exact: 'Variants in PCSK9 and HMGCR were associated with nearly identical protective effects on
        the risk of cardiovascular events per decrease of 10 mg per deciliter (0.26 mmol per liter) in
        the LDL cholesterol level: odds ratio for cardiovascular events, 0.81 (95% confidence interval
        [CI], 0.74 to 0.89) for PCSK9 and 0.81 (95% CI, 0.72 to 0.90) for HMGCR.'
  c002:
    quotes:
    - exact: 'Variants in these two genes were also associated with very similar effects on the risk of
        diabetes: odds ratio for each 10 mg per deciliter decrease in LDL cholesterol, 1.11 (95% CI, 1.04
        to 1.19) for PCSK9 and 1.13 (95% CI, 1.06 to 1.20) for HMGCR.'
  c003:
    quotes:
    - exact: 'Variants in these two genes were also associated with very similar effects on the risk of
        diabetes: odds ratio for each 10 mg per deciliter decrease in LDL cholesterol, 1.11 (95% CI, 1.04
        to 1.19) for PCSK9 and 1.13 (95% CI, 1.06 to 1.20) for HMGCR.'
