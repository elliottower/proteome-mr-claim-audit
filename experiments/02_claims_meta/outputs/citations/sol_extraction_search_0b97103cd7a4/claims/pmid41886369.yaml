claims:
  c000:
    quotes:
    - exact: Integrated analysis of single-cell transcriptomics, proteomics, and summary-data-based Mendelian
        randomization suggested that SMAD7 may serve as a negative regulator of ferroptosis in PAECs.
  c001:
    quotes:
    - exact: Additionally, experiments conducted both in vitro and in vivo showed that reducing SMAD7
        expression enhanced ferroptosis in PAECs, whereas SMAD7 overexpression alleviated ferroptosis
        and pulmonary vascular remodeling, potentially by blocking the transforming growth factor-beta
        -1-SMAD2/3 signaling pathway.
  c002:
    quotes:
