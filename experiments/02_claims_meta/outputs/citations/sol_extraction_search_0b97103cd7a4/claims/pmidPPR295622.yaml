claims:
  c000:
    quotes:
    - exact: After multiple testing correction, troponin I3, cardiac type (TNNI3) had the strongest effect
        (odds ratio (O.R.) of 6.86 per standard deviation increase in protein level), with proteinase
        3 (PRTN3) (O.R.=2.48), major histocompatibility complex, class II, DQ alpha 2 (HLA-DQA2) (O.R.=2.29),
        the C4A-C4B heterodimer (O.R.=1.76) and low-density lipoprotein receptor-related protein associated
        protein 1 (LRPAP1) (O.R.=1.73) also being associated with higher odds of severe COVID-19.
