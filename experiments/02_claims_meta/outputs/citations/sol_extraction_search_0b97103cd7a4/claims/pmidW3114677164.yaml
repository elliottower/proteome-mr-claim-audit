claims:
  c000:
    quotes:
    - exact: 'The fixed-effect IVW meta-analysis demonstrated a risk effect of protein PSAPL1 on osteoporosis
        after multiple testing corrections (OR=1.348,95%CI: 1.196-1.519,P=9.77×10 - 7 ).'
  c001:
    quotes:
    - exact: 'MR-Egger regression analysis did not produce evidence of directional horizontal pleiotropy
        (OR=1.002,95%CI: 0.951-1.056,P=0.943), and identified a similar causal effect of PSAPL1 level
        on osteoporosis (OR=1.334,95%CI: 0.988-1.801,P=0.079).'
  c002:
    quotes:
    - exact: 'MR-Egger regression analysis did not produce evidence of directional horizontal pleiotropy
        (OR=1.002,95%CI: 0.951-1.056,P=0.943), and identified a similar causal effect of PSAPL1 level
        on osteoporosis (OR=1.334,95%CI: 0.988-1.801,P=0.079).Sensitivity analysis also demonstrated similar
        causal effects using the weighted median (OR=1.297,95%CI: 1.095-1.535,P=2.60×10 -3 ) and weighted
        mode (OR=1.261,95%CI: 1.003-1.586,P=0.0649), respectively.'
