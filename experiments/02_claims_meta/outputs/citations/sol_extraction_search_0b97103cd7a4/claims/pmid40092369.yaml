claims:
  c000:
    quotes:
    - exact: 'NEFL (hazard ratio [HR] [95% confidence intervals (CIs)]: 1.54 [1.29, 1.84]) and RPS6KB1
        (HR [95% CI]: 1.33 [1.16, 1.52]) were robustly associated with incident all-cause dementia; MMP12
        (HR [95% CI]: 2.06 [1.41, 2.99]) was associated with vascular dementia in ELSA, after correcting
        for multiple testing.'
