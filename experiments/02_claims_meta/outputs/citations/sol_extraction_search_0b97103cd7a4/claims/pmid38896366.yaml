claims:
  c000:
    quotes:
    - exact: At the level of circulating proteins, genetically predicted higher levels of SDCCAG8 (OR
        = 0.46, 95% CI 0.34-0.64) and VCAM1 (OR = 0.21, 95% CI 0.10-0.45) were inversely associated with
        thyroid cancer risk; higher level of TCN2 was associated with an increased risk of thyroid cancer
        (OR = 1.30, 95% CI 1.15-1.47); and the higher level of SDCCAG8 (OR = 0.40, 95% CI 0.28-0.58) was
        associated with a decreased risk of papillary thyroid cancer.
