claims:
  c000:
    quotes:
    - exact: We put forth a viewpoint that the transcription factor BACH1 is causally related to the onset
        of HS, is a protective factor for HS, and may serve as its therapeutic target.
  c001:
    quotes:
    - exact: BACH1 is under-expressed in HS tissues and fibroblasts.
  c002:
    quotes:
    - exact: Overall, our results demonstrate that BACH1 has an inhibitory effect on HS, and vitamin E
        attenuates the formation of HS by stabilizing BACH1.
