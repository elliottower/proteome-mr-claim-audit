claims:
  c000:
    quotes:
    - exact: Among these, co-localization analysis further supported a role in type 2 diabetes for C-type
        Mannose Receptor 2 (MR OR=0.85, 95% CI 0.79 – 0.92 per genetically predicted standard deviation
        (SD) increase in protein level), MANS domain containing 4 (MR OR=0.90, 95% CI 0.88 – 0.92), Sodium/potassium-transporting
        ATPase subunit Beta-2 (MR OR=1.10, 95% CI 1.06 – 1.15), Endoplasmic Reticulum Oxidoreductase 1
        Beta (MR OR=1.09, 95% CI 1.05 – 1.14), Spermatogenesis-Associated Protein 20 (MR OR=1.12, 95%
        CI 1.06 – 1.18), Haptoglobin (MR OR=0.96, 95% CI 0.94 – 0.98), and Alpha 1-3-N-Acetylgalactosaminyltransferase
        and Alpha 1-3-Galactosyltransferase (MR OR=1.04, 95% CI 1.03 – 1.05).
