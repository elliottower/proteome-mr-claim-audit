claims:
  c000:
    quotes:
    - exact: MR analysis identified 97 (Decode) and 130 (UKB-PPP) sepsis-associated proteins, with 15
        overlapping candidates. Among these, SFRP1, IL1RL1, and INHBB were validated as risk factors,
        while GSTP1 exhibited protective effects.
