  c007:
    quotes:
    - exact: Analysis revealed 15 upstream regulators significantly associated with MS (FDR < 0.05; e.g.,
        GZMA, CXCL3, APOE, CFB, CA6, KIR2DL2/3).
  c008:
    quotes:
    - exact: Transcriptomic validation consistently identified ceruloplasmin (CP) as upregulated in MS
        microglia and lesions.
  c009:
    quotes:
    - exact: 'Mediation analyses established two complete causal pathways: an IFNA4-mediated pathway wherein
        five upstream immune regulators (KIR2DL2, KIR2DL3, CFB, GZMA, and CA6) influence MS susceptibility
        through IFNA4 regulation, with all component effects statistically significant; and an APOE-driven
        pathway operating via TNFAIP3, demonstrating significant total effects and near-significant mediator-outcome
        effects on MS risk.'
