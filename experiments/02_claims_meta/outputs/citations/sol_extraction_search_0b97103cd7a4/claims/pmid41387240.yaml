claims:
  c000:
    quotes:
    - exact: MR identified IFNA4 (OR = 0.24) and TNFAIP3 (OR = 2.0) as key causal ferroptosis/necroptosis-related
        proteins for MS risk.
  c001:
    quotes:
    - exact: MR identified IFNA4 (OR = 0.24) and TNFAIP3 (OR = 2.0) as key causal ferroptosis/necroptosis-related
        proteins for MS risk.
  c002:
    quotes:
    - exact: Analysis revealed 15 upstream regulators significantly associated with MS (FDR < 0.05; e.g.,
        GZMA, CXCL3, APOE, CFB, CA6, KIR2DL2/3).
  c003:
