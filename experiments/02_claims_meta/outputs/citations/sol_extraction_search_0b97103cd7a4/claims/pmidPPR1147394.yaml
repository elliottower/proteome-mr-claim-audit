claims:
  c000:
    quotes:
    - exact: Cross-trait genetic analyses and Mendelian randomization highlighted that the eGFR difference
        is highly heritable and shares genetic components with cardiometabolic signals. Multiple upstream
        inflammatory proteins, including ALPI, FABP9, INSR, and ABO, showed consistent protein-to-trait
        effects, corroborated by protein-level associations in 50,000 UK Biobank participants.
