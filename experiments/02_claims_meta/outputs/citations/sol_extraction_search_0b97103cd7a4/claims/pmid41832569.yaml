  c000:
    quotes:
    - exact: Protein-level MR analysis demonstrated that BMP6 significantly increased IVDD risk (OR =
        1.19, 95% CI 1.09-1.30; p < 0.001), supported by a colocalization probability of 99% (PP.H4 =
        0.99).
  c001:
    quotes:
    - exact: Protein-level MR analysis demonstrated that BMP6 significantly increased IVDD risk (OR =
        1.19, 95% CI 1.09-1.30; p < 0.001), supported by a colocalization probability of 99% (PP.H4 =
        0.99). Additionally, BMP6 satisfied the established validation thresholds in protein-level SMR
        and HEIDI analyses.
  c002:
    quotes:
    - exact: Urate levels exhibited a nominal mediation signal linking BMP6 to IVDD (proportion mediated
        = 7.48%, p = 0.036), which remained suggestive after BH-FDR correction.
