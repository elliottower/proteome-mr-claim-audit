  c000:
    quotes:
    - exact: At the protein level, AIF1, TNXB, APOM, and B3GNT2 were found to be negatively associated
        with AS risk, whereas higher levels of FCGR2A, FCGR2B, IL12B, TNFRSF1A, and ERAP1 were associated
        with an increased risk of AS.
