claims:
  c000:
    quotes:
    - exact: Overall 361 proteins were significantly associated at false discovery rate <0.05 with risk
        of IHD (349 positively, 12 inversely) in CKB, including N-terminal prohormone of brain natriuretic
        peptide and proprotein convertase subtilisin/kexin type 9.
  c001:
    quotes:
    - exact: Overall 361 proteins were significantly associated at false discovery rate <0.05 with risk
        of IHD (349 positively, 12 inversely) in CKB, including N-terminal prohormone of brain natriuretic
        peptide and proprotein convertase subtilisin/kexin type 9.
  c002:
    quotes:
    - exact: Of these 361 proteins, 212 had cis-pQTLs in CKB, and MR analyses of 198 variants in CARDIOGRAM+C4D
        identified 13 proteins that showed potentially causal associations with IHD. Independent MR analyses
        of 307 cis-pQTLs identified in Europeans replicated associations for 4 proteins (FURIN, proteinase-activated
        receptor-1, Asialoglycoprotein receptor-1, and matrix metalloproteinase-3).
