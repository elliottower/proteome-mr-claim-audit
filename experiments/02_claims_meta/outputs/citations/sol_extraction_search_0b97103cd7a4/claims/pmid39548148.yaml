  c003:
    quotes:
    - exact: Five drug targets for EC (CBR3, GSTO1, HHIP, IGF2R, and MMP10), seven for endometrioid subtypes
        (ACAP2, CBR3, GSTO1, HHIP, IGF2R, MMP10, and TLR2), and seven for non-endometrioid subtypes (CST3,
        DNAJB14, FSTL5, GMPR2, IFI16, MAPK9, and NEO1) were identified. Among these, IGF2R (OR = 1.165;
        95% CI 1.067-1.272; p = 1.046 × 10- 2) and CST3 (OR = 0.523; 95% CI 0.339-0.804; p = 7.010 × 10-
        3) were highlighted as key drug targets with causal evidence both at transcriptional and translational
        levels.
