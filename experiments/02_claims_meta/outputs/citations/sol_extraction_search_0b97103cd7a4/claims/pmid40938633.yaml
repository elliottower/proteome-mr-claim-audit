claims:
  c000:
    quotes:
    - exact: By integrating the cross-omics evidence, we provide a list of putative causal biomarkers
        of diabetes to serve as a valuable resource for the diabetes community. Cross-omics integration
        prioritized biomarkers for therapeutic targeting, highlighting COLEC11 as an example of a potential
        target and whose function was further validated in vitro.
  c001:
    quotes:
    - exact: We experimentally validated one of the prioritized proteins, COLEC11, and demonstrated its
        involvement in lipid metabolism.
