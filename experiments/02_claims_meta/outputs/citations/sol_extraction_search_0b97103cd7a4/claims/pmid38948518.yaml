claims:
  c000:
    quotes:
    - exact: 'What''s more, DR is associated with a lower risk of IBD according to genetic prediction
        (IVW: OR=0.922; 95%CI= 0.873-0.972; P value= 0.002) (Weighted median: OR=0.924; 95%CI= 0.861-0.992;
        P value= 0.029). Fibroblast growth factor 21 (FGF21), phosphatidylcholine (PC), and triacylglycerol
        (TG) serve as mediators in these relationships.'
