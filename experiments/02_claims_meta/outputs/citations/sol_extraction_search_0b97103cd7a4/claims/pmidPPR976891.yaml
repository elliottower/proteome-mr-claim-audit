  c002:
    quotes:
    - exact: In contrast to previous expression QTL evidence, our study suggested that ITGAV inhibition
        could reduce FEV 1 /FVC; we note that reduced lung function was also seen in a recent trial of
        an ITGAV inhibitor ( NCT01371305 ).
  c003:
    quotes:
    - exact: Our MR analysis implicated six proteins not implicated by previous lung function GWAS or
        MR (DTD1, PILRA, PTPRK, TDPRK, GRHPR, NUDT5).
