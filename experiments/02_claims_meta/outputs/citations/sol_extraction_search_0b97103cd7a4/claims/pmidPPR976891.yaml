claims:
  c000:
    quotes:
    - exact: Surfactant protein D (SFTPD) has been highlighted in previous respiratory MR analyses and
        variants in SFTPD have been previously reported to be associated with emphysema; our PheWAS suggested
        that this variant has a relatively specific effect on lung function as it was associated with
        no non-respiratory traits at a FDR<1%.
