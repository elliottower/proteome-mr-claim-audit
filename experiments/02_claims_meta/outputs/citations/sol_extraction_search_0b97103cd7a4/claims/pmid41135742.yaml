  c000:
    quotes:
    - exact: Cross-validation across multi-omics datasets revealed transcriptional enhancer factor (TEF)
        as a protective factor for PD, whereas increased counts of CD14+CD16+ monocytes were identified
        as a risk factor.
  c001:
