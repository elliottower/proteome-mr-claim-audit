claims:
  c000:
    quotes:
    - exact: PWAS identified seven significant proteins, with three (  <italic>MTHFR</italic>  ,  <italic>KDELC2</italic>  ,
        and  <italic>SAMD4A</italic>  ) confirmed as causal, further highlighting 15q15.1 as a novel risk
        locus consistently emerging across all omics layers. This integrated multi-omics approach reveals
        novel genetic and molecular mechanisms underlying DTC, linking genomic variation to gene expression
        and protein abundance.
