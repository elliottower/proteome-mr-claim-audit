  c003:
    quotes:
    - exact: Other proteins showed close-to-significant associations with the trait of 'fluid intelligence
        score', such as plasma protease C1 inhibitor (P CSF = 4.19 × 10-4, P plasma = 6.97 × 10-4), and
        with the trait of 'maximum digits remembered correctly', such as tenascin (P plasma = 3.42 × 10-4).
