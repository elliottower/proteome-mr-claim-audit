  c006:
    quotes:
    - exact: 'Additionally, Mendelian randomization analysis results suggested that macrophage-stimulating
        protein (Mendelian randomization-Egger: β = 0.54, P = 1.64 × 10-61 in the brain; β = 0.09, P =
        1.60 × 10-12 in CSF) had causal effects on fluid intelligence score.'
