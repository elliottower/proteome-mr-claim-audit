claims:
  c000:
    quotes:
    - exact: Pearson correlation analysis identified significant association signals between the protein
        of macrophage-stimulating protein and fluid intelligence in brain and CSF tissues (P brain = 1.21
        × 10-8, P CSF = 1.10 × 10-7), as well as between B-cell lymphoma 6 protein and fluid intelligence
        in CSF (P CSF = 1.23 × 10-4).
