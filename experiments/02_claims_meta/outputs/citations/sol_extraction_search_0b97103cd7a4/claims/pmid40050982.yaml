  c005:
    quotes:
    - exact: Among these five proteins, GRN was protective against AD, while the rest were risk factors.
        Consistent causal effects were found in the brain for cis-eQTLs of GRN, BLNK, and CD2AP, while
        the same was true for PILRA in the blood.
