claims:
  c000:
    quotes:
    - exact: Here, we prioritise eight robust (e.g., ELF5) or suggestive but unreported (e.g., RAB2A)
        candidate protein mediators of COVID-19 outcomes by integrating results from the COVID-19 Host
        Genetics Initiative with population-based plasma proteomics using statistical colocalisation.
  c001:
    quotes:
    - exact: Here, we prioritise eight robust (e.g., ELF5) or suggestive but unreported (e.g., RAB2A)
        candidate protein mediators of COVID-19 outcomes by integrating results from the COVID-19 Host
        Genetics Initiative with population-based plasma proteomics using statistical colocalisation.
  c002:
    quotes:
    - exact: 'The transcription factor ELF5 (ELF5) shows robust and directionally consistent associations
        across different outcome definitions, including a >4-fold higher risk (odds ratio: 4.88; 95%-CI:
        2.47-9.63; p-value < 5.0 × 10-6) for severe COVID-19 per 1 s.d. higher genetically predicted plasma
        ELF5.'
