  c003:
    quotes:
    - exact: 'Of the 3 genetic signals with evidence of colocalization, 2 protein-disease associations
        demonstrated generalizable causal effects on PAD in African and European ancestry groups: MMP3
        (European OR: 1.19, p=4.5x10 -5 ; African OR: 1.11, p=3.2x10 -36 ) and ENTPD6 (European OR: 1.08,
        p=6.9x10 -6 ; African OR: 1.16, p= 1x10 -20 ).'
