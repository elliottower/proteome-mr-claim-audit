claims:
  c000:
    quotes:
    - exact: 'Single and multivariant colocalization analysis identified 3 proteins that had shared genetic
        signals between cis-pQTLs and PAD-associated loci in European individuals: MMP3 PP.H4 = 0.89,
        MMP12 PP.H4 = 1.0, and E NTPD6 PP.H4 = 0.99.'
