claims:
  c000:
    quotes:
    - exact: 'Integrative two-sample and SMR analyses identified eight core PCD-related genes with robust
        genetic evidence linking to RP (e.g., AIM2, odds ratio = 2.90, 95% confidence interval: 1.81-4.63),
        which showed consistent effects across multiple tissues and remained nominally significant in
        MVMR models adjusting for proxy phenotypes of smoking and physical activity (nominal P < 0.05).'
  c001:
    quotes:
    - exact: 'Integrative two-sample and SMR analyses identified eight core PCD-related genes with robust
        genetic evidence linking to RP (e.g., AIM2, odds ratio = 2.90, 95% confidence interval: 1.81-4.63),
        which showed consistent effects across multiple tissues and remained nominally significant in
        MVMR models adjusting for proxy phenotypes of smoking and physical activity (nominal P < 0.05).'
  c002:
    quotes:
    - exact: In retinal transcriptomes, these genes were dysregulated and enriched in immune pathways;
        CIBERSORT analysis revealed correlated immune cell infiltration, including a strong negative correlation
        between H13 and M1 macrophages (r = -0.625, P < 0.05).
