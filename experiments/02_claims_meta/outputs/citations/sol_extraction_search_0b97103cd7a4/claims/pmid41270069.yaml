claims:
  c000:
    quotes:
    - exact: Our comprehensive analysis showed that protein abundance of eight genes was associated with
        prostate cancer, four of which were validated at the transcriptome level. These 8 candidate genes
        (MSMB, PLG, CHMP2B, ATF6B, EGF, TAPBP, GAS1 and MMP7) were validated.
