  c016:
    quotes:
    - exact: 'Eight proteins were independently associated with AF in both cohorts: NT-proBNP, SVEP1,
        TAGLN, TFF3, WAP4, MMP-12, CILP2 and NELL-1. Of these, 3 were significant in MR analysis (Figure
        1): CILP2 and MMP-12 maintain structural integrity of the extracellular matrix in the heart and
        modulate the fibrotic response; NELL-1 is responsible for cell signaling in kidney disease and
        cardiovascular development.'
