    - exact: Our study found a significant positive correlation between high expression of the FURIN gene
        and a reduced risk of RLS.
  c001:
    quotes:
    - exact: Mediator effect analysis showed that TLR1 indirectly reduces the occurrence of RLS by regulating
        the expression of the FURIN gene, with the mediator effect of FURIN gene expression accounting
        for 17.9% of the total effect.
