        be direct targets for PSC.
  c002:
    quotes:
    - exact: The phenome-wide screening suggested that variants located at AIF1 or HLA-DQA2 region were
        closely associated with several autoimmune diseases, such as rheumatoid arthritis, implicating
        the shared pathogenesis among them.
