  c000:
    quotes:
    - exact: The colocalization indicated that AIF1 (allograft inflammatory factor 1) and HLA-DQA2 (major
        histocompatibility complex, class II, DQ alpha 2) were shared proteins with PSC, and they should
        be direct targets for PSC.
