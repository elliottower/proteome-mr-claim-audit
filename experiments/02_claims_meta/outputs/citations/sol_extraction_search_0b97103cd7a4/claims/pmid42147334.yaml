claims:
  c000:
    quotes:
    - exact: The colocalization analysis revealed that six genes (APOM, C4A, C4B, CYP21A2, HCP5 and NEU1)
        and two proteins (MICB and IL17F) shared the causal genetic variants with DLBCL, suggesting their
        potential as therapeutic targets.
  c001:
    quotes:
    - exact: The colocalization analysis revealed that six genes (APOM, C4A, C4B, CYP21A2, HCP5 and NEU1)
        and two proteins (MICB and IL17F) shared the causal genetic variants with DLBCL, suggesting their
        potential as therapeutic targets.
  c002:
    quotes:
    - exact: The single-cell analysis for DLBCL tumors confirmed their cell type-specific expressions,
        suggesting that TUBB, with high risk for DLBCL, was highly expressed in malignant B cells with
        expression levels increasing as the tumor malignancy worsens.
  c003:
    quotes:
    - exact: The single-cell analysis for DLBCL tumors confirmed their cell type-specific expressions,
        suggesting that TUBB, with high risk for DLBCL, was highly expressed in malignant B cells with
        expression levels increasing as the tumor malignancy worsens.
  c004:
    quotes:
    - exact: Further experiments and transcriptomics using the TUBB inhibitor demonstrated its anti-DLBCL
        efficacy, highlighting the therapeutic promise of targeting TUBB.
