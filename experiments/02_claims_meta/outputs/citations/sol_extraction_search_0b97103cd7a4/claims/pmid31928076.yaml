  c002:
    quotes:
    - exact: uPA (urokinase-type plasminogen activator) was related to systolic blood pressure; ADM (adrenomedullin)
        was related to systolic blood pressure and pulse pressure; IL (interleukin) 16 was related to
        diastolic blood pressure; cFn (cellular fibronectin) and IGFBP3 (insulin-like growth factor-binding
        protein 3) were related to pulse pressure.
