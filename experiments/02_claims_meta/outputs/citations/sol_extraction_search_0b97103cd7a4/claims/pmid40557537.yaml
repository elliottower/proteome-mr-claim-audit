    - exact: LGALS9 and SELL exhibited significant causal associations with elevated GBM risk.
  c001:
    quotes:
    - exact: LGALS9 and SELL exhibited significant causal associations with elevated GBM risk.
  c002:
    quotes:
    - exact: 'Two-step MR analyses elucidated their mechanisms: LGALS9 promotes GBM via CD3 on CD39 +
        resting regulatory T cells (mediating 7% of the effect), while SELL acts through cerebrospinal
        fluid metabolite X-22162 (mediating 16% of the effect).'
