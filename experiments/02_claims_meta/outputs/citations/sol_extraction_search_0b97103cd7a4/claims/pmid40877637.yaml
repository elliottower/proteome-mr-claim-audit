claims:
  c000:
    quotes:
    - exact: Robust evidence linked follitropin subunit beta (FSHB) with endometrioid OC (per SD higher,
        OR 2.41, 95% CI 1.56, 3.71).
  c001:
    quotes:
    - exact: We identified 12 suggestive associations with OC or its subtypes at nominal threshold (p
        < 0.05), involving 11 plasma proteins, with no evidence of pleiotropy from leave-one-out and MR-Egger
        intercept tests (Pintercept > 0.17). Potential drug targets were identified for follitropin receptor
        and eight other proteins.
