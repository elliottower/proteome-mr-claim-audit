claims:
  c000:
    quotes:
    - exact: Genetically predicted circulating levels of 27 proteins were found to be associated with
        breast cancer survival. Among these, eight proteins (ADAM15, CD83, SH3BGRL3, SNCG, ANXA1, GRHPR,
        ALDH2, and MTHFD2) showed the strongest evidence of association, while four proteins (ARG2, RPL14,
        NFU1, and TXNL4B) demonstrated a strong but slightly weaker correlation.
