claims:
  c000:
    quotes:
    - exact: By applying Bayesian colocalization (posterior probability for H4>80%), SMR analysis (P<0.05),
        and the Steiger filtering test (TRUE), we identified one therapeutic target for LBP (P2RY13),
        four for IVDD (CAPN10, AKR1C2, BTN1A1, EIF2AK3), and four for sciatica (NT5C, GPX1, SUMO2, DAG1).
