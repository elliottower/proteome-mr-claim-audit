  c006:
    quotes:
    - exact: Co-localization analysis confirmed that ANO5, SCFD1, and SIGLEC9 (coloc.abf-PPH4 = 0.848,
        0.984, and 0.945, respectively) shared the same variant with amyotrophic lateral sclerosis, further
        substantiating potential role of these proteins as a therapeutic target.
