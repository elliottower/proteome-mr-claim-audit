claims:
  c000:
    quotes:
    - exact: Mendelian randomization analysis indicated that elevated levels of ANO5 (OR = 1.30; 95 %
        CI, 1.14-1.49; P = 1.52E-04), SCFD1 (OR = 3.82; 95 % CI, 2.39-6.10; P = 2.19E-08), and SIGLEC9
        (OR = 1.05; 95% CI, 1.03-1.07; P = 4.71E-05) are associated with an increased risk of amyotrophic
        lateral sclerosis, with external validation supporting these findings.
