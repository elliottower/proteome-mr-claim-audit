  c005:
    quotes:
    - exact: Apart from the circulating form of GP73, both mouse model and human specimens imply that
        vascular GP73 expression was also upregulated in atherosclerotic lesions and concomitant with
        markers of macrophage and phenotypic switching of vascular smooth muscle cells (VSMCs).
