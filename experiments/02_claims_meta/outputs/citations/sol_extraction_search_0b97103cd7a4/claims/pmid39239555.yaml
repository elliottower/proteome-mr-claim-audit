claims:
  c000:
    quotes:
    - exact: Among the differentially expressed proteins identified utilizing proteomics, we found that
        circulating Golgi protein 73 (GP73) was causally associated with incident CAD and other atherosclerotic
        events sharing similar etiology.
  c001:
    quotes:
    - exact: Among the differentially expressed proteins identified utilizing proteomics, we found that
        circulating Golgi protein 73 (GP73) was causally associated with incident CAD and other atherosclerotic
        events sharing similar etiology.
  c002:
    quotes:
    - exact: Network MR approach showed low-density lipoprotein cholesterol and glycated hemoglobin serve
        as mediators in the causal pathway, transmitting 42.1% and 8.7% effects from GP73 to CAD, respectively.
