  c003:
    quotes:
    - exact: Another example were UGT1A1 and UGT1A6, enzymes that transform small lipophilic molecules
        into water-soluble, excretable metabolites. Accordingly, they were among the proteins with the
        highest number of associated metabolites and linked to risk of gallstone disease.
