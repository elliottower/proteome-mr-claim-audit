  c000:
    quotes:
    - exact: For example, the kidney membrane enzyme DPEP1 displayed the strongest association with urine
        prolylglycine (p-value=1.1e-292) and was associated with 13 metabolite levels and 25 health outcomes
        including higher hemoglobin concentration and less frequently diagnosed high blood pressure.
