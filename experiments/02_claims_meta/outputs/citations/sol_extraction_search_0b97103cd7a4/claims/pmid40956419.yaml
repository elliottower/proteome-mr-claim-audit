    - exact: 'We found that the protein level ratio of ANXA11/ANXA3 was significantly positively associated
        with the positive effects of antidepressant treatment(IVW method(FEM): OR = 1.537, 95%CI = 1.263-1.869,
        p = 1.730E-05, pFDR = 0.049), suggesting its potential as a biomarker for predicting antidepressant
        efficacy.'
