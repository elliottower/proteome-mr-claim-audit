        analyses.'
  c002:
    quotes:
    - exact: Clinically, septic patients exhibited higher peripheral blood levels of CCL4 within 24 hours
        than controls.
  c003:
    quotes:
    - exact: This decline was accompanied by transcriptomic evidence of T-cell exhaustion, with increased
        CTLA-4 and decreased IL-2 and IFN-γ.
  c004:
