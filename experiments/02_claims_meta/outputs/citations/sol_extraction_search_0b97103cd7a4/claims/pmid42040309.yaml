claims:
  c000:
    quotes:
    - exact: 'Genetically elevated levels of CCL4 (Chemokine CC motif ligand 4) were associated with critical
        sepsis risk (OR = 0.70, 95% CI: 0.58-0.84, P = 1.45×10-4, FDR = 0.017), consistent across sensitivity
        analyses.'
