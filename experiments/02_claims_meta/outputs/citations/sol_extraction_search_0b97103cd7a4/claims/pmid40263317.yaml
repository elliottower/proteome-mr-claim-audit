  c000:
    quotes:
    - exact: We show colocalization of pQTLs for CTRB1, APOBR, IL7R, CPA1, and PNLIPRP1 with Type 1 diabetes
        GWAS signals, and Mendelian randomization causally implicates each of these five proteins in the
        aetiology of Type 1 diabetes.
