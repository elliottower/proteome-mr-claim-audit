claims:
  c000:
    quotes:
    - exact: In addition to some proteins reported previously, such as SFTPD related to severe COVID-19,
        we identified novel proteins involved in inflammation and immunity (such as ICAM-2 and ICAM-5
        which affect COVID-19 risk, CXCL9, HLA-DRA and LILRB4 for healthspan and lifespan), apoptosis
        (such as FGFR2 and ERBB4 which affect COVID-19 risk and FOXO3 which affect lifespan) and metabolism
        (such as PCSK9 which lowers lifespan).
