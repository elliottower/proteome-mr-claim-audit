claims:
  c000:
    quotes:
    - exact: In our preliminary analyses of nine proteomic datasets, we identified 104 potential drug
        targets for MDD after Bonferroni correction for multiple tests. All significant proteins were
        detected in blood plasma, with IL6R and BST1 overlapping in both blood and CSF.
