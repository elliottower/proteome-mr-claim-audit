claims:
  c000:
    quotes:
    - exact: Applied to genome-wide proteomics data from 54,306 UK Biobank participants and 455,258 subjects
        (71,880 cases and 383,378 controls) for a genome-wide association study of Alzheimer’s disease,
        we identified seven proteins (TREM2, PILRB, PILRA, EPHA1, CD33, RET, and CD55) with structural
        alterations due to missense mutations.
