claims:
  c000:
    quotes:
    - exact: SMR analysis integrating pQTL data was conducted to identify proteins linked to psoriasis,
        revealing ICAM1 (Intercellular Adhesion Molecule 1) as a potential pathogenic factor.
  c001:
    quotes:
    - exact: A key SNP, rs34536443 (P1104A), located in TYK2, was found to regulate ICAM1.
  c002:
    quotes:
    - exact: In TYK2-P1104A mutant THP-1 cells, LPS-induced ICAM1 expression was significantly reduced,
        with ICAM5 unaffected.
  c003:
    quotes:
    - exact: In TYK2-P1104A mutant THP-1 cells, LPS-induced ICAM1 expression was significantly reduced,
        with ICAM5 unaffected.
  c004:
    quotes:
    - exact: In TYK2-P1104A mutant THP-1 cells, LPS-induced ICAM1 expression was significantly reduced,
        with ICAM5 unaffected. The mutation also suppressed IL-1β, TNF-α, IL-6, and IL-18 expression,
        suggesting anti-inflammatory effects.
