claims:
  c000:
    quotes:
    - exact: Second, metabolite analyses highlighted the protective effect of carnitines and the disease
        risk associated with DSGEGDFXAEGGGVR, a peptide linked to the neuronal glucose transporter GLUT3;
        overall, impaired metabolic flexibility in motor neurons was found to increase ALS risk.
  c001:
    quotes:
    - exact: Third, a neurofilament-guided screen of circulating proteins prioritised plasma BRK1 as protective
        against ALS risk, alongside CD14, OMG, SMOC1, DPY30, and DTNB, implicating cytoskeletal regulation,
        immune activation, glial biology, and neuromuscular junction integrity in ALS pathogenesis.
