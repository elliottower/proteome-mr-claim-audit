claims:
  c000:
    quotes:
    - exact: ApoE was causally associated with sepsis risk in multiple independent datasets, supported
        by strong genetic colocalization (posterior probability for shared causal variant PP.H4 > 0.80).
  c001:
    quotes:
    - exact: In ICU patients, both low (adjusted OR 12.74, 95% CI 5.72-28.36) and high ApoE levels (adjusted
        OR 4.54, 95% CI 2.25-9.16) were independently associated with increased sepsis risk compared to
        medium levels, forming a significant U-shaped pattern (P_nonlinear < 0.001).
  c002:
    quotes:
    - exact: In ICU patients, both low (adjusted OR 12.74, 95% CI 5.72-28.36) and high ApoE levels (adjusted
        OR 4.54, 95% CI 2.25-9.16) were independently associated with increased sepsis risk compared to
        medium levels, forming a significant U-shaped pattern (P_nonlinear < 0.001).
  c003:
    quotes:
    - exact: This biphasic risk was mirrored in murine models, where both hypo- and hyper-expression of
        ApoE aggravated systemic inflammation, organ injury, and mortality.
