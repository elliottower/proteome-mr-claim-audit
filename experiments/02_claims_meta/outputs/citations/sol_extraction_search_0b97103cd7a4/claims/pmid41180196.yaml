  c003:
    quotes:
    - exact: PWAS in the discovery cohort identified three plasma proteins-NCAN, EPHA2, and APOE-significantly
        associated with MASLD risk. Among them, NCAN showed the strongest and most consistent association,
        which was replicated in the validation cohort.
  c004:
    quotes:
    - exact: MR analyses supported a causal role for NCAN in both cohorts, whereas colocalization at the
        NCAN locus was suggestive rather than definitive. Immunohistochemical analysis showed that NCAN
        expression was significantly reduced in MASLD liver tissues.
