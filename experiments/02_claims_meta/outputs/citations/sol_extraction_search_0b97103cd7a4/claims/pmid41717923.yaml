claims:
  c000:
    quotes:
    - exact: 'Six proteins (STAT3 [signal transducer and activator of transcription 3], MIC-1 [growth
        differentiation factor 15], apoA-II [apolipoprotein A-II], TPST1 [protein-tyrosine sulfotransferase
        1], integrin a1b1 [integrin alpha-I: beta-1 complex], and BLC [C-X-C motif chemokine 13]) showed
        potential inverse causal effects on with forced expiratory volume in 1 second and forced vital
        capacity, and integrin a1b1 demonstrated consistent inverse associations with chronic obstructive
        pulmonary disease, coronary heart disease, and heart failure risks.'
