claims:
  c000:
    quotes:
    - exact: SGLT2 inhibition demonstrated a lower risk of HF (odds ratio [OR] = 0.44, 95% CI [0.26, 0.76],
        P = 0.003).
  c001:
    quotes:
    - exact: Among 4,907 circulating proteins, we identified leucine rich repeat transmembrane protein
        2 (LRRTM2), which was related to both SGLT2 inhibition and HF.
  c002:
    quotes:
    - exact: Mediation analysis revealed that the impact of SGLT2 inhibition on HF operates indirectly
        through LRRTM2 [β = -0.20, 95% CI (-0.39, -0.06), P = 0.02] with a mediation proportion of 24.6%.
  c003:
    quotes:
    - exact: Colocalization analysis provided support for the connections between LRRTM2 and HF.
