claims:
  c000:
    quotes:
    - exact: 'In the EPIC+UKBB meta-analyses, FLT3LG and CNTNAP2 were significantly associated with overall
        prostate cancer risk (RRMeta: 0.88, 95% CI: 0.84-0.92 and RRMeta: 1.10, 95% CI: 1.05-1.16, respectively),
        and in the analyses stratified by time to diagnosis, IL15 was associated with risk of prostate
        cancer diagnosed more than seven years after blood draw (RRMeta: 0.86, 95% CI: 0.81-0.93), along
        with five other proteins (FLT3LG, BCL2L11, PGF, CKAP4, and TNFRSF11A).'
