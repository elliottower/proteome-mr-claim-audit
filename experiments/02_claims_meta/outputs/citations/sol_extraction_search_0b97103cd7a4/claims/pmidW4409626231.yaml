  c010:
    quotes:
    - exact: 'MR and colocalisation analyses also identified SPINT2 (OR: 2.11, 95% CI: 1.70-2.63) and
        NME3 (OR: 1.25, 95% CI: 1.11-1.41) as being associated with an increased risk of prostate cancer
        overall.'
