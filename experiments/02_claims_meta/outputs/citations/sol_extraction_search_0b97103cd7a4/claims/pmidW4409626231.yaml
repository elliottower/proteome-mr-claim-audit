  c008:
    quotes:
    - exact: 'Exome protein scores in UKBB identified PARP1 as associated with an increased risk of prostate
        cancer (OR: 1.05, 95% CI: 1.02-1.07), which replicated in MEC (OR: 1.04, 95% CI: 1.01-1.08).'
