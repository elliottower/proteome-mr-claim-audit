claims:
  c000:
    quotes:
    - exact: Decreased levels of eight proteins (IFNLR1, APOF, TDRKH, DDR1, HLA-E, LTA, MOG, and ICAM3)
        and increased levels of five proteins (IFNGR2, HCG22, IL12B, BTN3A2, and TRIM40) showed protective
        effects against PsO progression.
