  c000:
    quotes:
    - exact: 'After Bonferron correction (p < 0.05/734), RPN1 (OR: 0.96; 95%CI: (0.95, 0.97)), GDI2 (OR:
        0.94; 95%CI: (0.92, 0.96)), NT5C (OR: 0.97; 95%CI: (0.95, 0.98)) had a significant negative causal
        association with telomere length; TYRO3 (OR: 1.11; 95%CI: (1.09, 1.15)) had a significant positive
        causal association with telomere length.'
