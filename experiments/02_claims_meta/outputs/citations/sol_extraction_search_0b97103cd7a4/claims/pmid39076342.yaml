claims:
  c000:
    quotes:
    - exact: 'Causal mediators for MI were identified, encompassing cardiotrophin-1 (CT-1) (odds ratio
        [OR] per SD increase: 1.16; 95% confidence interval [CI]: 1.13-1.18; p = 1.29 × 10 - 31 ), Selenoprotein
        S (SELENOS) (OR: 1.16; 95% CI: 1.13-1.20; p = 4.73 × 10 - 24 ), killer cell immunoglobulin-like
        receptor 2DS2 (KIR2DS2) (OR: 0.93; 95% CI: 0.90-0.96; p = 1.08 × 10 - 5 ), vacuolar protein sorting-associated
        protein 29 (VPS29) (OR: 0.92; 95% CI: 0.90-0.94; p = 8.05 × 10 - 13 ), and histo-blood group ABO
        system transferase (NAGAT) (OR: 1.05; 95% CI: 1.03-1.07; p = 1.41 × 10 - 5 ).'
