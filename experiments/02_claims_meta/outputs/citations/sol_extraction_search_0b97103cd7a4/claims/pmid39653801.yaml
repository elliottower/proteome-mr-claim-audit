claims:
  c000:
    quotes:
    - exact: Proteome-wide association analysis across 4,696 participants of 2,922 proteins identified
        13 significantly associated with BAG, implicating stress, regeneration and inflammation. Brevican
        (BCAN) (β = -0.838, P = 2.63 × 10-10) and growth differentiation factor 15 (β = 0.825, P = 3.48
        × 10-11) showed the most significant, and multiple, associations with dementia, stroke and movement
        functions.
