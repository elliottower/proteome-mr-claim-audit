claims:
  c000:
    quotes:
    - exact: Mendelian randomization results suggest that LTBP4 (latent transforming growth factor β-binding
        protein 4) is significantly associated with the risk of TAA.
  c001:
    quotes:
    - exact: Plasma transcriptomics showed significantly increased LTBP4 expression in patients with TAA
        (log fold change=0.69, adjusted P=7.04×10-4), with an area under the curve of 0.76.
  c002:
    quotes:
    - exact: In vitro experiments demonstrate that the expression of LTBP4 protein is significantly increased
        in TAA tissue.
