claims:
  c000:
    quotes:
    - exact: Genetically predicted insulin was associated with a higher risk of CAD (odds ratio 1.79,
        95% confidence interval 1.34 to 2.40).
  c001:
    quotes:
    - exact: At a false discovery rate of 0.05, insulin affected 355 proteins, ten of which were both
        increased by insulin and linked to a higher risk of CAD. After sensitivity and replication analyses,
        PLA2G7, GZMA, LDLR, AGRP, and HHEX were identified as reliable mediators.
