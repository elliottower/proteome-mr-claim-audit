claims:
  c000:
    quotes:
    - exact: Higher levels of Cardiotrophin-1 (CTF1) (OR = 0.68, CI 0.53–0.87, P = 2.54×<sup>10−3</sup>)
        were associated with a reduced risk of female infertility, whereas higher levels of Insulin-like
        growth factor-binding protein 5 (IGFBP5) (OR = 1.35, CI 1.09–1.66, P = 5.54×<sup>10−3</sup>) were
        associated with an increased risk of female infertility.
