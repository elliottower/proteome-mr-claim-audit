        95% confidence interval: 0.37-0.71) through autophagy regulation, while SLAMF7 represents an immediate
        drug repositioning opportunity as the target of food and drug administration-approved elotuzumab.'
  c002:
    quotes:
    - exact: Five targets have existing approved drugs (SLAMF7, ICAM1, IL18, IL6ST, CTSS). Single-cell
        analysis revealed profound disruption of hub gene-immune cell relationships in untreated GCA patients,
        with cell-type-specific alterations in inflammatory gene expression, and TYMP as the most critical
        hub gene.
