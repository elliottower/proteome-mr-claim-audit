claims:
  c000:
    quotes:
    - exact: 'Unc-51 like kinase 3 (ULK3) emerged as the strongest protective factor (odds ratio = 0.47,
        95% confidence interval: 0.37-0.71) through autophagy regulation, while SLAMF7 represents an immediate
        drug repositioning opportunity as the target of food and drug administration-approved elotuzumab.'
