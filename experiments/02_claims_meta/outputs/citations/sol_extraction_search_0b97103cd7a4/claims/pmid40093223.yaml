claims:
  c000:
    quotes:
    - exact: To resolve findings at a coronary tissue level, we performed the largest to date coronary
        artery-specific transcriptome-wide association study for CAC (TWAS; based on RNA-seq from 268
        human coronary arteries) in >35,000 individuals, demonstrating enrichment of targets from the
        circulating proteome with supportive evidence by traditional MR approaches (NOTCH3, SPINK2, S100A12,
        RPP25, OAF, HS6ST3, TNFSF12, GPC6), several implicated in CVD-adjacent biological mechanisms.
