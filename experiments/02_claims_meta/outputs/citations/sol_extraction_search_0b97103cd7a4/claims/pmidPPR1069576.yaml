claims:
  c000:
    quotes:
    - exact: This study systematically revealed the tumor-promoting role of the ITGB2-IL2RB-NK cell axis
        in PTC for the first time, providing a theoretical basis for developing combined immunotherapy
        strategies targeting the tumor microenvironment.
  c001:
    quotes:
    - exact: This study systematically revealed the tumor-promoting role of the ITGB2-IL2RB-NK cell axis
        in PTC for the first time, providing a theoretical basis for developing combined immunotherapy
        strategies targeting the tumor microenvironment.
  c002:
    quotes:
    - exact: We identified the ITGB2-IL2RB-NK cell regulatory axis, which was significantly associated
        with PTC risk. This regulatory axis demonstrated marked differential expression and co-expression
        relationships in PTC tissues, confirming its functional relevance.
