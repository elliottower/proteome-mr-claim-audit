claims:
  c000:
    quotes:
    - exact: Next, employing Mendelian randomization which combined genetic determinants of Df, and cis-protein
        Quantitative Trait Loci from 1,159 circulating proteins from the Prospective Urban and Rural Epidemiological
        (PURE) cohort (n=12,066), we identified eight causal mediators for Df, namely IgG Fc receptorIIb,
        BST1, LILRB2, IL16, MMP12, PON2, ALPP, and PDL2.
