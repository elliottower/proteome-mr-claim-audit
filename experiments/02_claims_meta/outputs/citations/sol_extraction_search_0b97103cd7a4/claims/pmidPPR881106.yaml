  c008:
    quotes:
    - exact: Notably, MMP12 and IgG Fc receptorIIb have been suggested to connect Df to cardiometabolic
        outcomes (i.e., coronary artery disease, stroke, peripheral artery disease, and type 2 diabetes)
        and longevity, respectively.
