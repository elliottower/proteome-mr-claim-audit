claims:
  c000:
    quotes:
    - exact: For example, a 1-SD increase in genetically predicted CELSR2 abundance was associated with
        lower overall HF risk (odds ratio, 0.96 [95% CI, 0.94-0.98]; P=8.6×10-7), whereas a 1-SD increase
        in genetically predicted CSF3 abundance was associated with higher nonischemic HF risk (odds ratio,
        1.32 [95% CI, 1.18-1.48]; P=2.0×10-6).
