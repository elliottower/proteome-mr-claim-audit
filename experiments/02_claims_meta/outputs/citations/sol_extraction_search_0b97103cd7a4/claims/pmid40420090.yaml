    quotes:
    - exact: 'Eight proteins showed significant associations with VTE risk after Bonferroni correction
        (p < 3.19 × 10-5). Odds ratios ranged from 0.98 (95% CI: 0.98-0.99) for PLEK to 1.03 (95% CI:
        1.02-1.04) for LRP12.'
