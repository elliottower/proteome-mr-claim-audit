claims:
  c000:
    quotes:
    - exact: After correction for multiple testing, 78 circulating proteins showed genetically predicted
        associations with psoriasis, with 27 demonstrating strong colocalisation (PPH4>80%). Triangulation
        prioritised 12 Tier 1 proteins, STX4, FLT3, NFKB1, IL18, PRSS53, SPAG1, SGSH, PLAT, RALB, TNFSF11,
        SPHK2, and STAT3, supported by consistent effects and no heterogeneity.
