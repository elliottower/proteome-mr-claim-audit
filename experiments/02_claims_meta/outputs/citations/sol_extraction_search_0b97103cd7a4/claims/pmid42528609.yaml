claims:
  c000:
    quotes:
    - exact: Multivariable Mendelian randomization revealed eleven plasma proteins (coding genes APOE,
        ARL3, MICB, NSF, RHOC, RSPO3, ENPP2, BTN2A1, EIF2AK3, MRVI1, and OPLAH) with significant direct
        effects on the risk of Alzheimer's disease, Parkinson's disease, multiple sclerosis, bipolar disorder,
        and schizophrenia.
