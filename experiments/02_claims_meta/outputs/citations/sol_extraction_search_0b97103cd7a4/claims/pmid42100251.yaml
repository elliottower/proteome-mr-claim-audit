claims:
  c000:
    quotes:
    - exact: 'Galectin-3 (encoded by LGALS3 [prot-b-6]) was identified as a biomarker of KOA (odds ratio
        [OR] = 1.07, 95% confidence interval [CI]:1.03-1.11, p = 0.00048), with moderate-to-strong co-localization
        support for a shared causal variant (posterior probability of H4 [PPH4] = 77.3%, lead single nucleotide
        polymorphism [SNP]: rs9323280).'
  c001:
    quotes:
    - exact: Exploratory in vitro experiments revealed that galectin-3 stimulation upregulated the expression
        of inflammatory cytokines (tumor necrosis factor alpha, interleukin-1β, and interleukin-18) and
        related inflammatory mediators (proteinase 3 [encoded by PRTN3] and myeloperoxidase [encoded by
        MPO]) in MØs, suggesting a potential pro-inflammatory association.
