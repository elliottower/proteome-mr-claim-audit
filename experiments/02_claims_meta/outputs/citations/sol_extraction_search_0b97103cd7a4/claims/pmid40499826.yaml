claims:
  c000:
    quotes:
    - exact: Mendelian randomization analysis revealed that increased ADH4/GSTA1 (OR = 0.95; 95 % CI,
        0.92-0.98; P = 0.0027), ADH4/KYNU (OR = 0.94; 95 % CI, 0.89-0.99; P = 0.0364), and ROBO2/SCARF2
        (OR = 0.95; 95 % CI, 0.90-0.99; P = 0.0268) were associated with a decreased risk of depression,
        while elevated CD40/CD40LG (OR = 1.06; 95 % CI, 1.01-1.10; P = 0.0046), CD40/F11R (OR = 1.05;
        95 % CI, 1.02-1.09; P = 0.0003), PLA2G15/PRCP (OR = 1.05; 95 % CI, 1.01-1.09; P = 0.0143), and
        PPP1R2/USP8 (OR = 1.04; 95 % CI, 1.00-1.08; P = 0.0385) were associated with an increased risk
        of depression.
