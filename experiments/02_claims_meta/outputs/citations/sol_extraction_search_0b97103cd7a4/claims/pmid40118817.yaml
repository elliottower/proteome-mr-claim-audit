claims:
  c000:
    quotes:
    - exact: MR and colocalization analyses prioritized IL12B, CD6, MXRA8, CXCL9, IFNG, CCN3, RSPO3, and
        IL18 as having causal and high colocalization evidence with IBD or its subtypes.
  c001:
    quotes:
    - exact: Cohort study revealed associations of 673, 295, and 125 proteins with the risk of IBD, Crohn's
        disease (CD), and ulcerative colitis (UC), respectively. MR and colocalization analyses prioritized
        IL12B, CD6, MXRA8, CXCL9, IFNG, CCN3, RSPO3, and IL18 as having causal and high colocalization
        evidence with IBD or its subtypes.
