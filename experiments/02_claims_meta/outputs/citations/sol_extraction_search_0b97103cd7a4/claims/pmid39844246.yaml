claims:
  c000:
    quotes:
    - exact: Reduced expression of RP11-977G19.11 was linked to increased APOF levels, which were positively
        associated with a higher risk of psoriasis.
  c001:
    quotes:
    - exact: Colocalization analysis highlighted APOF as a key protein in psoriasis pathogenesis.
  c002:
    quotes:
    - exact: Validation using skin tissue, EBV-transformed lymphocytes data and inflammation-related protein
        panels confirmed the associations of RP11-977G19.11 and APOF with psoriasis.
