claims:
  c000:
    quotes:
    - exact: PSCA emerged as the principal novel cystitis-specific candidate (OR 0.977, 95% CI 0.967-0.987),
        with strong colocalization and high Finnish reference-panel linkage disequilibrium between the
        MR instrument and the top colocalization single-nucleotide polymorphism (SNP) (r2 = 0.980).
  c001:
    quotes:
    - exact: APOE showed strong evidence for the registry-derived implicit sepsis endpoint but was interpreted
        as a pleiotropy-prone broad host-response or severity-associated locus.
  c002:
    quotes:
    - exact: TNFSF8 retained a robust pneumonia MR signal, but colocalization was moderate (PP.H4 = 0.544)
        and became weak under stringent priors (PP.H4 = 0.107), despite high-LD deCODE proxy-instrument
        follow-up.
