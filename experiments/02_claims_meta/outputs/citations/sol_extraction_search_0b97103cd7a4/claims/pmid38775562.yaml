claims:
  c000:
    quotes:
    - exact: The authors identified seven overlapping proteins (RGMA, NRXN2, EVA1C, SLC14A1, SLC6A14,
        SCUBE1, FGF8) in endometrioid subtype and six overlapping proteins (IL32, GRB7, L1CAM, CCL25,
        GGT2, PSG5) in nonendometrioid subtype and conducted network analysis of above proteins and metabolites
        to identify coregulated nodes.
