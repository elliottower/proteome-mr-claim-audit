claims:
  c000:
    quotes:
    - exact: Further findings showed that there were 247 differentially expressed genes in asthma and
        2,878 differentially expressed genes in sepsis, and 65 common differentially expressed genes were
        enriched in immune and inflammatory pathways. The key gene CXCL8 exhibited excellent diagnostic
        performance and was closely related to immune cell subsets.
