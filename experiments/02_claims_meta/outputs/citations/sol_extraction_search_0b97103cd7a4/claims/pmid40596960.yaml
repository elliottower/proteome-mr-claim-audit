  c022:
    quotes:
    - exact: 'Through SMR and colocalization analysis, 4 potential drug target proteins were identified:
        FURIN as a potential drug target for stroke and any ischemic stroke, F11 as a potential drug target
        for cardioembolic stroke, DDHD2 and VSIR as potential drug targets for small vessel stroke.'
