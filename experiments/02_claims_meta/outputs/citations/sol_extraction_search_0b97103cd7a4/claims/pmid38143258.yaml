claims:
  c000:
    quotes:
    - exact: Further explorations showed that four proteins (TLR3, FCGR2A, IL23R, TCN1) have corresponding
        drugs, and 17 proteins have druggability. These findings will help us to further understand the
        biological mechanism of AIDs and highlight the potential of these proteins to develop as therapeutic
        targets for AIDs.
