claims:
  c000:
    quotes:
    - exact: The proteome-wide Mendelian randomization analysis identified 34 proteins associated with
        AAA risk. Among them, 2 proteins, COL6A3 and PRKD2, were highlighted by colocalization analysis,
        summary-data-based Mendelian randomization, and the heterogeneity in an independent instrument
        test, providing the most convincing evidence.
