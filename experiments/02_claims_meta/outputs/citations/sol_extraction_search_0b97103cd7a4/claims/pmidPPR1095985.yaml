claims:
  c000:
    quotes:
    - exact: We found that genetically predicted increases in apolipoprotein M (APOM) level and Tenascin
        XB (TNXB) level were associated with decreased risk of SSNS [p = 1.37×10 −5 ; MR Odds Ratio (OR)
        0.40, 95% CI 0.27-0.61 for APOM, and p = 2.95×10 −4 ; OR 0.49, 95% CI 0.33-0.72 for TNXB].
  c001:
    quotes:
    - exact: We found that genetically predicted increases in apolipoprotein M (APOM) level and Tenascin
        XB (TNXB) level were associated with decreased risk of SSNS [p = 1.37×10 −5 ; MR Odds Ratio (OR)
        0.40, 95% CI 0.27-0.61 for APOM, and p = 2.95×10 −4 ; OR 0.49, 95% CI 0.33-0.72 for TNXB].
  c002:
    quotes:
    - exact: Colocalization with SSNS occurred at HLA-DRB1 (98%) and HLA-DQA1 (79%) for APOM and TNXB,
        respectively.
  c003:
    quotes:
    - exact: Colocalization with SSNS occurred at HLA-DRB1 (98%) and HLA-DQA1 (79%) for APOM and TNXB,
        respectively.
  c004:
    quotes:
    - exact: Follow-up binding affinity and gene expression analysis showed that APOM and TNXB peptides
        have high binding affinity for their respective HLA-pQTLs, and that APOM has a biologically plausible
        causal relationship with SSNS.
