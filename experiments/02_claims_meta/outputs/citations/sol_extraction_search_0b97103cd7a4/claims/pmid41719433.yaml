        of malignant neoplasms of bone and articular cartilage through Mendelian randomisation and co-localisation
        analyses, providing novel molecular evidence for early diagnosis, risk assessment and potential
        targeted therapies for malignant neoplasms of bone and articular cartilage.
  c003:
    quotes:
    - exact: Following Bonferroni correction, seven proteins-GNLY, PCSK7, ADAMTS5, PDCD1LG2, SCG3, CXCL16
        and CNTN1-retained significant causal associations. Further co-localisation analysis revealed
        that ADAMTS5, GNLY and PCSK7 shared genetic variants associated with the risk of malignant neoplasms
        of bone and articular cartilage.
