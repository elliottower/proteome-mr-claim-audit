  c001:
    quotes:
    - exact: 'Specifically, a one standard deviation increase in NEU1 expression was associated with an
        odds ratio of 11.80 for the development of IgAN (95% confidence interval: 4.03-34.54). This association
        was substantiated across various statistical models and external validations.'
  c002:
    quotes:
    - exact: Colocalization analysis indicated a shared causal variant between NEU1 expression and IgAN.
  c003:
    quotes:
    - exact: Furthermore, an increased influenza risk associated with NEU1 was observed, supporting the
        therapeutic potential of NEU1 inhibitors for IgAN.
