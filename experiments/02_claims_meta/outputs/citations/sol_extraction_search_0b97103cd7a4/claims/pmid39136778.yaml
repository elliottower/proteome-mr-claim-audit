claims:
  c000:
    quotes:
    - exact: 'SMR analysis showed that eight plasma proteins were causally associated with AD: PVALB and
        TST were associated with a reduced risk of AD, while CA14, ECM1, IL22, IL6R, IL18R1, and MMP12
        were associated with an increased risk of AD.'
