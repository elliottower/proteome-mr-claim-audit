claims:
  c000:
    quotes:
    - exact: 'Of these, aspirin decreased MCM6, RRM2, and ARFIP2 expression, and MR analysis showed that
        a standard deviation increase in mRNA/protein expression was associated with increased CRC risk
        (OR: 1.08, 95% CI, 1.03-1.13; OR: 3.33, 95% CI, 2.46-4.50; and OR: 1.15, 95% CI, 1.02-1.29, respectively).'
