claims:
  c000:
    quotes:
    - exact: An inverse association of Interleukin-10 (IL-10) with PsA risk was observed [odds ratio (OR)=0.45,
        95% confidence interval (CI), 0.28 to 0.70, P FDR=0.072].
  c001:
    quotes:
    - exact: Additionally, Apolipoprotein F (APOF) has a positive effect on PsA risk (OR=2.08, 95% CI,
        1.51 to 2.86, P FDR=0.005).
  c002:
    quotes:
    - exact: Subsequently, we found strong evidence indicating that IL-10 and APOF were colocalized with
        PsA associations (PP.H4 = 0.834 for IL-10 and PP.H4 = 0.900 for APOF).
  c003:
    quotes:
    - exact: Subsequently, we found strong evidence indicating that IL-10 and APOF were colocalized with
        PsA associations (PP.H4 = 0.834 for IL-10 and PP.H4 = 0.900 for APOF).
