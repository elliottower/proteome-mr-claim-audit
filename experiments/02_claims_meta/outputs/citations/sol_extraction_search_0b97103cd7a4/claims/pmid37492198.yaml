  c000:
    quotes:
    - exact: MR analysis revealed that the genetically predicted levels of MHC class I polypeptide-related
        sequence B (MICB), granzyme A (GZMA), cathepsin S (CTSS), chloride intracellular channel protein
        5, and ficolin-1 (FCN1) were causally associated with DN risk.
