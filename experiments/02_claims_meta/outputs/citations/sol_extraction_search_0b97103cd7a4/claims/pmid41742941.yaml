  c006:
    quotes:
    - exact: Mendelian randomization analyses further suggested potential causal effects (p-value<0.05),
        including positive effects of HCII, LG3BP, and TFF3 on WMH; HCII on small vessel stroke; LG3BP
        on any stroke and ischemic stroke; and a negative effect of gelsolin on large artery stroke.
