claims:
  c000:
    quotes:
    - exact: 'Of these, six proteins were validated in AGES (N=2,586, 58% female, mean age=76) at p-value
        < 0.05/48: TFF3 (beta=0.015), LG3BP (beta=0.0089), and heparin cofactor II (HCII, beta=0.0097)
        showed positive associations with FW, while CCL28 was positively associated with PSMD (beta=0.01).'
