claims:
  c000:
    quotes:
    - exact: In this study, we applied UPLC-MS/MS lipidomics and data-independent acquisition proteomics
        to profile plasma from healthy controls, active TB patients, and cured individuals to identify
        differentially expressed lipids and proteins. Mendelian randomization prioritized phosphatidylcholine
        (PC) lipids (PC(18:2/18:2), PC(14:0/20:4) and PC(18:0/20:4)) and proteins (haptoglobin [HP], retinol
        binding protein 4 [RBP4], coagulation factor XIII B subunit [F13B] and inter-alpha-trypsin inhibitor
        heavy chain 1 [ITIH1]) as candidate diagnostic and cure biomarkers.
