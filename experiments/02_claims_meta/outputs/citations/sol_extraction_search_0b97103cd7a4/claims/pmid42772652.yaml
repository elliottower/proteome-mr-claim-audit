claims:
  c000:
    quotes:
    - exact: MR identified four genes (CASP8, MAPK3, CBS, and LTA) and three proteins (EIF2AK2, SPAG1,
        and LGALS3) significantly associated with CC risk (FDR < 0.05). LTA and LGALS3 increased risk,
        whereas CASP8, MAPK3, CBS, EIF2AK2, and SPAG1 were protective.
