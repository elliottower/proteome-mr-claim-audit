claims:
  c000:
    quotes:
    - exact: Protein abundance analysis confirmed sex-specific patterns, and several candidates showed
        discordant directions between genetically predicted causal effects and observed protein abundance
        — including male-specific plasma elevation of  CD160 and female-specific patterns for  STX4 —
        underscoring the distinction between causal risk mechanisms and disease-state molecular changes.  These
        findings demonstrate that PD is a molecularly heterogeneous disorder with sexually dimorphic pathogenic
        drivers.
