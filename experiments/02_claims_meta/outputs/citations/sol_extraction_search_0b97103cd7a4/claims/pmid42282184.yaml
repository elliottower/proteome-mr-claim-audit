    quotes:
    - exact: For instance, genetically predicted higher levels of MAPK3, FES, MRE11A, HS6ST3, OLFM1, BTN3A1,
        BTN3A2 and BTN3A3 were associated with increased psychiatric risk, whereas higher levels of CD40,
        ITIH3, and ITIH4 were associated with decreased risk.
