claims:
  c000:
    quotes:
    - exact: By integrating the results of SMR and colocalization analyses, we found that EPHB4 is strongly
        associated with the risk of endometriosis, with higher levels of EPHB4 correlating with an increased
        risk of the condition (PFDR < 0.05, PPH4 = 0.99).
  c001:
    quotes:
    - exact: RSPO3 is moderately associated, with higher levels of RSPO3 correlating with an increased
        risk of endometriosis (PFDR < 0.001, PPH4 = 0.78).
  c002:
    quotes:
    - exact: CD109, SAA1, SAA2, FSHB, and SEZ6L2 are weakly associated with endometriosis, with higher
        levels of FSHB and SEZ6L2 correlating with an increased risk of endometriosis, and higher levels
        of CD109, SAA1, and SAA2 correlating with a decreased risk of endometriosis (PFDR < 0.05, PPH4
        < 0.6).
