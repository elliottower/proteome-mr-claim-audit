claims:
  c000:
    quotes:
    - exact: Higher baseline levels of PDCD1, TNFRSF9, and BCL2 were associated with an increased risk
        of developing NHL in the future.
  c001:
    quotes:
    - exact: Higher baseline levels of PDCD1, TNFRSF9, and BCL2 were associated with an increased risk
        of developing NHL in the future.
  c002:
    quotes:
    - exact: Higher baseline levels of PDCD1, TNFRSF9, and BCL2 were associated with an increased risk
        of developing NHL in the future.
  c003:
    quotes:
    - exact: PDCD1 and TNFRSF9 demonstrated robust predictive performance for NHL, achieving area under
        the receiver operating characteristic curve (AUC) values of 0.81 and 0.80 for predicting the 5-year
        incidence of NHL.
  c004:
    quotes:
    - exact: PDCD1 and TNFRSF9 demonstrated robust predictive performance for NHL, achieving area under
        the receiver operating characteristic curve (AUC) values of 0.81 and 0.80 for predicting the 5-year
        incidence of NHL.
  c005:
    quotes:
    - exact: For DLBCL, PDCD1 showed a 5-year AUC of 0.83, while TNFRSF9 demonstrated an AUC of 0.88 for
        predicting FL.
  c006:
    quotes:
    - exact: For DLBCL, PDCD1 showed a 5-year AUC of 0.83, while TNFRSF9 demonstrated an AUC of 0.88 for
        predicting FL.
  c007:
    quotes:
    - exact: Although BCL2 exhibited lower predictive value, it showed significant causal effects across
        all NHL subtypes.
  c008:
    quotes:
    - exact: A combined protein model achieved AUCs exceeding 0.82 for NHL prediction over 5, 10, and
        15 years. Temporal trajectory analysis revealed that PDCD1, TNFRSF9, and BCL2 levels began to
        deviate from normal controls at least 10 years prior to diagnosis, with a marked increase in the
        5 years preceding disease onset.
