  c011:
    quotes:
    - exact: Temporal trajectory analysis revealed that PDCD1, TNFRSF9, and BCL2 levels began to deviate
        from normal controls at least 10 years prior to diagnosis, with a marked increase in the 5 years
        preceding disease onset. Further transcriptomic analysis confirmed the upregulation of these proteins
        in lymphoma relative to normal controls, and drug sensitivity profiling suggested that these proteins
        could serve as promising therapeutic targets.
