  c005:
    quotes:
    - exact: Elevated levels of tumor necrosis factor ligand superfamily member 14 and TNF-related activation-induced
        cytokine were associated with an increased risk of diabetic nephropathy, and increased concentrations
        of interleukin-1-alpha and transforming growth factor-alpha were potentially correlated with a
        diminished risk of diabetic nephropathy.
