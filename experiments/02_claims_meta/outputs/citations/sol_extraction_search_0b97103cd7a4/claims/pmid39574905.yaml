claims:
  c000:
    quotes:
    - exact: Genetic evidence indicated that elevated levels of fibroblast growth factor 19 levels promoted
        the occurrence of type 2 diabetes mellitus, and increased concentrations of fibroblast growth
        factor 21 levels, C-C motif chemokine 19 levels, eotaxin levels, and interleukin-10 mitigated
        the risk of developing type 2 diabetes mellitus, while type 2 diabetes mellitus did not exert
        a significant influence on said proteins.
