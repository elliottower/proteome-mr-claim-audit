claims:
  c000:
    quotes:
    - exact: Here, we report eight stable plasma protein targets for glaucoma, identified through a large-scale
        proteome-wide association study integrated with Mendelian randomization and colocalization analyses.
        Among these candidates, we show that the DnaJ heat shock protein family member B14 (DNAJB14) acts
        as a critical neuroprotective factor.
  c001:
    quotes:
    - exact: Using single-cell and bulk transcriptomics, we demonstrate that Dnajb14 is characteristically
        expressed in retinal ganglion cells (RGCs) and that its abundance is inversely correlated with
        ferroptosis under ischemic stress.
  c002:
    quotes:
    - exact: Furthermore, our results reveal that Dnajb14 preserve RGC survival and structural and functional
        integrity in multiple acute and chronic murine models.
  c003:
    quotes:
    - exact: Furthermore, our results reveal that Dnajb14 preserve RGC survival and structural and functional
        integrity in multiple acute and chronic murine models.
  c004:
    quotes:
    - exact: Mechanistically, Dnajb14 overexpression robustly alleviate ischemia-reperfusion-induced retinal
        injury, whereas targeted knockdown exacerbate lipid peroxidation, mitochondrial dysfunction, and
        ferroptosis.
