claims:
  c000:
    quotes:
    - exact: Direct causal relationships were established between kidney stones and 9 dietary factors
        (including fruit, alcohol, coffee intake), 11 gut microbiota types, 8 metabolites, 12 plasma proteins
        and 8 laboratory indicators (CRE, EGFR, CA, UAHDL, APOA, CYS and URNA).
  c001:
    quotes:
    - exact: Direct causal relationships were established between kidney stones and 9 dietary factors
        (including fruit, alcohol, coffee intake), 11 gut microbiota types, 8 metabolites, 12 plasma proteins
        and 8 laboratory indicators (CRE, EGFR, CA, UAHDL, APOA, CYS and URNA).
  c002:
    quotes:
    - exact: 'These pathways reveal the indirect effects of dietary habits on kidney stone formation mediated
        through laboratory biomarkers. Specifically, five dietary habits-alcohol, coffee, fruit, champagne/white
        wine and dried fruit consumption-were shown to mediate through seven key factors: APOA, CA, CYS,
        EGFR, HDL, UA and URNA.'
