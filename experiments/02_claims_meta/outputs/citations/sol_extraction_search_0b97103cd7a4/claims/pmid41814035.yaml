claims:
  c000:
    quotes:
    - exact: Elevated plasma CD74 levels were associated with an increased risk of PSC (OR = 1.54, 95%
        CI 1.24-1.90), whereas CD74-PPRs exhibited robust protection.
  c001:
    quotes:
    - exact: Specifically, CD74/JAM2 reduced risks of PSC (OR = 0.70, 95% CI 0.59-0.83) and AIH (OR =
        0.53, 95% CI 0.39-0.71), while CD74/NPDC1 conferred protection against PSC (OR = 0.66, 95% CI
        0.54-0.80).
