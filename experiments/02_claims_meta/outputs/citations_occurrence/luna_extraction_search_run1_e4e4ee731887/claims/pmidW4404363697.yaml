claims:
  c000:
    quotes:
    - exact: Thirty-seven proteins were significantly associated with HRCP in models adjusted for clinical
        covariables. These included GDF-15 (OR [95% CI]=1.4 [1.1-1.7], p=0.01), ACE2 (OR=1.4 [1.1-1.7],
        p=0.002), and LPL (OR=0.7 [0.6-0.9], p=0.01); proteins represented biologic pathways of metabolic
        regulation, inflammation, and protein degradation.
