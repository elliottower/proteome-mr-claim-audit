  c003:
    quotes:
    - exact: Seven of the 37 proteins were associated with MACE, including LPL (HR=0.5 [0.4-0.8], q=0.003),
        CTSD (HR=1.9 [1.2-2.9], q=0.009), GDF-15 (HR=1.7 [1.1-2.5], q=0.01), and ACE2 (HR=1.8 [1.3-2.6],
        q=0.002) with a direction of effect consistent with odds of HRCP.
