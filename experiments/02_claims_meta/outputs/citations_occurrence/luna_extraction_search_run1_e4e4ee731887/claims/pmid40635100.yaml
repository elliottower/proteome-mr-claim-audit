claims:
  c000:
    quotes:
    - exact: 'Genetically predicted higher levels of CPXM1 [odds ratio (OR): 0.86, 95% confidence interval
        (CI): 0.81-0.91, PFDR < 0.001], FLT4 (OR: 0.74, 95% CI: 0.64 - 0.87, PFDR = 0.033), INSR (OR:
        0.58, 95% CI: 0.43 - 0.78, PFDR = 0.042), and CPZ (OR: 0.55, 95% CI: 0.40 - 0.74, PFDR = 0.033)
        were associated with decreased glaucoma risk while those of PXDN (OR: 1.33, 95% CI: 1.15 - 1.54,
        PFDR = 0.033) with increased risk.'
