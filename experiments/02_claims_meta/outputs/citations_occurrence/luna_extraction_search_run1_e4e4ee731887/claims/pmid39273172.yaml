claims:
  c000:
    quotes:
    - exact: Subsequent MR and COLOC analyses further identified 313 potentially causal IDP-related proteins,
        which were significantly enriched in neural-related phenotypes, among which 91 were further identified
        as pleiotropic proteins associated with both IDPs and NDs, including EGFR, TMEM106B, GPT, and
        HLA-B.
