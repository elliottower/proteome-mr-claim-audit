  c008:
    quotes:
    - exact: Nine potential mediation pathways were identified to illustrate the mediating roles of the
        IDPs in the causal effect of the pleiotropic proteins on NDs, including the indirect effect of
        TMEM106B on Alzheimer's disease (AD) risk via radial diffusivity (RD) of the posterior limb of
        the internal capsule (PLIC), with the mediation proportion being 11.18%, and the indirect effect
        of EGFR on AD through RD of PLIC, RD of splenium of corpus callosum (SCC), and fractional anisotropy
        (FA) of SCC, with the mediation proportion being 18.99%, 22.79%, and 19.91%, respectively.
