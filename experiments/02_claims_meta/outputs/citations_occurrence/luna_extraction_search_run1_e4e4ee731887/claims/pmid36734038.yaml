claims:
  c000:
    quotes:
    - exact: MR analysis found that genetically predicted levels of vWF, SERPINE1 (plasminogen activator
        inhibitor 1, known as PAI-1), EPHB4 (ephrin type-B receptor 4), TYRO3 (tyrosine-protein kinase
        receptor TYRO3), TNFRSF11A (tumour necrosis factor receptor superfamily member 11A), and BOC (brother
        of CDO) were causally associated with VTE risk.
