    quotes:
    - exact: These results suggest that higher BMI is associated with reduced SLIT2 expression, which
        in turn increases the risk of atrial fibrillation.
  c001:
    quotes:
    - exact: In contrast, ANGPTL3 showed a significant positive mediating effect (OR = 1.010, 95% CI =
        1.003-1.017), accounting for 3.64% of the total effect, indicating that elevated BMI increases
        ANGPTL3 levels, thereby further increasing the risk of atrial fibrillation.
