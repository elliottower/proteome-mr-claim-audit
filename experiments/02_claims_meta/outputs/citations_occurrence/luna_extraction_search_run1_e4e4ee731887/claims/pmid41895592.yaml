claims:
  c000:
    quotes:
    - exact: Comparison of the TAA and AAA proteomic profiles revealed both shared proteins (e.g., AHSG,
        MMP7, RARRES2, THBS2, CCL25) and condition-specific proteins (e.g., OVCA2, STAT3, and HPSE for
        TAA; PLAU, LPA, SERPING1, and SMPDL3A for AAA), reflecting the distinct embryonic origins and
        pathological drivers of these 2 conditions.
