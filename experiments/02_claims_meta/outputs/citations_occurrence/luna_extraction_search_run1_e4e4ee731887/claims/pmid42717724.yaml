claims:
  c000:
    quotes:
    - exact: 'Over a median follow-up of 14.1 years, we identified 490 proteins significantly associated
        with incident SLD risk. Growth differentiation factor 15 (GDF15) emerged as the strongest predictor,
        achieving a C-index of 0.80 and outperforming conventional clinical indices (LiverRisk score:
        0.75; FIB-4: 0.68; APRI: 0.68).'
  c001:
    quotes:
    - exact: Mendelian randomization analysis supported genetic associations linking higher protein levels
        of GDF15, FABP1, SPON2, CHI3L1, and PIGR with SLD risk.
