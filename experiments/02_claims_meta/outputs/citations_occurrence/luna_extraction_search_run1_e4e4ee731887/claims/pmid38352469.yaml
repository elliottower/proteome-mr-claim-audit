claims:
  c000:
    quotes:
    - exact: 'Using MR, we identified 2 proteins with an effect on subsequent MACE after a stroke: CCL27
        (effect OR= 0.77, 95% CI = 0.66-0.88, adj. p=0.05), and TNFRSF14 (effect OR=1.42, 95% CI = 1.24-1.60,
        adj. p=0.006).'
