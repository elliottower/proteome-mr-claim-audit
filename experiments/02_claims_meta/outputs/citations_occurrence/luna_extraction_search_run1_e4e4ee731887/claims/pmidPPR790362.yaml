claims:
  c000:
    quotes:
    - exact: The Apolipoprotein L1 (APOL1) PRS had a statistically significant GCA association with a
        protective effect ( P-value [ P ]=1 x 10 -4 ), which replicated in an independent dataset ( P
        =8.69 x 10 - 4 ), and MR analysis supported a causal relationship ( beta =-0.093; SE =0.02 ; P
        =4.42 x 10 -9 ).
