claims:
  c000:
    quotes:
    - exact: Utilizing a Bonferroni-corrected threshold, our MR examination identified 10 protein-aging
        associations. Within this cohort of proteins, MST1, LCT, GMPR2, PSMB4, ECM1, EFEMP1, and ISLR2
        appear to exacerbate aging risks, while MAX, B3GNT8, and USP8 may exert protective influences.
