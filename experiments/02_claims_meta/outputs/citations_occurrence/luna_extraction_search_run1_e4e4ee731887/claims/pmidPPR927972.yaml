claims:
  c000:
    quotes:
    - exact: Mediation analyses revealed that these effects were partially mediated by various factors,
        including plasma proteins (e.g., LRRN1 for type 2 diabetes), sex hormone-binding globulin (for
        high cholesterol), insulin-like growth factor 1 (for testosterone levels), specific immune cells
        (for asthma), and cerebrospinal fluid metabolites (for bipolar disorder).
