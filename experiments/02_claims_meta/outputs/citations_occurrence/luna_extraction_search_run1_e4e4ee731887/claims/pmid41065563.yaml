    quotes:
    - exact: Genetically predicted FURIN and FGF5 were strongly associated with BP and stroke risk, while
        ACOX1, FGF5, and MST1 exhibited potential causal effects on CAD. Network MR suggested that a substantial
        proportion of their effect on CAD and stroke (30.5%-77.2%) was mediated through BP regulation.
