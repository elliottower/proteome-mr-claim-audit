  c000:
    quotes:
    - exact: Among these, 10 proteins (particularly ALDH2 [mitochondrial aldehyde dehydrogenase] and ULK3
        [serine/threonine-protein kinase]) were found to mediate the associations of 8 genetically predicted
        modifiable risk factors with hypertension/BP, with ALDH2 emerging as a central hub across multiple
        causal pathways.
