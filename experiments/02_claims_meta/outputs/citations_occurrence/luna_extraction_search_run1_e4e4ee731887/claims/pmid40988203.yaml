claims:
  c000:
    quotes:
    - exact: Through the proteome-wide analysis, 2 proteins, tyrosinase-related protein 1 and dipeptidase
        1, were identified to have significant associations with CM risk.
  c001:
    quotes:
    - exact: Notably, dipeptidase 1 exhibited an inverse relationship with CM risk, indicating its potential
        as a therapeutic target.
  c002:
    quotes:
    - exact: Notably, dipeptidase 1 exhibited an inverse relationship with CM risk, indicating its potential
        as a therapeutic target. However, the findings also raised concerns about its possible link to
        dementia.
