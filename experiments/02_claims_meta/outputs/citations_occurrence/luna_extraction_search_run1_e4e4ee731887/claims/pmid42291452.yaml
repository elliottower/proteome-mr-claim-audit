claims:
  c000:
    quotes:
    - exact: Among these, PLAU demonstrated strong colocalization with AAA risk loci (PPH4 = 0.983) and
        robust discriminatory accuracy across training and validation cohorts (area under the curve =
        0.854 and 0.944).
  c001:
    quotes:
    - exact: Gene set enrichment analysis and immune-infiltration profiling indicated that elevated PLAU
        expression is associated with complement activation and enrichment of pro-inflammatory immune
        subsets, including activated dendritic cells, natural killer T cells, regulatory T cells and T
        helper 17 cells.
