claims:
  c000:
    quotes:
    - exact: In Paper I, 21 proteins were identified and confirmed as being associated with kidney function
        decline and incident CKD, with tumor necrosis factor receptor superfamily member 11A (TNFRSF11A)
        further showing a potential causal relationship with kidney function decline.
  c001:
    quotes:
    - exact: In Paper II, 27 proteins associated with hypertension and/or systolic blood pressure (SBP)
        were discovered and validated, with robust associations observed for kidney injury molecule 1
        (KIM1), N-terminal pro-B-type natriuretic peptide (NT-proBNP), and osteoprotegerin (OPG).
