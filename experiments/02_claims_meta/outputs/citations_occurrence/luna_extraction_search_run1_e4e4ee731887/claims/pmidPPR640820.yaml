  c005:
    quotes:
    - exact: The analysis revealed 812 cis-acting protein quantitative trait loci (pQTL), which were used
        as instruments in Mendelian randomisation (MR) analysis of breast cancer. Five proteins (P < 1.7x10-5,
        Bonferroni-corrected) with a potential causal role in breast cancer risk were revealed (CD160,
        DNPH1, LAYN, LRRC37A2 and TLR1). Confirming the MR findings in independent cohorts (FinnGen R9
        and the UK Biobank), our study suggests that these proteins should be further explored as potential
        drug targets in breast cancer.
