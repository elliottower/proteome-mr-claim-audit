claims:
  c000:
    quotes:
    - exact: Of 11 proteins passing steps 1&2, only Paralemmin-1 (PALM) satisfied both MR (inverse-variance
        weighted OR 1.47, 95% CI 1.18-1.80, Fig. 2) and mediation criteria. PALM accounted for an estimated
        16% of the total effect of APOE ε4 on ICH risk, indicating a significant indirect pathway ( P
        =0.007).
  c001:
    quotes:
    - exact: PALM accounted for an estimated 16% of the total effect of APOE ε4 on ICH risk, indicating
        a significant indirect pathway ( P =0.007).
  c002:
    quotes:
    - exact: In MR analyses with further outcomes, PALM was also associated with microbleeds, white matter
        hyperintensities, and white matter integrity measures (fractional anisotropy, mean diffusivity,
        Fig. 3), suggesting a role in amyloid-related small vessel disease and perivascular dysfunction.
