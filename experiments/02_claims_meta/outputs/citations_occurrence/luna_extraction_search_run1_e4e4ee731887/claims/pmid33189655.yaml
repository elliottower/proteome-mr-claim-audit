claims:
  c000:
    quotes:
    - exact: Plasma insulin-like growth factor binding protein 7 (IGFBP7) moderately increased ARDS 28-day
        mortality (OR, 1.11; 95% CI, 1.04-1.19; P = .002) per log2 increase.
  c001:
    quotes:
    - exact: GSMR analysis coupled with four other Mendelian randomization methods revealed IGFBP7 as
        a causal biomarker for ARDS 28-day mortality (OR, 2.61; 95% CI, 1.33-5.13; P = .005).
  c002:
    quotes:
    - exact: Causal mediation analysis indicated that the association between IGFBP7 and ARDS 28-day mortality
        is mediated by platelet count (OR, 1.03; 95% CI, 1.02-1.04; P = .01).
