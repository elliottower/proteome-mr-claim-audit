  c003:
    quotes:
    - exact: Notably, MR analyses revealed putative causal associations between higher genetically predicted
        plasma levels of three hub proteins-CD63, CTSS, and S100A4-and an increased risk of GBM, with
        S100A4 showing the strongest effect (odds ratio [OR] = 2.03, 95% confidence interval [CI] 1.15-3.58,
        p = 0.0149). This association was consistently validated across 11 independent cohorts, including
        TCGA, GTEx, and GEO datasets.
  c004:
    quotes:
    - exact: A two-step MR mediation analysis further indicated that S100A4 partially influences GBM risk
        by altering plasma lipid metabolites, with erucic acid mediating ~17% of the total effect.
