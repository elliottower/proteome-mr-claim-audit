claims:
  c000:
    quotes:
    - exact: 'SGLT2 inhibition was significantly associated with decreased risks of IS (odds ratio (OR):
        0.39, 95 % confidence interval (CI): 0.25-0.61, p = 3.53 × 10-5) and cardioembolic stroke (OR:
        0.16, 95 % CI: 0.07-0.37, p = 1.82 × 10-5); the effect of SGLT2 inhibition on IS was indirectly
        mediated through pathways involving tryptophanyl-transfer RNA synthetase (WARS) (β:0.08, 95 %
        CI:0.15 - -0.01, p = 0.034) and matrix metalloproteinase 12 (MMP12) (β:0.06, 95 % CI:0.12 - -0.01,
        p = 0.016), with mediation proportions of 8.2 % and 6.8 %, respectively.'
