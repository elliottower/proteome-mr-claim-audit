  c002:
    quotes:
    - exact: PWAS identified three proteins associated with MN (PLA2R1, LY75, TIMP4), while TWAS of whole
        blood and kidney cortex tissues implicated significant associations for LY75, POLR2I, and NFKB1
        in MN.
  c003:
    quotes:
    - exact: TIMP4 was uniquely prioritized as a high-confidence candidate through concordant evidence
        from PWAS significance (P = 2.67 × 10-2), causal association by SMR (P SMR = 3.61 × 10-4, P HEIDI
        = 3.49 × 10-1), and genetic colocalization (PP.H4 = 8.01 × 10-1).
  c004:
    quotes:
    - exact: Clinically, serum TIMP4 levels were significantly elevated in MN patients versus controls
        (2267.1 vs 1581.4 pg/mL, P < 0.001).
