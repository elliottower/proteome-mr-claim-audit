claims:
  c000:
    quotes:
    - exact: 'Lower levels of genetically predicted ALPI (odds ratio [OR]: 0.89, 95% confidence interval
        [CI] 0.83-0.95), HSPG2 (OR: 0.81, 95% CI 0.75-0.88), POLR2F (OR: 0.51, 95% CI 0.36-0.73), and
        STXBP1 (OR: 0.75, 95% CI 0.64-0.86) were associated with an increased risk of EM.'
