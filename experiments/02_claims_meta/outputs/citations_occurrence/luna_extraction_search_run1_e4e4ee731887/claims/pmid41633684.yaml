  c003:
    quotes:
    - exact: Methyl-4-hydroxybenzoate sulfate partially mediated the effect between Axin-1 and AD (20.10%).
  c004:
    quotes:
    - exact: Pregnenetriol sulfate partially mediated the effect between CXCL11 and AD (18.20%).
  c005:
    quotes:
    - exact: The ratio of spermidine to ornithine played an important mediating role between IL-12β and
        AD, with a mediating effect of 43.40%.
