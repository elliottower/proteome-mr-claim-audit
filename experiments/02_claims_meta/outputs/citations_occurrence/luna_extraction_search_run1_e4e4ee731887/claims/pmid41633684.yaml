claims:
  c000:
    quotes:
    - exact: 'Elevated levels of Axin-1 were positively causally associated with AD risk (OR=1.082, 95%
        CI: 1.009-1.159; P=0.026), while CXCL11 (OR=0.951, 95% CI: 0.914-0.990; P=0.026) and IL-12β (OR=0.959,
        95% CI: 0.926-0.994; P=0.026) were negatively causally associated with AD risk.'
