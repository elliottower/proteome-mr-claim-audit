claims:
  c000:
    quotes:
    - exact: 'The discovery cohort identified 20 significant rQTLs associated with LC risk after false
        discovery rate correction, with the strongest effects observed for: DNAJA2/SCAMP3 (OR = 0.66,
        95% CI, 0.54–0.81), CNST/MAVS (OR = 1.40, 95% CI, 1.05–1.88), whereas the LDSC genetic score for
        DNAJA2/SCAMP3 and DSC2/SPINT1 exhibited statistical significance.'
