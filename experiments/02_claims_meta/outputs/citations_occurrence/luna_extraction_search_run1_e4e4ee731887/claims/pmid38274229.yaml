claims:
  c000:
    quotes:
    - exact: Elevated genetically predicted levels of WARS (OR = 1.16; 95% CI = 0.095-0.208, FDR = 1.31×10-4)
        and SIRPG (OR = 1.15; 95% CI = 0.071-0.201, FDR = 1.46×10-2) were associated with higher DR risk,
        while increased levels of ALDOC (OR = 1.56; 95% CI = 0.246-0.637, FDR = 5.48×10-3) and SIRPG (OR
        = 1.15; 95% CI = 0.068-0.208, FDR = 4.73×10-2) were associated with higher PDR risk.
