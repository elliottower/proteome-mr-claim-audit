  c009:
    quotes:
    - exact: In the Chinese cohort (67 lumbar spinal stenosis patients and 100 controls), WGS identifies
        4 GFPT1 cis-eQTL loci (rs13016371, rs35392088, rs12997521, and rs13019789) associated with lumbar
        spinal stenosis risk; all risk alleles are linked to increased GFPT1 expression, and all 24 variant
        carriers show L4/L5 stenosis on imaging.
  c010:
    quotes:
    - exact: In zebrafish, IOX1 significantly rescues GFPT1-induced degenerative phenotypes.
