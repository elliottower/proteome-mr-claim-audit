  c007:
    quotes:
    - exact: In murine macrophages, inhibition of IKKβ using a small-molecule agent and short interfering
        RNA (siRNA) suppressed NLRP3 activation and abrogated IL-1β maturation. To uncouple the putative
        effect of IKKβ for NLRP3 activation from its NF-κB-mediated effects on NLRP3 priming, we inhibited
        IKKβ in rapid priming and post-priming inhibition experiments, maintaining the observed effect.
