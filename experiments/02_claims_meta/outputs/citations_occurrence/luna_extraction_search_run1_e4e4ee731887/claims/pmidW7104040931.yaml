claims:
  c000:
    quotes:
    - exact: In Publication I, we systematically searched the available literature for studies investigating
        direct pharmacological inhibition of CCL2 or CCR2 in animal models of atherosclerosis. Pooling
        14 mouse studies of 11 different agents in random-effects meta-analyses, we observed a significant
        reduction in plaque burden across multiple vascular frames and an increase in composition features
        conveying plaque stability.
