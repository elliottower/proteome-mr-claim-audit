  c011:
    quotes:
    - exact: After examining the association of genetic instruments proxying circulating levels of these
        proteins with cardiovascular outcomes, we found C-X-C motif chemokine ligand 10 (CXCL10) to be
        associated with risk of coronary artery disease (CAD), large-artery atherosclerotic stroke and
        peripheral artery disease.
