  c014:
    quotes:
    - exact: We then looked at associations between circulating levels of CXCL10 and major adverse cardiovascular
        events (MACE) in a population-based cohort, noting that individuals with higher CXCL10 levels
        exhibited higher risk of MACE.
  c015:
    quotes:
    - exact: Lastly, we observed increased lipid core size and a pro-inflammatory transcriptomic profile
        in carotid artery plaques with increased CXCL10 expression, suggesting a causal role in atherosclerosis.
