  c004:
    quotes:
    - exact: We also noted that the reduction of plaque size correlated with reduction of plaque macrophage
        content, confirming the role of CCL2/CCR2 for macrophage accumulation, and no differences in efficacy
        were observed when comparing ligand and receptor inhibition.
  c005:
    quotes:
    - exact: In murine macrophages, inhibition of IKKβ using a small-molecule agent and short interfering
        RNA (siRNA) suppressed NLRP3 activation and abrogated IL-1β maturation.
  c006:
