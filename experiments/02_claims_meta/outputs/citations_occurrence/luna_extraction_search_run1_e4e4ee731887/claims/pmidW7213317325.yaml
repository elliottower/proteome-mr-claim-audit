claims:
  c000:
    quotes:
    - exact: A standout discovery is the causal link between the ALDH2 protein and the metabolite 2-hydroxyisovalerate,
        a branched-chain amino acid metabolite uniquely associated with insulin resistance in East Asians.
        Through Mendelian randomization and colocalization, we demonstrate how these population-specific
        genetic architectures dictate systemic metabolic responses, providing a molecular explanation
        for the EA-specific T2D phenotype.
