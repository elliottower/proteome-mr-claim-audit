claims:
  c000:
    quotes:
    - exact: By integrating genetic signals with tumor transcriptomic and clinical data, this study prioritized
        immune checkpoint-related genes potentially involved in HNC susceptibility. HGF and AKT1 emerged
        as the most consistently supported candidates, showing convergent tumor transcriptomic and survival
        support despite lacking genetic replication in FinnGen, providing a foundation for further biological
        investigation.
