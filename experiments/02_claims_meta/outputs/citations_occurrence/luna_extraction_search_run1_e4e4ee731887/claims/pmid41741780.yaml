claims:
  c000:
    quotes:
    - exact: 'MR and Bayesian colocalization analysis revealed a robust causal relationship between DNER
        and HSCR risk (OR = 0.12, 95% CI: 0.04-0.39, P = 4.54 × 10-4) ScRNA-seq data analysis showed that
        DNER expression increased during enteric neural crest cell (ENCC) development, consistent along
        with western blotting result in colon tissue at different developmental stages.'
  c001:
    quotes:
    - exact: 'MR and Bayesian colocalization analysis revealed a robust causal relationship between DNER
        and HSCR risk (OR = 0.12, 95% CI: 0.04-0.39, P = 4.54 × 10-4) ScRNA-seq data analysis showed that
        DNER expression increased during enteric neural crest cell (ENCC) development, consistent along
        with western blotting result in colon tissue at different developmental stages.'
  c002:
    quotes:
    - exact: Meanwhile we demonstrated DNER protein expression in enteric neurons and observed a marked
        decreased expression of DNER in the colon of HSCR models.
  c003:
    quotes:
    - exact: Moreover, down-regulation of DNER not only impeded ENCC migration but also compromised their
        subsequent differentiation into neurons and synaptic maturation.
  c004:
    quotes:
    - exact: Moreover, down-regulation of DNER not only impeded ENCC migration but also compromised their
        subsequent differentiation into neurons and synaptic maturation.
  c005:
    quotes:
    - exact: Moreover, down-regulation of DNER not only impeded ENCC migration but also compromised their
        subsequent differentiation into neurons and synaptic maturation.
  c006:
    quotes:
    - exact: We demonstrate that DNER regulates enteric neural crest cell proliferation, migration, and
        differentiation via the Notch signaling pathway, with dynamic expression during ENS development
        revealed by single-cell RNA sequencing.
  c007:
    quotes:
    - exact: Our findings establish a novel DNER-Notch signaling axis in gut neural development and reveal
        that DNER deficiency disrupts ENCC colonization, neuronal differentiation, and neural network
        assembly.
