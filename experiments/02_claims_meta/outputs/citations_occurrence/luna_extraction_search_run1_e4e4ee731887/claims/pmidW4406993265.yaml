claims:
  c000:
    quotes:
    - exact: 'Higher genetically-proxied, ADIPOQ -mediated circulating adiponectin levels were associated
        with lower WMH (IVW β=-0.131 per μg/ml increase in adiponectin levels; 95% CI: (-0.217) - (-0.044);
        p=0.003) and CAD (IVW OR 0.93 per μg/ml increase in adiponectin levels; 95% CI: 0.88-0.98; p=0.006)
        risk, but not ischemic stroke/subtypes (all p-values > 0.05).'
