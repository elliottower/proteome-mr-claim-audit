  c006:
    quotes:
    - exact: After FDR correction per proteomic dataset (p-FDR < 0.05), higher genetically-proxied, ADIPOQ
        -mediated circulating adiponectin levels were associated with proteins involved in various pathways
        including the inflammatory (e.g. CXCL17 , CRP ), thrombogenic (e.g. factor X, plasminogen), cardiometabolic
        (e.g. IGFBPL1 , NOTCH3 ), and oncologic (e.g IL9 ) pathways (Figures 1, 2) .
