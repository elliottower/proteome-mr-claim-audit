claims:
  c000:
    quotes:
    - exact: We found that a genetically predicted a standard deviation increase in Signal Regulatory
        Protein Gamma (SIRPG) level was associated with increased risk of type 1 diabetes risk (MR OR
        = 1.66, 95% 1.36- 2.03; P = 7.1 x 10-7).
  c001:
    quotes:
    - exact: Sensitivity analyses using MR methods testing for pleiotropy while including trans-pQTL showed
        similar results.
  c002:
    quotes:
    - exact: The risk of type 1 diabetes increased almost two-fold per genetically predicted SD increase
        in interleukin-27 Epstein-Barr Virus Induced 3 (IL27-EBI3) protein levels (MR OR=1.97, 95% CI
        = 1.48 – 2.62, P= 3.7 x10-6).
  c003:
    quotes:
    - exact: Sensitivity analyses using MR methods testing for pleiotropy while including trans-pQTL showed
        similar results.
  c004:
    quotes:
    - exact: However, a SD increase in chymotrypsinogen B1 (CTRB1) was associated with decreased risk
        of type 1 diabetes (MR OR=0.84, 95% CI = 0.77 – 0.90, P= 6.1 x10-6).
  c005:
    quotes:
    - exact: Sensitivity analyses using MR methods testing for pleiotropy while including trans-pQTL showed
        similar results.
