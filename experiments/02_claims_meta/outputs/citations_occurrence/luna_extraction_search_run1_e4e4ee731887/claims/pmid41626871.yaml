claims:
  c000:
    quotes:
    - exact: 'We identified 26 plasma proteins with putative causal associations with glaucoma, six of
        which were novel: COL24A1, KAZALD1, EBAG9, CSNK1D, AZI2, and AXIN1. COL24A1 (odds ratio [OR] =
        0.85; 95% confidence interval [CI], 0.80-0.90; PFDR < 0.001; PP.H4 = 0.95) and EFEMP1 (OR = 0.88;
        95% CI, 0.83-0.92; PFDR < 0.001; PP.H4 = 0.98) emerged as the most compelling candidates.'
  c001:
    quotes:
    - exact: 'We identified 26 plasma proteins with putative causal associations with glaucoma, six of
        which were novel: COL24A1, KAZALD1, EBAG9, CSNK1D, AZI2, and AXIN1. COL24A1 (odds ratio [OR] =
        0.85; 95% confidence interval [CI], 0.80-0.90; PFDR < 0.001; PP.H4 = 0.95) and EFEMP1 (OR = 0.88;
        95% CI, 0.83-0.92; PFDR < 0.001; PP.H4 = 0.98) emerged as the most compelling candidates.'
  c002:
    quotes:
    - exact: 'Notably, EFEMP1 was significantly associated with glaucoma incidence in the prospective
        cohort analysis (fully adjusted Cox model: hazard ratio = 1.61; 95% CI, 1.29-2.00; PFDR = 0.002),
        demonstrating strong predictive performance (C-index = 0.811, area under the curve = 0.806) and
        representing a promising therapeutic target.'
