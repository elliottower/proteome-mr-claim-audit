  c009:
    quotes:
    - exact: Single-cell RNA sequencing revealed the predominant downregulation of ACE, AGER, and IL18R1
        in T cells and alveolar type II cells from SCLC patients. PBMC analysis further supported IL18R1
        downregulation in CD8+ T cells, NK cells, and dendritic cells.
