  c012:
    quotes:
    - exact: 'In an independent prospective cohort (n = 300), lower plasma IL18R1 levels were independently
        associated with shorter PFS (HR = 0.997 per unit increase; 95% CI: 0.995-0.999; and p = 0.003),
        with time-dependent AUCs of 0.77-0.86.'
