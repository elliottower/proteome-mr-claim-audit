claims:
  c000:
    quotes:
    - exact: Colocalization identified shared genetic signals (posterior probability > 0.7) between VV
        and clusters of proteins (eg. a cluster of vascular proteins at the ABO locus including vascular
        proteins like VEFGR2/3, and ICAM1/4/5, among others), and clusters of clinical traits (eg. a cluster
        of anthropometric associations at the DLC1 locus).
