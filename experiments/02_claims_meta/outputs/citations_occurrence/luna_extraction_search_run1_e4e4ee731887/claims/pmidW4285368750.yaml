  c002:
    quotes:
    - exact: We found significant causal associations (p < 0.05/738) between 15 proteins and VV, including
        vasoactive proteins like ADM; extracellular matrix and connective proteins like MFAP2, POSTN,
        ASPN, ECM1; and hormone-proteins like SHBG.
