  note: abstract text exactly as sent to the extractor
claims:
  c000:
    quotes:
    - exact: 'The specific findings indicate that elevated levels of plasma cathepsin H (CTSH) (OR = 1.06,
        95%CI: 1.03-1.08, p = 6.12 × 10-6), plasma signal regulatory protein alpha (SIRPA) (OR = 1.03,
        95%CI: 1.02-1.05, p = 1.37 × 10-5), plasma TMEM106B (OR = 1.16, 95%CI: 1.09-1.23, p = 1.92 × 10-6),
        and CSF bone sialoprotein (BSP) (OR = 1.33, 95%CI: 1.17-1.51, p = 9.34 × 10-6), CSF Interleukin-34
        (IL-34) (OR = 2.13, 95%CI: 1.51-3.01, p = 1.85 × 10-5), CSF immunoglobulin-like transcript 2 (ILT-2)
        (OR = 1.33, 95%CI: 1.17-1.51, p = 9.34 × 10-6) are associated with an increased risk of AD, while
        increased levels of plasma progranulin gene (GRN) (OR = 0.79, 95%CI: 0.74-0.84, p = 2.19 × 10-12),
        plasma triggering receptor expressed on myeloid cells 2 (TREM2) (OR = 0.67, 95%CI: 0.58-0.78,
        p = 6.95 × 10-8), plasma sialic acid-bind immunoglobulin-like lectins (SIGLEC)-9 (OR = 0.67, 95%CI:
        0.58-0.78, p = 6.95 × 10-8), and CSF SIGLEC7 (OR = 0.42, 95%CI: 0.28-0.64, p = 4.30 × 10-5) are
        associated with a decreased risk of AD.'
