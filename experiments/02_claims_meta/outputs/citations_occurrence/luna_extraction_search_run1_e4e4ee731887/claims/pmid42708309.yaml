claims:
  c000:
    quotes:
    - exact: Among 543 cis-acting plasma proteins evaluated in the discovery phase, 35 exhibited evidence
        of association with LCINS risk, including 15 positively and 20 inversely associated proteins.
        After False Discovery Rate (FDR) correction, only genetically proxied plasma RARRES1 remained
        statistically significant (OR = 1.17, adjusted P = 2.72 × 10-5), and this finding was replicated
        in an independent cohort.
