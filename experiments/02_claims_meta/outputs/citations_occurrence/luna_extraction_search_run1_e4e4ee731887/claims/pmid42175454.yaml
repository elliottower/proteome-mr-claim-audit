claims:
  c000:
    quotes:
    - exact: Notably, a higher melanoma inhibitory activity (MIA)/DAN family BMP antagonist ratio was
        associated with increased risk for both LC and LUSC.
  c001:
    quotes:
    - exact: Notably, a higher melanoma inhibitory activity (MIA)/DAN family BMP antagonist ratio was
        associated with increased risk for both LC and LUSC.
  c002:
    quotes:
    - exact: When analyzing the constituent proteins of these ratios individually, only the causal association
        between MIA and LC remained significant.
  c003:
    quotes:
    - exact: 'Subsequent 2-step MR analysis revealed that the MIA/DAN family BMP antagonist ratio mediated
        the effect of body mass index on LUSC development, with consistent mediation proportions across
        both databases (13.46%, 95% confidence interval: 3.14%-23.77% in FinnGen; 9.26%, 95% confidence
        interval: 0.05%-18.47% in Transdisciplinary Research in Cancer of the Lung and International Lung
        Cancer Consortium).'
