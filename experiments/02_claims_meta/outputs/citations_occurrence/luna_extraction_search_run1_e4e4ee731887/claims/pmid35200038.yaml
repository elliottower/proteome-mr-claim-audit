claims:
  c000:
    quotes:
    - exact: We found that seven kinds of plasma proteins had genetic correlations with RA, such as Soluble
        Receptor for Advanced Glycation End Products (sRAGE) (correlation coefficient = 0.2582, p = 0.049),
        vesicle transport protein USE1 (correlation coefficient = 0.1337, p = 0.018), and spermatogenesis-associated
        protein 20 (correlation coefficient = 0.3706, p = 0.018).
