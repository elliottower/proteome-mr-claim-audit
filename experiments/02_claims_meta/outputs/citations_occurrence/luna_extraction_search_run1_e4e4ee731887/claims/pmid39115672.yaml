claims:
  c000:
    quotes:
    - exact: CXCL8 was found to be positively associated with the risk of developing large-artery atherosclerotic
        (LAA) stroke (OR, 1.005; 95% CI 1.001 to 1.010; p = 0.022), whereas TNFRSF11b was negatively correlated
        with the risk of developing LAA stroke (OR, 0.937; 95% CI 0.892 to 0.984; p = 0.010), independently
        of other stroke subtypes.
