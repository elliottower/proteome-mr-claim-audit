claims:
  c000:
    quotes:
    - exact: 'Additionally, glucosamine 6-phosphate N-acetyltransferase was identified as a protective
        factor against hypertension, OR (95% CI): 0.995 (0.992-0.998), shedding light on the potential
        protective mechanism of glucosamine. Mediation Mendelian randomization indicated that the protective
        effect of glucosamine metabolism was mediated by glutaminyl-peptide cyclotransferase, with a mediation
        proportion of 12.1% (5.9-18.2%), p < 0.05.'
