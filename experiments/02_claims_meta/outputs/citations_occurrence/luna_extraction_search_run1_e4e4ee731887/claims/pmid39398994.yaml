claims:
  c000:
    quotes:
    - exact: MR identified 90 plasma proteins associated with AAA at FDR<0.05, with 25 supported by colocalization
        analysis. Among those supported by both MR and colocalization were previously experimentally validated
        proteins such as PCSK9 (OR 1.3; 95%CI 1.2-1.4; P<1e-10), LTBP4 (OR 3.4; 95%CI 2.6-4.6; P<1e-10)
        and COL6A3 (OR 0.6; 95%CI 0.5-0.7; P<1e-6).
