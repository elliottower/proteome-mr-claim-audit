  c000:
    quotes:
    - exact: Higher genetically predicted tissue inhibitor of metalloproteinases 2 (TIMP2) levels was
        associated with lower BMD and increased forearm fracture risk.
  c001:
    quotes:
    - exact: Higher genetically predicted tissue inhibitor of metalloproteinases 2 (TIMP2) levels was
