claims:
  c000:
    quotes:
    - exact: Measured levels of 871 proteins were significantly associated with PP when adjusting for
        age, sex, mean arterial pressure, and body mass index, and 61 remained significantly associated
        after further adjusting for stroke volume. Top associations included NPPB (natriuretic peptide
        B), thrombospondin-2, paraoxonase-2, and sclerostin.
