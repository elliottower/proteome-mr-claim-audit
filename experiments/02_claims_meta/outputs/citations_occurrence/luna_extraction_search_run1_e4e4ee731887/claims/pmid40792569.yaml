  c004:
    quotes:
    - exact: Genetic analyses indicated that genetically predicted levels for 16 proteins were significantly
        associated with PP after false discovery rate correction, including fibroblast growth factor 5
        (βIVW per SD change in protein levels=0.47 [95% CI, 0.34-0.61]), NPPB (βIVW=-1.40 [95% CI, -1.85
        to -0.95]), insulin-like growth factor binding 3 (βIVW=-1.143 [95% CI, -1.57 to -0.71]), and furin
        (βIVW, 1.31 [95% CI, 0.88-1.73]).
