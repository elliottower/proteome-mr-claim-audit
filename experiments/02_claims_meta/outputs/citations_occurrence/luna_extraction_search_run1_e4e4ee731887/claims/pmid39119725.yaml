  note: abstract text exactly as sent to the extractor
claims:
  c000:
    quotes:
    - exact: We demonstrate genetic associations of 18 circulating proteins with preeclampsia (SULT1A1
        [sulfotransferase 1A1], SH2B3 [SH2B adapter protein 3], SERPINE2 [serpin family E member 2], RGS18
        [regulator of G-protein signaling 18], PZP [pregnancy zone protein], NOTUM [notum, palmitoleoyl-protein
        carboxylesterase], METAP1 [methionyl aminopeptidase 1], MANEA [mannosidase endo-alpha], jun-D
        [JunD proto-oncogene], GDF15 [growth differentiation factor 15], FGL1 [fibrinogen like 1], FGF5
        [fibroblast growth factor 5], FES [FES proto-oncogene], APOBR [apolipoprotein B receptor], ANP
        [natriuretic peptide A], ALDH-E2 [aldehyde dehydrogenase 2 family member], ADAMTS13 [ADAM metallopeptidase
        with thrombospondin type 1 motif 13], and 3MG [N-methylpurine DNA glycosylase]), among which 11
        were either directly or indirectly supported by gene expression data, 9 were supported by Bayesian
        colocalization analyses, and 5 (SERPINE2, PZP, FGF5, FES, and ANP) were supported by all lines
        of evidence examined.
