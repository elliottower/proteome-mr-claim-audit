claims:
  c000:
    quotes:
    - exact: In those of European ancestry, the genetically predicted levels of five plasma proteins (BLNK,
        CD2AP, GRN, PILRA, and PILRB) were causally associated with AD. Among these five proteins, GRN
        was protective against AD, while the rest were risk factors.
