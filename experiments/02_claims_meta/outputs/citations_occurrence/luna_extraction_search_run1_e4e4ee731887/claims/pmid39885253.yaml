claims:
  c000:
    quotes:
    - exact: 'Seven proteins had 95% confidence intervals (CIs) that did not overlap the null in both
        forward MR analyses and did not have evidence for an effect in the reverse direction: higher levels
        of dermatopontin (DPT), beta-crystallin B1 (CRYBB1), interleukin-18-binding protein (IL18BP) and
        vascular endothelial growth factor receptor 2 (KDR) and lower levels of odorant-binding protein
        2b (OBP2B), glutamate-cysteine ligase regulatory subunit (GCLM) and gamma-crystallin D (CRYGD)
        were implicated in increasing MM risk.'
