claims:
  c000:
    quotes:
    - exact: 'At the protein level, high circulating levels of STAT3 are inversely associated with MS
        risk (OR: 0.43, 95% CI, 0.33-0.54).'
  c001:
    quotes:
    - exact: 'Elevated levels of TNFRSF1A are also linked with a decreased risk of MS (OR: 0.21; 95% CI,
        0.12-0.37), while higher levels of CR1 are positively associated with an increased risk of MS
        (OR: 1.17; 95% CI, 1.08-1.27).'
