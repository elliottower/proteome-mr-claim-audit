  c002:
    quotes:
    - exact: Fourteen druggable genes were identified, with eight (PLAT, SIRPB1, LAIR2, NEU1, SLC22A16,
        RAD52, PSPH, and CDH23) demonstrating consistent causal relationships with SjD.
  c003:
    quotes:
    - exact: Fourteen druggable genes were identified, with eight (PLAT, SIRPB1, LAIR2, NEU1, SLC22A16,
        RAD52, PSPH, and CDH23) demonstrating consistent causal relationships with SjD. ELISA validation
        supported differential protein expression for these targets. Key findings include the protective
        role of NEU1 and PSPH in systemic immune regulation, the pathogenic impact of PLAT, SIRPB1, BRD2,
        and LAIR2 on inflammation, and the potential involvement of SLC22A16 and RAD52 in metabolic stress
        and immune activation.
