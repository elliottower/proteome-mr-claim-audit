claims:
  c000:
    quotes:
    - exact: By testing causal effects of 1,271 proteins on AAM, we identified 22 proteins causally associated
        with AAM in MR, among which 13 proteins (GCKR, FOXO3, SEMA3G, PATE4, AZGP1, NEGR1, LHB, DLK1,
        ANXA2, YWHAB, DNAJB12, RMDN1 and HPGDS) colocalized.
