claims:
  c000:
    quotes:
    - exact: First, we performed a proteome-wide Mendelian randomization analysis to investigate causal
        relationships between plasma proteins and atherosclerosis risk, utilizing GWAS data from FinnGen
        R10 and plasma protein data from the UK Biobank. Integrating Bayesian colocalization and single-cell
        expression profiling, we identified FES as a potential therapeutic target for atherosclerosis.
  c001:
    quotes:
    - exact: Notably, intravenous delivery of recombinant adeno-associated virus (rAAV)-mediated FES overexpression
        significantly reduced inflammatory responses and lipid deposition in atherosclerotic plaques.
  c002:
