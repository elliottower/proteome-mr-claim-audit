claims:
  c000:
    quotes:
    - exact: Among the 4907 circulating proteins, diadenosine tetraphosphatase (Ap4A) was identified as
        being linked to both SGLT2 inhibition and insomnia.
  c001:
    quotes:
    - exact: Mediation analysis indicated that the effect of SGLT2 inhibition on insomnia partially operates
        through Ap4A (β = -0.018, 95 % CI [-0.036, -0.005], P = 0.023), with a mediation proportion of
        7.7 %.
