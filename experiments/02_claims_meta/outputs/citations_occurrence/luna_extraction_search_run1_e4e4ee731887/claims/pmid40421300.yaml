  c005:
    quotes:
    - exact: Western blot analysis validated these findings in plasma samples, showing significantly increased
        expression of MMP12 and ASM, and decreased expression of NPNT and SNX1 in COPD patients compared
        to healthy controls, while KLC1 showed no significant difference.
