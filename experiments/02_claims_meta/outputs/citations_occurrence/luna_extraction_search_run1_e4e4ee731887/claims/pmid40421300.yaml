claims:
  c000:
    quotes:
    - exact: MR identified 18 proteins linked to COPD, with 11 accelerating disease onset. Strong colocalization
        evidence was found for MMP12, ASM, KLC1, NPNT and SNX1, none of which overlap with current COPD
        drug targets.
