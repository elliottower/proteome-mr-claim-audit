claims:
  c000:
    quotes:
    - exact: PW-MR highlighted numerous plasma proteins, with interleukin-6 receptor (IL6R) showing strong
        association and colocalization in both deCODE and UK Biobank Pharma Proteomics Project (UKB-PPP)
        datasets. Multi-trait colocalization analysis supports IL6R's role, suggesting that drugs targeting
        IL6R, such as tocilizumab, may benefit AA treatment, though potential side effects warrant consideration.
