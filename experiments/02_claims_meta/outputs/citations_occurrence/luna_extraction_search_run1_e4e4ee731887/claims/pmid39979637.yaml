claims:
  c000:
    quotes:
    - exact: 'We found 38 PD-related proteins, with six of the top ten validated in the Parkinson''s Progression
        Markers Initiative (PPMI) cohort. ITGAV, HNMT and ITGAM showed consistent significant association
        (hazard ratio: 0.11-0.57, P = 6.90 × 10-24 to 2.10 × 10-11).'
