claims:
  c000:
    quotes:
    - exact: Among the 70 significant proteins, genetically proxied circulating levels of CXCL10 were
        associated with risk of CAD, LAAS, and PAD with up to 67% of the effects of genetically downregulated
        IL-6 signaling on these endpoints mediated by decreases in CXCL10.
