  c001:
    quotes:
    - exact: 'Following multiple testing corrections using the Benjamini-Hochberg method, fatty acid synthase
        (FASN) and tissue inhibitor of metalloproteinases 4 (TIMP4) remained significantly associated
        with acne risk. FASN exhibited a protective effect against acne (OR = 0.768, 95% CI: 0.676-0.872,
        p = 4.685E-05), while TIMP4 was associated with an increased risk (OR = 1.169, 95% CI: 1.103-1.241,
        p = 1.956E-07).'
