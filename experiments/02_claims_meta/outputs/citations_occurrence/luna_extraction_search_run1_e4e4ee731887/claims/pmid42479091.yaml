        was further confirmed by IHC.
  c003:
    quotes:
    - exact: Survival analyses demonstrated that high FAM3D expression (p = 0.016) and low promoter methylation
        (p = 0.048) were associated with favorable overall survival, while combined expression-methylation
        analysis further improved prognostic stratification (p = 0.006).
  c004:
    quotes:
    - exact: Functional assays showed that FAM3D suppressed CC cell proliferation and migration.
  c005:
    quotes:
    - exact: Functional assays showed that FAM3D suppressed CC cell proliferation and migration.
  c006:
    quotes:
    - exact: Transcriptomic profiling revealed that FAM3D restoration induced extensive transcriptional
        reprogramming and was associated with inflammatory signaling, cytokine-mediated pathways, and
        extracellular matrix remodeling.
