claims:
  c000:
    quotes:
    - exact: Integrative SMR analysis identified FAM3D as a protective gene for CC.
  c001:
    quotes:
    - exact: FAM3D expression was significantly reduced in CC tissues and exhibited a progressive decline
        from normal cervical tissues to cervical intraepithelial neoplasia (CIN) and invasive CC, which
        was further confirmed by IHC.
  c002:
    quotes:
    - exact: FAM3D expression was significantly reduced in CC tissues and exhibited a progressive decline
