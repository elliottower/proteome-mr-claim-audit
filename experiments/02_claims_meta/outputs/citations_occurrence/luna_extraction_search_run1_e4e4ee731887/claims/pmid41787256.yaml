  c005:
    quotes:
    - exact: Tumor microenvironment analysis revealed that IL3RA expression levels significantly correlated
        with immune landscape alterations in ER+ breast cancer.
  c006:
    quotes:
    - exact: Immune infiltration analysis demonstrated significant associations between IL3RA expression
        levels and multiple immune cell populations in ER+ breast cancer, particularly CD8+ T cells, neutrophils,
        M0 macrophages, and M2 macrophages.
