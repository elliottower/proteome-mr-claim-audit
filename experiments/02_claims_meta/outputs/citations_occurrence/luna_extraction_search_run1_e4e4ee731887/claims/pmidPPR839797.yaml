claims:
  c000:
    quotes:
    - exact: Results from the MR analysis in the finding cohort indicated ten protein–Endometriosis pairs,
        including Intercellular adhesion molecule 2, R-spondin-3, Intercellular adhesion molecule 4, Endoglin,
        OX-2 membrane glycoprotein, Leukemia inhibitory factor receptor, Insulin-like growth factor 1
        receptor, Hydroxycarboxylic acid receptor 2, Tryptase gamma, Alpha-(1,3)-fucosyltransferase 9
        in the plasma.
