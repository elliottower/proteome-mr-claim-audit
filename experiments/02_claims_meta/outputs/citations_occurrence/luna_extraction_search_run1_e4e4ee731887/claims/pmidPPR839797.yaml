  c010:
    quotes:
    - exact: After validation analysis and Bayesian co-localization analysis, RSPO3 was identified as
        a potential drug target for endometriosis.
  c011:
    quotes:
    - exact: We conducted Mendelian Randomization analysis on GWAS data from a large population, confirming
        a causal relationship between serum levels of RSPO3 and endometriosis. This suggests that RSPO3
        may influence the onset and progression of endometriosis, providing a protective effect.
