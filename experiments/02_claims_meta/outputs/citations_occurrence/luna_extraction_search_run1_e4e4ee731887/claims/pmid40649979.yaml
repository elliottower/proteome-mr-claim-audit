claims:
  c000:
    quotes:
    - exact: Notably, colocalization confirmed the causal roles of PCSK9, IL6R, CELSR2, FN1, and SPARCL1
        in CAS, and single-cell RNA-seq analysis revealed that five genes (TGFB1, SPARCL1, IL6R, FN1,
        and CELSR2) were exclusively expressed in smooth muscle cells of either coronary plaques or healthy
        vasculature.
