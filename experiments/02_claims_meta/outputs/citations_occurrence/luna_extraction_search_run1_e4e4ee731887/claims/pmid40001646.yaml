claims:
  c000:
    quotes:
    - exact: Four drug target proteins significantly associated with sensorineural hearing loss (SNHL)
        were determined by Mendelian randomization (MR) analysis and co-localization analysis. These drug
        targets include LATS1, TEF, LMNB2, and OGFR and were shown to have fewer potential side effects
        when acting on these target proteins by phenotype-wide association analysis.
