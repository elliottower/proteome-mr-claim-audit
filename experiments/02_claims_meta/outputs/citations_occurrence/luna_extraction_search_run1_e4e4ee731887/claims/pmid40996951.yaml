claims:
  c000:
    quotes:
    - exact: Genetically predicted levels of 68 plasma proteins were associated with RA. After colocalization
        and SMR analysis, 6 plasma proteins (FCRL3, SUGP1, TNFAIP3, EHBP1, HAPLN4, and CILP2) have been
        passed all tests and identified as having potential as therapeutic targets for RA.
