claims:
  c000:
    quotes:
    - exact: In primary analyses, MR analysis revealed 2 plasma protein significantly associated with
        MDD risk at Bonferroni correction (P < 3.720 × 10-5), including butyrophilin subfamily 2 member
        A1 (BTN2A1, OR = 0.860; 95 % CI, 0.825-0.895; P = 1.79 × 10-5) and butyrophilin subfamily 3 member
        A2 (BTN3A2, OR = 1.071; 95 % CI, 1.056-1.086; P = 3.89 × 10-6).
  c001:
    quotes:
    - exact: In primary analyses, MR analysis revealed 2 plasma protein significantly associated with
        MDD risk at Bonferroni correction (P < 3.720 × 10-5), including butyrophilin subfamily 2 member
        A1 (BTN2A1, OR = 0.860; 95 % CI, 0.825-0.895; P = 1.79 × 10-5) and butyrophilin subfamily 3 member
        A2 (BTN3A2, OR = 1.071; 95 % CI, 1.056-1.086; P = 3.89 × 10-6).
  c002:
    quotes:
    - exact: In the replication stage, BTN2A1 and BTN3A2 were successfully validated in the FinnGen cohort.
        This study genetically determined BTN2A1 and BTN3A2 were associated with MDD and these findings
        may have clinical implications for MDD prevention.
