claims:
  c000:
    quotes:
    - exact: Elevated levels of 9 proteins (APOC1, S100A7, ADH7, LYZ, NPNT, C9, MMP7, TPI1, SAR1A) and
        decreased levels of 3 proteins (REG4, CRISPLD2, ENO2) were associated with an increased risk of
        GC (IDDF2024-ABS-0107-Figure 4. Summary results from case-control study and mendelian randomization).
