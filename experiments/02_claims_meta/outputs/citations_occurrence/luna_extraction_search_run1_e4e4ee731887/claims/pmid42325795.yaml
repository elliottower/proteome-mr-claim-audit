claims:
  c000:
    quotes:
    - exact: Employing an integrative multi-omic strategy - combining proteome-wide Mendelian randomization,
        immune cell mediation analysis, bulk and single-cell transcriptomics, and machine learning - we
        identified 132 plasma proteins with genetically inferred causal effects on DVT. Among these, COP9
        signalosome subunit 2 (COPS2) emerged as the most consistent candidate, with approximately 20%
        of its effect mediated through effector memory cluster of differentiation 8-positive (CD8+) T
        cells.
  c001:
    quotes:
    - exact: Employing an integrative multi-omic strategy - combining proteome-wide Mendelian randomization,
        immune cell mediation analysis, bulk and single-cell transcriptomics, and machine learning - we
        identified 132 plasma proteins with genetically inferred causal effects on DVT. Among these, COP9
        signalosome subunit 2 (COPS2) emerged as the most consistent candidate, with approximately 20%
        of its effect mediated through effector memory cluster of differentiation 8-positive (CD8+) T
        cells.
  c002:
    quotes:
    - exact: Transcriptomic profiling localized COPS2 expression to CD8+ T cells and endothelial cells,
        and functional validation in endothelial cells demonstrated that COPS2 directly upregulates tissue
        factor (TF), intercellular adhesion molecule-1 (ICAM-1), and Bcl-2-associated X protein (BAX),
        enhances procoagulant activity, and activates the Janus kinase-signal transducer and activator
        of transcription (JAK-STAT) signaling pathway.
