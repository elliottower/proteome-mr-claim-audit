  c007:
    quotes:
    - exact: In vivo, Cops2 deficiency reduced thrombus burden, attenuated activation of effector memory
        CD8+ T cells, and decreased intrathrombotic levels of interferon-gamma (IFN-γ) and granzyme B
        (GZMB).
