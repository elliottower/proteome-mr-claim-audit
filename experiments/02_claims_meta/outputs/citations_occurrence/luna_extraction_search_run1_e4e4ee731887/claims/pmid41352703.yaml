claims:
  c000:
    quotes:
    - exact: The MR analysis revealed that higher levels of phosphatidylcholine (PC) (18:1/18:2) were
        associated with a reduced risk of IS (OR = 0.816, 95 % CI 0.742-0.898, p = 2.89 × 10-5). Interleukin
        (IL)-18 was identified as a mediator in this association, with a mediation proportion of 4.07
        %.
  c001:
    quotes:
    - exact: During stroke onset, IL-18 expression increased significantly in CNS-associated macrophages
        and other cell types but was lower in homeostatic microglial cells.
