claims:
  c000:
    quotes:
    - exact: Five proteins HPSE, ST3GAL1, CEL, KLK13, and GNRH2 were identified as highly associated with
        EC. HPSE and GNRH2 showed protective effects with odds ratios (OR) of 0.80 (95% confidence interval
        [CI], 0.70-0.92) and 0.73 (95% CI 0.54-0.98), respectively.
