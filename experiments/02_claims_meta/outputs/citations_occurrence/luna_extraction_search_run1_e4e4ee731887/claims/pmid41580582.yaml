  c000:
    quotes:
    - exact: 'Higher CD300C expression was associated with reduced LUAD risk (β = − 0.030, OR = 0.97,
        95% CI: 0.942–0.999), while the proportion of CD62L⁻ monocytes was also inversely associated with
        LUAD (β = − 0.086, OR = 0.91, 95% CI: 0.855–0.982).'
  c001:
    quotes:
    - exact: 'CD300C expression was positively associated with CD62L⁻ monocytes (β = 0.008, OR = 1.082,
        95% CI: 1.029–1.139).'
