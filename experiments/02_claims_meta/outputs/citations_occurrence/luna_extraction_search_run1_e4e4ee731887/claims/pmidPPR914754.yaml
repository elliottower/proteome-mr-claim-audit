  c001:
    quotes:
    - exact: Of them, inhibition of angiotensin-converting enzyme (ACE) was found to increase the risk
        of AD (OR 1.10, 95% CI 1.08-1.14), which was likely independent of blood pressure as suggested
        by multivariable MR. Observational analysis in UK Biobank showed a higher incidence (HR 1.24,
        95% CI 1.01-1.52) of AD among regular users of ACE inhibitors (ACEI), compared with the counterpart
        angiotensin receptor blocker users.
