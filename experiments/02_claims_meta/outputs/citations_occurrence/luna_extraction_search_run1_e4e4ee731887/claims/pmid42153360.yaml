claims:
  c000:
    quotes:
    - exact: MR analyses identified 6 targets causally linked to NP risk in both eQTL and pQTL analyses.
        Therein, cathepsin S (CTSS) increased the risk of NP, exclusively demonstrating colocalization
        with NP and exhibiting significant upregulation in NP tissue.
  c001:
    quotes:
    - exact: Therein, cathepsin S (CTSS) increased the risk of NP, exclusively demonstrating colocalization
        with NP and exhibiting significant upregulation in NP tissue.
  c002:
    quotes:
    - exact: Single-cell data showed CTSS mainly express in monocyte/macrophages, and CTSS-high subsets
        enriched in CRSwNP vs. Control.
  c003:
    quotes:
    - exact: Moreover, CTSS expression cor-related with tissue remodeling pathways and associated with
        CRSwNP clinical severity.
