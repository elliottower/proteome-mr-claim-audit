  c000:
    quotes:
    - exact: 'Finally, we identified MAPK3 (OR = 0.855, 95% CI: 0.791-0.923, p = 6.88 × 10-5) and GZMK
        (OR = 1.278, 95% CI: 1.131-1.444, p = 8.58 × 10-5) as the core therapeutic targets for knee OA,
        and ITIH1 (OR = 0.847, 95% CI: 0.784-0.915, p = 2.44 × 10-5) for hip OA.'
