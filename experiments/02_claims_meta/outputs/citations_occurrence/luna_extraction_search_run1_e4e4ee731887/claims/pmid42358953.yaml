claims:
  c000:
    quotes:
    - exact: MR analysis prioritized GABARAP as a suggestive protective candidate for CD, with genetically
        predicted higher GABARAP levels associated with a decreased disease risk (OR = 0.563, 95% CI 0.327-0.968,
        P = 0.038).
  c001:
    quotes:
    - exact: Two-step MR further suggested a putative genetic association between ANGPT1 and GABARAP,
        and mediation analysis indicated that GABARAP may partially mediate the genetically predicted
        ANGPT1-CD association, with an estimated mediation proportion of 22.97%.
  c002:
    quotes:
    - exact: Two-step MR further suggested a putative genetic association between ANGPT1 and GABARAP,
        and mediation analysis indicated that GABARAP may partially mediate the genetically predicted
        ANGPT1-CD association, with an estimated mediation proportion of 22.97%.
  c003:
    quotes:
    - exact: DSS-induced colitis was associated with reduced ANGPT1 and GABARAP expression, along with
        increased NLRP3 expression, Caspase-1 processing, GSDMD-N accumulation, and elevated IL-1β, IL-18,
        and LDH levels.
  c004:
    quotes:
    - exact: DSS-induced colitis was associated with reduced ANGPT1 and GABARAP expression, along with
        increased NLRP3 expression, Caspase-1 processing, GSDMD-N accumulation, and elevated IL-1β, IL-18,
        and LDH levels.
  c005:
    quotes:
    - exact: In vitro, silencing either GABARAP or ANGPT1 enhanced NLRP3 inflammasome-associated pyroptotic
        signaling under LPS plus nigericin stimulation, whereas rhANGPT1 treatment partially attenuated
        these responses in association with restored GABARAP expression.
