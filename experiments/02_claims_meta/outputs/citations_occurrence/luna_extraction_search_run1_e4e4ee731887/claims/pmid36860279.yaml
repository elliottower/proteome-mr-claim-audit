claims:
  c000:
    quotes:
    - exact: 'Using single-nucleotide polymorphisms as instrumental variables, 1-SD increase in MET level
        was associated with an approximately 10% decreased risk of HF (odds ratio [OR]: 0.92; 95% confidence
        interval [CI]: 0.89 to 0.95; p = 1.42 × 10-6), whereas increases in the levels of CD209 (OR: 1.04;
        95% CI: 1.02-1.06; p = 6.67 × 10-6) and USP25 (OR: 1.06; 95% CI: 1.03-1.08; p = 7.83 × 10-6) were
        associated with an increased risk of HF.'
