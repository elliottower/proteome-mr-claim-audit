claims:
  c000:
    quotes:
    - exact: At Bonferroni significance (P < 6.82 × 10-5), Mendelian randomization analysis revealed that
        three proteins were causally associated with low grip strength. Increased MGP (OR = 0.85) and
        HP (OR = 0.96) decreased the risk of low grip strength, whereas elevated ART4 (OR = 1.06) increased
        the risk of low grip strength.
