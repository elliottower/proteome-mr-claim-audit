claims:
  c000:
    quotes:
    - exact: Through SMR analysis, we identified two NETs-related genes ( AGER and SIGLEC9 ) and one protein
        ( CEACAM1 ) as causally associated with COPD.
  c001:
    quotes:
    - exact: Through SMR analysis, we identified two NETs-related genes ( AGER and SIGLEC9 ) and one protein
        ( CEACAM1 ) as causally associated with COPD.
  c002:
    quotes:
    - exact: Subsequent experimental validation in cigarette smoke extract (CSE)-treated BEAS-2B cells,
        a 12-week smoke-exposed mouse model, and clinical human lung tissue samples confirmed the involvement
        of these key molecules, revealing their dysregulated expression profiles in COPD-related conditions.
        Notably, although SMR analysis suggested protective effects of SIGLEC9 and CEACAM1 based on genetically
        predicted blood levels, experimental data demonstrated their upregulation in diseased lung tissues,
        indicating the involvement of complex regulatory mechanisms.
