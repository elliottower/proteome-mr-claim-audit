  c000:
    quotes:
    - exact: 'Notably, CKAP2 showed directionally discordant associations across molecular layers: genetically
        predicted CNS-related CKAP2 expression was inversely associated with MDD risk, whereas genetically
        predicted plasma CKAP2 protein levels showed an association in the opposite direction.'
