claims:
  c000:
    quotes:
    - exact: 'After FDR adjustment, circulating ERAP1 (OR = 1.30, 95 % CI: 1.21-1.39, P = 8.18 × 10-14)
        and IL23R (OR = 2.21, 95 % CI: 1.61-3.03, P = 9.47 × 10-7) were genetically linked to increased
        AS risk, while IL1RL2 showed a protective effect (OR = 0.70, 95 % CI: 0.58-0.85, P = 3.22 × 10-4).'
