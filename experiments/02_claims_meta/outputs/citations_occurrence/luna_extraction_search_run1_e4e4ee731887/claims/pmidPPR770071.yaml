  c008:
    quotes:
    - exact: Among these, 8 proteins (PSMB4, PARP1, GDI2, MAX, GMPR2, ARPC1B, ATOX1, and NUDT5) were found
        to be well colocalized with telomere length (posterior probability >80%).
