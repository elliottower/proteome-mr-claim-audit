claims:
  c000:
    quotes:
    - exact: In a multicenter, large-scale study, Keratin 5 (KRT5) and Versican (VCAN) were identified
        as promising biomarkers for PDAC, with an area under the curve (AUC) of 0.90, and a combined panel
        including CA 19-9 achieved an AUC of 0.95.
