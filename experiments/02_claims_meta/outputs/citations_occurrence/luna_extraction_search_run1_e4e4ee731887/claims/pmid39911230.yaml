claims:
  c000:
    quotes:
    - exact: 'MR analysis revealed that a decrease of one standard deviation (SD) in plasma R-Spondin
        3 (RSPO3) level had a protective effect on EM (OR = 1.0029; 95% confidence interval (95% CI):
        1.0015-1.0043; P = 3.2567e-05; Bonferroni P < 5.63 × 10-5).'
  c001:
    quotes:
    - exact: 'MR analysis revealed that a decrease of one standard deviation (SD) in plasma R-Spondin
        3 (RSPO3) level had a protective effect on EM (OR = 1.0029; 95% confidence interval (95% CI):
        1.0015-1.0043; P = 3.2567e-05; Bonferroni P < 5.63 × 10-5). BC analysis showed that RSPO3 shared
        the same genetic variant with EM (coloc.abf-PPH4 = 0.874). External validation further supported
        this causal association.'
  c002:
    quotes:
    - exact: 'Galectin-3 (LGALS3; OR = 0.9906; 95% CI: 0.9835-0.9977; P = 0.0101), carboxypeptidase E
        (CPE; OR = 1.0147; 95% CI: 1.0009-1.0287; P = 0.0366), and alpha-(1,3)-fucosyltransferase 5 (FUT5;
        OR = 1.0053; 95% CI: 1.0013-1.0093; P = 0.002) were detected as potential targets for EM in CSF.'
