claims:
  c000:
    quotes:
    - exact: 'We identified a positive causal association between the protein level ratios of Low-Density
        Lipoprotein Receptor-Related Protein 11/ Nectin Cell Adhesion Molecule 2 (IVW odds ratio (OR):
        1.84; 95% confidence interval (CI): 1.40–2.41, <italic>P =</italic> 1.07E-05) and Tumor Necrosis
        Factor Receptor Superfamily Member 13B/ Tumor Necrosis Factor Receptor Superfamily Member 9 (IVW
        OR: 2.72, 95% CI: 1.77–4.19, <italic>P =</italic> 5.56E-06) and the risk of PSC. Conversely, the
        protein level ratios of Lymphotoxin Alpha/ Lymphotoxin Beta Receptor (IVW OR: 0.50, 95% CI: 0.43–0.58,
        <italic>P =</italic> 7.58E-20) and Nectin Cell Adhesion Molecule 2/ Tumor Necrosis Factor Receptor
        Superfamily Member 14 (IVW OR: 0.55, 95% CI: 0.44–0.69, <italic>P =</italic> 2.17E-07) were found
        to have an inverse causal relationship with the risk of PSC.'
