claims:
  c000:
    quotes:
    - exact: 'Our two-sample MR analysis identified nominally significant associations between genetically
        predicted higher vWF (OR 1.27, 95% CI 1.06– 1.51), FVIII (OR 2.21, 95% CI 1.05– 4.66), and lower
        Protein C (OR: 0.91, 95% CI: 0.83– 0.99) with a higher risk of preeclampsia.'
