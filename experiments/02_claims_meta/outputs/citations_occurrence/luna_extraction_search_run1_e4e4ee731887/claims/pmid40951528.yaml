claims:
  c000:
    quotes:
    - exact: Six molecular biomarkers-including canopy FGF signaling regulator 4 (CNPY4), ectonucleoside
        triphosphate diphosphohydrolase 6 (ENTPD6), and major histocompatibility complex, class I, A (HLA-A)-and
        eight clinical biomarkers (e.g., serum total protein (STP)) were identified as causally related
        to MASLD.
