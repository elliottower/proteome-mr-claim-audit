  c004:
    quotes:
    - exact: Using the RNA-seq data, average transcript levels for six genes were associated with incident
        IA (N = 274 pairs), with only the association from SIGLEC6 remaining statistically significant
        after multiple testing correction.
  c005:
    quotes:
    - exact: Average serum protein levels before the age of one for LTA and CCL19 levels were associated
        with incident IA (N = 307 pairs), and the LTA association remained significant after correction
        for multiple testing.
  c006:
    quotes:
    - exact: Average serum protein levels before the age of one for LTA and CCL19 levels were associated
        with incident IA (N = 307 pairs), and the LTA association remained significant after correction
        for multiple testing.
  c007:
    quotes:
    - exact: Of the 27 putative core proteins, 11 were supported by a dose response relationship in the
        MR analysis; rare variants in PDCD1 had been discovered to cause autoimmune diabetes; CXCL9 was
        supported with a cis score association of T1D; 4 are located within 200 kb from previously reported
        T1D GWAS hits for T1D; 11 were supported by protein associations; 9 were supported by experimental
        perturbation in mouse models; and 1 was supported by drug effects in humans.
