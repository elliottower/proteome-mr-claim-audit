    - exact: 'MR analysis revealed that each 1-standard deviation increase in genetically predicted ITPR3
        expression was associated with a 32.8 % higher risk of chronic prostatitis (OR = 1.328, 95 % CI:
        1.108-1.702, P < 0.001), which was further validated by SMR-HEIDI testing (HEIDI P > 0.05).'
