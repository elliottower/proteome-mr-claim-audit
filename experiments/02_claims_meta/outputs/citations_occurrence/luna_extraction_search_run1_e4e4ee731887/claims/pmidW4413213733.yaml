claims:
  c000:
    quotes:
    - exact: GATE scores for 27 proteins were associated with type 1 diabetes. Fourteen were replicated
        between datasets, 11 had support in Mendelian randomisation analysis and 9 had experimental support
        in mouse models of autoimmune diabetes. The strongest associations were for immune checkpoints
        (PDCD1, CD5, TIGIT, LAG3), chemokines and innate immune system proteins (NCR1, KLRB1).
