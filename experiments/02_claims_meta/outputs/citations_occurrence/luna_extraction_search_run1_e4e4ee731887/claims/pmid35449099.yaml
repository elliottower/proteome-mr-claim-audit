claims:
  c000:
    quotes:
    - exact: Our integrative analysis revealed that ICA1L was associated with small-vessel stroke (SVS),
        according to robust evidence at both protein and transcriptional levels based on brain-derived
        data.
  c001:
    quotes:
    - exact: In blood, we identified 5 genes (MMP12, SCARF1, ABO, F11, and CKAP2) that had causal relationships
        with stroke and stroke subtypes.
