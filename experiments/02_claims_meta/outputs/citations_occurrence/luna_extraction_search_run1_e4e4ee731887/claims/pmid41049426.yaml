claims:
  c000:
    quotes:
    - exact: We genetically identified eight proteins with a causal role in the etiology of NSCLC. Lower
        levels of five proteins (CDH17, CXADR, FAM3D, POGLUT3, SFTPB) and higher levels of two proteins
        (CEACAM5, KLK1) were linked to increased LUAD risk, while higher CD14 levels were associated with
        elevated LUSC risk.
