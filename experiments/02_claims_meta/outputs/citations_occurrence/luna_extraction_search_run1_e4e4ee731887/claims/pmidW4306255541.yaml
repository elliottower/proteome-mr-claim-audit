claims:
  c000:
    quotes:
    - exact: 'We identified 377 serum proteins associated with the primary endpoint in ATMOSPHERE and
        replicated 167 in PARADIGM-HF. Prognostic proteins included known HF biomarkers Growth Differentiation
        Factor 15, NT-proBNP, and Angiopoietin-2, and also a previously unrecognized HF biomarker: Sushi,
        Von Willebrand Factor Type A, EGF And Pentraxin Domain Containing 1 (SVEP1) (HR 1.60 [95% CI 1.44–1.79]
        per standard deviation [SD], p=2x10–17) (Table 1).'
