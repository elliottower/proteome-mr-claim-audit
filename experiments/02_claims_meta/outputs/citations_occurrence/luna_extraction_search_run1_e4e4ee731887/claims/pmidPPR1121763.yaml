  c004:
    quotes:
    - exact: Four ferroptosis-related genes (SMPD1 and SIRT3 suppressing obesity, GSTZ1 and ADAMTS13 promoting
        obesity) and nine plasma metabolites were found to be significantly associated with childhood
        obesity (six negatively correlated and three positively correlated). Further mediation analysis
        indicated that the ferroptosis mechanism regulated by SMPD1 and SIRT3 partially mediated the association
        between specific plasma metabolites and childhood obesity, with the highest mediation proportion
        reaching 9.62%.
