claims:
  c000:
    quotes:
    - exact: Elevated plasma MANBA (odds ratio [OR] = 1.29, 95% confidence interval [CI] 1.20-1.40, p
        = 1.22 × 10-10) and CSF TNFSF15 (OR = 6.37, 95% CI 2.94-13.83, p = 2.79 × 10-6) were associated
        with higher PBC risk, whereas elevated plasma FCRL3 (OR = 0.79, 95% CI 0.73-0.86, p = 2.12 × 10-8)
        was associated with lower risk.
