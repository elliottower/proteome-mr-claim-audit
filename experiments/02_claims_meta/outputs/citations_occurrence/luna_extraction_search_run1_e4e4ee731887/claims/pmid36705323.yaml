claims:
  c000:
    quotes:
    - exact: Overall, 44 traits were found to be putatively causal for early AMD in univariable analysis.
        Serum proteins that were found to have significant relationships with AMD included S100-A5 (odds
        ratio [OR] = 1.07, p-value = 6.80E-06), cathepsin F (OR = 1.10, p-value = 7.16E-05), and serine
        palmitoyltransferase 2 (OR = 0.86, p-value = 1.00E-03).
