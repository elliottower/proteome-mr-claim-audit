  c002:
    quotes:
    - exact: 'After adjusting PM2.5 and TAC-1, there was still a negative causal association between TNF
        and BMD (IVW β = -0.089, 95% CI: -0.166 - -0.012, P < 0.05).'
  c003:
    quotes:
    - exact: In the final drug-target MR study, the protective effect of TNF/TNF receptor 1 (TNFR1) inhibition
        on BMD was observed.
