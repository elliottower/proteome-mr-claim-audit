claims:
  c000:
    quotes:
    - exact: 'TNF has a negative causal association with BMD (Wald ratio β = -0.082, 95% CI: -0.165 -
        0.000, P < 0.05) and TAC-1 has a positive causal association with BMD (IVW β = 0.042, 95% CI:
        0.007 - 0.077, P < 0.05).'
  c001:
    quotes:
    - exact: 'TNF has a negative causal association with BMD (Wald ratio β = -0.082, 95% CI: -0.165 -
        0.000, P < 0.05) and TAC-1 has a positive causal association with BMD (IVW β = 0.042, 95% CI:
