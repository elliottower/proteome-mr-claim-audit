  c000:
    quotes:
    - exact: This included positive control findings, for example higher values of AT1B2 (targeted by
        digoxin) decreased the risk of HCM, which we were able to link to a novel unclassified urinary
        breakdown product (X-15497).
  c001:
    quotes:
    - exact: Additionally, we showed that increased plasma RET values, a mediator of GDF-15 signalling,
        reduced the risk of HF, and linked this to the novel unclassified urinary breakdown product X-23776.
