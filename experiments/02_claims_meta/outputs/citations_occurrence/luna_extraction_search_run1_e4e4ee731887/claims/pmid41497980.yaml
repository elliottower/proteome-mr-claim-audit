claims:
  c000:
    quotes:
    - exact: 'After stringent SMR validation, we identified four high-confidence causal proteins: TREML2
        (Triggering Receptor Expressed on Myeloid cells-like 2) and MMP12 (Matrix Metallopeptidase 12)
        as risk factors, and PLA2R1 (Phospholipase A2 Receptor 1) and MAX (MYC Associated Factor X) as
        protective factors.'
