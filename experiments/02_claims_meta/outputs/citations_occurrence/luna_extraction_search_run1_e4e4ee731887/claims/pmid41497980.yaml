  c004:
    quotes:
    - exact: These genetic predictions were phenocopied in our ALD mouse model; hepatic expression of
        Treml2 and Mmp12 was significantly upregulated, whereas Pla2r1 and Max were downregulated, corroborating
        their respective roles in disease pathogenesis.
