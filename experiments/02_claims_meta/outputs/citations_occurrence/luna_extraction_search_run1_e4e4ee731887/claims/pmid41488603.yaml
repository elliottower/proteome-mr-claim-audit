    quotes:
    - exact: The effect of F11, SH3BGRL3, SPATA20 and SWAP70 on each subtype was mediated by Factor XI
        inhibitors, atrial fibrillation, type 2 diabetes and systolic blood pressure, respectively (P
        < 0.05).
