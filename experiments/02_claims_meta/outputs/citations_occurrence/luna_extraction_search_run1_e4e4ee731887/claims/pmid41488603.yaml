claims:
  c000:
    quotes:
    - exact: We found that the protein abundance of seven genes (MMP12, F11, SH3BGRL3, ENGASE, SCARA5,
        SWAP70 and SPATA20) in the plasma was associated with stroke and its subtypes, and six genes (MMP12,
        F11, SH3BGRL3, SCARA5, SWAP70 and SPATA20) causally related with stroke and its subtypes.
