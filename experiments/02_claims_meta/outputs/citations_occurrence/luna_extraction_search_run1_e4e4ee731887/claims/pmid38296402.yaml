claims:
  c000:
    quotes:
    - exact: Fifty-two proteins cross-sectionally were associated with AVmax and dimensionless index at
        V5 and with risk of incident AV-related hospitalization after V3. Among 3,413 participants in
        the Cardiovascular Health Study, 6 of those proteins were significantly associated with adjudicated
        moderate or severe AS, including matrix metalloproteinase 12 (MMP12), complement C1q tumor necrosis
        factor-related protein 1 (C1QTNF1), and growth differentiation factor-15.
