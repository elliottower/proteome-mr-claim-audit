claims:
  c000:
    quotes:
    - exact: Notably, BTN2A1 is causally associated with an increased risk of bone and articular cartilage
        cancer (OR = 1.776, 95% CI = 1.429 - 2.207), colorectal cancer (OR = 1.200, 95% CI = 1.129 - 1.275),
        eye and adnexa cancer (OR = 2.686, 95% CI = 1.943 - 3.714), lip cancer (OR = 3.004, 95% CI = 2.193
        - 4.114), oral cancer (OR = 1.905, 95% CI = 1.577 - 2.302), ovary cancer (OR = 1.265, 95% CI =
        1.143 - 1.400), and rectum cancer (OR = 1.393, 95% CI = 1.263 - 1.536).
