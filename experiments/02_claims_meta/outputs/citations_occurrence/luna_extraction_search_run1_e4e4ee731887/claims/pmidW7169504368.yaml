claims:
  c000:
    quotes:
    - exact: Together, these findings prioritize DPEP1 as a genetically supported candidate associated
        with skin cancer risk and provide supportive transcriptomic and computational evidence for future
        mechanistic and therapeutic investigation.
  c001:
    quotes:
    - exact: In the murine Dpep1‐knockout dataset, Dpep1 deficiency was associated with altered stromal
        and immune programs, including reduced fibroblast abundance, lower YAP‐TEAD/TGF‐β pathway activity
        and increased CD8 + T‐cell cytotoxicity scores.
