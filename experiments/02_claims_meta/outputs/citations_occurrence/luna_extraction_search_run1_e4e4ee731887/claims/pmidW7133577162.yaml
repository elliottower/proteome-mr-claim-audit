claims:
  c000:
    quotes:
    - exact: We identified five key proteins associated with bacterial infectious skin diseases. Specifically,
        FN1 was associated with erysipelas; ULK3 and CSK were associated with cellulitis; and ARHGAP25
        and ENTPD6 were associated with cutaneous abscess, furuncle, and carbuncle.
