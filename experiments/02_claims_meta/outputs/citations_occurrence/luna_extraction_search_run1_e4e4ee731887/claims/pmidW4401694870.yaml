claims:
  c000:
    quotes:
    - exact: This study identified six plasma proteins potentially causal for LUSC risk. HSPA1L, SPINK2,
        and VARS are associated with decreased risk, while PCSK7, POLI, and TCL1A are linked to increased
        risk.
