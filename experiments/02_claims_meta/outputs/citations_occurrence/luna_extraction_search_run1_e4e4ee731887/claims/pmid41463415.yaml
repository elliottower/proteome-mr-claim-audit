  c005:
    quotes:
    - exact: Notably, DOK2 emerged as a Tier 1 target, while FKBPL, NCF2, AXL, and PDIA3 were classified
        as Tier 2 targets, representing promising candidates for further drug development. Overall, we
        identified 12 proteins with druggable potential associated with LUSC risk and demonstrated how
        modifiable risk factors mediate these associations.
