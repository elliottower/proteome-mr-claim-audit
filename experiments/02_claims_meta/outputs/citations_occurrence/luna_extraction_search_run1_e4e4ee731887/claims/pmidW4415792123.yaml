claims:
  c000:
    quotes:
    - exact: AI-derived spatial fibrosis phenotypes using VAE decomposition of T1 maps reveal hidden prognostic
        information and region-specific biological drivers invisible to conventional mean T1 analysis,
        identifying causal protein targets (FOLH1, ENPP2, CTSS, PDE5A) amenable to existing inhibitors
        for precision anti-fibrotic therapies.
