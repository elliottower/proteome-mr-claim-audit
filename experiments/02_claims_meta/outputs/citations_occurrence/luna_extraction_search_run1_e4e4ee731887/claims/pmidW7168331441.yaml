claims:
  c000:
    quotes:
    - exact: Two plasma proteins, CX3CL1 and uromodulin (UMOD), were identified as significantly and positively
        causally associated with AKI risk, supported by genetic colocalization evidence.
  c001:
    quotes:
    - exact: Two plasma proteins, CX3CL1 and uromodulin (UMOD), were identified as significantly and positively
        causally associated with AKI risk, supported by genetic colocalization evidence.
  c002:
    quotes:
    - exact: we found that patients with I/R-induced AKI exhibited significantly elevated plasma levels
        of CX3CL1 and UMOD compared to those who underwent ischemia-reperfusion without developing AKI
        (P< 0.05).
  c003:
    quotes:
    - exact: we found that patients with I/R-induced AKI exhibited significantly elevated plasma levels
        of CX3CL1 and UMOD compared to those who underwent ischemia-reperfusion without developing AKI
        (P< 0.05).
  c004:
    quotes:
    - exact: Spearman’s test demonstrated a significant correlation between serum creatinine and plasma
        CX3CL1 and UMOD in patients with I/R induced AKI (r = 0.848, P < 0.001; r = 0.794, P< 0.001, respectively).
  c005:
    quotes:
    - exact: Spearman’s test demonstrated a significant correlation between serum creatinine and plasma
        CX3CL1 and UMOD in patients with I/R induced AKI (r = 0.848, P < 0.001; r = 0.794, P< 0.001, respectively).
  c006:
    quotes:
    - exact: Plasma CX3CL1 and UMOD showed high specificity but low sensitivity in diagnosing AKI (sensitivity
        68.0% and 60%;specificity 92.0% and 88%,respectively).
