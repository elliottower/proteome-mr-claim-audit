claims:
  c000:
    quotes:
    - exact: Through MR analysis, we successfully identified five plasma proteins that are causally linked
        to JIA. Genetically inferred lower levels of AIF1, TNF, and TNFSF11 were associated with an elevated
        risk of JIA, while higher levels of AGER and GP1BA proteins were positively correlated with JIA
        risk.
