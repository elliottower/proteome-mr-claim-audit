  c000:
    quotes:
    - exact: 'MR analysis revealed a significant negative association between cytochrome P450 oxidoreductase
        (POR) and CRSwNP risk (discovery cohort: OR=0.87, P=1.47×10-5; replication cohort: OR=0.82, P=1.09×10-7);
        cis-pQTL-MR analysis further supported this association (OR=0.77, P=4.12×10-4).'
