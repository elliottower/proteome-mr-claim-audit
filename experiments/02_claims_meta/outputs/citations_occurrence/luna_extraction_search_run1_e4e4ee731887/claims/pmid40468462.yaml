  c002:
    quotes:
    - exact: Preliminary MR analysis identified two proteins (SPAG11B and DEFB135) associated with RA,
        and elevated plasma levels of both proteins would reduce the risk of RA (for SPAG11B, OR = 0.49,
        95% CI = 0.40-0.61, p = 1.19 × 10- 10; for DEFB135, OR = 0.28, 95% CI = 0.15-0.52, p = 4.51 ×
        10- 5, using the IVW method). In the external validation phase, the results were reproducible
        for SPAG11B, but not for DEFB135.
  c003:
    quotes:
    - exact: Reverse MR analysis pointed out that RA exhibited reverse causality for plasma levels of
        SPAG11B (OR = 0.93, 95% CI = 0.89-0.98, p = 0.004), but not for DEFB135 (p = 0.93).
