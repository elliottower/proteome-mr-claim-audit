claims:
  c000:
    quotes:
    - exact: 'Triangulation of evidence with multi-omics external validation highlighted six key proteins:
        RRM2B (a Cladribine target), CBR1, and ETFA, which are linked to existing drugs; DNM3 (a GWAS-implicated
        locus), CAB39L, and NMRAL1, which emerged as validated novel proteins providing biological insight
        into MS progression.'
