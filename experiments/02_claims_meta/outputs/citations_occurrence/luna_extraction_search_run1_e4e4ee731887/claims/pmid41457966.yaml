claims:
  c000:
    quotes:
    - exact: Thirteen antihypertensive target genes were also linked to WMH burden, including ADRB3, AOC1
        (amine oxidase copper containing 1), SHBG (sex hormone binding globulin), and KCNH2 (potassium
        voltage-gated channel subfamily H member 2), which influenced both systolic blood pressure and
        diastolic blood pressure.
