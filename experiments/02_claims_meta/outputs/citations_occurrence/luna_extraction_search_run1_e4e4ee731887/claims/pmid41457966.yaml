  c012:
    quotes:
    - exact: Antihypertensive drug targets, including angiotensin II receptor blockers, β-blockers, calcium
        channel blockers, and diuretics, were significantly associated with WMH burden. Mediation analysis
        showed that systolic blood pressure partially mediated TFPI's effect (3.04%), and diastolic blood
        pressure mediated the effects of ACP1 (acid phosphatase 1) (2.74%) and LAMC1 (laminin subunit
        gamma 1; 4.94%).
