claims:
  c000:
    quotes:
    - exact: In contrast to previous expression QTL evidence, our study suggested that ITGAV inhibition
        could reduce FEV1/FVC; we note that reduced lung function was also seen in a recent trial of an
        ITGAV inhibitor (NCT01371305).
  c001:
    quotes:
    - exact: Of 10 proteins previously implicated by reported lung function signals, surfactant protein
        D (SFTPD) has been highlighted in previous respiratory MR analyses and variants in SFTPD have
        been previously reported to be associated with emphysema; our PheWAS suggested that this variant
        has a relatively specific effect on lung function as it was associated with no non-respiratory
        traits at a FDR<1%.
