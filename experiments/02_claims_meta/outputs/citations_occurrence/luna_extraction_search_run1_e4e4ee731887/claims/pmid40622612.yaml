claims:
  c000:
    quotes:
    - exact: 'Among these, MED4 (OR = 1.819, 95% CI: 1.493-2.217, FDR < 0.001), COPS7B (OR = 1.136, 95%
        CI: 1.076-1.199, FDR < 0.001), CSF3 (OR = 1.262, 95% CI: 1.139-1.398, FDR < 0.001), IL26 (OR =
        1.125, 95% CI: 1.066-1.186, FDR < 0.001), NRXN1 (OR = 1.125, 95% CI: 1.066-1.187, FDR < 0.001),
        LRRTM4 (OR = 1.418, 95% CI: 1.225-1.614, FDR < 0.001), and MAGEA3 (OR = 1.883, 95% CI: 1.403-2.529,
        FDR < 0.001) were identified as risk factors for VaD, with MED4 showing the strongest association.'
