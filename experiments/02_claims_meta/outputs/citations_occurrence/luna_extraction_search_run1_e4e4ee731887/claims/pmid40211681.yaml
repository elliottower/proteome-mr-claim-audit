claims:
  c000:
    quotes:
    - exact: Fourteen plasma proteins and nine transcripts in whole blood had independent causal effects
        on longevity, where a cascading effect of both the tissue-specific transcripts and plasma proteins
        of LPA, PDAP1, DNAJA4, and TMEM106B showed negative effects on longevity.
  c001:
    quotes:
    - exact: PDAP1 (PDGFA-associated protein 1) with the strongest genetic evidence might reduce lifespan
        by modifying sex hormones, adiposity, and epigenetic aging acceleration.
  c002:
    quotes:
    - exact: Fourteen plasma proteins and nine transcripts in whole blood had independent causal effects
