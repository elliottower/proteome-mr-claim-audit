  c000:
    quotes:
    - exact: 'SMR analysis revealed that FIS1 showed a consistent, significant protective association
        with MI risk across three molecular levels: DNA methylation (e.g., site cg19802458), gene expression,
        and plasma protein abundance.'
  c001:
    quotes:
    - exact: Clinical samples confirmed downregulated FIS1 expression in MI patients.
  c002:
    quotes:
    - exact: In vitro, FIS1 knockdown in spermatogonial cells reduced mitochondrial membrane potential,
        elevated reactive oxygen species, decreased antioxidant enzyme activity, and significantly inhibited
        proliferation.
