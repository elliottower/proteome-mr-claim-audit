claims:
  c000:
    quotes:
    - exact: Further MR analysis showed that 20 of these plasma proteins, including UNC5D, IGFBP1, SCG3,
        ST3GAL6, and ST3GAL2 are affected by noisy workplace environments; TFF1, RBM39, ACYP2, STAT3,
        GRB2, CXCL1, EIF1AD, CSNK1G2, and CRKL that are affected by chemical fumes; ADCYAP1, NRSN1, TMEM132A,
        and CA10 that are affected by passive smoking; LILRB2, and TENM4 that are affected by diesel exhaust,
        are associated with the risk of at least one disease.
