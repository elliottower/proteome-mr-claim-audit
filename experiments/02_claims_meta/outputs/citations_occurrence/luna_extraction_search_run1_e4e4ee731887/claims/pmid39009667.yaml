claims:
  c000:
    quotes:
    - exact: Integrative analysis revealed that genetic variations in IBD, UC and CD affected the abundance
        of five (ERAP2, RIPK2, TALDO1, CADM2 and RHOC), three (VSIR, HGFAC and CADM2) and two (MST1 and
        FLRT3) cis-regulated plasma proteins, respectively (P < 0.05).
