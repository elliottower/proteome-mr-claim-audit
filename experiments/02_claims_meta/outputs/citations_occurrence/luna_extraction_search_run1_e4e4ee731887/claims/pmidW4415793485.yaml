claims:
  c000:
    quotes:
    - exact: Colocalization analysis revealed strong genetic overlap between glycine amide transferase(GATM）and
        cardiac arrest (PPH4=0.96).
  c001:
    quotes:
    - exact: pQTL MR analysis showed that elevated plasma GATM levels were associated with an increased
        risk of cardiac arrest (OR= 2.120, 95%CI 1.514-2.969, P Wald ratio =1.22E-05), consistent with
        eQTL findings.
  c002:
    quotes:
    - exact: pQTL MR analysis showed that elevated plasma GATM levels were associated with an increased
        risk of cardiac arrest (OR= 2.120, 95%CI 1.514-2.969, P Wald ratio =1.22E-05), consistent with
        eQTL findings.
  c003:
    quotes:
    - exact: Among cardiac arrest patients, higher blood mRNA expression of GATM correlated with worse
        cerebral performance category (CPC) scores.
  c004:
    quotes:
    - exact: Receiver operating characteristic (ROC) analysis further confirmed that GATM expression predicted
        poor neurological outcomes.
