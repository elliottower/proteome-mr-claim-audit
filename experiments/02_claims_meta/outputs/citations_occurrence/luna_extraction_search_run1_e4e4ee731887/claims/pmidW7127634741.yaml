        death model, with the reduction of Beclin 1 and LC3 expression and increased level of autophagy-related
        protective factor P62.
  c004:
    quotes:
    - exact: In the SD rat MI model, C4a silencing improved cardiac function and inhibited myocardial
        cell autophagy as well.
  c005:
    quotes:
