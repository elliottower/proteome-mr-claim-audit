  c017:
    quotes:
    - exact: To further validate this, we overexpressed C4a in hypoxic myocardial cells treated with STAT2
        agonist. The results indicated that STAT2 may directly regulated PF4 expression and further affect
        downstream inflammatory cytokines and autophagy proteins.
