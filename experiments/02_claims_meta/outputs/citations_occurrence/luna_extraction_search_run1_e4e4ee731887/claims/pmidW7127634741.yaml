claims:
  c000:
    quotes:
    - exact: The clinical blood samples from 376 AMI cases showed elevated levels of C4a in the serum
        of AMI patients, particularly pronounced in those with MI combined with heart failure.
  c001:
    quotes:
    - exact: The clinical blood samples from 376 AMI cases showed elevated levels of C4a in the serum
        of AMI patients, particularly pronounced in those with MI combined with heart failure.
  c002:
    quotes:
    - exact: Downregulation of C4a significantly inhibited cell autophagy and had no effect on other cell
        death model, with the reduction of Beclin 1 and LC3 expression and increased level of autophagy-related
        protective factor P62.
  c003:
