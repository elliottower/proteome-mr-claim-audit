  c006:
    quotes:
    - exact: Furthermore, compared to the group with only C4a overexpression, the simultaneous overexpression
        of C4a and PF4 (salvage experiment) resulted in a significant reduction in myocardial injury and
        attenuated inflammation and autophagy.
