claims:
  c000:
    quotes:
    - exact: 'Integrating the overlapping results of summary-data-based Mendelian randomisation of mQTL,
        eQTL and pQTL at the blood level with Bayesian co-localisation analysis, 3 cell death-related
        genes were identified as causally associated with TMD: TIE1 (Tier 1), IFI16 (Tier 1) and GATM
        (Tier 2).'
