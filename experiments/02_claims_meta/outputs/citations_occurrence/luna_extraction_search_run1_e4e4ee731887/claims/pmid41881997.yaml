claims:
  c000:
    quotes:
    - exact: Particularly, high FCRL6 expression is a promising biomarker for immune activation, underlined
        by the demethylation of FCRL6 and up-regulation of gene expression and plasma protein concentrations
        in CMV-seropositive PLHIV.
  c001:
    quotes:
    - exact: Host genetics-driven elevation in both gene and protein expression of FCRL6 was also associated
        with latent CMV infection.
  c002:
    quotes:
    - exact: Mendelian randomization analyses demonstrated a causal relationship between elevated FCRL6
        expression and CMV seropositivity.
