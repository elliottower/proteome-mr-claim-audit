claims:
  c000:
    quotes:
    - exact: CKD-stratified proteomic analysis identifies 574 plasma proteins significantly associated
        with probable sarcopenia (false discovery rate [FDR] < 0.05), led by COL6A3 (odds ratio [OR] =
        1.64, 95% confidence interval [CI] 1.47-1.84) and GDF15 (OR = 1.53, 95% CI 1.38-1.69), alongside
        COLEC12, TNFRSF1B, CD300E, ADM and CST3.
