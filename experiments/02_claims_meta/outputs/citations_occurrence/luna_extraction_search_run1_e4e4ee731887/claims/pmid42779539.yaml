claims:
  c000:
    quotes:
    - exact: Mendelian randomization analysis identified 46 plasma proteins with causal genetic evidence
        for AAA, of which 6 (IL6R [interleukin-6 receptor], PCSK9 [proprotein convertase subtilisin/kexin
        type 9], NFKB1 [nuclear factor kappa B subunit], MMP1 [matrix metalloproteinase-1], TIMD4 [T-cell
        immunoglobulin and mucin domain-containing 4], and SMPD1) were validated.
