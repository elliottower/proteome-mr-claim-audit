  c006:
    quotes:
    - exact: SMPD1 robustly colocalized with AAA susceptibility, an effect specifically mediated by ceramide
        (d18:1/16:0).
  c007:
    quotes:
    - exact: SMPD1 was upregulated in AAA mice and originated from adventitial fibroblasts.
  c008:
    quotes:
    - exact: Functional studies showed that SMPD1 promotes AAA by suppressing proliferation, inducing
        apoptosis/autophagy in endothelial cells and smooth muscle cells, amplifying inflammation, and
        promoting smooth muscle cell phenotypic switching.
