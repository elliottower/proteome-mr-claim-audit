    quotes:
    - exact: Eight circulating proteins (AMN, ESM1, KIR2DL2, PIGR, SPINT1, SPP1, TNFRSF6B, TMEM9) were
        identified as causally associated with ED based on two-sample MR and coloc colocalization criteria.
        Among these, five proteins (AMN, ESM1, KIR2DL2, PIGR, TNFRSF6B) satisfied SMR validation, while
        SPINT1, TMEM9, and SPP1 were excluded.
