claims:
  c000:
    quotes:
    - exact: This study reveals the causal associations between certain UKB pQTLs, BD pQTLs, and BCC,
        and identifies six BD pQTLs that mediate the effect of UKB pQTLs on BCC through STAT3 and GUCA1A
        as core mediator proteins, providing new genetic evidence for the precise stratification and targeted
        intervention of BCC.
