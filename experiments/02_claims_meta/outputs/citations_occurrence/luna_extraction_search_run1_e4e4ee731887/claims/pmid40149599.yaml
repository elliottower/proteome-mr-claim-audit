    - exact: A large-scale GWAS on proteomics (4907 circulatory protein) with 35,559 individuals was included
        as the exposure data; a GWAS with 138,086 ALS patients was used as the outcome data; we found
        that a high level of sex hormone-binding globulin (SHBG) is a risk factor by MR analysis.
