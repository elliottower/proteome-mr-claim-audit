claims:
  c000:
    quotes:
    - exact: 'After MR analysis and the Steiger test, we identified five proteins as potential therapeutic
        targets for AD. SMR analysis and colocalization analysis also confirmed our findings. Finally,
        we identified ASPN (OR = 1.36, 95% CI: 1.20, 1.54, p = 4.22 × 10-5) and SPOCK2 (OR = 0.57, 95%
        CI: 0.41, 0.78, p = 4.52 × 10-4) as the core therapeutic targets.'
