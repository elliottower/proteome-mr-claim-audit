claims:
  c000:
    quotes:
    - exact: Our findings indicate that N-palmitoyl glycine (PalGly) is linked to an increased risk of
        BrS and interacts with BrS-associated proteins, demonstrating moderate binding affinities for
        DCC, CR1, CTSB, NAAA, DEFB1, EPHA1, IGF1/IGFBP3/ALS, and LTA.
