claims:
  c000:
    quotes:
    - exact: 'We identified 21 protein-encoding genes causally associated with PD in Europeans and 8 in
        East Asians, with BST1 common to both (Europeans: OR=1.04, 95% CI 1.02-1.06; East Asians: OR=1.18,
        95% CI 1.10-1.27).'
  c001:
    quotes:
    - exact: 'We identified 21 protein-encoding genes causally associated with PD in Europeans and 8 in
        East Asians, with BST1 common to both (Europeans: OR=1.04, 95% CI 1.02-1.06; East Asians: OR=1.18,
        95% CI 1.10-1.27).'
  c002:
    quotes:
    - exact: Ancestry-specific associations included PRSS53 and TXNDC15 in Europeans, and HDGF , PM20D1
        , and TOP1 in East Asians. These findings highlighted ancestry-related differences in gene-protein-PD
        associations and have implications for biomarker development and targeted therapeutic strategies.
