  c005:
    quotes:
    - exact: Measuring OAS1 levels in 504 individuals, we found that higher plasma OAS1 levels in a non-infectious
        state were associated with reduced COVID-19 susceptibility and severity. Further analyses suggested
        that a Neanderthal isoform of OAS1 in individuals of European ancestry affords this protection.
