  c002:
    quotes:
    - exact: In up to 14,134 cases and 1.2 million controls, we found that an s.d. increase in OAS1 levels
        was associated with reduced COVID-19 death or ventilation (odds ratio (OR) = 0.54, P = 7 × 10-8),
