claims:
  c000:
    quotes:
    - exact: Our integrative study demonstrates that aging-induced SPARCL1 deficiency in brain endothelial
        cells causally contributes to VaD pathogenesis.
  c001:
    quotes:
    - exact: Importantly, reduced SPARCL1 expression was validated in BECs from post-mortem human brains
        of VaD patients, and external replication across independent pQTL datasets further corroborated
        its protective effect against VaD risk.
  c002:
    quotes:
    - exact: Importantly, reduced SPARCL1 expression was validated in BECs from post-mortem human brains
        of VaD patients, and external replication across independent pQTL datasets further corroborated
        its protective effect against VaD risk.
  c003:
    quotes:
    - exact: BECs with high SPARCL1 expression maintained a homeostatic transcriptional profile, whereas
        SPARCL1-low cells exhibited pronounced inflammatory signatures.
