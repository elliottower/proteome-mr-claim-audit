  c004:
    quotes:
    - exact: In our NAFLD clinical cohort, each biomarker individually showed promising diagnostic performance
        (THBS2 AUC = 0.867; NFASC AUC = 0.834; VWF AUC = 0.777; AKR1B10 AUC = 0.733), which was comparable
        to established non-invasive indicators.
