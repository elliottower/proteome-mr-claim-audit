  c003:
    quotes:
    - exact: Genetic variants associated with plasma levels of T1D-protective pancreatic enzymes such
        as CPA1 were enriched in cis-regulatory elements in pancreatic exocrine and gut enteroendocrine
        cells, and the protective effects of CPA1 and other enzymes on T1D were consistent when using
        instruments specific to acinar cells.
  c004:
    quotes:
    - exact: Finally, pancreatic enzymes had decreased acinar expression in T1D, including CPA1 which
        was altered prior to onset.
