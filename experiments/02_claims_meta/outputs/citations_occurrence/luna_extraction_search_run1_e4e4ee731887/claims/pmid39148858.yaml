claims:
  c000:
    quotes:
    - exact: We identified 23 proteins with evidence for a causal role in using pQTLs as genetic instruments
        in Mendelian Randomization which included multiple sensitivity analyses. Proteins increasing T1D
        risk were involved in immune processes (e.g. HLA-DRA) and, more surprisingly, T1D protective proteins
        were enriched in pancreatic secretions (e.g. CPA1), cholesterol metabolism (e.g. APOA1), and gut
        homeostasis.
