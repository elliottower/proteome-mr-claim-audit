claims:
  c000:
    quotes:
    - exact: Among them, ACOT8 was highly expressed specifically in renal tubular epithelial cells and
        showed a significant positive correlation with M1 macrophage infiltration.
  c001:
    quotes:
    - exact: Using an AAV9 vector with a kidney-specific promoter to knock down ACOT8 in tubular epithelial
        cells in a mouse model, we demonstrated that inhibiting ACOT8 significantly attenuated renal palmitate
        accumulation, reduced M1 macrophage infiltration, lowered serum pro-inflammatory cytokine levels,
        and improved renal function.
