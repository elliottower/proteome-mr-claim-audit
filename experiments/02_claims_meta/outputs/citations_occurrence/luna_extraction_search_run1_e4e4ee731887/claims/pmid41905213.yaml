  c005:
    quotes:
    - exact: In conclusion, this study demonstrates that ACOT8-mediated tubular palmitate accumulation
        promotes macrophage M1 polarization via the cGAS-STING pathway, thereby contributing to renal
        ischemia-reperfusion injury.
