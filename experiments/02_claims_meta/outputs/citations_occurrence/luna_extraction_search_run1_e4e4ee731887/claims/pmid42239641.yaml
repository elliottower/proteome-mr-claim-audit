claims:
  c000:
    quotes:
    - exact: Using Mendelian randomization and protein quantitative trait loci (pQTL) analysis, 2 functionally
        significant genetic variants [rs6677666 (WLS) and rs2272528 (COL4A4)] and 5 protein biomarkers
        (MMP12, EGF, Gal_9, GZMA, and ICOSLG) mechanistically linked to silicosis pathogenesis were identified.
