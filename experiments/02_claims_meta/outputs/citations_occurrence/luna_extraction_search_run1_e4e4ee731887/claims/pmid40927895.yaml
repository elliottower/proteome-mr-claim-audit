  c003:
    quotes:
    - exact: 'Among 445 unique proteins significantly linked to 18 cardiovascular metrics, LEP (RVEDV:
        β = -9.03, P = 2.76 × 10-51) and FABP4 (RVEDV: β = -10.18, P = 2.42 × 10-32) emerged as the strongest
        correlates of cardiac structure and function.'
