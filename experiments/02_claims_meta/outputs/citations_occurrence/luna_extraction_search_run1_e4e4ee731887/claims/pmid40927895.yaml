  c005:
    quotes:
    - exact: Two-sample Mendelian randomization analysis revealed 225 proteins causally linked to CVDs,
        with LPA showing the strongest coronary artery disease association (OR = 1.13 [1.10-1.17], P =
        2.38 × 10-15), many of which are targets of existing drugs, suggesting repurposing opportunities.
