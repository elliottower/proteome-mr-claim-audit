claims:
  c000:
    quotes:
    - exact: For example, higher levels of genetically predicted ICAM1 (per unit of increase) were associated
        with an increased risk of luminal B/HER2-negative-like cancer (OR = 1.06, 95% CI = 1.03-1.08,
        BH-FDR = 2.43 × 10-4) while inversely associated with triple-negative breast cancer with borderline
        significance (OR = 0.97, 95% CI = 0.95-0.99, BH-FDR = 0.065, Pheterogeneity < 0.005).
