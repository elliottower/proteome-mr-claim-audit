claims:
  c000:
    quotes:
    - exact: 'Using protein quantitative trait loci (pQTL) data from the SCALLOP consortium, involving
        meta-analysis of up to 26,494 individuals, and COVID-19 genome-wide association data from the
        Host Genetics Initiative, we performed MR for 157 COVID-19 severity protein biomarkers. We identified
        significant MR results for five proteins: FAS, TNFRSF10A, CCL2, EPHB4 and LGALS9.'
