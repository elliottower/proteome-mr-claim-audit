  c006:
    quotes:
    - exact: 'Five plasma proteins showed significant causal effects on these antibody responses: UBC,
        TIMD4, and NEFL (linked to EBV EA-D), and TMEM70 and HIF1A (linked to HSV-1 IgG). Mediation analysis
        revealed that antibody responses explained 9.2 %-13.2 % of the total effects of these proteins
        on UC risk.'
