claims:
  c000:
    quotes:
    - exact: Forward MR analysis using UKB-PPP cis-pQTL data identified 45 CA-associated proteins (23
        protective, 22 risk-related; FDR < 0.05), with no reverse causality observed. Five proteins-PARP1,
        SDCCAG8, FST, FOLH1, and NCAN-were prioritized through MR (FDR < 0.05), colocalization analysis
        (PP.H4 > 0.50), and SMR analysis with HEIDI filtering (p_SMR < 0.05; p_HEIDI > 0.05).
