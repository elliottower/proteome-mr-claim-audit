claims:
  c000:
    quotes:
    - exact: 152 CpG sites near 28 ovarian genes (72 risk sites, 80 protective sites),14 CpG sites near
        2 granulosa genes (PER3, RUNX3) (7 risk sites, 7 protective sites) were associated with menopausal
        age. PDCD6IP is a protective factor at both gene and protein levels, while INPP5B exhibits protective
        effects at both methylation and protein levels.
