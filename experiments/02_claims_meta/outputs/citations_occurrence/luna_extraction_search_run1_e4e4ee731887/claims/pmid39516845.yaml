claims:
  c000:
    quotes:
    - exact: In plasma protein cis-pQTL data from two cohorts, an increase in one standard deviation in
        PLA2R1 (OR = 2.01, 95%CI = 1.83-2.21), AIF1 (OR = 9.04, 95%CI = 4.69-17.41), MLN (OR = 3.79, 95%CI
        = 2.12-6.78), and NFKB1 (OR = 29.43, 95%CI = 7.73-112.0) was associated with an increased risk
        of MN.
