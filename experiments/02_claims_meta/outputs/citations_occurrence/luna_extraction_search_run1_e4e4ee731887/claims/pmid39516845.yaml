  c004:
    quotes:
    - exact: Additionally, in plasma protein cis-pQTL data, a standard deviation increase in FCGR3B (OR
        = 1.15, 95%CI = 1.09-1.22) and BTN3A1 (OR = 4.05, 95%CI = 2.65-6.19) correlated with elevated
        IgAN risk, while AIF1 (OR = 0.58, 95%CI = 0.46-0.73) exhibited IgAN protection.
