claims:
  c000:
    quotes:
    - exact: We found 27 core proteins had genetic evidence of causality for type 1 diabetes. Top hits
        included immune checkpoints (PDCD1, CD5, TIGIT, and LAG3) and innate immune system proteins (NCR1
        and KLRB1).
