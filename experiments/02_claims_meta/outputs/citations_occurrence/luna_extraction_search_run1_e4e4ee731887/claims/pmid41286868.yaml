claims:
  c000:
    quotes:
    - exact: Eleven proteins showed significant associations with COPD risk in the discovery stage (FDR
        < 0.05), including risk-enhancing MST1, TIE1, and PILRA, and protective ERAP2, PILRB, SERPING1,
        SNX1, IL17RD, STARD5, IL27RA, and TNFRSF6B.
