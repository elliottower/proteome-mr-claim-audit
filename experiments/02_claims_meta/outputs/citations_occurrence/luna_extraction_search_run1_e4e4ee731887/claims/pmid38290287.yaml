    quotes:
    - exact: 'Nine proteins were modified by the intervention: glycoprotein Nmb; furin; Wnt inhibitory
        factor 1; toll-like receptor 3; pancreatic prohormone; erb-b2 receptor tyrosine kinase 2; hepatocyte
        growth factor; endothelial cell specific molecule 1 and Ret proto-oncogene (Holm corrected P-value
        <0.05).'
