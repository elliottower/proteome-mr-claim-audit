  note: abstract text exactly as sent to the extractor
claims:
  c000:
    quotes:
    - exact: Two-sample Mendelian randomisation (MR) analyses in East Asians using cis-protein quantitative
        trait locus (cis-pQTLs) identified in GWAS find 30/2 proteins significantly affect levels of BMI/WC,
        respectively, with 10 showing evidence of colocalisation, and seven (inter-alpha-trypsin inhibitor
        heavy chain H3, complement factor B, EGF-containing fibulin-like extracellular matrix protein
        1, thioredoxin domain-containing protein 15, alpha-2-antiplasmin, fibronectin, mimecan) are replicated
        in separate MR using different cis-pQTLs identified in Europeans.
