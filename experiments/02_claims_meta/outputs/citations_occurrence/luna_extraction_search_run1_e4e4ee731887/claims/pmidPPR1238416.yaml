claims:
  c000:
    quotes:
    - exact: Serum amyloid A1 (SAA1) emerged as the most strongly increased protein in the acute phase.
  c001:
    quotes:
    - exact: Validation through independent immunoassays confirmed robust serum amyloid A elevations at
        disease onset relative to the one-year recovery phase, healthy controls, and relevant post-infectious
        and neuromuscular disease controls (acute disseminated encephalomyelitis and myasthenia gravis),
        underscoring a peripheral nerve-specific inflammatory response.
  c002:
    quotes:
    - exact: Furthermore, unexpected elevations of cardiac troponin T (cTnT) were observed at disease
        onset.
  c003:
    quotes:
    - exact: Clinical validation using high-sensitivity assays demonstrated that cTnT exceeded the diagnostic
        99  th percentile upper reference limit in 25.5% of acute Guillain-Barré syndrome patients.
  c004:
    quotes:
    - exact: A similarly high frequency of elevation in the myasthenia gravis disease control group (42.1%)
        suggests these increases predominantly reflect neuromuscular damage rather than myocardial injury.
  c005:
    quotes:
    - exact: Finally, Mendelian randomisation provided causal genetic evidence linking specific systemic
        proteins to disease susceptibility, identifying robust roles for SERPING1 (plasma protease C1
        inhibitor), CNDP1 (an antioxidant protein), and CRISPLD2 (a lipopolysaccharide-binding protein
        that regulates endotoxin function).
