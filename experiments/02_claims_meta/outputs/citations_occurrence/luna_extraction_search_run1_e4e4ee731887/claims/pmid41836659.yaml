  c007:
    quotes:
    - exact: 'External validation partially confirmed these associations: LIMA1, CTSS, FOXO3, KLC1, and
        MMP16 replicated in the Fenland study; ADAM22 and CTSS replicated in UKB-PPP; MMP16 and CTSS expression
        in specific brain tissues replicated using GTEx brain eQTLs.'
