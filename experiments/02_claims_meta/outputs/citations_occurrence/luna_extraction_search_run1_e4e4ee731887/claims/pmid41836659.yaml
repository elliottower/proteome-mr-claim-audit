claims:
  c000:
    quotes:
    - exact: 'In the primary analysis, genetically predicted levels of seven plasma proteins were significantly
        associated with SCZ risk: ADAM22 (OR = 0.85, P = 8.97×10-7), LIMA1 (OR = 0.43, P = 1.28×10-5),
        CTSS (OR = 1.27, P = 9.18×10-7), FOXO3 (OR = 2.80, P = 6.05×10-6), IRF3 (OR = 2.09, P = 1.15×10-6),
        KLC1 (OR = 2.17, P = 3.38×10-¹¹), and MMP16 (OR = 2.00, P = 1.60×10-5).'
