  note: abstract text exactly as sent to the extractor
claims:
  c000:
    quotes:
    - exact: 'We performed a proteome-wide cis-pQTL Mendelian randomization (MR) screen of uterine leiomyoma
        using plasma protein quantitative trait loci, followed by multi-layer in-silico triangulation:
        colocalization of all FDR-significant proteins against two independent leiomyoma GWAS (FinnGen
        R12 and Kim et al. 2025), a colocalization prior-sensitivity grid, summary-data-based MR (SMR),
        reverse MR, cross-platform replication (deCODE/INTERVAL SomaScan), blood cis-eQTL MR (eQTLGen),
        a phenome-wide safety scan, tissue differential expression (fibroid vs myometrium), endometriosis-specificity
        colocalization, and cross-ancestry direction concordance. Six proteins (PARP1, ITGA11, RSPO3,
        EIF2AK3, WNT9A, FSHB) colocalized (PP4 > 0.8) in both outcome cohorts and are nominated as druggable
        candidates.'
