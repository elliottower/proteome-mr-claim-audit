claims:
  c000:
    quotes:
    - exact: 'We found that a 1 SD increase in circulating S100 calcium binding protein A3 (S100A3) levels
        correlated with a reduced PAH risk (OR: 0.073, 95% CI: 0.020-0.267; p = 0.00799).'
  c001:
    quotes:
    - exact: 'We found that a 1 SD increase in circulating S100 calcium binding protein A3 (S100A3) levels
        correlated with a reduced PAH risk (OR: 0.073, 95% CI: 0.020-0.267; p = 0.00799). Sensitivity
        analyses including various cis-SNPs, provided consistent estimates for S100A3 (inverse variance
        weighted (IVW) OR: 0.085, 95% CI: 0.032-0.225; p = 7.5 × 10-7 and MR-Egger OR: 0.212, 95% CI:
        0.013-3.376; p = 0.387).'
  c002:
    quotes:
    - exact: 'We found that a 1 SD increase in circulating S100 calcium binding protein A3 (S100A3) levels
        correlated with a reduced PAH risk (OR: 0.073, 95% CI: 0.020-0.267; p = 0.00799). Sensitivity
        analyses including various cis-SNPs, provided consistent estimates for S100A3 (inverse variance
        weighted (IVW) OR: 0.085, 95% CI: 0.032-0.225; p = 7.5 × 10-7 and MR-Egger OR: 0.212, 95% CI:
        0.013-3.376; p = 0.387).'
  c003:
    quotes:
    - exact: Transcriptomic investigations further highlighted S100A3's protective role in CHD-PAH.
