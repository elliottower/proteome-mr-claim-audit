claims:
  c000:
    quotes:
    - exact: We found 15 proteins that causally mediate the association between polygenic risk and IS
        (Fig. 2). The identified proteins are involved in cell adhesion (e.g. CD34, CD48, PODXL), inflammatory
        pathways (e.g. CD28, CD300A, NCR1), angiogenesis (FGF5, MET), and protein glycosylation (GALNT10,
        GCNT1), influencing vascular integrity, immune response, and blood vessel formation.
