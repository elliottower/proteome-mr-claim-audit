claims:
  c000:
    quotes:
    - exact: Six plasma proteins (COLGALT1, CLMP, LECT1, ITIH1, CDHR3, CPLX2) were negatively correlated
        with kidney stone risk, while the genetic overexpression of 16 target proteins (GJA1, STOM, IRF9,
        F9, TMPRSS11D, ADH1B, SPINK13, CRYBB2, TNS2, DOCK9, OXSM, MST1, IL2, LMAN2, ITIH3, KLRF1) increased
        the risk of kidney stones.
