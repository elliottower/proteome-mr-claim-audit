claims:
  c000:
    quotes:
    - exact: Then, we used cis-genetic variants to proxy the causal effect of some of these T2D-influenced
        circulating proteins and found that, collectively, five proteins (INHBC, GNPTG, LPO, AGRN, and
        CTSD) affected three kidney traits (blood urea nitrogen [BUN], estimated glomerular filtration
        rate [eGFR] and CKD risk) based on GWAS with up to 1,004,040 participants.
