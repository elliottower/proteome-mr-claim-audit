  c013:
    quotes:
    - exact: Notably, we found that higher levels of circulating INHBC protein were estimated to lead
        to a lower eGFR and higher BUN based on MR analyses.
  c014:
    quotes:
    - exact: Notably, we found that higher levels of circulating INHBC protein were estimated to lead
        to a lower eGFR and higher BUN based on MR analyses.
  c015:
    quotes:
    - exact: In observational analyses, increased circulating INHBC levels were associated with increased
        hazard for kidney disease diagnosis in 37,854 UK Biobank participants.
  c016:
    quotes:
    - exact: We estimated that circulating INHBC levels mediate 1.3% (95% confidence interval [0.85%,
        1.9%]) of the association between T2D and kidney disease diagnosis.
