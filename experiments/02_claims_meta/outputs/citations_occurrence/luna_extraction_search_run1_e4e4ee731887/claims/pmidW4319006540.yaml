claims:
  c000:
    quotes:
    - exact: Previously reported biomarkers were found to mediate risk of early-onset IS including ABO
        (OR all stroke =1.10 per SD increase in genetically predicted levels; 95% CI, 1.05-1.15; P=2.8x10
        -5 ) and MMP12 (OR all stroke =0.87; 95% CI, 0.82-0.93; P=2.1x10 -5 ).
  c001:
    quotes:
    - exact: Previously reported biomarkers were found to mediate risk of early-onset IS including ABO
        (OR all stroke =1.10 per SD increase in genetically predicted levels; 95% CI, 1.05-1.15; P=2.8x10
        -5 ) and MMP12 (OR all stroke =0.87; 95% CI, 0.82-0.93; P=2.1x10 -5 ).
  c002:
    quotes:
    - exact: 'In addition, at Bonferroni significance, we identified two new mediators of early IS: vascular
        endothelial growth factor 2 (KDR ; OR small artery occlusion =1.94; 95% CI,1.6-2.4; P=2.1x10 -9
        ) and urokinase-type plasminogen activator (PLAU; OR undetermined stroke =3.08; 95% CI,1.9-5.2;
        P=1.3x10 -5 ).'
  c003:
    quotes:
    - exact: 'In addition, at Bonferroni significance, we identified two new mediators of early IS: vascular
        endothelial growth factor 2 (KDR ; OR small artery occlusion =1.94; 95% CI,1.6-2.4; P=2.1x10 -9
        ) and urokinase-type plasminogen activator (PLAU; OR undetermined stroke =3.08; 95% CI,1.9-5.2;
        P=1.3x10 -5 ).'
  c004:
    quotes:
    - exact: 'In addition, at Bonferroni significance, we identified two new mediators of early IS: vascular
        endothelial growth factor 2 (KDR ; OR small artery occlusion =1.94; 95% CI,1.6-2.4; P=2.1x10 -9
        ) and urokinase-type plasminogen activator (PLAU; OR undetermined stroke =3.08; 95% CI,1.9-5.2;
        P=1.3x10 -5 ). Genetically predicted levels of these proteins were not significantly associated
        with late-onset IS (> 65 years), and MR effect estimates differed significantly between early
        vs. late-onset IS for KDR (I 2 =96; heterogeneity P=9.7x10 -7 ) and PLAU (I 2 =85; het. P=0.01).'
