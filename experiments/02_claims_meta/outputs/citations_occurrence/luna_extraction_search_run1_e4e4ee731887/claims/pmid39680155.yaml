  c008:
    quotes:
    - exact: Genetic correlation analysis revealed significant positive genetic correlations between LMAN2
        and urolithiasis (rg = 1.12, P = 8.11e-11), while NUCKS1 (rg = - 0.60, P = 3.10e-03) and L3MBTL3
        (rg = - 0.38, P = 1.20e-03) showed strong negative correlations.
