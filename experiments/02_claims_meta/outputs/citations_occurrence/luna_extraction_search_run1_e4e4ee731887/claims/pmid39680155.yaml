claims:
  c000:
    quotes:
    - exact: LMAN2 was positively associated with urolithiasis risk (SMR b = 0.842, FDR < 0.05), with
        evidence that increased LMAN2 expression elevates stone formation likelihood, supported by findings
        from DNA methylation and protein level analyses.
  c001:
    quotes:
    - exact: LMAN2 was positively associated with urolithiasis risk (SMR b = 0.842, FDR < 0.05), with
        evidence that increased LMAN2 expression elevates stone formation likelihood, supported by findings
        from DNA methylation and protein level analyses.
  c002:
    quotes:
    - exact: Conversely, NUCKS1 and L3MBTL3 exhibited protective effects, with NUCKS1 expression negatively
        associated with urolithiasis and supported by methylation at the cg12081870 site.
  c003:
    quotes:
    - exact: Conversely, NUCKS1 and L3MBTL3 exhibited protective effects, with NUCKS1 expression negatively
        associated with urolithiasis and supported by methylation at the cg12081870 site.
  c004:
    quotes:
    - exact: Bayesian colocalization analysis showed strong shared genetic bases for NUCKS1 and L3MBTL3
        with urolithiasis, with further multivariable MR confirming these associations were independent
        of BMI, smoking, alcohol consumption, and serum calcium levels.
