claims:
  c000:
    quotes:
    - exact: Mendelian randomisation (MR) analysis supported causality since genetically predicted levels
        of SOST (Sclerostin), CCDC80 (Coiled-coil domain-containing protein 80), NT-proBNP (N-terminal
        prohormone brain natriuretic peptide), and BNP (Brain natriuretic peptide) were associated with
        risk of hip fracture.
