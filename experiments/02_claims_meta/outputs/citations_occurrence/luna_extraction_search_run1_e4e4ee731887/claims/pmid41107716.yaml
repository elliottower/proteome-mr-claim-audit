claims:
  c000:
    quotes:
    - exact: Eighty-three UKB plasma proteins were causally associated with osteoporosis (FDR < 0.01),
        including known regulators (e.g.,GALNT3, IL18, IL7R) and novel candidates (e.g., NUDT2,SMOC2).
