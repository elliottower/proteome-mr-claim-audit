  c009:
    quotes:
    - exact: Two-step MR analyses revealed that NT5C, BOLA1, GREM1, and CCL19 significantly mediated the
        effects of upstream UKB proteins on osteoporosis, with mediation proportions ranging from 3.93%
        to 17.95%, supporting multi-tiered protein-to-protein causal pathways.
