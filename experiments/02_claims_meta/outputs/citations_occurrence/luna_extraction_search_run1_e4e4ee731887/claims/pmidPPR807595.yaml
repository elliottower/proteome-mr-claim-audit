claims:
  c000:
    quotes:
    - exact: Sex-specific analyses revealed additional 412 female-exclusive and 37 male-exclusive proteins
        and distinct CAD-risk pathways were identified for women (e.g., innate immune response) and men
        (e.g., tube morphogenesis (angiogenesis)). Translation toward druggability on targets with causal
        evidence revealed sex-specific clinical drug candidates such as C1S (men) and FOXO1 (women).
