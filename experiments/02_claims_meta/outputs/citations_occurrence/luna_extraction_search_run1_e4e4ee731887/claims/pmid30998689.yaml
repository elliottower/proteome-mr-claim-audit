claims:
  c000:
    quotes:
    - exact: Genetic correlation analysis confirmed known epidemiological associations between VVs and
        deep venous thrombosis, weight, rough labor, and standing job, and found a genetic overlap with
        multiple traits that have not been previously suspected to share common genetic background with
        VVs. These traits included educational attainment, fluid intelligence and prospective memory scores,
        walking pace (negative correlation with VVs), smoking, height, number of operations, pain, and
        gonarthrosis (positive correlation with VVs). Finally, Mendelian randomization analysis provided
        evidence for causal effects of plasma levels of MICB and CD209 proteins, and anthropometric traits
        such as waist and hip circumference, height, weight, and both fat and fat-free mass.
