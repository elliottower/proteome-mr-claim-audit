claims:
  c000:
    quotes:
    - exact: 'We identified 377 serum proteins that were associated with the primary endpoint in ATMOSPHERE
        and replicated 167 in PARADIGM-HF. Prognostic proteins included known HF biomarkers such as Growth
        Differentiation Factor 15, NT-BNP, and Angiopoietin-2, and also a previously unrecognized HF biomarker:
        Sushi, Von Willebrand Factor Type A, EGF and Pentraxin Domain Containing 1 (SVEP1, HR 1.60 [95%
        CI 1.44-1.79] per standard deviation [SD], p=2×10 −17 ).'
