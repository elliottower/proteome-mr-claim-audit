claims:
  c000:
    quotes:
    - exact: 'Two immunoglobulin domain proteins significantly (Bonferroni p < 0.05) mediated endotoxin
        effects on lung function change: Epididymis luminal protein 180 (HEL180) and IGL c3728_light_IGKV4-1_IGKJ1
        (IGL c3728), with 46.4% (p = 0.04) and 46.9% (p = 0.05) proportion of the total effect that was
        mediated.'
  c001:
    quotes:
    - exact: 'Two immunoglobulin domain proteins significantly (Bonferroni p < 0.05) mediated endotoxin
        effects on lung function change: Epididymis luminal protein 180 (HEL180) and IGL c3728_light_IGKV4-1_IGKJ1
        (IGL c3728), with 46.4% (p = 0.04) and 46.9% (p = 0.05) proportion of the total effect that was
        mediated.'
  c002:
    quotes:
    - exact: 'MR estimates demonstrated that every 2-fold decrease in HEL180 and IGL c3728 expression
        was associated with an FEV-1 decline of 1.90 ml/year (95% CI: [0.79, 3.02]) and 2.36 ml/year (95%
        CI: [1.68, 3.02]), respectively.'
  c003:
    quotes:
    - exact: 'MR estimates demonstrated that every 2-fold decrease in HEL180 and IGL c3728 expression
        was associated with an FEV-1 decline of 1.90 ml/year (95% CI: [0.79, 3.02]) and 2.36 ml/year (95%
        CI: [1.68, 3.02]), respectively.'
