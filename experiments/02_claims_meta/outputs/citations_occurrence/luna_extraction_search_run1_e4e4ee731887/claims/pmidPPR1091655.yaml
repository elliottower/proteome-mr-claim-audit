claims:
  c000:
    quotes:
    - exact: MR analysis identified CLEC1B (chronic lymphocytic leukemia) and IGFLR1 (chronic myeloid
        leukemia) as significant causal genes (P<0.05).
  c001:
    quotes:
    - exact: MR analysis identified CLEC1B (chronic lymphocytic leukemia) and IGFLR1 (chronic myeloid
        leukemia) as significant causal genes (P<0.05).
  c002:
    quotes:
    - exact: Cell experiments confirmed that silencing CLEC1B inhibited CLL cell proliferation and promoted
        apoptosis (P<0.05), and silencing IGFLR1 significantly inhibited CML cell proliferation, promoted
        apoptosis, and suppressed CML cell invasion (P<0.05).
