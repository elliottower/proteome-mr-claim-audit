claims:
  c000:
    quotes:
    - exact: Two-sample Mendelian randomization (MR) identifies 21 and 9 plasma proteins for MI and AF,
        respectively (FDR P<0.05), with plasminogen (PLG) being a commonly protective factor against both
        diseases.
  c001:
    quotes:
    - exact: Two-sample Mendelian randomization (MR) identifies 21 and 9 plasma proteins for MI and AF,
        respectively (FDR P<0.05), with plasminogen (PLG) being a commonly protective factor against both
        diseases.
  c002:
    quotes:
    - exact: Multi-trait MR suggests that PLG is also protective against coronary atherosclerosis.
  c003:
    quotes:
    - exact: PheWAS analysis identifies associations of six cis-pQTLs with both MI and AF, i.e., rs11751347
        (PLG), rs11591147 (PCSK9), rs77347777 (ITIH4), rs936228 (ULK3), rs2261033 (AIF1V), and rs2711897
        (BDH2).
