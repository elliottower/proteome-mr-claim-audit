claims:
  c000:
    quotes:
    - exact: Proteins involved in inflammation and tissue remodeling, such as follistatin and cathepsin
        D, are strongly and independently associated with family history of early-onset CHD, indicating
        novel pathophysiological mechanisms of these proteins in familial disease.
  c001:
    quotes:
    - exact: Proteins involved in inflammation and tissue remodeling, such as follistatin and cathepsin
        D, are strongly and independently associated with family history of early-onset CHD, indicating
        novel pathophysiological mechanisms of these proteins in familial disease.
  c002:
    quotes:
    - exact: 18 proteins were statistical interactors with family history in the association between each
        protein and the coronary atherosclerotic burden, most notably the LDL-receptor, transferrin receptor
        protein 1 and platelet endothelial cell adhesion molecule 1 (PECAM1).
  c003:
    quotes:
    - exact: 18 proteins were statistical interactors with family history in the association between each
