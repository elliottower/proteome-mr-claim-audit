claims:
  c000:
    quotes:
    - exact: 'We implicated 16 proteins as potentially causal for lung function (p<1.71×10-5): seven proteins
        have not been implicated by previous lung function GWAS or MR (CCND2, DTD1, PILRA, PTPRK, TDRKH,
        GRHPR, NUDT5), and we provide corroborative evidence for 10 proteins.'
