claims:
  c000:
    quotes:
    - exact: Based on our results, we first identified and validated GNLY as a novel cis-eQTL and cis-pQTL-mediated
        susceptibility gene for reducing prostatitis risk in five independent datasets (one discovery
        dataset and four validation datasets) (all p <0.05).
  c001:
    quotes:
    - exact: Meanwhile, we also found that the GNLY eQTL could increase the metabolite of sphingomyelin
        level (d18:0/20:0, d16:0/22:0) risks (p <0.05), and the metabolite of sphingomyelin level (d18:0/20:0,
        d16:0/22:0) could reduce the risk of prostatitis (p <0.05).
  c002:
    quotes:
    - exact: Meanwhile, we also found that the GNLY eQTL could increase the metabolite of sphingomyelin
        level (d18:0/20:0, d16:0/22:0) risks (p <0.05), and the metabolite of sphingomyelin level (d18:0/20:0,
        d16:0/22:0) could reduce the risk of prostatitis (p <0.05).
