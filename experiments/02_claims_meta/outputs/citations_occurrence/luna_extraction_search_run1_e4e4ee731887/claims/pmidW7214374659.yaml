claims:
  c000:
    quotes:
    - exact: 'This record replaces 10.5281/zenodo.22948358 and adds: (i) the unrestricted cis-plus-trans
        pQTL MR tables, which show that trans instruments produce the largest apparent effects; (ii) UK
        Biobank C44 side colocalization for CTSS as well as ASIP; (iii) a pigmentation-trait layer (ASIP-pQTL
        colocalization with eight pigmentation traits across four windows and four prior settings, with
        negative controls, and pigmentation-phenotype Mendelian randomization with heterogeneity, MR-Egger,
        weighted median and leave-one-out sensitivity analyses); (iv) Steiger directionality tests; and
        (v) a versioning note: results/superseded_pre_fix/ holds the tables produced before the FinnGen
        column-order fix, with a README explaining why they must not be used.'
  c001:
