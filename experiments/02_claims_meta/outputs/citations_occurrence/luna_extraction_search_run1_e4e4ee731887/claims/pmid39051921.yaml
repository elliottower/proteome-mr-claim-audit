claims:
  c000:
    quotes:
    - exact: 'After integrating multiomics evidence from expression quantitative trait loci (eQTL) and
        protein quantitative trait loci (pQTL), the authors found that tier 1: RELT [odds ratio (OR):
        0.14, 95% CI: 0.04-0.50], TNFSF12 (OR: 1.24, 95% CI: 1.24-1.43), tier 3: ICAM5 (OR: 0.89, 95%
        CI: 0.82-0.96), and ERAP2 (OR: 1.07, 95% CI: 1.02-1.12) were associated with the risk of IAs;
        tier 3: RELT (OR: 0.11, 95% CI: 0.02-0.54), ERAP2 (OR: 1.08, 95% CI: 1.02-1.13), and TNFSF12 (OR:
        1.24, 95% CI: 1.05-1.47) were associated with the risk of aneurysmal subarachnoid hemorrhage (aSAH);
        and tier 1: RELT (OR: 0.04, 95% CI: 0.01-0.30) was associated with the risk of unruptured intracranial
        aneurysms (uIAs).'
