  c000:
    quotes:
    - exact: At circulating protein level, genetically predicted higher levels of HSPA1A (odds ratio [OR]
        0.28, 95% confidence interval [CI] 0.19-0.41, P < 0.001), HSPA1B (OR 0.13, 95% CI 0.06-0.27, P
        < 0.001), and NFKB1 (OR 0.43, 95% CI 0.27-0.68, P < 0.001) were inversely associated with AMD
        risk.
