  c000:
    quotes:
    - exact: Of these, eleven genes reached significance across all three layers, including  SNCA, MAPT,
        and  CTSB significant in both sexes;  CD160, GPNMB, and  LRRC37A2 as male-predominant;  STX4 and  PRSS53
        as female-predominant; and  BST1, SCARB2, and  LGALS3 significant only in sex-combined analysis.
