  c003:
    quotes:
    - exact: Higher midlife circulating CXCL10 levels were associated with a larger number of cardiovascular
        events over 20 years, whereas higher CXCL10 expression in human atherosclerotic lesions correlated
        with a larger lipid core and a transcriptomic profile reflecting immune cell infiltration, adaptive
        immune system activation, and cytokine signaling.
