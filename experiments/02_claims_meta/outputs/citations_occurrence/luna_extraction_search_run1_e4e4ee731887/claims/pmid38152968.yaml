claims:
  c000:
    quotes:
    - exact: Among the 70 significant proteins, genetically proxied circulating levels of CXCL10 (C-X-C
        motif chemokine ligand 10) were associated with risk of coronary artery disease, large artery
        atherosclerotic stroke, and peripheral artery disease, with up to 67% of the effects of genetically
        downregulated IL-6 signaling on these end points mediated by decreases in CXCL10.
