claims:
  c000:
    quotes:
    - exact: Phenotype association analysis of the lead variant rs5011432_C at the TMEM106B locus revealed
        associations not only with increased risk of three ASCVDs, but also with elevated adverse factors
        and reduced protective factors.
  c001:
    quotes:
    - exact: Subsequent proteome-wide Mendelian randomisation (MR) analysis using plasma pQTL data from
        the ARIC study(Hicks et al., 2021) provided consistent evidence for causal protective roles of
        TMEM106B on the three ASCVDs and multiple related risk traits.
  c002:
    quotes:
    - exact: Data from the ATHERO-Express database(Verhoeven et al., 2004) further demonstrated that higher
        TMEM106B expression is negatively associated with plaque vulnerability index, and with features
        indicative of plaque instability, such as intraplaque haemorrhage and lipid-rich areas.
