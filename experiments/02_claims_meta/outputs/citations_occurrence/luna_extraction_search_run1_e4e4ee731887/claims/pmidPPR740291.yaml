claims:
  c000:
    quotes:
    - exact: We observed that a higher protein level of ABO showed a putative causal effect on venous
        complications and haemorrhoids in pregnancy (OR = 1.207, 95%CI = 1.107-1.316, colocalization probability
        = 91.3%), which was validated by using pQTLs from Fenland and INTERVAL.
