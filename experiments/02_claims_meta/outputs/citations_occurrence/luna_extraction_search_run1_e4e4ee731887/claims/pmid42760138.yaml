  c001:
    quotes:
    - exact: 'Higher genetically predicted GLP-1R expression was associated with a lower risk of idiopathic
        pulmonary fibrosis on inverse-variance weighted analysis (odds ratio = 0.740, 95% confidence interval:
        0.632-0.866, p = 1.83 × 10-4). The positive-control analysis supported the biological coherence
        of the GLP1R expression proxy (type 2 diabetes mellitus, odds ratio = 0.630).'
