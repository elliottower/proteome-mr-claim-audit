claims:
  c000:
    quotes:
    - exact: MR analysis showed that plasma proteins ASPSCR1 [OR=0.678, 95%CI (0.544, 0.847)] and C1QTNF5
        [OR=0.526, 95%CI (0.367, 0.752)] had a protective effect on RLS; plasma proteins KRT19 [OR=1.769,
        95%CI (1.283, 2.439)] and LAT2 [OR=5.536, 95%CI (2.206, 13.893)] were associated with the increased
        risk of RLS.
