claims:
  c000:
    quotes:
    - exact: In GWAS data, genetically altered concentration of 27 protein biomarkers was associated with
        eGFR (P < 9.5 x 10-5). UMOD was the strongest signal, a positive control of the analysis.
  c001:
    quotes:
    - exact: Novel biomarker associations with eGFR include interesting biological candidates such as
        inhibin beta chain C, a subunit of activins, and proteinase-3, the antigen in PR3-ANCA vasculitis.
