  c005:
    quotes:
    - exact: Cross-sectional analyses showed 5 of the 13 proteins (EPHA2 [ephrin type-A receptor 2], METAP1D
        [methionine aminopeptidase 1D, mitochondrial], FLT4 [vascular endothelial growth factor receptor
        3], COL2A1, and TIMD4 [T-cell immunoglobulin and mucin domain-containing protein 4]) were associated
        with cognitive performance with effects concordant with their MR findings.
  c006:
    quotes:
    - exact: Survival analyses with the Fine-Gray models indicated that 5 of the 13 proteins (EPHA2, METAP1D,
        FLT4, APOE [apolipoprotein E], and PDE5A [cGMP-specific 3',5'-cyclic phosphodiesterase]) were
        associated with the risk of all-cause dementia or stroke independent of age and sex, consistent
        with their MR evidence.
