claims:
  c000:
    quotes:
    - exact: Our findings have confirmed the association between severe COVID-19 and multiple organ-related
        diseases, such as Hypothyroidism, strict autoimmune (HTCBSA), Thyroid disorders (TD), and Graves'
        disease (GD). And we have also identified certain proteins that are associated with organ-related
        diseases, such as Superoxide Dismutase 2 (SOD2) and TEK Receptor Tyrosine Kinase (TEK), which
        are also considered potential drug targets.
