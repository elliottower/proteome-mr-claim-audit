claims:
  c000:
    quotes:
    - exact: We identified GDF15, CDCP1, ADGRG1, GGT1, HGF, MFAP4, and THBS2 from 2923 plasma proteins
        and developed proteomic models to predict early cirrhosis and its complications occurring at 5,
        10, and over 10 years. These protein markers were validated to be associated with liver fibrosis
        in an external liver biopsy cohort.
