  c004:
    quotes:
    - exact: Remarkably, four proteins in this group (TBCA, ARL2, S100A13 and IRF6) were downregulated
        by APOE-ε4 yet upregulated as a consequence of LOAD as determined in a bi-directional Mendelian
        randomization analysis, reflecting a potential response to the disease onset. Accordingly, the
        direct association of these proteins to LOAD was reversed upon APOE-ε4 genotype adjustment, a
        finding which we replicate in an external cohort (n=719).
