  c005:
    quotes:
    - exact: Interestingly, two of them, namely APOF and PRSS8 with a high support for colocalization
        evidence with psoriasis, were detected in FinnGen and UK Biobank studies.
  c006:
    quotes:
    - exact: Interestingly, two of them, namely APOF and PRSS8 with a high support for colocalization
        evidence with psoriasis, were detected in FinnGen and UK Biobank studies.
  c007:
    quotes:
    - exact: Gene differentially expression analysis using bulk transcriptome data from 92 psoriatic and
        82 normal punch biopsies revealed elevated PRSS8 expression was linked to an increased risk of
        psoriasis.
  c008:
    quotes:
    - exact: Furthermore, single-cell RNA sequencing from 33 biopsy samples revealed that PRSS8 was higher
        expressed in psoriasis skin compared to healthy normal skin and psoriatic non-lesional skin in
        SERPINB4+ cells of the supraspinous layer of keratinocytes that were upregulated in psoriasis
        skin.
