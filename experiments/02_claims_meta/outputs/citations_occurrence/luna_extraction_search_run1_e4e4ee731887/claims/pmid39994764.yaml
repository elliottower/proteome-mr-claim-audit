  c021:
    quotes:
    - exact: 'SMAD2 and CREB3L4 gene expressions proxied with cis-expression quantitative trait loci are
        also significantly associated with the risk of prostate cancer in both consortiums and when combined
        with meta-analyses (SMAD2: OR 0.787, 95% CI 0.719-0.861, p-value = 1.00 × 10-4; CREB3L4: OR 1.219,
        95% CI 1.033-1.438, p-value = 0.019).'
