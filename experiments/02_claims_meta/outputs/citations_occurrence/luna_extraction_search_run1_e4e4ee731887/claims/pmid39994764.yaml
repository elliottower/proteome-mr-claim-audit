  c009:
    quotes:
    - exact: 'Among the identified proteins, the causal effects of six proteins including CREB3L4, HDGF,
        SERPINA3, TNFRSF6B, EIF4B, and SMAD2 remained significant in the replication analyses in the FinnGen
        consortium and when combined with meta-analyses (SMAD2: OR 0.710, 95% CI 0.578-0.873, p-value
        = 0.001; CREB3L4: OR 1.260, 95% CI 1.164-1.364, p-value < 0.0001; HDGF: OR 1.072, 95% CI 1.021-1.125,
        p-value = 0.005; SERPINA3: OR 1.138, 95% CI 1.091-1.187, p-value < 0.0001; TNFRSF6B: OR 0.656,
        95% CI 0.496-0.869, p-value = 0.003; EIF4B: OR 0.701, 95% CI 0.618-0.796, p-value < 0.0001).'
