claims:
  c000:
    quotes:
    - exact: Genetically proxied levels of 4 plasma proteins (CREB3L4, HDGF, SERPINA3, GNPNAT1) were identified
        as positively correlated with an increased risk of prostate cancer, while an increase in genetically
        proxied levels of 5 plasma proteins (TNFRSF6B, GSK3A, EIF4B, CLIC1, SMAD2) were significantly
        associated with a decreased risk of prostate cancer in the PRACTICAL consortium.
