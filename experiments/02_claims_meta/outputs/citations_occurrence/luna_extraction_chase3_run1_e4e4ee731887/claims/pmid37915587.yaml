  note: abstract text exactly as sent to the extractor
claims:
  c000:
    quotes:
    - exact: 'We found evidence to support the causal role of genetically predicted circulating levels
        on decreased risk of sepsis, including RANTES (OR = 0.920, 95% CI: 0.849-0.997, P = 0.041) and
        basic fibroblast growth factor (basic-FGF) (OR = 0.869, 95% CI: 0.766-0.986, P = 0.029). Additionally,
        MR analysis positive causal association of between beta-nerve growth factor (β-NGF) and sepsis
        (OR = 1.120, 95% CI: 1.037-1.211, P = 0.004). The results of MR-Egger, Weighted Median, Weighted
        Mode, and Simple Mode methods were consistent with the IVW estimates.'
