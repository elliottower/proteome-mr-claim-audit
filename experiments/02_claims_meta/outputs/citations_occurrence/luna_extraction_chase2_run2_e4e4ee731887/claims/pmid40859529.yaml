claims:
  c000:
    quotes:
    - exact: 'The MR analysis of the integrated GWAS and protein quantity trait loci data demonstrated
        that CCL27 and CXCL9 were causally associated with a higher risk of COVID-19 susceptibility (CCL27:
        odds ratio [OR]: 1.06, 95% confidence interval [CI]: 1.01-1.10, P = .015; CXCL9: OR: 1.04, 95%
        CI: 1.01-1.08, P = .023), while hepatocyte growth factor was causally linked to a lower risk of
        COVID-19 susceptibility (OR: 0.89, 95% CI: 0.83-0.96, P = .002).'
