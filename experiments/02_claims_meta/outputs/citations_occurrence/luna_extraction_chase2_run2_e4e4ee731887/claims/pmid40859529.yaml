  c003:
    quotes:
    - exact: 'In terms of hospitalization, the inverse variance weighted approach provided evidence to
        support that genetically predicted CXCL9 and interleukin-16 had negative associations with the
        risk of COVID-19 hospitalization (interleukin-16: OR: 0.92, 95% CI: 0.85-0.99, P = .034; CXCL9:
        OR: 0.85, 95% CI: 0.74-0.98, P = .043).'
