    - exact: 'Our results suggest that lower levels of macrophage-migration inhibitory factor (IVW estimate
        odds ratio [OR IVW] per SD genetic cytokines change: 0.641; 95% confidence interval [CI]: 0.427-0.964;
        p = 0.032) and higher levels of interleukin-2 receptor α (lL2Rα, 1.377, 95% CI: 1.006-1.883; p
        = 0.046) are associated with an increased risk of MPN.'
  c002:
    quotes:
    - exact: 'Genetically predicted MPN is related to increased levels of RANTES (IVW estimate β: 0.043,
        95% CI: 0.002-0.084; p = 0.039) and interleukin-10 (IVW estimate β: 0.030, 95% CI: 0.001-0.060;
        p = 0.041).'
