claims:
  c000:
    quotes:
    - exact: 'This study pinpointed several cytokines as key upstream influencers on the risk of CHD,
        including eotaxin (CCL11) (odds ratio [OR]: 1.10, 95% confidence interval [CI]: 1.03-1.18, P =
        .003), C-C motif chemokine ligand 20 (CCL20) (OR: 1.15, 95% CI: 1.05-1.25, P = .002), macrophage
        colony-stimulating factor 1 (CSF1) (OR: 1.09, 95% CI: 1.01-1.17, P = .020), Fibroblast growth
        factor 21 (FGF21) (OR: 1.14, 95% CI: 1.01-1.29, P = .038), Fms-related tyrosine kinase 3 ligand
        (FLT3LG) (OR: 1.26, 95% CI: 1.09-1.44, P = .001), neurotrophin-3 (NT-3) (OR: 1.12, 95% CI: 1.01-1.24,
        P = .026), and leukemia inhibitory factor (LIF) (OR: 0.89, 95% CI: 0.80-0.99, P = .029).'
