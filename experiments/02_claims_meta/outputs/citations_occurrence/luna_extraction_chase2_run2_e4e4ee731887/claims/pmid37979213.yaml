        p = 0.036).
  c003:
    quotes:
    - exact: 'Four inflammatory cytokines were found to be associated with an increased risk of PsA: vascular
        endothelial growth factor (VEGF) (OR = 1.161, 95 % CI = 1.057-1.275, p = 0.002); Interleukin 12p70
        (IL12p70) (OR = 1.189, 95 % CI = 1.049-1.346, p = 0.007); IL10 (OR = 1.216, 95 % CI = 1.024-1.444,
        p = 0.026); IL13 (OR = 1.159, 95 % CI = 1.05-1.28, p = 0.004).'
