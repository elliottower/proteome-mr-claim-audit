claims:
  c000:
    quotes:
    - exact: The results showed that macrophage colony-stimulating factor (MCSF) was associated with an
        increased risk of AS (OR = 1.163, 95 % CI = 1.016-1.33, p = 0.028).
  c001:
    quotes:
    - exact: Conversely, high levels of TRAIL and beta nerve growth factor (β-NGF) were associated with
        a decreased risk of AS (OR = 0.892, 95 % CI = 0.81-0.982, p = 0.002; OR = 0.829, 95 % CI = 0.696-0.988,
        p = 0.036).
  c002:
