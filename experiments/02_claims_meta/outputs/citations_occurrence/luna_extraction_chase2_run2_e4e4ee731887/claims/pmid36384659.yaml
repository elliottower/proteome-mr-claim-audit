claims:
  c000:
    quotes:
    - exact: Particularly, circulating monokine induced by gamma interferon (MIG) level was suggestively
        associated with a higher risk of AD (odds ratio from inverse variance weighted [ORIVW] 1.23; 95%
        CI 1.06-1.42; p IVW = 0.007) and lower risk of Crohn disease (ORIVW 0.73; 95% CI -0.62 to 0.86;
        p IVW = 1.3 × 10-4).
