claims:
  c000:
    quotes:
    - exact: Mendelian randomization analyses showed that blood concentrations of important inflammatory
        cytokines associated with the interferon pathway (CXCL9, CXCL10, CCL11, and IL-18) increase with
        age and are causal drivers of epigenetic age acceleration and age-related diseases.
