claims:
  c000:
    quotes:
    - exact: In addition to identifying well-established risk factors (smoking, alcohol, obesity, lack
        of physical activity), we provide evidence for specific factors, including dietary intake, sex
        steroid hormones, plasma lipids and telomere length as determinants of cancer risk. We also implicate
        molecular factors including plasma levels of IL-18, LAG-3, IGF-1, CT-1, and PRDX1 as risk factors.
