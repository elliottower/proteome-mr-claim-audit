claims:
  c000:
    quotes:
    - exact: After applying Bonferroni correction, a higher circulating level of Interleukin-7 (IL-7)
        was suggestively associated with TL maintaining (OR:1.01, 95%CI:1.00-1.02, P=0.032 by IVW method).
  c001:
    quotes:
    - exact: The study also revealed suggestive evidence indicating the involvement of Interleukin-2 receptor,
        alpha subunit (IL-2Rα) level was negatively associated with TL maintaining (OR:0.98, 95%CI:0.96-1.00,
        P=0.045 by IVW method), and the weighted median approach was consistent (OR:0.99, 95%CI:0.97-1.00,
        P=0.035).
  c002:
