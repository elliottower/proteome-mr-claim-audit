claims:
  c000:
    quotes:
    - exact: Summary-data-based MR and multi-omics quantitative trait locus (QTL) analyses covering DNA
        methylation, gene expression, and protein abundance QTLs identified PRKAB1 as significantly associated
        with reduced risk of both IBD and ulcerative colitis (UC).
  c001:
    quotes:
    - exact: Summary-data-based MR and multi-omics quantitative trait locus (QTL) analyses covering DNA
        methylation, gene expression, and protein abundance QTLs identified PRKAB1 as significantly associated
        with reduced risk of both IBD and ulcerative colitis (UC).
  c002:
    quotes:
    - exact: Combined analysis of Gene Expression Omnibus (GEO) and single-cell RNA sequencing (scRNA-seq)
        data revealed marked downregulation of PRKAB1 specifically in colonic epithelial cells during
        active UC inflammation.
  c003:
    quotes:
    - exact: Functional loss-of-function validation via PRKAB1 knockdown confirmed its regulatory function,
        triggering significant reductions in intracellular PC and lyso-PC concentrations.
  c004:
    quotes:
    - exact: Functional loss-of-function validation via PRKAB1 knockdown confirmed its regulatory function,
        triggering significant reductions in intracellular PC and lyso-PC concentrations.
  c005:
    quotes:
    - exact: Functional loss-of-function validation via PRKAB1 knockdown confirmed its regulatory function,
        triggering significant reductions in intracellular PC and lyso-PC concentrations. Quantitative
        real-time PCR (qRT-PCR) further demonstrated that this metabolic shift was accompanied by suppressed
        expression of core phosphatidylcholine metabolic genes, including CHKB, PCYT1B, and PLA2G4A.
