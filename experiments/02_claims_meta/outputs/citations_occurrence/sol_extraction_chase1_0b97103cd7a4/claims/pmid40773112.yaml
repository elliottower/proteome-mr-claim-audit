    - exact: After Bonferroni correction, we identified a significant inverse genetic association between
        Leukemia inhibitory factor receptor (LIFR) levels and BC risk.
  c001:
    quotes:
    - exact: While C-X-C motif chemokine 5 (CXCL5) did not survive Bonferroni correction, it showed significant
        negative association with BC in MVMR analysis.
