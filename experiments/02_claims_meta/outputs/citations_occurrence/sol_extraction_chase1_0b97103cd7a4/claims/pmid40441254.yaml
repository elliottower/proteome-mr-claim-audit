claims:
  c000:
    quotes:
    - exact: Statistical significance was found between 2 mitochondria-associated proteins (dihydrolipoyl
        dehydrogenase, mitochondrial apoptosis-inducing factor 1) and hypertrophic cardiomyopathy, both
        with P < .05.
  c001:
    quotes:
    - exact: Statistical significance was found between 2 mitochondria-associated proteins (dihydrolipoyl
        dehydrogenase, mitochondrial apoptosis-inducing factor 1) and hypertrophic cardiomyopathy, both
        with P < .05.
  c002:
    quotes:
    - exact: Six mitochondria-associated proteins (mitochondrial 39S ribosomal protein L33, ribosomal
        recycling factor, mitochondrial leucine-rich pentatricopeptide repeat motif-containing protein,
        serine protease high-temperature requirement protease A2, mitochondrial peptide methionine sulfoxide
        reductase, and mitochondrial input endomembrane transporter enzyme subunit translocase of inner
        mitochondrial membrane 14) and dilated cardiomyopathy were statistically significant, both with
        P < .05.
