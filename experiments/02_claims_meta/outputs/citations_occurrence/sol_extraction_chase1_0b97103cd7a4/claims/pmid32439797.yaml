claims:
  c000:
    quotes:
    - exact: We observed associations between predicted concentrations of 38 proteins and PDAC risk at
        an FDR of < 0.05, including 23 of those proteins that showed an association even after Bonferroni
        correction. These include the protein encoded by ABO, which has been implicated as a potential
        target gene of PDAC risk variant.
  c001:
    quotes:
    - exact: Eight of the identified proteins (LMA2L, TM11D, IP-10, ADH1B, STOM, TENC1, DOCK9, and CRBB2)
        were associated with PDAC risk after adjusting for previously reported PDAC risk variants (OR
        ranged from 0.79 to 1.52).
