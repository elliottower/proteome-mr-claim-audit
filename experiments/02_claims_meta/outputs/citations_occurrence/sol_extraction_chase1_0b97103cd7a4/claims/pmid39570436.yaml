claims:
  c000:
    quotes:
    - exact: 'Integrating the findings from two MR models, RANTES was suggestively associated with IA
        (Finnish model: inverse variance-weighted odds ratio [ORIVW] (95% confidence interval [95% CI]),
        0.86 (0.74-0.99); Icelandic model: 0.80 (0.68-0.94)) and aneurysmal subarachnoid hemorrhage (aSAH)
        (ORIVW (95% CI): 0.81 (0.68-0.95) and 0.80 (0.66-0.97) in Finnish and Icelandic models).'
