claims:
  c000:
    quotes:
    - exact: 'Eleven traits related to POAG risk were identified including: serum levels of the angiopoietin-1
        receptor (OR [odds ratio] = 1.11, IVW p = 2.34E-06) and the cadherin 5 protein (OR = 1.06, IVW
        p = 1.31E-06); intraocular pressure (OR = 2.46-3.79, IVW p = 8.94E-44-3.00E-27); diabetes (OR
        = 5.17, beta = 1.64, IVW p = 9.68E-04); and waist circumference (OR = 0.79, IVW p = 1.66E-05).'
