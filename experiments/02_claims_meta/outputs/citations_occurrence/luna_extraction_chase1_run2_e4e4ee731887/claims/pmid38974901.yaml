  c000:
    quotes:
    - exact: 'RESULTS: Results indicated a genetically predicted association between Interleukin-16 (IL-16)
        [OR: 1.228, 95% CI: 1.049-1.439, p = 0.011], TNF-related apoptosis ligand (TRAIL) [OR: 1.111,
        95% CI: 1.019-1.210, p = 0.017] and Urokinase-type plasminogen activator (uPA) [OR: 1.303, 95%
        CI: 1.025-1.658, p = 0.031] and the risk of iNPH.'
