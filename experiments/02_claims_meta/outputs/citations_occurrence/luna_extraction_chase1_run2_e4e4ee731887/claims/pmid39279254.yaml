  sha256: 04d8347240c0b8371c59404a2a09fa91523f4c637d4950597c689b4587a2b673
  url: https://pubmed.ncbi.nlm.nih.gov/39279254/
  note: abstract text exactly as sent to the extractor
claims:
  c000:
    quotes:
    - exact: MR analysis identified a total of 9 inflammatory cytokines that were genetically associated
        with migraines, and we subsequently identified 21 mediated relationships, with 20 metabolites
        (13 metabolites, 7 ratios) acting as potential mediators between 8 inflammatory cytokines and
        migraine. The 9 inflammatory cytokines were beta-nerve growth factor levels (β-NGF), T-cell surface
        glycoprotein CD5 levels (CD5), T-cell surface glycoprotein CD6 isoform levels (CD6), C-X-C motif
        chemokine 11 levels (CXCL11), interleukin-4 levels (IL-4), oncostatin-M levels (OSM), signalling
        lymphocytic activation molecule levels (SLAM), C-C motif chemokine 25 levels (CCL25) and monocyte
        chemoattractant protein-1 levels (MCP-1).
