claims:
  c000:
    quotes:
    - exact: 'Additionally, we have discovered three inflammatory proteins that are also associated with
        the occurrence of acute pancreatitis, namely interleukin-15 receptor subunit alpha (IL-15RA),
        monocyte chemoattractant protein-4 (CCL13), and tumor necrosis factor receptor superfamily member
        9 (TNFRSF9). Following a two-step MR analysis, we ultimately identified IL-15RA as a potential
        intermediate factor, with a mediated effect of 0.018 (95% CI: 0.005 - 0.032).'
