  c000:
    quotes:
    - exact: In addition, of the two inflammatory cytokines identified, hepatocyte growth factor(HGF)
        reduced the risk of male infertility (odds ratio = 0.50, 95% confidence interval = 0.35-0.71,
        P = 0.0001), Monocyte chemotactic protein 3 (MCP-3) increased the risk of male infertility (odds
        ratio = 1.28, 95% confidence interval = 1.03-1.61, P = 0.0039).
