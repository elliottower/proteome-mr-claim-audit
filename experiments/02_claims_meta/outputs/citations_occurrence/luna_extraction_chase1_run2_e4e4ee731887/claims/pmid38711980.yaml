  c002:
    quotes:
    - exact: Mediated MR analysis showed that HGF mediated the causal effect of Bacteroides on MI (mediated
        percentage 38.9%).
  c003:
    quotes:
    - exact: Multivariate MR analyses suggest that HGF may be one of the pathways through which Bacteroides
        affects MI, with other unexplored pathways.
