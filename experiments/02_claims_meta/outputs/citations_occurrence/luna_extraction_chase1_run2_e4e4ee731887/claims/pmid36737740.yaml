claims:
  c000:
    quotes:
    - exact: 'After Bonferroni correction, genetically predicted circulating level of basic fibroblast
        growth factor (FGF-basic) was suggestively associated with a lower risk of ALS [odds ratio (OR):
        0.74, 95% confidence interval (95% CI): 0.60-0.92, P = 0.007].'
  c001:
    quotes:
    - exact: 'We also observed suggestive evidence that interferon gamma-induced protein 10 (IP-10) was
        associated with a 10% higher risk of ALS (OR: 1.10, 95% CI: 1.03-1.17, P = 0.005) in the primary
        study.'
  c002:
    quotes:
    - exact: 'After Bonferroni correction, genetically predicted circulating level of basic fibroblast
        growth factor (FGF-basic) was suggestively associated with a lower risk of ALS [odds ratio (OR):
        0.74, 95% confidence interval (95% CI): 0.60-0.92, P = 0.007]. We also observed suggestive evidence
        that interferon gamma-induced protein 10 (IP-10) was associated with a 10% higher risk of ALS
        (OR: 1.10, 95% CI: 1.03-1.17, P = 0.005) in the primary study. The results of sensitivity analyses
        were consistent.'
  c003:
    quotes:
    - exact: 'After Bonferroni correction, genetically predicted circulating level of basic fibroblast
        growth factor (FGF-basic) was suggestively associated with a lower risk of ALS [odds ratio (OR):
        0.74, 95% confidence interval (95% CI): 0.60-0.92, P = 0.007]. We also observed suggestive evidence
        that interferon gamma-induced protein 10 (IP-10) was associated with a 10% higher risk of ALS
        (OR: 1.10, 95% CI: 1.03-1.17, P = 0.005) in the primary study. The results of sensitivity analyses
