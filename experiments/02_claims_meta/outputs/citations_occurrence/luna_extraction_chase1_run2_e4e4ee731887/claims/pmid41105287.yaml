claims:
  c000:
    quotes:
    - exact: 'Our study revealed significant bidirectional effects of immune signaling on cancer risk.
        Three immune factors demonstrated protective associations: C-C motif chemokine 4 (OR: 0.682, 95%
        CI: 0.509–0.915, p = 0.011), leukemia inhibitory factor receptor (OR: 0.588, 95% CI: 0.374–0.924,
        p = 0.021), and macrophage inflammatory protein (OR: 0.521, 95% CI: 0.345–0.786, p = 0.002).'
