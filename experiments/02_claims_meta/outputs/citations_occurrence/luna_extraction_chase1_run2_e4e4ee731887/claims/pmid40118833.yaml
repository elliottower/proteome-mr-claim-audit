claims:
  c000:
    quotes:
    - exact: Higher levels of DBI (OR = 0.79, 95%CI = 0.69-0.90) and MAX (OR = 0.74, 95%CI = 0.62-0.90)
        encoded proteins are inversely associated with UC risk, while higher QDPR (OR = 1.17, 95%CI =
        1.07-1.28) and HP (OR = 1.09, 95%CI = 1.04-1.14) levels increase UC and IBD risk.
