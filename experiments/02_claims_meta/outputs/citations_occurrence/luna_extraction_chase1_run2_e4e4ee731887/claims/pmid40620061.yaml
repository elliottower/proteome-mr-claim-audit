claims:
  c000:
    quotes:
    - exact: 'Six genes (sterol carrier protein2 [SCP2], ATP binding cassette subfamily D member 3 [ABCD3],
        cytochrome coxidase assembly factor heme A: farnesyltransferase [COX10], mitochondrial contact
        site and cristae organizing system subunit 10 [MiCOS 10], glutaryl-Coenzyme A dehydrogenase [GCDH],
        and mitochondrial translational release factor 1-like [MTRF1L] were causally associated with CRC
        and showed better prognostic significance when their expression levels were high, and there were
        106 drugs targeting them.'
