  c003:
    quotes:
    - exact: MR and colocalization prioritized four protein targets, FCRL3, ICAM5, ENTPD5 and OAS1 that
        showed effect on COVID-19 severity in European ancestry.
  c004:
    quotes:
    - exact: One protein target, SERPINA1 showed a stronger effect in African ancestry but much weaker
        effect in European ancestry (odds ratio [OR] in Africans=0.369, 95%CI=0.203 to 0.668, P = 9.96
        × 10-4; OR in Europeans=1.021, 95%CI=0.901 to 1.157, P = 0.745), which suggested that increased
        level of SERPINA1 will reduce COVID-19 risk in African ancestry.
  c005:
    quotes:
    - exact: One protein target, SERPINA1 showed a stronger effect in African ancestry but much weaker
        effect in European ancestry (odds ratio [OR] in Africans=0.369, 95%CI=0.203 to 0.668, P = 9.96
        × 10-4; OR in Europeans=1.021, 95%CI=0.901 to 1.157, P = 0.745), which suggested that increased
        level of SERPINA1 will reduce COVID-19 risk in African ancestry.
  c006:
    quotes:
    - exact: One protein, ICAM1 showed suggestive effect on COVID-19 severity in both ancestries (OR in
        Europeans=1.152, 95%CI=1.063 to 1.249, P = 5.94 × 10-4; OR in Africans=1.481, 95%CI=1.008 to 2.176;
        P = 0.045).
  c007:
    quotes:
    - exact: One protein, ICAM1 showed suggestive effect on COVID-19 severity in both ancestries (OR in
        Europeans=1.152, 95%CI=1.063 to 1.249, P = 5.94 × 10-4; OR in Africans=1.481, 95%CI=1.008 to 2.176;
        P = 0.045).
  c008:
    quotes:
    - exact: The OAS1, SERPINA1 and ICAM1 effects were replicated using updated COVID-19 severity data
        in the two ancestries respectively, where alternative splicing events in OAS1 and ICAM1 also showed
        marginal effects on COVID-19 severity in Europeans.
