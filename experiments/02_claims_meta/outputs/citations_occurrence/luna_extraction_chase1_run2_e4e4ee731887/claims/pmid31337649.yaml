claims:
  c000:
    quotes:
    - exact: A total of 31 proteins were associated with prostate cancer risk including proteins encoded
        by GSTP1, whose methylation level was shown previously to be associated with prostate cancer risk,
        and MSMB, SPINT2, IGF2R, and CTSS, which were previously implicated as potential target genes
        of prostate cancer risk variants identified in genome-wide association studies.
