claims:
  c000:
    quotes:
    - exact: MR insights intimated that reduced genetically-predicted interleukin-10 (IL-10) levels causally
        correlated with a heightened sepsis risk (odds ratio [OR] 0.68, 95% confidence interval [CI] 0.52-0.90,
        P=0.006).
  c001:
    quotes:
    - exact: An inverse relationship emerged between monocyte chemoattractant protein-1 (MCP-1) and sepsis-induced
        mortality.
  c002:
    quotes:
    - exact: Conversely, elevated macrophage inflammatory protein 1 beta (MIP1B) concentrations were positively
        linked with both sepsis incidence and associated mortality.
