claims:
  c000:
    quotes:
    - exact: Both the total effect of the CD33 + HLA DR+ AC (odds ratio [OR] = 0.977, 95 % confidence
        interval [CI], 0.960-0.994; P = 0.010) and the effect of CD33 + HLA DR+ CD14 - cells (OR = 0.977,
        95 % CI, 0.963-0.991; P = 0.001) were significant. These effects were partially mediated by STAM-binding
        protein levels, contributing 16.7 % and 15.0 % to the total effects of the CD33 + HLA DR+ AC and
        CD33 + HLA DR+ CD14 - AC, respectively.
