claims:
  c000:
    quotes:
    - exact: This MR study found a significant causal association between BMI and AF (OR=1.41, 95%CI=1.33-1.50;
        P<0.001), which was attenuated to 1.21 (95%CI=1.03-1.43) after being adjusted for leptin, in which
        48.78% excess risk was mediated.
  c001:
    quotes:
    - exact: 'This MR study found a significant causal association between BMI and AF (OR=1.41, 95%CI=1.33-1.50;
        P<0.001), which was attenuated to 1.21 (95%CI=1.03-1.43) after being adjusted for leptin, in which
        48.78% excess risk was mediated. After further adjustment for leptin and sleep apnoea or coronary
        heart disease, the association was attenuated to null (adjusted for leptin and sleep apnoea: OR=1.05,
        95%CI=0.85-1.30; adjusted for leptin and coronary heart disease: OR=1.08, 95%CI=0.90-1.30), resulting
        in 87.80% and 80.49% excess risk being mediated, respectively.'
