  c003:
    quotes:
    - exact: There was a positive association between skin fibrosis and levels of Fibroblast growth factor
        21 (OR 2.276 [95% CI 1.064, 4.870], p = 0.034).
  c004:
    quotes:
    - exact: Two-step MR showed that Retinol (Vitamin A) to the linoleoyl-arachidonoyl-glycerol ratio
        (βM 0.108 [95% CI 0.006, 0.210], p = 0.004) and the Cholesterol to linoleoyl-arachidonoyl-glycerol
        ratio (βM 0.238 [95% CI 0.002, 0.474], p = 0.048) were identified as mediators, which showed evidence
        of the mediated effect of the levels of Fibroblast growth factor 21 on Keloid through these mediators.
