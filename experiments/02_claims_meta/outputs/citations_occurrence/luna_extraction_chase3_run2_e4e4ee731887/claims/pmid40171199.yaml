  c002:
    quotes:
    - exact: Bidirectional Mendelian randomization revealed negative associations between skin fibrosis
        and the levels of T-cell surface glycoprotein CD6 isoform (odds ratio [OR] 0.670 [95% confidence
        interval [CI] 0.472, 0.951], p = 0.025), Delta and Notch-like epidermal growth factor-related
        receptor (OR 0.779 [95% CI 0.609, 0.998], p = 0.048), and Interleukin-10 receptor subunit beta
