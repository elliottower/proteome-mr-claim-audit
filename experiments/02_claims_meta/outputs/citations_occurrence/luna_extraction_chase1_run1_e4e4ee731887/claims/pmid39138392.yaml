  c004:
    quotes:
    - exact: HGF was associated with better overall survival (OS) in HNSC, regardless of the types of
        cells enriched.
  c005:
    quotes:
    - exact: However, high expression of the ligand MET for HGF leads to a decrease in overall survival
        in LUSC.
  c006:
    quotes:
    - exact: TNF was related to poor OS in LUSC with no significant impact.
  c007:
    quotes:
    - exact: However, in CD8 + T cell-enriched, eosinophil-enriched, macrophage-enriched, and NK cell-deficient
        types of LUSC, high expression of TNF leads to a poor prognosis, and there is statistical significance.
