  c011:
    quotes:
    - exact: Serum ELISA further revealed that circulating ADH7 concentrations were elevated in smokers
        and in EC patients, with the highest levels observed in smoking EC patients, supporting a role
        for smoking-driven elevation of circulating ADH7 in EC risk.
