  c004:
    quotes:
    - exact: Five plasma proteins (ADH7, CPXM1, FUT3, GZMM, LYPD3) were identified as mediators in smoking-driven
        EC risk.
  c005:
    quotes:
    - exact: Among these, ADH7 emerged as a key protein and was consistently associated with smoking traits;
        high ADH7 mRNA expression in EC tumor tissue was associated with reduced progression-free survival.
  c006:
    quotes:
    - exact: PheWAS inferred that ADH7-targeted interventions might pose risks of neurological or psychiatric
        side effects, though these were not statistically significant.
  c007:
    quotes:
    - exact: PheWAS inferred that ADH7-targeted interventions might pose risks of neurological or psychiatric
        side effects, though these were not statistically significant.
  c008:
    quotes:
    - exact: qRT-PCR and immunohistochemistry showed that ADH7 was downregulated in EC tissues relative
        to adjacent normal mucosa, and functional assays demonstrated that overexpression of ADH7 suppressed
        the proliferative and migratory capacity of EC cells.
