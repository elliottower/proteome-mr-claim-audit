claims:
  c000:
    quotes:
    - exact: MR analysis suggested that 55 out of 5048 exposure traits, including four proteins, play
        a causal role in AF (P < 1e-5 allowing for multiple comparisons). Multivariable analysis suggested
        that higher body mass index, height, systolic blood pressure as well as genetic liability to coronary
        artery diseases independently cause AF. Three out of the four proteins (DUSP13, TNFSF12 and IL6R)
        had a drug prioritising score for atrial fibrillation of 0.26, 0.38 and 0.88, respectively (values
        closer to 1 indicating stronger evidence of the protein as a potential drug target).
