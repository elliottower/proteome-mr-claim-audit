claims:
  c000:
    quotes:
    - exact: Multiple MR results revealed that BRSK2 has a significant pathogenic impact on IPF at both
        transcriptional and translational levels, with a lung tissue-specific association (OR = 1.596;
        CI, 1.300-1.961; Pval = 8.290 × 10 - 6).
  c001:
    quotes:
    - exact: BRSK2 was associated with IPF progression driven by high-risk factors, with mediation effects
        ranging from 34.452 to 69.665%.
  c002:
    quotes:
    - exact: Elevated BRSK2 expression in peripheral blood mononuclear cells correlated with reduced pulmonary
        function, while increased circulating BRSK2 levels suggested respiratory failure and shorter transplant-free
        survival in IPF patients.
  c003:
    quotes:
    - exact: Elevated BRSK2 expression in peripheral blood mononuclear cells correlated with reduced pulmonary
        function, while increased circulating BRSK2 levels suggested respiratory failure and shorter transplant-free
        survival in IPF patients.
  c004:
    quotes:
    - exact: Elevated BRSK2 expression in peripheral blood mononuclear cells correlated with reduced pulmonary
        function, while increased circulating BRSK2 levels suggested respiratory failure and shorter transplant-free
        survival in IPF patients.
  c005:
    quotes:
    - exact: BRSK2 silencing attenuated lung fibrosis progression in cellular and animal models.
  c006:
    quotes:
    - exact: Transcriptomic integration identified PSMB1, CTSD, and CTSH as significant downstream effectors
        of BRSK2, with PSMB1 showing robust shared causal variant support (PPH4 = 0.800).
  c007:
