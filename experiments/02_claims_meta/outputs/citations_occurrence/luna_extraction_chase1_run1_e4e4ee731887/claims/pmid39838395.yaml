  c009:
    quotes:
    - exact: Colocalization analysis and phenotype scan deepened the pathogenic association of BRSK2 with
        IPF, while methylation MR analysis highlighted the critical role of epigenetic regulation in BRSK2-driven
        IPF pathogenesis.
  c010:
