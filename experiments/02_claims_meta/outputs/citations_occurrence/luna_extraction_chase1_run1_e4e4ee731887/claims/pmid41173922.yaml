  c003:
    quotes:
    - exact: Integrating DR proteomic profile markedly improves predictive performance beyond clinical
        and genetic predictors, with plexin B2, growth differentiation factor 15, and renin emerging as
        top proteins validated across cohorts and linked to retinal microvascular degeneration in Guangzhou
        Diabetic Eye Study (GDES) based on SS-OCTA. A parsimonious panel of these three proteins alone
        achieves comparable performance in predicting DR development and progression, while renin is confirmed
        as a causal promoter through genetic analyses.
