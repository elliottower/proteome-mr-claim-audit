claims:
  c000:
    quotes:
    - exact: 'The results suggest a genetically predicted potential association between beta-nerve growth
        factor (βNGF), Interleukin-1-beta (IL-1β), and TNF-related apoptosis inducing ligand (TRAIL) with
        the risk of AS (OR: 2.17, 95% CI: 1.13-4.16; OR: 0.41, 95% CI: 0.18-0.95,; OR: 1.47, 95% CI: 1.02-2.13).'
  c001:
    quotes:
    - exact: 'The results suggest a genetically predicted potential association between beta-nerve growth
