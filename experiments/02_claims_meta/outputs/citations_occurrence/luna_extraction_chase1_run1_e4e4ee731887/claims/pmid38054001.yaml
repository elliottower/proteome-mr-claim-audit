  c003:
    quotes:
    - exact: Additionally, Interleukin-12p70 (IL-12p70), Interleukin-17 (IL-17), Interleukin-6 (IL-6),
        Interleukin-4 (IL-4), Stromal-cell-derived factor 1 alpha (SDF-1α), Macrophage inflammatory protein
        1β (MIP1β), Monocyte chemoattractant protein-3 (MCP-3), Platelet-derived growth factor bb (PDGFbb),
        Granulocyte-colony stimulating factor (GCSF), Fibroblast growth factor basic (bFGF), TNF-related
        apoptosis inducing ligand (TRAIL), and Interferon-gamma (IFN -γ) are suggested as consequences
        of AS in genetically prediction.
