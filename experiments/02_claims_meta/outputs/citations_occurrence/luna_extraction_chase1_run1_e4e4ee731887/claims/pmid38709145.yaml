claims:
  c000:
    quotes:
    - exact: In FinnGen datasets, macrophage Inflammatory Protein-1 Alpha (MIP_1A), MIP_1A and interferon
        γ-induced protein 10 (IP_10) were verified for IA, uIA and SAH, respectively.
  c001:
    quotes:
    - exact: In FinnGen datasets, macrophage Inflammatory Protein-1 Alpha (MIP_1A), MIP_1A and interferon
        γ-induced protein 10 (IP_10) were verified for IA, uIA and SAH, respectively.
  c002:
    quotes:
    - exact: In FinnGen datasets, macrophage Inflammatory Protein-1 Alpha (MIP_1A), MIP_1A and interferon
        γ-induced protein 10 (IP_10) were verified for IA, uIA and SAH, respectively.
  c003:
    quotes:
    - exact: In the reverse Mendelian randomization analysis, the common cytokines altered by uIA and
        SAH were vascular endothelial growth factor (VEGF), MIP_1A, IL_9, IL_10 and IL_17, respectively.
        The meta-analysis results show that MIP_1A and IP_10 could be associated with the decreased risk
        of IA, and MIP_1A and IP_10 were associated with the decreased risk of uIA and SAH, respectively.
        Notably, the levels of VEGF, MIP_1A, IL_9, IL_10 and TNF_A were increased with uIA.
