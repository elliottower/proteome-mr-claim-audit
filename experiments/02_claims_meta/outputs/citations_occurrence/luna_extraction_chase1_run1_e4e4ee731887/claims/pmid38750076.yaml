claims:
  c000:
    quotes:
    - exact: 'We identify 618 protein-cancer associations, of which 107 persist for cases diagnosed more
        than seven years after blood draw, 29 of 618 were associated in genetic analyses, and four had
        support from long time-to-diagnosis ( > 7 years) and both cis-pQTL and exGS analyses: CD74 and
        TNFRSF1B with NHL, ADAM8 with leukemia, and SFTPA2 with lung cancer.'
