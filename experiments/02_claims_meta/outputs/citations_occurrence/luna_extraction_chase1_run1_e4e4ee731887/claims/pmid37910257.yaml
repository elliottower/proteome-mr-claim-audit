claims:
  c000:
    quotes:
    - exact: 'Based on the IVW method, genetically predicted that increasing level of Monokine induced
        by interferon gamma (MIG/CXC chemokine ligand 9, CXCL9) [OR: 1.31; 95% CI: 1.05-1.62; P = 0.01]
        and interferon gamma-induced protein 10(IP-10/CXC chemokine ligand 10, CXCL10) [OR: 1.30; 95%
        CI: 1.02-1.66; P = 0.03] showed suggestive associations with DLBCL risk.'
