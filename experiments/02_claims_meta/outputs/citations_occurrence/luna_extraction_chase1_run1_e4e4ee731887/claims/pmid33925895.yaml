  c008:
    quotes:
    - exact: We observed associations between genetically predicted concentrations of nine proteins and
        EC risk at a false discovery rate of <0.05 (p-values range from 1.14 × 10-10 to 3.04 × 10-4).
        Except for vascular cell adhesion protein 1, all other identified proteins were independent from
        known EC risk variants identified in EC GWAS.
