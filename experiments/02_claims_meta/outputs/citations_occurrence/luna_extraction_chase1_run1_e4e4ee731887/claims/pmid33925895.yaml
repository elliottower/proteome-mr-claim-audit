claims:
  c000:
    quotes:
    - exact: The respective odds ratios (95% confidence intervals) per one standard deviation increase
        in genetically predicted circulating protein concentrations were 1.21 (1.13, 1.30) for DNA repair
        protein RAD51 homolog 4, 1.27 (1.14, 1.42) for desmoglein-2, 1.14 (1.07, 1.22) for MHC class I
        polypeptide-related sequence B, 1.05 (1.02, 1.08) for histo-blood group ABO system transferase,
        0.77 (0.68, 0.89) for intestinal-type alkaline phosphatase, 0.82 (0.74, 0.91) for carbohydrate
        sulfotransferase 15, 1.07 (1.03, 1.11) for D-glucuronyl C5-epimerase, and 1.07 (1.03, 1.10) for
        CD209 antigen.
