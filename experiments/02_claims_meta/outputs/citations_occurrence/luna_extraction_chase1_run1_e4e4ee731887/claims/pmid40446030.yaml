claims:
  c000:
    quotes:
    - exact: One of these proteins, IGDCC4 (immunoglobulin superfamily deleted in colorectal cancer subclass
        member 4), was related to 20-year dementia risk, cognitive functioning, and amyloid-β positivity
        using data from two independent cohorts, while its plasma and intrathecal abundance were causally
        implicated in dementia risk and clinically relevant brain atrophy.
