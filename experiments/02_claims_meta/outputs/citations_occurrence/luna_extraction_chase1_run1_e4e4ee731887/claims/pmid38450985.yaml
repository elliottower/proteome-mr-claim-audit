claims:
  c000:
    quotes:
    - exact: 'The IVM-MR analysis showed a casual association between genetically predicted circulating
        levels of interleukin-16 and both ALM and grip strength (ALM: OR = 0.990, 95% CI: 0.980-1.000,
        p = .049; grip strength: OR = 0.971, 95% CI: 0.948-0.995, p = .020).'
  c001:
    quotes:
    - exact: 'The IVM-MR analysis showed a casual association between genetically predicted circulating
        levels of interleukin-16 and both ALM and grip strength (ALM: OR = 0.990, 95% CI: 0.980-1.000,
        p = .049; grip strength: OR = 0.971, 95% CI: 0.948-0.995, p = .020).'
  c002:
    quotes:
    - exact: Additionally, interferon-gamma-induced protein 10 (IP-10), interleukin-1-beta (IL-1β), and
        hepatocyte growth factor (HGF) were correlated with ALM and vascular endothelial growth factor
        (VEGF), interleukin-12 (IL-12), and interleukin-5 (IL-5) with grip strength.
