claims:
  c000:
    quotes:
    - exact: We found a causal relationship between circulating levels of macrophage inflammatory protein-1beta
        (MIP-1β) and risk of OA (OR = 0.998, 95% CI = 0.996-0.999p = 9.61 × 10-5); tumour necrosis factor
        beta (TNF-β) was also causally associated with risk of OA (OR = 0.996,95%CI = 0.994-0.999, p =
        0.002); finally we found a suggestive association between C-C motif chemokine ligand 5(CCL5, also
        called Rantes) and OA risk (OR = 1.013, 95%CI = 1.002-1.024,p = 0.016).
