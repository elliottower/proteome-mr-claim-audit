claims:
  c000:
    quotes:
    - exact: '15 of 907 analyzed proteins displayed potential associations with long-term FEV1 decline,
        including two hemoglobin subunits: hemoglobin subunit beta (HBB, FDR-qACAT = 0.040), alpha globin
        chain (HBA2, FDR-qACAT = 0.045), and four immunoglobulin subunits: immunoglobulin kappa variable
        3-7 (IGKV3-7, FDR-qACAT = 0.003), immunoglobulin heavy chain variable region (IgH, FDR-qACAT =
        0.011).'
