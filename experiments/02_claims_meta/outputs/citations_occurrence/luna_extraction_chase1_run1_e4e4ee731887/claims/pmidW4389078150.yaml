claims:
  c000:
    quotes:
    - exact: 'After rigorous genetic variant selection, IVW, sensitivity analysis, 3 genetically determined
        MRPs were significantly associated with NAFLD [MRPL33 (OR: 1.06, 95% CI: 1.00-1.11, p = 0.0284),
        MRPL34 (OR: 0.88, 95% CI: 0.78–0.98, p = 0.0294) and FARS2 (OR : 0.90, 95% CI: 0.84–0.97, p =
        0.0120)], 2 MRPs were significantly associated with liver cirrhosis[MICU1 (OR: 1.11, 95% CI: 1.00-1.22,
        p = 0.0337) and NUDT8 (OR: 1.16, 95% CI: 1.03–1.30, p = 0.0096)], and 4 MRPs were significantly
        correlated with HCC [MRPL32 (OR: 0.62, 95% CI: 0.39–0.99, p = 0. 0492), MRPL33 (OR:1.29, 95% CI:
        1.07–1.55, p = 0.0063), SCO1 (OR:0.56, 95% CI. 0.38–0.83, p = 0.0036) and SIRT5 (OR:0.71, 95%
        CI: 0.53–0.96, p = 0.0283)].'
