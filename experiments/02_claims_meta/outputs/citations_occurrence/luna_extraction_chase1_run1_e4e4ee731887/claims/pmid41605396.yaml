  c009:
    quotes:
    - exact: 'Mechanistically, GGPPS drives oncogenesis through its catalytic activity in mediating protein
        geranylgeranylation: geranylgeranylated RHOA activated ROCK1-dependent phosphorylation of the
        p65 subunit of NF-κB to induce transcription of IL1B, whereas geranylgeranylated RAC1 promoted
