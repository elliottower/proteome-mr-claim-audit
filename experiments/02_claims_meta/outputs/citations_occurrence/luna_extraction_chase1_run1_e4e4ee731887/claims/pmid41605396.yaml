claims:
  c000:
    quotes:
    - exact: Through integrative multi-omics analysis combining Mendelian randomization and colocalization
        of LUSC genome-wide association studies with functional quantitative trait loci, we identified
        the enzyme GGPPS as a causal driver with robust genetic support (PP·H4 = 74.1%) and showed that
        its elevated expression predicted reduced survival and accelerated tumor progression.
