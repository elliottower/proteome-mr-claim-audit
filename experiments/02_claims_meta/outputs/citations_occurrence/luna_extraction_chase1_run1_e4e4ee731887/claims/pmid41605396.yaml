  c010:
    quotes:
    - exact: 'Critically, pharmacological inhibition abolished GGPPS-driven geranylgeranylation-dependent
        signaling: JSH-23 reversed both the proliferation mediated by RHOA and NF-κB p65 and the upregulation
        of IL1B potentiated by GGPS1 overexpression; and NSC23766 blocked the RAC1/STAT1-dependent IL1RAP
        activation amplified by GGPPS elevation, confirming that both axes are indispensable for GGPPS-dependent
        proliferation.'
