claims:
  c000:
    quotes:
    - exact: 'The IVW method indicated that basic fibroblast growth factor (FGFBasic), interleukin-2 (IL-2),
        and macrophage migration inhibitory factor (MIF) may be suggestively associated with the risk
        of PD (OR: 0.71, 95%CI: 0.52-0.96, P = 0.027; OR: 1.18, 95%CI: 1.01-1.38, P = 0.041; and OR: 1.23,
        95%CI: 1.04-1.46, P = 0.018).'
