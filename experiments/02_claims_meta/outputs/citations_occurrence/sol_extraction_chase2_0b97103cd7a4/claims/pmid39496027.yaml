  c003:
    quotes:
    - exact: 'Conversely, higher levels of macrophage colony-stimulating factor (OR: 0.80, P = .010) may
        potentially decrease the risk of colon cancer.'
  c004:
    quotes:
    - exact: 'In the reverse MR analysis, it was found that rectal cancer is linked to higher levels of
        IL-1b (OR: 0.93, P = .022), IL-1ra (OR: 0.90, P = .001), IL-5 (OR: 0.93, P = .022), IL-9 (OR:
        0.93, P = .017), and TNF-a (OR: 0.91, P = .003).'
