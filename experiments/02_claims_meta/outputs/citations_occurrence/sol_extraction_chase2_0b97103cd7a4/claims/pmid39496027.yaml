claims:
  c000:
    quotes:
    - exact: 'The forward MR analysis revealed a positive association between higher levels of interleukin
        (IL)-16 (OR: 1.37, P = .002), vascular endothelial growth factor (OR: 1.44, P = .001), and MIG
        (OR: 1.23, P = .040) with an increased risk of rectal cancer.'
