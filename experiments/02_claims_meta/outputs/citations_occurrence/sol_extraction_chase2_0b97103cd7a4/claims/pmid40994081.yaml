claims:
  c000:
    quotes:
    - exact: Positive control analyses revealed that genetically predicted GLP-1R activation was associated
        with reduced levels of HbA1c (p = 4.93E-15) and blood glucose (p = 9.73E-5), as well as a decreased
        risk of T2DM (p = 2.45E-4) and DN (p = 6.35E-4), fully validating the reliability of the genetic
        instruments.
