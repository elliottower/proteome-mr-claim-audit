  c008:
    quotes:
    - exact: 'Mediation analyses indicated that fibroblast growth factor 23 (FGF23) suppression mediated
        26.57% of the effect on eGFR and 13.50% of CKD protection, whereas metabolic traits (BMI: 2.08%
        for CKD, 5.51% for eGFR; high-density lipoprotein: 0.79% for CKD, 2.34% for eGFR; HbA1c: 8.25%
        for eGFR) partially explained the benefits on CKD and eGFR.'
