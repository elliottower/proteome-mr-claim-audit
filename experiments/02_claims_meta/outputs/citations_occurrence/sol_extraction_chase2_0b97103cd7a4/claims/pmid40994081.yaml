  c004:
    quotes:
    - exact: Genetic proxies for GLP-1R activation lowered risks of CKD (odds ratio [OR] = 0.83, p = 9.22E-9),
        immunoglobulin A nephropathy (IgAN) (OR = 0.70, p = 2.11E-3) and kidney function preservation
        (β = 0.01, p = 9.11E-3), but showed null effects on other CKD subtypes.
