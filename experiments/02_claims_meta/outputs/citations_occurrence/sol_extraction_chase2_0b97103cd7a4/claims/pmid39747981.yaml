  c008:
    quotes:
    - exact: Colocalization analyses demonstrated substantial genetic overlap between inflammatory proteins
        and IBD, with CXCL5 showing strong evidence of shared genetic variants with UC, and CXCL9 exhibiting
        genetic colocalization with CD, suggesting common genetic determinants underlying these inflammatory
        protein-IBD relationships.
