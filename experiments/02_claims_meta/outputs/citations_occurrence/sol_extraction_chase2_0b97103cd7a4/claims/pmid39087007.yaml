  c012:
    quotes:
    - exact: 'In the reverse MR study, only one mitochondrial protein, TIM14 (OR: 1.087, 95% CI: 1.004-1.177,
        p = 0.04), showed a causal relationship with aSAH.'
  c013:
    quotes:
    - exact: The results suggest that CCDC90B, tRNA PusA, and MRM3 may be common risk factors for cerebral
        aneurysms (ruptured and unruptured), while AIF1 and NAGS are specifically associated with an increased
        risk of aSAH, unrelated to uIA.
