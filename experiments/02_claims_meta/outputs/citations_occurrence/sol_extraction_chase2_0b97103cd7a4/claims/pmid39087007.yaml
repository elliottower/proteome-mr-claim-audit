claims:
  c000:
    quotes:
    - exact: 'Through MR analysis, we identified six mitochondrial proteins associated with an increased
        risk of aSAH: AIF1 (OR: 1.394, 95% CI: 1.109-1.752, p = 0.0044), CCDC90B (OR: 1.318, 95% CI: 1.132-1.535,
        p = 0.0004), TIM14 (OR: 1.272, 95% CI: 1.041-1.553, p = 0.0186), NAGS (OR: 1.219, 95% CI: 1.008-1.475,
        p = 0.041), tRNA PusA (OR: 1.311, 95% CI: 1.096-1.569, p = 0.003), and MRM3 (OR: 1.097, 95% CI:
        1.016-1.185, p = 0.0175).'
