  c002:
    quotes:
    - exact: IL-18 was a potential risk factor for extensive basal ganglia perivascular space burden (BGPVS,
        OR, 1.02, 95% CI, 1.00-1.05).
  c003:
    quotes:
    - exact: Moreover, the risk of extensive white matter perivascular space burden (WMPVS) decreased
        with rising levels of E-selectin (OR, .98, 95% CI, .97-1.00), IL-1RL2 (OR, .97, 95% CI, .95-1.00),
        IL-3 receptor subunit alpha (IL-3Ra, OR, .98, 95% CI, .97-1.00), and IL-5 receptor subunit alpha
        (IL-5Ra, OR, .98, 95% CI, .97-1.00).
