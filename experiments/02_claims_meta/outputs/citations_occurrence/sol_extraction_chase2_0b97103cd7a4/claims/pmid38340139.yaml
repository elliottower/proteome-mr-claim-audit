  c009:
    quotes:
    - exact: SMR estimates showed that TRAIL-related IVs rs5030044 and rs2304456 increased the risk of
        SVS by increasing the expression of gene Kininogen-1 (KNG1) in the cerebral cortex, particularly
        in the frontal cortex (βsmr = .10, Psmr = .003, FDR = .04).
  c010:
