claims:
  c000:
    quotes:
    - exact: Specifically, Interleukin-17 receptor D (IL-17RD) (OR = 0.67, 95%CI = 0.51-0.89, p = 0.006),
        Interleukin-22 receptor subunit alpha-1 (IL22RA-1) (OR = 1.45, 95%CI = 1.08-1.96, p = 0.014),
        Interleukin-20 receptor subunit alpha (IL20RA) (OR = 0.53, 95%CI = 0.32-0.89, p = 0.016), Interleukin-22
        (IL-22) (OR = 3.60, 95%CI = 1.20-10.83, p = 0.022), Interleukin-23 receptor (IL-23R) (OR = 2.14,
        95%CI = 1.10-4.17, p = 0.025), Single Ig IL-1-related receptor (SIGIRR) (OR = 1.22, 95%CI = 1.00-1.48,
        p = 0.047) showed notable associations with ARDS.
