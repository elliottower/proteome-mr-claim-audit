claims:
  c000:
    quotes:
    - exact: 'Meta-analysis revealed that increased CCL4 (C-C motif chemokine 4) levels were associated
        with a higher risk of PCOS (odds ratio [OR] = 1.123, 95% confidence interval [CI]: 1.056-1.195;
        P < .001).'
  c001:
    quotes:
    - exact: 'Decreased PCOS risk was linked to CXCL11 (C-X-C motif chemokine 11, OR = 0.930, 95% CI:
        0.890-0.970; IVW-false discovery rate [FDR] P = 4.85 × 10-4) and CD6 (T-cell surface glycoprotein
        CD6 isoform, OR = 0.730, 95% CI: 0.890-0.970; IVW-FDR P = .008).'
