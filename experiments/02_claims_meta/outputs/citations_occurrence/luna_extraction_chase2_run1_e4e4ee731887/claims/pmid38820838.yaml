claims:
  c000:
    quotes:
    - exact: 'This study demonstrated the causal effect of genetically predicted circulating interleukin
        interleukin-16 (IL16) levels on both ALM [odds ratio (OR) = 0.990, 95% confidence interval (CI):
        0.980-1.000, P = 0.049] and grip strength (OR = 0.971, 95% CI: 0.948-0.995, P = 0.020].'
  c001:
    quotes:
    - exact: 'This study demonstrated the causal effect of genetically predicted circulating interleukin
        interleukin-16 (IL16) levels on both ALM [odds ratio (OR) = 0.990, 95% confidence interval (CI):
        0.980-1.000, P = 0.049] and grip strength (OR = 0.971, 95% CI: 0.948-0.995, P = 0.020].'
  c002:
    quotes:
    - exact: Additionally, C-X-C motif chemokine ligand 10 (CXCL10), interleukin-1beta (IL1B), and hepatocyte
        growth factor (HGF) were correlated with ALM, while vascular endothelial growth factor (VEGF),
        interleukin-12 (IL12), and interleukin-15 (IL15) were correlated with grip strength.
