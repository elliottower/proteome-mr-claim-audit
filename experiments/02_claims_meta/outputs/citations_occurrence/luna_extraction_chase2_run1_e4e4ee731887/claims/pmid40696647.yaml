  c003:
    quotes:
    - exact: In contrast, beta-nerve growth factor (β-NGF; OR 1.043 [95% CI 1.000-1.087], P = .048), tumor
        necrosis factor-alpha (TNF-α; OR 1.040 [95% CI 1.001-1.081], P = .042), and macrophage colony
        stimulating factor (M-CSF; OR 1.032 [95% CI 1.001-1.064], P = .043) conferred increased causal
        risks for the development of asthma.
