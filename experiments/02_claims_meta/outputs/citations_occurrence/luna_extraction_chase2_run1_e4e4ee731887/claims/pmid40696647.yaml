claims:
  c000:
    quotes:
    - exact: Genetically predicted levels of the chemokines RANTES (regulated on activation, normal T-cell
        expressed and secreted [CCL5]), monocyte chemoattractant protein-1 (MCP-1), and growth-regulated
        protein alpha (GRO-α) exhibited significant causal associations with reduced asthma susceptibility,
        as evidenced by odds ratios (OR) of 0.935 (95% confidence interval [CI] 0.895-0.978; P = .003),
        0.951 (95% CI 0.916-0.986; P = .007), and 0.968 (95% CI 0.944-0.992; P = .011), respectively.
