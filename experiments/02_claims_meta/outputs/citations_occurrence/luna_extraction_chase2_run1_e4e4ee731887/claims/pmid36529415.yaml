claims:
  c000:
    quotes:
    - exact: 'After FDR adjustment, macrophage colony-stimulating factor (MCSF) and vascular endothelial
        growth factor (VEGF) were identified as causally associated with knee OA (MCSF, odds ratio [OR]:
        1.16, 95% confidence interval [CI]: 1.09-1.23, q = 5.05 × 10-5; VEGF, OR: 1.09, 95% CI: 1.04-1.15,
        q = 0.011).'
  c001:
    quotes:
    - exact: 'After FDR adjustment, macrophage colony-stimulating factor (MCSF) and vascular endothelial
        growth factor (VEGF) were identified as causally associated with knee OA (MCSF, odds ratio [OR]:
        1.16, 95% confidence interval [CI]: 1.09-1.23, q = 5.05 × 10-5; VEGF, OR: 1.09, 95% CI: 1.04-1.15,
        q = 0.011).'
  c002:
    quotes:
    - exact: We also observed that genetically predicted MCSF and VEGF were positively associated with
        the risk of TJA, and MCP3 was negatively associated with for the risk of TJA, although the effects
        seem fairly modest.
