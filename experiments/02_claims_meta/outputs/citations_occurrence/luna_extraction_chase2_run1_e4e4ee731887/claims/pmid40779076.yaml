claims:
  c000:
    quotes:
    - exact: 'For pituitary adenomas, Neurotrophin-3 demonstrated significant protective effects (OR =
        0.754, 95% CI: 0.583-0.975, P = 0.031), while programmed cell death 1 ligand emerged as a risk
        factor (OR = 1.320, 95% CI: 1.016-1.714, P = 0.037).'
  c001:
    quotes:
    - exact: 'For pituitary adenomas, Neurotrophin-3 demonstrated significant protective effects (OR =
        0.754, 95% CI: 0.583-0.975, P = 0.031), while programmed cell death 1 ligand emerged as a risk
        factor (OR = 1.320, 95% CI: 1.016-1.714, P = 0.037).'
  c002:
    quotes:
    - exact: 'Regarding diabetic nephropathy, six inflammatory factors showed significant associations:
        CX3C-motif chemokine 1 (OR = 0.514, P = 0.049), interleukin-13 (OR = 0.822, P = 0.014), TNF-beta
        (OR = 0.903, P = 0.011), and TNF-related activation-induced cytokine (OR = 0.905, P = 0.037) exhibited
        protective effects, whereas macrophage colony-stimulating factor (OR = 1.175, P = 0.026) and matrix
        metalloproteinase-10 (OR = 1.142, P = 0.030) increased disease risk.'
