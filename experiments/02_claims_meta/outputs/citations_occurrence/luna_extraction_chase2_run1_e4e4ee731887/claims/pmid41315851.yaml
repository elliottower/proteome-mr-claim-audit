claims:
  c000:
    quotes:
    - exact: Mendelian randomisation implicated N-palmitoyl glycine (PalGly) in BrS risk and identified
        BrS-associated proteins (DCC, CR1, CTSB, NAAA, DEFB1, EPHA1, IGF1/IGFBP3/ALS, and LTA), for which
        molecular docking further predicted moderate binding affinities with PalGly.
