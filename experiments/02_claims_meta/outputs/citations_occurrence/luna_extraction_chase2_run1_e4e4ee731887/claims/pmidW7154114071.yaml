claims:
  c000:
    quotes:
    - exact: 'Mediation analysis revealed that 39S ribosomal protein L33 (MRPL33) exerts a protective
        effect on overall breast cancer (inverse-variance weighted [IVW] OR=0.978, P= 0.023) was partially
        counteracted by the upregulation of C-C motif chemokine ligand 25 (CCL25) (mediation proportion:
        –7.01%), while NADH dehydrogenase [ubiquinone] iron-sulfur protein 4 (NDUFS4) exerts a risk-promoting
        effect on overall breast cancer (IVW OR=1.017, P= 0.009) and ER-positive (ER+) breast cancer (IVW
        OR=1.017, P= 0.031) was partially attenuated by cluster of differentiation 5 (CD5) downregulation
        (mediation proportions: –9.69% and –15.01%, respectively).'
