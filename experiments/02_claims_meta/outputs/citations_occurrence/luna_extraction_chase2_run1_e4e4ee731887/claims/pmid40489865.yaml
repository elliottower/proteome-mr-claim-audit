claims:
  c000:
    quotes:
    - exact: The MR analysis revealed nominal associations between certain cytokines and the risk of oral
        cancer. Specifically, increased levels of C-X-C motif chemokine ligand 9 (odd ratios [OR] = 0.760,
        0.600-0.962, 95% confidence interval [CI] 0.600-0.962, P = .023), monocyte chemoattractant protein
        1 (OR = 0.78, 95% CI 0.32-0.99, P = .046), and TNF related activation induced cytokine (OR = 0.792,
        95% CI 0.630-0.994, P = .044) were associated with a reduced risk of oral cancer, while higher
        levels of monocyte chemoattractant protein 2 (OR = 1.164, 95% CI 1.001-1.353, P = .048) and CC
        motif chemokine 25 (OR = 1.434, 95% CI 1.106-1.858, P = .006) were linked to an increased risk.
