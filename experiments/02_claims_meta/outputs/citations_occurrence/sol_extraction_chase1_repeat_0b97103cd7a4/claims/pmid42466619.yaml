claims:
  c000:
    quotes:
    - exact: This study suggests that atrazine-related targets may be associated with BC risk through
        pathways involving cellular senescence, human T-cell leukemia virus 1 (HTLV-1) infection, and
        small cell lung cancer pathways, with AKT1, CASP3, HSPA4, CCND1, and MAPK3 as candidate targets.
