claims:
  c000:
    quotes:
    - exact: The primary MR analysis using the IVW method reveals a significant negative correlation between
        Metallothionein-1F (MT-1F), zinc finger protein 134 (ZNF134), calcium/calmodulin-dependent protein
        kinase type 1D (CAMK1D), and EF-hand calcium-binding domain-containing protein 14 (EFCAB14) with
        the occurrence of osteoarthritis (OA) (p value < 0.05).
