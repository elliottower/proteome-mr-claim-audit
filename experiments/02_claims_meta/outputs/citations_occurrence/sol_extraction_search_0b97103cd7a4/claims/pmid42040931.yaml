claims:
  c000:
    quotes:
    - exact: Association and Mendelian Randomization analyses of WMH volume and 2,923 plasma proteins
        in 52,560 UK Biobank participants identified the lysosomal protease cathepsin B (CTSB) and the
        mitochondrial enzyme Enoyl-CoA Hydratase Domain Containing 3 (ECHDC3) as the top candidates associated
        with WMH volume.
