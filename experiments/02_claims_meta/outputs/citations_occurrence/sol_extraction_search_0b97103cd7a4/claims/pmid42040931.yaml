  c004:
    quotes:
    - exact: Single-nucleus RNA sequencing of post-mortem periventricular white matter from 8 individuals
        (4 with WMH lesions and 4 matched controls) revealed a marked downregulation of CTSB in WMH lesions,
        predominantly in astrocytes and oligodendrocytes, whereas ECHDC3 expression was unchanged between
        cases and controls.
