        cases and controls.
  c006:
    quotes:
    - exact: In the UK Biobank, higher plasma CTSB levels and a cis-pQTL polygenic score each predicted
        better general cognitive ability, independent of vascular risk factors, whereas ECHDC3 showed
        no cognitive association.
