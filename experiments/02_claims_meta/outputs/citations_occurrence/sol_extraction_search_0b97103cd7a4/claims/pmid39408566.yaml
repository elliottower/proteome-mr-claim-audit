  c005:
    quotes:
    - exact: Twenty brain-protein-OD pairs were identified by COLOC analysis. Eight pairs (protein-coding
        genes TOM1L2, MXRA7, RHPN2, and HINT1 for senile cataract, WARS1 and TDRD7 for AMD, STAT6 for
        myopia, and TPPP3 for DR) are newly reported in this study.
