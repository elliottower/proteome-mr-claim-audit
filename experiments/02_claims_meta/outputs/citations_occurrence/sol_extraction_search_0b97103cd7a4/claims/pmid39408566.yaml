claims:
  c000:
    quotes:
    - exact: Proteome-wide association studies (PWAS) identified plasma and brain proteins associated
        with ODs, and 11 plasma proteins were identified by Mendelian randomization (MR) and colocalization
        (COLOC) analyses as being potentially causally associated with ODs. Five of these proteins (protein-coding
        genes ECI1, LCT, and NPTXR for glaucoma, WARS1 for age-related macular degeneration (AMD), and
        SIGLEC14 for diabetic retinopathy (DR)) are newly reported.
