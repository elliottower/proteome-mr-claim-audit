  c013:
    quotes:
    - exact: Combined with a drug exploration analysis, we found that the drugs related to C3 and TXN
        have been used for the treatment of ODs, and another eight genes (GSTM3 for senile cataract, IGFBP7
        and CFHR1 for AMD, PTPMT1 for glaucoma, EFEMP1 and ACP1 for myopia, SIRPG and CTSH for DR) are
        promising targets for pharmacological interventions.
