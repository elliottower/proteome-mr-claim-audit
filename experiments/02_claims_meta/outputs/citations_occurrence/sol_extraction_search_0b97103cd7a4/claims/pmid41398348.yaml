claims:
  c000:
    quotes:
    - exact: 'Among 535 tested proteins, three colocalized and demonstrated decreasing effects on BMI
        per standard deviation increase in their level: endoglin (ENG; MR beta: -0.07, 95% CI [-0.10,
        -0.04], P=4.4×10⁻5), fatty acid binding protein 4 (FABP4; MR beta: -0.33, 95% CI [-0.50, -0.16],
        P=1.3×10⁻4), and cell adhesion molecule 1 (CADMI1; MR beta: -0.26, 95% CI [-0.37, -0.15], P=5.45×10⁻5).'
