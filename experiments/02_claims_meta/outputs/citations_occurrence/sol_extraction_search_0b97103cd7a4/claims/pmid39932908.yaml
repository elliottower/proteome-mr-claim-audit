claims:
  c000:
    quotes:
    - exact: 'Four proteins were ultimately found to be reliably and causally associated with three OA-related
        features: DNAJB12 and USP8 were associated with knee OA, IL12B with spinal OA, and RGMB with thumb
        OA. The ORs for the above proteins were 1.51 (95% CI, 1.26-1.81), 1.72 (95% CI, 1.42-2.08), 0.87
        (95% CI, 0.81-0.92), and 0.59 (95% CI, 0.47-0.75), respectively.'
