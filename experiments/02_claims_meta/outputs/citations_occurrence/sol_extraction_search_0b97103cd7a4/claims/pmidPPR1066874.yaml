  c004:
    quotes:
    - exact: Trajectory and pseudotime analyses suggested that the malignant progression of cells may
        be driven by interactions between IL6 and Pan B cells.
  c005:
    quotes:
    - exact: Finally, we demonstrated that IL6 not only influences immunotherapy response but also affects
        targeted therapy response.
