claims:
  c000:
    quotes:
    - exact: We found bidirectional causal effects of interleukin (IL) 6 in ccRCC, indicating a complementary
        and mutually reinforcing relationship.
  c001:
    quotes:
    - exact: Although no statistical differences were observed in IL6 expression between ccRCC and normal
        tissues, plasma IL6 levels in ccRCC patients were significantly higher than in control cases,
        positively correlating with T stage.
