claims:
  c000:
    quotes:
    - exact: 'A total of 17 genes revealed causal associations with ASD and were identified as potential
        targets for ASD patients. Cathepsin B (CTSB) [odd ratio (OR) = 2.66 95, confidence interval (CI):
        1.28-5.52, P = 8.84 × 10-3], gamma-aminobutyric acid type B receptor subunit 1 (GABBR1) (OR =
        1.99, 95CI: 1.06-3.75, P = 3.24 × 10-2), and formin like 1 (FMNL1) (OR = 0.15, 95CI: 0.04-0.58,
        P = 5.59 × 10-3) were replicated in the proteome-wide MR analyses.'
