claims:
  c000:
    quotes:
    - exact: An integrative omics pipeline analysis identified ERAP2 as having putatively causal effects
        on JIA.
  c001:
    quotes:
    - exact: WGS analysis also detected two potentially pathogenic mutations on ERAP2 in sJIA patients.
  c002:
    quotes:
    - exact: ScRNA-seq reveals that ERAP2 expression is significantly elevated in patients with sJIA compared
        to normal and other subtypes, particularly in monocytes.
  c003:
    quotes:
    - exact: 'ScRNA-seq reveals that ERAP2 expression is significantly elevated in patients with sJIA
        compared to normal and other subtypes, particularly in monocytes. Bulk RNA-seq with ROC analysis
        demonstrating significant diagnostic power (AUC = 0.86, 95%CI: 0.71-1.00) in discriminating sJIA
        from healthy controls.'
  c004:
    quotes:
    - exact: Literature and Phe-WAS search revealed that ERAP2 is primarily studied in the context of
        genetic predisposition to disease and is closely related to autoimmune disorders.
  c005:
    quotes:
    - exact: ERAP2 was identified as a candidate associated with JIA, especially sJIA, through integrative
        omics analysis, indicating its potential role in protein-mediated disease mechanisms and therapeutic
        targeting.
