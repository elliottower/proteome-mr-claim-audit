claims:
  c000:
    quotes:
    - exact: Among the 10 causal genes, six genes (<italic>OLFML3</italic>, <italic>PAM</italic>, <italic>ICOSLG</italic>,
        <italic>FCRL3</italic>, <italic>ERAP2</italic>, <italic>IL6R</italic>) were also associated to
        RA at transcriptome level, including the three novel genes (<italic>ICOSLG</italic>, <italic>FCRL3</italic>,
        <italic>ERAP2</italic>) that were not implicated in the original GWAS, which were regarded as
        novel candidate genes for RA.
