  c006:
    quotes:
    - exact: Druggable targets exploration identified 120 drug-gene interactions involving in 7 causal
        PWAS genes, including seven drugs or compounds targeting novel PWAS gene <italic>ERAP2</italic>
        and <italic>ICOSLG</italic>, which possesses superior anti-inflammatory and anti-rheumatic activity
        in autoimmune diseases, hence might be candidates for treating RA.
