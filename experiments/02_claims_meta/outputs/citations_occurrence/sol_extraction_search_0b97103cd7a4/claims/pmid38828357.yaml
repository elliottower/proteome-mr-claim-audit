claims:
  c000:
    quotes:
    - exact: The PWAS identified 22 plasma proteins significantly associated with CKD. Of them, the significant
        associations of three proteins (INHBC, LMAN2, and SNUPN) were replicated in the GWASs of eGFR,
        and BUN.
