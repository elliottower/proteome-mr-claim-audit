  c000:
    quotes:
    - exact: Forward MR indicated that a higher TGFBR2/THBD ratio was associated with increased risk of
        any ischemic stroke (AIS) (OR = 1.15; 95% CI, 1.09–1.21; p = 4.07e-7).
  c001:
    quotes:
    - exact: A higher GP1BA/SDC4 ratio was associated with increased risk of small-vessel stroke (SVS)
        (OR = 1.25; 95% CI, 1.14–1.37; p = 2.25e-6), whereas a higher SDC4/SEMA4D ratio was associated
        with lower SVS risk (OR = 0.82; 95% CI, 0.76–0.89; p = 1.18e-6).
