        FEV₁ (β = 0.008 to 0.015) and FEV₁/FVC% (β = 0.014 to 0.026).
  c002:
    quotes:
    - exact: We identified serpin family G member 1 (SERPING1) as a robust causal candidate, with consistent
        pQTL associations with COPD (β = -0.038 to -0.006) and with lung function measures, including
        FEV₁ (β = 0.008 to 0.015) and FEV₁/FVC% (β = 0.014 to 0.026).
  c003:
    quotes:
    - exact: 'Longitudinal analyses in the UK Biobank (n = 46,369) and ECOPD cohort (n = 576) revealed
        that higher circulating SERPING1 protein levels were causally linked to slower FEV₁ decline during
        early follow-up (UKB: adjusted difference = -22.1 mL/year per standardized unit; ECOPD: -0.73
        mL/year per ng/mL), accompanied by marked expression differences between European (higher) and
        Asian (lower) smokers and COPD patients.'
