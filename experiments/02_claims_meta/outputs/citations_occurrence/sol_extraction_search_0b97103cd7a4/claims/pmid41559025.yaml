        early follow-up (UKB: adjusted difference = -22.1 mL/year per standardized unit; ECOPD: -0.73
        mL/year per ng/mL), accompanied by marked expression differences between European (higher) and
        Asian (lower) smokers and COPD patients.'
  c005:
    quotes:
    - exact: In a murine model exposed to cigarette smoke, AAV-mediated SERPING1 overexpression improved
        lung function, reduced alveolar destruction, and upregulated the expression of fibroblast elastic
        fiber-related genes.
