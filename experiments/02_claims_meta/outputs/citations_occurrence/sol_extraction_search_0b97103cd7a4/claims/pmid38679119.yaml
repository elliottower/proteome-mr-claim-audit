claims:
  c000:
    quotes:
    - exact: SGLT2 inhibition (per 1 SD decrement in HbA1c) was associated with reduced risk of MI (odds
        ratio [OR] = 0.462, [95% CI 0.222, 0.958], P = 0.038).
  c001:
    quotes:
    - exact: Mediation analysis showed evidence of the indirect effect of SGLT2 inhibition on MI through
        APOB (β = -0.557, 95%CI [-1.098, -0.155]) with a mediated proportion of 72%, and CCL17 (β = -0.176,
        95%CI [-0.332, -0.056]) with a mediated proportion of 17%.
  c002:
    quotes:
    - exact: Mediation analysis showed evidence of the indirect effect of SGLT2 inhibition on MI through
        APOB (β = -0.557, 95%CI [-1.098, -0.155]) with a mediated proportion of 72%, and CCL17 (β = -0.176,
        95%CI [-0.332, -0.056]) with a mediated proportion of 17%.
  c003:
    quotes:
    - exact: The meta-analysis result showed that SGLT2 inhibition was associated with a lower risk of
        CHD.
