claims:
  c000:
    quotes:
    - exact: Screening identified 647 smoking-associated proteins, with Retinol-Binding Protein 5 (RBP5)
        identified as a critical causal mediator of LAS.
  c001:
    quotes:
    - exact: In HASMCs, RBP5 promoted a phenotypic switch from contractile to synthetic states, accelerating
        proliferation via cell cycle and ribosomal biogenesis pathways.
  c002:
    quotes:
    - exact: In HASMCs, RBP5 promoted a phenotypic switch from contractile to synthetic states, accelerating
        proliferation via cell cycle and ribosomal biogenesis pathways.
  c003:
    quotes:
    - exact: Conversely, in HUVECs, RBP5 exacerbated endothelial dysfunction, amplified inflammatory signaling
        (NF-κB/TNF), and impaired DNA repair mechanisms, leading to barrier disruption.
