claims:
  c000:
    quotes:
    - exact: The results showed that 10 plasma proteins had a causal relationship with glioma, with five
        being risk factors (SIRPB1, RACGAP1, MLN, CHST9, TPST2) and five being protective factors (IL18R1,
        FCRL3, TAPBPL, ERAP1, TDGF1).
