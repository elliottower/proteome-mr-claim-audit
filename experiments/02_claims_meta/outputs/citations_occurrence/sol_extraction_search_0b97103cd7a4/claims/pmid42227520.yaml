claims:
  c000:
    quotes:
    - exact: Of the 2,994 circulating proteins examined, 11 showed evidence of a potential causal relationship
        with POP after multiple testing correction. Among these, soluble Tie2 (sTie2) emerged as a prominent
        candidate, with similar effect estimates observed across independent datasets.
  c001:
    quotes:
    - exact: Elevated circulating sTie2 levels in POP patients were further supported by ELISA measurements.
  c002:
    quotes:
    - exact: Further two-step MR analysis identified 27 metabolites linked to sTie2, with paraxanthine
        showing a significant positive association with POP susceptibility.
