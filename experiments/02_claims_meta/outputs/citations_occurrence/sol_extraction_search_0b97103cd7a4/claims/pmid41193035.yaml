claims:
  c000:
    quotes:
    - exact: Genetically raised levels of tyrosine-protein kinase receptor TYRO3, intercellular adhesion
        molecule 2, sortilin (SORT1), and sialomucin core protein 24 were associated with increased T2D
        risk, whereas catechol O-methyltransferase, CD2-associated protein, matrix metalloproteinase-12,
        nectin-2 (NECTIN2), reticulon-4 receptor (RTN4R), and fibroblast growth factor 21 were inversely
        associated (false discovery rate-adjusted P < 0.05).
