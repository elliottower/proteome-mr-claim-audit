claims:
  c000:
    quotes:
    - exact: Validation in the KORA Age1/Age2 study replicated 7 proteins associated with hypertension
        and 23 associated with SBP. Three proteins, NT-proBNP (N-terminal pro-B-type natriuretic peptide),
        KIM1 (kidney injury molecule 1), and OPG (osteoprotegerin), consistently showed positive associations
        with both outcomes.
