claims:
  c000:
    quotes:
    - exact: We identified 30 unique significant PWAS risk genes for AD dementia, including 11 for brain,
        9 for CSF, and 16 for plasma tissues. Four of these were shared by at least two tissues, and gene
        MAPK3 was found in all three tissues.
