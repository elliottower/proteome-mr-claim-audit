  sha256: 088852fdb51547091ea16af6d036c25b8ce15e8fd4dc9c28794605c975e67ec6
  url: https://pubmed.ncbi.nlm.nih.gov/38898508/
  note: abstract text exactly as sent to the extractor
claims:
  c000:
    quotes:
    - exact: Leveraging pQTLs of 3032 proteins from 3 large-scale GWASs and corresponding blood- and tissue-specific
        eQTLs, we identified 32 proteins associated with CKD, which were validated across diverse CKD
        datasets, kidney function indicators, and clinical types. Notably, 12 proteins with prior MR support,
        including fibroblast growth factor 5 (FGF5), isopentenyl-diphosphate delta-isomerase 2 (IDI2),
        inhibin beta C chain (INHBC), butyrophilin subfamily 3 member A2 (BTN3A2), BTN3A3, uromodulin
        (UMOD), complement component 4A (C4a), C4b, centrosomal protein of 170 kDa (CEP170), serologically
        defined colon cancer antigen 8 (SDCCAG8), MHC class I polypeptide-related sequence B (MICB), and
        liver-expressed antimicrobial peptide 2 (LEAP2), were confirmed.
