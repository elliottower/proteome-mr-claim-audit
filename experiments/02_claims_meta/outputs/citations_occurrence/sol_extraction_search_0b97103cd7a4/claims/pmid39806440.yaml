claims:
  c000:
    quotes:
    - exact: In plasma, we observed that an increase of one standard deviation in IL1R1[1.30 (95% CI 1.20-1.42)],
        IL7R[1.07 (95% CI 1.04-1.11)], ECM1[1.03 (95% CI 1.02-1.05)], and CD200R1[1.18 (95% CI 1.09-1.27)]
        were associated with an increased risk of asthma, while an increase in ADAM19 [0.87 (95% CI 0.82-0.92)]
        was found to be protective.
