claims:
  c000:
    quotes:
    - exact: In a meta-analysis of genome-wide association studies of 60,314 sepsis cases and 1,464,733
        controls, we identified four genome-wide significant loci, including a missense variant in SERPINA1,
        encoding alpha-1 antitrypsin (AAT), that was also associated with 30-day sepsis mortality in the
        UK Biobank.
  c001:
    quotes:
    - exact: In a meta-analysis of genome-wide association studies of 60,314 sepsis cases and 1,464,733
        controls, we identified four genome-wide significant loci, including a missense variant in SERPINA1,
        encoding alpha-1 antitrypsin (AAT), that was also associated with 30-day sepsis mortality in the
        UK Biobank.
  c002:
    quotes:
    - exact: Mendelian randomization (MR) and colocalization analyses supported a causal and protective
        effect of higher genetically predicted circulating AAT levels on sepsis risk.
  c003:
    quotes:
    - exact: Mendelian randomization (MR) and colocalization analyses supported a causal and protective
        effect of higher genetically predicted circulating AAT levels on sepsis risk. The protective association
        was highly specific to acute infectious phenotypes, including pneumonia, and was not observed
        for non-infectious traits.
  c004:
    quotes:
    - exact: Mendelian randomization (MR) and colocalization analyses supported a causal and protective
        effect of higher genetically predicted circulating AAT levels on sepsis risk. The protective association
        was highly specific to acute infectious phenotypes, including pneumonia, and was not observed
        for non-infectious traits.
  c005:
    quotes:
    - exact: In two independent cohorts (UK Genomic Advances in Sepsis and the Biobanque Québécois sur
        la COVID-19), circulating AAT increased markedly during acute illness but was significantly attenuated
        among missense variant carriers in a dose-dependent manner, consistent with impaired protease-antiprotease
        balance.
