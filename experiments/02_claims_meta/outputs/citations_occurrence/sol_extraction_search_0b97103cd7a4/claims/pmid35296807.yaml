claims:
  c000:
    quotes:
    - exact: Addressing this, we aimed to highlight potentially causal genes by systematically integrating
        the brain and blood protein and expression quantitative trait loci (QTL) data with a depression
        GWAS dataset via a statistical framework including Mendelian randomization (MR), Bayesian colocalization,
        and Steiger filtering analysis. In summary, we identified three candidate genes (TMEM106B, RAB27B,
        and GMPPB) based on brain data and two genes (TMEM106B and NEGR1) based on blood data with consistent
        robust evidence at both the protein and transcriptional levels.
