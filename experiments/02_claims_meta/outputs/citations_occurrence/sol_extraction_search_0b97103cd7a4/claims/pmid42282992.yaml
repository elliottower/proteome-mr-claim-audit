claims:
  c000:
    quotes:
    - exact: Using two-sample MR with plasma pQTL data from the deCODE cohort and the UK Biobank Pharma
        Proteomics Project and PC genome-wide association summary statistics from FinnGen, we screened
        159 FerrDb-defined ferroptosis-related proteins and identified three ferroptosis-related proteins
        (CTSB, IDO1, and MDM4) with significant causal effects on PC risk.
