  c000:
    quotes:
    - exact: The mediation analysis results indicate that HLA-DRA significantly increases the risk of
        developing ovarian endometriosis by inhibiting the expression of CREB3L4 (with a mediation proportion
        of 13.99 %), and the direction of the mediation effect is consistent with the total effect.
