  c000:
    quotes:
    - exact: Phenome-wide analysis highlights the significance of pain-related proteome on diverse facets
        of human health, and in-depth Mendelian randomization validates 10 proteins (CD302, RARRES2, TNFRSF1B,
        BTN2A1, TNFRSF9, COL18A1, TNF, CD74, TNFRSF4, and BTN2A1) as markers of chronic pain.
