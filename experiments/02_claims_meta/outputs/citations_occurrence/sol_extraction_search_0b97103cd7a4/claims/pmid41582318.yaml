  c038:
    quotes:
    - exact: Finally, GDF15, ITGAV, ITGAM, ITGA11, HPGDS, GFAP, ADM, AHNAK, and DPP4 were among 21 unique
        proteins found to mediate the relationship of PA with all-cause dementia, implicating processes
        such as synaptic plasticity, neurogenesis, and inflammation.
