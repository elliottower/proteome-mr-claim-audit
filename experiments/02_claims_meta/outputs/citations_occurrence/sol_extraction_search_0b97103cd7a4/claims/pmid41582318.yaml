claims:
  c000:
    quotes:
    - exact: Both conventional observational and Mendelian randomization study designs converged on proteins
        that appear to increase as a result of PA, including integrins such as ITGAV and ITGAM, as well
        as MXRA8, CLEC4A, CLEC4M, LPL, and ADGRG2; and on proteins that appear to decrease as a result
        of PA such as LEP, INHBC, CLMP, PTGDS, ADM, OGN, and PI3; and on proteins that are more responsive
        to high-intensity PA, such as CA14, CA6, CA4, KIT, and ANGPT2.
