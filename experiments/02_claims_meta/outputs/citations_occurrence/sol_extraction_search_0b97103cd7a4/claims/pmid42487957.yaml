claims:
  c000:
    quotes:
    - exact: 'Genetically predicted higher levels of thioredoxin domain-containing protein 12 (TXNDC12)
        were associated with an increased risk of PKOA (OR = 1.38, 95%CI: 1.27-1.50, P = 9.33 × 10-15),
        whereas growth/differentiation factor 2 (GDF2) was associated with a reduced risk (OR = 0.93,
        95%: CI; 0.89-0.98, P = 4.17 × 10-2).'
