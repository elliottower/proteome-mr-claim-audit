claims:
  c000:
    quotes:
    - exact: Multi-omics integration revealed four key biomarkers (transforming growth factor beta 3 (TGFB3),
        insulin-like growth factor binding protein 6 (IGFBP6), Golgi membrane protein 1 (GOLM1), and serpin
        family F member 1 (SERPINF1)) with distinct spatial expression patterns and links to tumor progression
        and immune modulation.
