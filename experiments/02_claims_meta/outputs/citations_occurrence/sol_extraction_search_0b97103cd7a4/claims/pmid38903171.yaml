claims:
  c000:
    quotes:
    - exact: SMR and colocalization analysis jointly identified risk-associated proteins for AMD and its
        subtypes, including 5 proteins (WARS1, BRD2, IL20RB, TGFB1, TNFRSF10A) associated with AMD, 2
        proteins (WARS1, IL20RB) associated with Dry-AMD, and 9 proteins (COL10A1, WARS1, VTN, SDF2, LBP,
        CD226, TGFB1, TNFRSF10A, CSF2) associated with Wet-AMD.
