claims:
  c000:
    quotes:
    - exact: Here we show that nine circulating proteins associate with forearm fracture risk, including
        sclerostin and osteoprotegerin targeted by existing osteoporosis treatments, and three other known
        bone-related proteins, providing proof of concept for our MRpipeline.
  c001:
    quotes:
    - exact: Here we show that nine circulating proteins associate with forearm fracture risk, including
        sclerostin and osteoprotegerin targeted by existing osteoporosis treatments, and three other known
        bone-related proteins, providing proof of concept for our MRpipeline.
  c002:
    quotes:
    - exact: Notably, we identify ephrin-A1 as a novel protective factor against fractures, a membrane-linked
        protein partly released into circulation that binds its high-affinity receptor EphA2 on osteoblasts.
  c003:
    quotes:
    - exact: Experimental models and genetic analyses indicate that ephrin-A1 increases bone mineral density,
        supporting a mechanism by which this pathway may mediate fracture protection.
