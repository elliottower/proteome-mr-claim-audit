claims:
  c000:
    quotes:
    - exact: 'The MR study revealed five plasma proteins as protective factors and nine as risk factors
        for PCa (PFDR < 0.05). Subsequent analyses identified SCP2 (OR: 2.10, 95% CI:1.45-3.03, PFDR =
        0.027) and C5 (OR: 1.23, 95% CI:1.10-1.37, PFDR = 0.037) as promising drug targets.'
