claims:
  c000:
    quotes:
    - exact: Six plasma proteins were identified as potential mediators for the hypertension history,
        with secretory leukocyte peptidase inhibitor (SLPI) explaining the largest proportion of the effect
        (13.3%). Ankyrin Repeat and SOCS Box Containing 9 (ASB9) was found to mediate the effects for
        both hypertension history (3.56%) and SBP (4.31%) to RVAO.
