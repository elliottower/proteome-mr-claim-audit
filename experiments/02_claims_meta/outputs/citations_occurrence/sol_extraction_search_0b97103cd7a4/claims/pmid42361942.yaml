claims:
  c000:
    quotes:
    - exact: Integrating Bayesian colocalization and single-cell expression profiling, we identified FES
        as a potential therapeutic target for atherosclerosis.
  c001:
    quotes:
    - exact: We found that FES expression was significantly reduced in atherosclerotic plaques of ApoE-/-
        mice fed a high-fat diet.
  c002:
    quotes:
    - exact: Notably, intravenous delivery of recombinant adeno-associated virus (rAAV)-mediated FES overexpression
        significantly reduced inflammatory responses and lipid deposition in atherosclerotic plaques.
  c003:
    quotes:
    - exact: Notably, intravenous delivery of recombinant adeno-associated virus (rAAV)-mediated FES overexpression
        significantly reduced inflammatory responses and lipid deposition in atherosclerotic plaques.
  c004:
    quotes:
    - exact: Computational predictions coupled with biochemical experiments revealed that FES-mediated
        atheroprotection is accomplished through upregulation of Arg1.
  c005:
    quotes:
    - exact: Furthermore, we observed that FES increases Arg1 expression by activating the transcription
        factor PU.1 and promoting its nuclear translocation.
