claims:
  c000:
    quotes:
    - exact: Following systematic cross-ancestry screening of 2719 plasma proteins, FGF5 was identified
        as the core candidate protein, with its circulating pQTL signals showing strong colocalization
        with CVDs, CKD, and cardiorenal-related phenotypes.
