  c002:
    quotes:
    - exact: Following systematic cross-ancestry screening of 2719 plasma proteins, FGF5 was identified
        as the core candidate protein, with its circulating pQTL signals showing strong colocalization
        with CVDs, CKD, and cardiorenal-related phenotypes.
  c003:
    quotes:
    - exact: MR analysis suggested that genetically predicted elevation in circulating FGF5 levels was
        significantly associated with an increased risk of CVD, with 42.9–66.7% of this association potentially
        mediated by blood pressure.
  c004:
    quotes:
    - exact: In contrast, MR analyses suggested a potentially protective effect of elevated FGF5 levels
        on CKD, with 8.4–11.8% of the association potentially mediated by uric acid.
  c005:
    quotes:
    - exact: Clinical observational analyses provided complementary support for this bidirectional association
        pattern, with plasma FGF5 levels showing a positive linear association with CVD risk and a nonlinear
        U-shaped association with CKD prevalence.
