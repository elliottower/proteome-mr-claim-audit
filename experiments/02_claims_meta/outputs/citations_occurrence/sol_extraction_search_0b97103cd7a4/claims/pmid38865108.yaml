  c006:
    quotes:
    - exact: 'Using cis-MR, genetically predicted levels of TGFBR3 were associated with SBP, hypertension,
        and CVD events (SBP: β, -0.38; 95% CI, -0.64 to -0.11; P = .006; hypertension: odds ratio [OR],
        0.99; 95% CI, 0.98-0.99; P < .001; heart failure with hypertension: OR, 0.86; 95% CI, 0.77-0.97;
        P = .01; CVD: OR, 0.84; 95% CI, 0.77-0.92; P = 8 × 10-5; cerebrovascular events: OR, 0.77; 95%
        CI, 0.70-0.85; P = 5 × 10-7).'
