claims:
  c000:
    quotes:
    - exact: 'Transforming growth factor β receptor 3 (TGFBR3) and prostaglandin D2 synthase (PTGDS) had
        the strongest association with exercise systolic BP (SBP) and diastolic BP (DBP), respectively
        (TGFBR3: exercise SBP, β estimate, -3.39; 95% CI, -4.79 to -2.00; P = 2.33 × 10-6; PTGDS: exercise
        DBP β estimate, -2.50; 95% CI, -3.29 to -1.70; P = 1.18 × 10-9).'
  c001:
    quotes:
    - exact: 'Transforming growth factor β receptor 3 (TGFBR3) and prostaglandin D2 synthase (PTGDS) had
        the strongest association with exercise systolic BP (SBP) and diastolic BP (DBP), respectively
        (TGFBR3: exercise SBP, β estimate, -3.39; 95% CI, -4.79 to -2.00; P = 2.33 × 10-6; PTGDS: exercise
        DBP β estimate, -2.50; 95% CI, -3.29 to -1.70; P = 1.18 × 10-9).'
  c002:
    quotes:
    - exact: 'In fully adjusted models, TGFBR3 was inversely associated with incident hypertension in
        FHS, JHS, and MESA (hazard ratio [HR]: FHS, 0.86; 95% CI, 0.75-0.97; P = .01; JHS, 0.87; 95% CI,
        0.77-0.97; P = .02; MESA, 0.84; 95% CI, 0.71-0.98; P = .03; pooled cohort, 0.86; 95% CI, 0.79-0.92;
        P = 6 × 10-5).'
