claims:
  c000:
    quotes:
    - exact: An additive interaction was observed between UHI exposure and genetic risk for RA. Proteomic
        analyses suggested that this association may involve not only canonical immune-inflammatory pathways,
        but also hypoxia response and protein transport, with CD40, VCAM1, and SUGP1 emerging as potential
        molecular mediators.
