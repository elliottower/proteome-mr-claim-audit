claims:
  c000:
    quotes:
    - exact: Analysis scripts (R/Python), derived Mendelian-randomization and colocalization results,
        cis-pQTL re-analysis, phenome-wide association (PheWAS) results, and supplementary tables for
        the vitiligo proteome-wide MR study. The record dissociates the 12q24/SH2B3 trans-pQTL signal
        from cis-genetic protein effects and does not support LAG3 or IL2RB as cis-genetic causal targets.
