    - exact: This study maps putative causal POAG proteins to conventional outflow pathway cells, highlighting
        SEL1L as a novel target for TM homeostasis and TFPI for drug repurposing, thereby providing data-driven
        hypotheses to facilitate precision glaucoma therapeutics.
