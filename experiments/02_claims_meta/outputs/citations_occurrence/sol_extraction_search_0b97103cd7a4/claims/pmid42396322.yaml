claims:
  c000:
    quotes:
    - exact: Proteome-wide MR prioritized 29 proteins for BMI-subtracted T2D. Thirteen showed eQTL colocalization
        in at least one tissue, implicating liver and intermediary metabolism (GCDH, NOTCH2), pancreatic
        islet biology (CTRB2, MANBA), adipose and Wnt signaling (RSPO3, GALNT3), and whole blood regulatory
        signals (PAM, SNUPN).
