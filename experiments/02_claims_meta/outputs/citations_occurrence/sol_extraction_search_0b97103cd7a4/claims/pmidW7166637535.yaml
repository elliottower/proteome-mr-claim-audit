  c005:
    quotes:
    - exact: CD40 emerged as the most robust candidate, demonstrating consistent evidence across all omics
        levels (Tier 1), with two hypomethylated CpG sites (cg11841529, cg24575067) significantly associated
        with increased LAAS risk (OR = 1.58-2.13). Tissue-specific analyses revealed CD40's protective
        effects were strongest in transverse colon (OR = 0.52) and adipose tissues, while ITGAV showed
        risk-enhancing effects in visceral adipose (OR = 1.64).
