claims:
  c000:
    quotes:
    - exact: The identified biomarkers suggest a role of both brain specific and systemic immune response
        in the aetiology of schizophrenia, Alzheimers disease, depression, and bipolar disorder. Of the
        identified biomarkers, 20 appeared to be therapeutically tractable, including ACE , TNFRSF17 ,
        SERPING1 , AGER and CD40, with drugs approved or in advanced clinical trials.
