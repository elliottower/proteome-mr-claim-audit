claims:
  c000:
    quotes:
    - exact: Under the threshold of False discovery rate (FDR) < 0.05, results showed that S100A16 was
        protective protein and S100A14 was risk protein for human epidermal growth factor receptor 2-positive
        (HER-positive) breast cancer, phosphodiesterase 5A (PDE5A) was risk protein for colorectal cancer,
        and melanoma inhibitory activity (MIA) was protective protein for non-small cell lung carcinoma
        (NSCLC).
