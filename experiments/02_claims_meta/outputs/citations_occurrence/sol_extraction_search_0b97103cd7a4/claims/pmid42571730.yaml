claims:
  c000:
    quotes:
    - exact: Proteome-wide MR analysis identified multiple circulating proteins associated with AD risk.
        Integration with transcriptomic data identified AIF1 (allograft inflammatory factor 1) as a shared
        candidate supported by both genetic prioritization and differential expression analysis.
  c001:
    quotes:
    - exact: Although bulk transcriptomic data showed reduced AIF1 expression in AD, single-cell analysis
        revealed distinct cell type-specific expression patterns, with predominant enrichment in monocytes
        and other innate immune populations.
  c002:
    quotes:
    - exact: PBMC-based qPCR further confirmed an overall reduction in AIF1 expression in AD.
