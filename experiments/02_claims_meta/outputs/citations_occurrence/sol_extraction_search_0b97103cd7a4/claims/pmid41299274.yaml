  c006:
    quotes:
    - exact: Colocalization analysis further identified only PCSK9 (Proprotein convertase subtilisin/kexin
        type 9) shared a causative genetic variant with AF/AFL (PP.H4 > 0.8).
  c007:
    quotes:
    - exact: TWAS analysis also provided strong evidence to the association between PCSK9 and risks of
        AF/AFL.
  c008:
    quotes:
    - exact: Moreover, MVMR analysis revealed that LDL-C, systolic/diastolic blood pressure, and inflammatory
        factors may exert partial mediation effects on the causal relationship between PCSK9 and AF/AFL.
