  c005:
    quotes:
    - exact: Several proteins were found to mediate the associations between some modifiable factors and
        CAD, with PCSK9, C1S, AGER (advanced glycosylation end product-specific receptor), and MST1 (mammalian
        Ste20-like kinase 1) exhibiting highest frequency among the mediating networks.
