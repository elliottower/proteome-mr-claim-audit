claims:
  c000:
    quotes:
    - exact: Genetically predicted levels of 41 circulating proteins were associated with CAD, and 17
        of them were supported by medium to high colocalization evidence. PTK7 (protein tyrosine kinase-7),
        RGMB (repulsive guidance molecule BMP co-receptor B), TAGLN2 (transgelin-2), TIMP3 (tissue inhibitor
        of metalloproteinases 3), and VIM (vimentin) were identified as promising therapeutic targets.
