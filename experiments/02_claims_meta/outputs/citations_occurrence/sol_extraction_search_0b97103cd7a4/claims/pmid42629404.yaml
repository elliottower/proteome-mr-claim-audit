claims:
  c000:
    quotes:
    - exact: The methylation of SRA1 at cg02434007 in the brain was associated with increased expression
        of SRA1 and a high risk of PPD, which aligns with the positive effect of SRA1 gene expression
        on PPD risk.
  c001:
    quotes:
    - exact: Across the two proteome datasets, the genetically predicted levels of 18 plasma proteins
        were nominally significantly associated with PPD, and the expression of steroid receptor RNA activator
        1 (SRA1), a regulator of steroid hormone signalling, was significantly associated with PPD. SRA1,
        angiotensinogen (AGT, a key mediator of the renin-angiotensin and stress-response system), and
        glycerol-3-phosphate phosphatase (PGP, involved in lipid metabolism and cellular stress) showed
        increased colocalisation.
