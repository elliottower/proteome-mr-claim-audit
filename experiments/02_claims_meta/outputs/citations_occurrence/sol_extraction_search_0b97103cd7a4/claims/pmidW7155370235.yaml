  c002:
    quotes:
    - exact: Withthemicroarraydata, averagetranscriptlevels before the age of one for PDCD1 and CD48 were
        nominally associated with incident IA developed within the next six years of follow-up (N = 104
        pairs), and those for PDCH17 and AGR2 were nominally associated with incident T1D (N = 54 pairs).
