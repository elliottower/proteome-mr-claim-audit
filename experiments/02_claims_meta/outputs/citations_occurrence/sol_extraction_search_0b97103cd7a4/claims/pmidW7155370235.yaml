  c009:
    quotes:
    - exact: 'By systematically assessing several lines of evidence in support of causality of each of
        the 49 putative core proteins in T1D and reviewing what is known about their safety and technical
        feasibility as possible drug targets, the 49 proteins were classified into four categories: (1)
        strong causal evidence with existing drugs in clinical pipelines (PDCD1, CD274, LAG3, CD28, and
        TNFRSF4); (2) strong causal evidence with agents at preclinical stages (LGALS9, IDO1, and TIGIT);
        (3) strong causal evidence but requiring further evaluation of technical feasibil ity (CD5, CD48,
        NCR1, KLRB1, CXCL9, CXCL10, CXCL11, CCL19, FASLG, NOTCH1, and DLL1); and (4) requiring further
        validation of causal relationships (including all the pancreatic and gut proteins and'
