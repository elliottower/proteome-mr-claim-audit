claims:
  c000:
    quotes:
    - exact: The strongest association was with PDCD1 (log odds ratio = 0.21, p = 6 ×10−24). Of the 27
        putative core proteins, 11 were supported by a dose response relationship in the MR analysis;
        rare variants in PDCD1 had been discovered to cause autoimmune diabetes; CXCL9 was supported with
        a cis score association of T1D; 4 are located within 200 kb from previously reported T1D GWAS
        hits for T1D; 11 were supported by protein associations; 9 were supported by experimental perturbation
        in mouse models; and 1 was supported by drug effects in humans.
  c001:
    quotes:
    - exact: Of the 27 putative core proteins, 11 were supported by a dose response relationship in the
