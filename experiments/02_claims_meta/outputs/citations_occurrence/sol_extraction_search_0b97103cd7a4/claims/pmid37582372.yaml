claims:
  c000:
    quotes:
    - exact: Given that a multi-trait approach increases the power to detect meaningful variants/genes,
        we conduct multi-omics and multi-trait analyses, followed by network connectivity investigations,
        and prioritize 30 potential therapeutic targets for dyslipidemia, including SORT1, PSRC1, CELSR2,
        PCSK9, HMGCR, APOB, GRN, HFE2, FJX1, C1QTNF1, and SLC5A8.
