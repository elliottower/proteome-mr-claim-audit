claims:
  c000:
    quotes:
    - exact: By integrating Mendelian Randomization (MR) and colocalization analysis on eQTL and pQTL
        data, we prioritized seven genetically supported druggable genes, including MAPT, TNFSF12, GZMB,
        SIRPB1, GNLY, NMB, and C1RL, as promising targets for brain aging.
