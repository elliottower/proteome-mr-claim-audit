claims:
  c000:
    quotes:
    - exact: After validating Mendelian randomization assumptions and colocalization evidence, we found
        that genetically predicted circulating abundances of CTSH (OR=1.17 per one standard deviation
        increase; 95% CI:1.10-1.24), IL27RA (OR=1.13; 95% CI:1.07-1.19), SIRPG (OR=1.37; 95% CI:1.26-1.49),
        and PGM1 (OR=1.66; 95% CI:1.40-1.96) were associated with the risk of type 1 diabetes.
