claims:
  c000:
    quotes:
    - exact: This two-step MR approach found that increased circulating nephronectin (NPNT) levels were
        associated with an increased risk of critically ill and COVID-19 hospitalization.
  c001:
    quotes:
    - exact: This two-step MR approach found that increased circulating nephronectin (NPNT) levels were
        associated with an increased risk of critically ill and COVID-19 hospitalization.
  c002:
    quotes:
    - exact: To ensure the robustness of our findings, we repeated the analyses using body fat percentage
        and cis-pQTLs from different cohorts, which consistently showed that NPNT partially mediates the
        effect of obesity on COVID-19 severity.
  c003:
    quotes:
    - exact: To ensure the robustness of our findings, we repeated the analyses using body fat percentage
        and cis-pQTLs from different cohorts, which consistently showed that NPNT partially mediates the
        effect of obesity on COVID-19 severity. In further follow-up analyses for NPNT, we showed that
        a specific NPNT isoform drives the effect.
  c004:
    quotes:
    - exact: Finally, multivariable MR revealed that decreasing body fat mass and increasing fat-free
        mass can lower NPNT levels and thus may improve COVID-19 severity—underscoring NPNT’s potential
        clinical relevance and actionability.
  c005:
    quotes:
    - exact: Among them, circulating collagen type VI alpha-3 (COL6A3) was strongly increased by BMI and
        increased the risk of CAD.
  c006:
    quotes:
    - exact: In follow-up analysis for COL6A3, we evaluated the causal effect of its C- and N-terminal
        effects on CAD. This domain-aware MR found that the C-terminal fragment of COL6A3, known as endotrophin,
        mediated the effect.
  c007:
    quotes:
    - exact: This integrative proteogenomics approach prioritizes potential therapeutic targets, including
        NPNT for COVID-19 and endotrophin for CAD
