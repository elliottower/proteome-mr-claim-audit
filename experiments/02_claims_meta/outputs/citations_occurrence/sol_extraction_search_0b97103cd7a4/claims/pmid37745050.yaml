claims:
  c000:
    quotes:
    - exact: 'Seven significant (p < 6.81 × 10-5) plasma protein-SCLC pairs were identified by MR analysis,
        including ACP5 (OR = 0.76, 95% CI: 0.67-0.86), CPB2 (OR = 0.90, 95% CI: 0.86-0.95), GSTM3 (OR
        = 0.45, 95% CI: 0.33-0.63), SHMT1 (OR = 0.74, 95% CI: 0.64-0.86), CTSB (OR = 0.79, 95% CI: 0.71-0.88),
        NTNG1 (OR = 0.81, 95% CI: 0.74-0.90) and FAM171B (OR = 1.40, 95% CI: 1.21-1.62).'
