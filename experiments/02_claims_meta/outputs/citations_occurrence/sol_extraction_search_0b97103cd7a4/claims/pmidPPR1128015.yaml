claims:
  c000:
    quotes:
    - exact: 'Our fully adjusted model identified 55 proteins significantly associated with AS incidence,
        with GDF15 showing the strongest association (HR=1.93 per SD, 95% CI: 1.67–2.23, P value = 3.3E-19).'
  c001:
    quotes:
    - exact: In sex-stratified analyses, 10 proteins showed a significant association with AS incidence
        in women, including 5 more strongly associated in women (CD38, CD80, IGFBPL1, NFASC, SERPINA9,
        P interaction <0.05), whereas 16 proteins were identified in men including 1 protein (REG1A) with
        a significantly stronger association in men.
