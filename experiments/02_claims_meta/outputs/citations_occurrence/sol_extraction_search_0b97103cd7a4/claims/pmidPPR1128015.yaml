  c007:
    quotes:
    - exact: pQTL-MR suggested a potential causal role for 4 proteins (PCSK9, CHI3L1, NFASC, PRSS8). Transcriptomic
        integration confirmed high aortic valve expression for 11 candidates, with three genes demonstrating
        significant associations in aortic valve eQTL MR analyses, including LTBP2, for which the pQTL
        and eQTL colocalized.
