  c004:
    quotes:
    - exact: The MR analysis identified GREM1, DKKL1, and CHRDL2 as plasma proteins whose genetically
        predicted levels were positively associated with CRC risk, whereas TMEM132A was inversely associated
        with CRC risk (P_fdr < 0.05). The colocalization analysis identified these four proteins as shared
        variation with CRC (PPH3 + PPH4 > 0.7), suggesting that these proteins represent potential direct
        targets for CRC intervention.
