  c000:
    quotes:
    - exact: Of 2,919 plasma proteins, we identified 134 significantly associated with osteoporosis, with
        sclerostin (SOST), adiponectin (ADIPOQ), and creatine kinase B-type (CKB) exhibiting strong associations.
