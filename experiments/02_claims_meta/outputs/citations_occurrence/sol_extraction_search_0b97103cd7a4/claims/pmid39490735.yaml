  c003:
    quotes:
    - exact: Moreover, follitropin subunit beta (FSHB), SOST, and ADIPOQ demonstrated high importance
        in predictive modeling. Utilizing a predictive model built with 10 proteins, we achieved relatively
        accurate prediction of osteoporosis onset up to 5 years in advance (AUC = 0.803).
