claims:
  c000:
    quotes:
    - exact: MR analysis identified 70 inflammatory proteins, 77 metabolites, and 26 immune cell traits
        as potentially causally associated with Bell's palsy. After external validation, BLVRB, HMOX2,
        TNFRSF12A, DEFB128, ITM2A, VEGF-A, and DDX58 remained significantly associated (p < 0.05).
