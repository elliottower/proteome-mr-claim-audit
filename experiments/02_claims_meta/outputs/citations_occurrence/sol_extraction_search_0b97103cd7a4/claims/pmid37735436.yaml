    - exact: 'Furthermore, we observed an inverse association between CPNE1 (OR: 0.96, 95% CI 0.94-0.98)
        and breast cancer, while PDIA3 (OR: 1.19, 95% CI 1.10-1.30) were found to be associated with the
        risk of breast cancer.'
  c004:
    quotes:
    - exact: 'In addition, we also propose that SPINT2 (OR: 1.05, 95% CI 1.03-1.06), GSTP1 (OR: 0.82,
        95% CI 0.74-0.90), and CTSS (OR: 0.91, 95% CI 0.88-0.95) may serve as potential therapeutic targets
        in prostate cancer.'
