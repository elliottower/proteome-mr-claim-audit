claims:
  c000:
    quotes:
    - exact: 'Our study indicatied that genetically predicted KDELC2 (OR: 0.89, 95% CI 0.86-0.93) and
        TNFRSF10B (OR: 0.74, 95% CI 0.65-0.83) are inversely associated with prostate cancer.'
  c001:
    quotes:
    - exact: 'Our study indicatied that genetically predicted KDELC2 (OR: 0.89, 95% CI 0.86-0.93) and
        TNFRSF10B (OR: 0.74, 95% CI 0.65-0.83) are inversely associated with prostate cancer.'
  c002:
    quotes:
    - exact: 'Furthermore, we observed an inverse association between CPNE1 (OR: 0.96, 95% CI 0.94-0.98)
        and breast cancer, while PDIA3 (OR: 1.19, 95% CI 1.10-1.30) were found to be associated with the
        risk of breast cancer.'
