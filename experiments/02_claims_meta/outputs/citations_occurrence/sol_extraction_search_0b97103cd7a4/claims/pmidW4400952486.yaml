claims:
  c000:
    quotes:
    - exact: Secondary MR explored the causal effect of 731 immune cell traits on CAD risk. In total,
        11 overlapping candidate proteins (P<0.05, OR>1.0) were identified from the plasma proteome meta-analysis,
        including LPA, PLA2G7, and PCSK9, substantiating the validity of our MR analysis.
