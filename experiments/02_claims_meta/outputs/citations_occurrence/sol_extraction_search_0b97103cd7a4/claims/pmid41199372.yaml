claims:
  c000:
    quotes:
    - exact: 'Based on a MR analysis of plasma proteomics, we identified 68 plasma proteins significantly
        associated with the risk of ALS. By integrating differentially expressed genes (DEGs) from whole
        blood transcriptomics (1,116 DEGs), we selected four potential circulating biomarkers: FCRL3,
        HTATIP2, RNASE6, and SF3B4.'
