claims:
  c000:
    quotes:
    - exact: Multi-omics SMR-HEIDI analysis prioritized LAMC2 and PLTP as first-tier risk genes, which
        was consistently supported across protein, expression, and methylation levels. Single-cell RNA
        sequencing revealed cell-type-specific enrichment of key genes in monocytes and stromal/progenitor-like
        cells within AMD retinas, and subsequent mediation analysis identified specific immune traits,
        most notably regulatory T-cell subsets, as potential partial mediators of AMD risk.
