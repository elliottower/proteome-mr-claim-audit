claims:
  c000:
    quotes:
    - exact: Of the 110 proteins available in plaque, 16 were associated with plaque vulnerability. This
        included positive control proteins targeted by drugs indicated for CHD, such as CAH1 (targeted
        by aspirin), IL6R (targeted by tocilizumab), and AT1B2 (targeted by digoxin), as well as two potential
        repurposing opportunities C1S (targeted by C1-esterase inhibitor and sutimlimab) and CATH (targeted
        by bortezomib).
