  c000:
    quotes:
    - exact: Apolipoprotein E, triggering receptor expressed on myeloid cells 2, and Fc receptor-like
        3 showed protective associations across dementia subtypes.
  c001:
    quotes:
    - exact: Apolipoprotein E, triggering receptor expressed on myeloid cells 2, and Fc receptor-like
