  c002:
    quotes:
    - exact: Apolipoprotein E, triggering receptor expressed on myeloid cells 2, and Fc receptor-like
        3 showed protective associations across dementia subtypes.
  c003:
    quotes:
    - exact: Multiple potential causal protein-outcome relationships were identified, corroborating known
        associations (e.g., apolipoprotein E, synaptosomal-associated protein 25) and uncovering more
        novel proteins (e.g., butyrophilin subfamily 3 member A2, granzyme A, contactin-2, and trefoil
        factor 3) potentially involved in dementia disease processes.
  c004:
    quotes:
    - exact: Butyrophilin subfamily 3 member A2, granzyme A, contactin-2, and trefoil factor 3 were uncovered
        as novel dementia-associated proteins.
