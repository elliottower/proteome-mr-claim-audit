claims:
  c000:
    quotes:
    - exact: Consistent suggestive MR findings included a strong negative UVMR association for IGFBP3
        with KD risk (across eight robust methods).
  c001:
    quotes:
    - exact: Consistent suggestive MR findings included a strong negative UVMR association for IGFBP3
        with KD risk (across eight robust methods). MVMR (five methods) further linked FCGR3B, PLEK, AZGP1,
        and THAP5 to decreased risk, and SLIT1, FGB, CFH, and SELP to increased risk.
