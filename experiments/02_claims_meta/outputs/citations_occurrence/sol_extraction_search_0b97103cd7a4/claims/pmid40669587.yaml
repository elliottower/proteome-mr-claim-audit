claims:
  c000:
    quotes:
    - exact: Through Cox analysis of proteomic data from 706 RA patients and 1410 controls, we identified
        440 plasma proteins. Mendelian randomization analysis further narrowed down 35 plasma proteins,
        and colocalization analysis ultimately confirmed strong associations and colocalization for ICAM3,
        CTSV, and RNASET2 in the UKB-PPP dataset.
