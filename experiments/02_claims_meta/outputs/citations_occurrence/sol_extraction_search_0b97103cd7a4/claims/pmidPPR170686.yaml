claims:
  c000:
    quotes:
    - exact: Mendelian randomization suggests a bi‐directional causal relationship of BMI with three proteins
        (LEPR, IGFBP1, and WFIKKN2), a protein‐to‐BMI relationship for three proteins (AGER, DPT, and
        CTSA), and a BMI‐to‐protein relationship for 21 other proteins.
