  c000:
    quotes:
    - exact: This study identified significant associations between five proteins including NRX3A and
        chronic obstructive pulmonary disease, three proteins including IL7R and asthma, FUT3-FUT5 and
        idiopathic pulmonary fibrosis, and found causal associations between CSF3 and severe COVID-19,
        BTN2A1 and different subtypes of lung cancer.
