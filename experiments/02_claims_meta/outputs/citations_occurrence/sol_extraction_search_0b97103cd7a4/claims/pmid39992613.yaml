claims:
  c000:
    quotes:
    - exact: 'Genetically higher HLA-E levels were significantly associated with increased HSV infection
        risk (OR = 1.39, 95% CI: 1.17-1.65, P = 2.13 × 10-4, while ULBP2 showed a significant negative
        association with HSV infection risk (OR = 0.81, 95% CI: 0.73-0.90, P = 6.25 × 10-5) in the primary
        analysis.'
