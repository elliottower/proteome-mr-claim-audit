    - exact: SMR and colocalization screening identified 90 mQTLs, 15 eQTLs, and 2 pQTLs (KRT18 and FOXO1)
        linked to IPF in the discovery cohort.
  c002:
    quotes:
    - exact: Multi-omics integration validated NDUFA9 (mQTL-eQTL) level and FOXO1 (mQTL-eQTL-pQTL). Our
        study identified key oxidative stress-related genes (i.e., FOXO1 and NDUFA9) in IPF pathogenesis,
        highlighting the need for further research to inform prevention and treatment.
