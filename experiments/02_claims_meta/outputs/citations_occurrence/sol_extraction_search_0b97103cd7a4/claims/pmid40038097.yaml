  c005:
    quotes:
    - exact: 'Mediation analysis identified six inflammatory proteins as potential mediators in the causal
        pathways from these druggable targets to cancer: caspase 8, interleukin-1-alpha, C-X-C motif chemokine
        1, C-C motif chemokine 23, TNF-related apoptosis-inducing ligand, and interleukin-6.'
