  c000:
    quotes:
    - exact: The results of the Mendelian randomization analysis and subsequent verification indicate
        that 3 exposures are significantly associated with acne, including galanin and galanin message-associated
        peptide prepropeptide, among others.
  c001:
    quotes:
    - exact: In the context of psoriasis, the analysis identified 16 significant exposures, including
        Trefoil factor 3, among others.
  c002:
    quotes:
    - exact: In the context of psoriasis, the analysis identified 16 significant exposures, including
        Trefoil factor 3, among others. Furthermore, 31 exposures were identified as suggestive, such
        as the sum of neutrophil and eosinophil counts, and interleukin 16.
