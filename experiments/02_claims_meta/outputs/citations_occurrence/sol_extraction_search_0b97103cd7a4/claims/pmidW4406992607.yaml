  c002:
    quotes:
    - exact: 'Our analyses identified two proteins (Cathepsin B and ECHDC3) that met all the criteria
        to mediate the polygenic effect of CSVD on WMH. However, only one of these, Cathepsin B, was confirmed
        by Mendelian Randomization (Beta: -0.092, SE: 0.003, P<0.001).'
