  c004:
    quotes:
    - exact: Mendelian Randomization also confirmed the association between Cathepsin B and the risk of
        intracerebral hemorrhage, small vessel stroke, perivascular spaces volumes, and alterations in
        white matter microstructure (Figure 2).
