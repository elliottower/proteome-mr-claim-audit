claims:
  c000:
    quotes:
    - exact: The top 3 causal associations are follistatin (FST) on trunk fat-free mass (Beta = -0.63,
        SE = 0.04, P = 2.00 × 10-63), insulin-like growth factor-binding protein 1 (IGFBP1) on trunk fat-free
        mass (Beta = -0.54, SE = 0.03, P = 1.79 × 10-57) and r-spondin-3 (RSPO3) on WHR (waist circumference/hip
        circumference) (Beta = 0.01, SE = 4.47 × 10-4, P = 5.45 × 10-60), respectively.
