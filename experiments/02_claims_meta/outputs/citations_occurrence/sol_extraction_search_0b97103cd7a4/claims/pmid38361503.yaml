claims:
  c000:
    quotes:
    - exact: Our findings supported that high plasma levels of C3b, CTNNB1, CCL1, and CCL3L1 were associated
        with increased risk of AMD, thereby highlighting the role of systemic inflammation in AMD pathogenesis
        and providing the rationale for developing new preventative and therapeutic strategies.
