claims:
  c000:
    quotes:
    - exact: Our MR analysis identified significant associations between genetically predicted levels
        of 9 proteins in the deCODE dataset and 17 proteins in the UKB-PPP dataset with AD risk after
        Bonferroni correction. Four proteins (BCAM, CD55, CR1, and GRN) showed consistent associations
        across both datasets.
