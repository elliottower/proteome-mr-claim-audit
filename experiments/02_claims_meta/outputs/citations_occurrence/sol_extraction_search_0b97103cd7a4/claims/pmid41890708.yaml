claims:
  c000:
    quotes:
    - exact: Multi-omics integration identified CCS as the only gene supported at both eQTL and pQTL levels
        and revealed its strongest and most specific causal association with CTS.
  c001:
    quotes:
    - exact: Mediation MR demonstrated that circulating CCS accounts for a substantial proportion of the
        GDM-CTS effect.
  c002:
    quotes:
    - exact: Transcriptomic, single-cell, and animal analyses confirmed a CCS-high, inflamed, and collagen-rich
        microenvironment in CTS, whereas docking analyses indicated that CCS-centred pathways are pharmacologically
        tractable.
  c003:
    quotes:
    - exact: Transcriptomic, single-cell, and animal analyses confirmed a CCS-high, inflamed, and collagen-rich
