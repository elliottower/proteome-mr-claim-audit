claims:
  c000:
    quotes:
    - exact: In mediation analysis, decreased chymotrypsin B2 (CTRB2) levels mediated 1.03% (95% CI [confidence
        interval] 0.02%-2.03%) of the effects of body mass index on acute pancreatitis.
  c001:
    quotes:
    - exact: Increased R-spondin 3 (RSPO3) levels mediated the effects of body mass index (2.95%, 95%
        CI 0.18%-5.73%), body fat percentage (4.53%, 95% CI 1.11%-7.96%), waist-hip ratio (8.48%, 95%
        CI 3.11%-13.86%), and visceral adipose tissue (3.93%, 95% CI 0.64%-7.22%) on acute pancreatitis.
  c002:
    quotes:
    - exact: We also found increased klotho beta (KLOTB) levels mediated the effects of waist-hip ratio
        (7.01%, 95% CI 3.30%-10.71%) and visceral adipose tissue (8.98%, 95% CI 4.55%-13.41%) on chronic
        pancreatitis, and decreased receptor tyrosine kinase-like orphan receptor 1 (ROR1) levels mediated
        the effects of body mass index (10.39%, 95% CI 3.36%-17.42%) and visceral adipose tissue (6.29%,
        95% CI 1.00%-11.58%) on pancreatic carcinoma.
  c003:
    quotes:
    - exact: We also found increased klotho beta (KLOTB) levels mediated the effects of waist-hip ratio
        (7.01%, 95% CI 3.30%-10.71%) and visceral adipose tissue (8.98%, 95% CI 4.55%-13.41%) on chronic
        pancreatitis, and decreased receptor tyrosine kinase-like orphan receptor 1 (ROR1) levels mediated
        the effects of body mass index (10.39%, 95% CI 3.36%-17.42%) and visceral adipose tissue (6.29%,
        95% CI 1.00%-11.58%) on pancreatic carcinoma.
