claims:
  c000:
    quotes:
    - exact: 'pQTL-based MR implicated TLR1 (OR = 0.21, 95% CI: 0.10-0.44, P = 3.17 × 10-5) and NFKB1
        (OR = 3.19, CI: 1.96-5.21, P = 3.37 × 10-6), with concordant eQTL-based MR in whole blood. eQTL-based
        MR additionally identified DCAKD (skeletal muscle; IIM: OR = 0.57, CI: 0.46-0.70, P = 1.22 × 10-7)
        and PTPN22 (whole blood; PM: OR = 3.43, CI: 2.14-5.48, P = 2.63 × 10-7).'
  c001:
    quotes:
    - exact: 'pQTL-based MR implicated TLR1 (OR = 0.21, 95% CI: 0.10-0.44, P = 3.17 × 10-5) and NFKB1
        (OR = 3.19, CI: 1.96-5.21, P = 3.37 × 10-6), with concordant eQTL-based MR in whole blood. eQTL-based
        MR additionally identified DCAKD (skeletal muscle; IIM: OR = 0.57, CI: 0.46-0.70, P = 1.22 × 10-7)
        and PTPN22 (whole blood; PM: OR = 3.43, CI: 2.14-5.48, P = 2.63 × 10-7).'
  c002:
    quotes:
    - exact: 'Colocalisation confirmed shared causal variants for: (i) IIM with serum levels of TLR1 and
        NFKB1, and expression levels in skeletal muscle of DCAKD; and (ii) PM with expression levels in
        whole blood of PTPN22.'
