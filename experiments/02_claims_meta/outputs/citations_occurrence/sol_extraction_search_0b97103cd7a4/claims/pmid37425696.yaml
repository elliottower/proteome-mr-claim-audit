claims:
  c000:
    quotes:
    - exact: In observational analyses, 473 SOMAmers were associated with FEV1 after multiple testing
        adjustment. The most significant were R-Spondin 4, Alkaline Phosphatase, Placental Like 2 and
        Retinoic Acid Receptor Responder 2.
