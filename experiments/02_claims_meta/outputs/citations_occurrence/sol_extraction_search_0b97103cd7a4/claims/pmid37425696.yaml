  c003:
    quotes:
    - exact: Of the 235 SOMAmers with genetic data, eight were associated with FEV1 in MR analyses. Three
        were directionally consistent with the observational estimate, Thrombospondin 2 (THBS2), Endoplasmic
        Reticulum Oxidoreductase 1 Beta and Apolipoprotein M.
