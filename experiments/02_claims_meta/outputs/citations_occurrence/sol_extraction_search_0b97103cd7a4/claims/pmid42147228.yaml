claims:
  c000:
    quotes:
    - exact: Our analyses revealed four significant protein targets in the EUR population (SLURP1, ANGPTL3,
        NME4, ANXA10) and nine in the EAS population (ICAM5, SMOC1, PSCA, SATB1, SCRG1, PTPRB, ISLR2,
        NCR3LG1, SELE) associated with GC susceptibility.
