  c005:
    quotes:
    - exact: Two-sample Mendelian randomization (MR) inverse variance weighted analysis indicated that
        higher NeGR1 reduces T2D risk (odds ratio [OR] per SD 0.92; P = 0.03) and was consistent with
        MR-Egger, weighted median, and weighted mode sensitivity analyses. A stronger association was
        observed for the single cis-acting NeGR1 genetic variant (OR per SD 0.80; P = 6.3 × 10-5).
  c006:
    quotes:
    - exact: Coupled with previous evidence that low circulating NeGR1 levels promote adiposity, its association
        with PA and potential causal role in T2D shown here suggest that NeGR1 may link PA exposure with
        metabolic outcomes.
