claims:
  c000:
    quotes:
    - exact: Eighteen of these proteins were independently associated with incident T2D (P < 1.25 × 10-3),
        including neuronal growth regulator 1 (NeGR1; hazard ratio per SD 0.85; P = 7.5 × 10-11).
  c001:
    quotes:
    - exact: Two-sample Mendelian randomization (MR) inverse variance weighted analysis indicated that
        higher NeGR1 reduces T2D risk (odds ratio [OR] per SD 0.92; P = 0.03) and was consistent with
        MR-Egger, weighted median, and weighted mode sensitivity analyses.
