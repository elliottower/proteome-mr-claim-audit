claims:
  c000:
    quotes:
    - exact: Genetically predicted levels of 11 plasma proteins were found to have a causal association
        with AITD. Colocalization analysis revealed that five of these proteins had evidence of colocalization,
        including leukemia inhibitory factor (LIF), interleukin-7 receptor subunit alpha (IL7RA), CD226,
        tumor necrosis factor ligand superfamily member 11 (TNF11), and transcription factor junD (JUND).
