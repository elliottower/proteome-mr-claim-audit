claims:
  c000:
    quotes:
    - exact: 'Results were wide ranging: including, for example, new evidence for a causal role of tyrosine-protein
        phosphatase non-receptor type substrate 1 (SHPS1; SIRPA) in schizophrenia, and a new finding that
        intestinal fatty acid binding protein (FABP2) abundance contributes to the pathogenesis of cardiovascular
        disease.'
