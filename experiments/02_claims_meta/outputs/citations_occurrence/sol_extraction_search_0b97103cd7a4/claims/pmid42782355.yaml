    - exact: 'The strongest risk and protective associations were NECTIN2 with Alzheimer''s dementia (odds
        ratio [OR] = 2.650, 95% confidence interval [CI]: 1.875-3.744, FDR-adjusted P = 1.58 × 10- 5)
        and ATXN2L with dementia (OR = 0.408, 95% CI: 0.255-0.654, FDR-adjusted P = 0.0370), respectively.'
