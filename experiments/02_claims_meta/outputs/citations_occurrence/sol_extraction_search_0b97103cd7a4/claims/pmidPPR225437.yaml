claims:
  c000:
    quotes:
    - exact: We found that a standard deviation increase in OAS1 levels was associated with reduced COVID-19
        death or ventilation (N = 4,336 cases / 623,902 controls; OR = 0.54, P = 7×10 −8 ), COVID-19 hospitalization
        (N = 6,406 / 902,088; OR = 0.61, P = 8×10 −8 ) and COVID-19 susceptibility (N = 14,134 / 1,284,876;
        OR = 0.78, P = 8×10 −6 ).
