  c006:
    quotes:
    - exact: We then measured OAS1 levels in 504 patients with repeated plasma samples (N=1039) with different
        COVID-19 outcomes and found that increased OAS1 levels in a non-infectious state were associated
        with protection against very severe COVID-19, hospitalization and susceptibility.
