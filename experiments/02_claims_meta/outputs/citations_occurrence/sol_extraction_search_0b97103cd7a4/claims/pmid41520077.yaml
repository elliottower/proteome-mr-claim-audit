claims:
  c000:
    quotes:
    - exact: Several proteins correlate with carotid intimal medial thickness and CHD associations are
        attenuated in participants without subclinical atherosclerosis. Macrophage metalloelastase (MMP12)
        is the strongest observed association (Hazard Ratio, 1.31; 95% Confidence Interval, 1.19-1.44).
  c001:
    quotes:
    - exact: Mendelian randomization (MR) identifies a causal relationship between higher MMP12 and lower
        CHD (Odds Ratio, OR 0.94) and ischemic stroke (OR 0.90) risk, while reverse MR found that genetic
        propensity to CHD increased MMP12.
  c002:
    quotes:
    - exact: Mendelian randomization (MR) identifies a causal relationship between higher MMP12 and lower
        CHD (Odds Ratio, OR 0.94) and ischemic stroke (OR 0.90) risk, while reverse MR found that genetic
        propensity to CHD increased MMP12.
  c003:
    quotes:
    - exact: Mendelian randomization (MR) identifies a causal relationship between higher MMP12 and lower
        CHD (Odds Ratio, OR 0.94) and ischemic stroke (OR 0.90) risk, while reverse MR found that genetic
        propensity to CHD increased MMP12.
  c004:
    quotes:
    - exact: Taken together, multivariable MR confirms a direct protective effect of higher plasma MMP12
        on CHD risk and a genetic effect of atherosclerosis and CHD on elevating MMP12.
