claims:
  c000:
    quotes:
    - exact: We observed that a higher protein level of BGAT showed a putative causal effect on venous
        complications and haemorrhoids in pregnancy (VH) (odds ratio [OR]=1.19, 95% confidence interval
        [95% CI]=1.12-1.27, colocalization probability=91%), which was validated by using pQTLs from Fenland
        and INTERVAL.
