  c002:
    quotes:
    - exact: MR analysis identified 14 druggable genes causally associated with PBC risk, with replication
        in the FinnGen cohort confirming CD58 and IL7R as tier-1 targets. Functional studies revealed
        both genes modulate immune synapse formation and T-cell homeostasis, supported by significant
        hepatic overexpression in human PBC biopsies.
