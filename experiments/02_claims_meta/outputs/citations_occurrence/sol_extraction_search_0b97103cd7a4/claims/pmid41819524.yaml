  c008:
    quotes:
    - exact: This study establishes CD58 and IL7R as mechanistically grounded therapeutic targets for
        PBC. We provide a translational framework integrating causal genomics, computational drug screening,
        and experimental validation by demonstrating their protective effects against cholestatic bile
        duct injury, thereby informing therapy development for PBC.
