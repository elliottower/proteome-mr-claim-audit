claims:
  c000:
    quotes:
    - exact: 'The upregulation of ULK3 (blood eQTL, beta: 0.62, 95% CI: 1.129-3.091, P = 0.015; muscle
        eQTL, beta: 0.93, 95% CI: 1.055-6.146, P = 0.037; blood pQTL, beta: 2.51, 95% CI: 1.199-126.169,
        P = 0.034), CSK (blood eQTL, beta: 0.69, 95% CI: 1.094-3.650, P = 0.024; muscle eQTL, beta: 0.98,
        95% CI: 1.058-6.707, P = 0.037; blood pQTL, beta: 3.41, 95% CI: 1.509-606.864, P = 0.025), and
        PPIE (blood eQTL, beta: 0.52, 95% CI: 1.218-2.321, P = 0.001; muscle eQTL, beta: 0.85, 95% CI:
        1.384-3.962, P = 0.001; blood pQTL, beta: 1.06, 95% CI: 1.094-7.565, P = 0.032) in blood and skeletal
        muscle tissues was positively associated with the risk of CPPD disease.'
