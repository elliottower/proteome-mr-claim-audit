claims:
  c000:
    quotes:
    - exact: Additional deep-dive analyses such as SMR, colocalization, and differential expression studies
        highlighted four critical proteins (MMP12, PCSK9, PRSS8, and SCLY). We calculated a protein score
        based on the levels of these proteins, with higher scores correlating with increased risk of psoriasis.
