  c005:
    quotes:
    - exact: A protein newly-associated with PD (CTF1) is involved in the interleukin-6 pathway, two proteins
        for ALS (TPP1, TNFSF13) are involved in lysosomal and astrocyte function, respectively, and proteins
        associated with MS are involved in blood-brain barrier function (TYMP, VEGFB), the oligodendrocyte
        function (PARP1), the structure of the node of Ranvier and function of dorsal root ganglion (NCS1,
        FLRT3, CDH15), and the response to viral infections including Epstein-Barr virus (PVR, WARS1).
