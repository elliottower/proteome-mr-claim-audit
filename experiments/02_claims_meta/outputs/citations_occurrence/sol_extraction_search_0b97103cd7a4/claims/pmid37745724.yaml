claims:
  c000:
    quotes:
    - exact: Furthermore, genetically predicted HannumAge was consistently associated with the proteins
        C-type lectin domain family 4 member D (CLEC4D) and Retinoic acid receptor responder protein 1
        (RARR-1), indicating their potential role as mediators in the causal pathway.
  c001:
    quotes:
    - exact: Furthermore, genetically predicted HannumAge was consistently associated with the proteins
        C-type lectin domain family 4 member D (CLEC4D) and Retinoic acid receptor responder protein 1
        (RARR-1), indicating their potential role as mediators in the causal pathway.
  c002:
    quotes:
    - exact: HannumAge acceleration may increase the risk of lung cancer, some of which may be mediated
        by CLEC4D and RARR-1, suggestion that CLEC4D and RARR-1 may serve as potential drug targets for
        the treatment of lung cancer.
