claims:
  c000:
    quotes:
    - exact: Three significant (p < 6.81 × 10-5) plasma protein-DR pairs were identified during the primary
        MR analysis, including CFH (OR = 0.8; 95% CI 0.75-0.86; p = 1.29 × 10-9), B3GNT8 (OR = 1.09; 95%
        CI 1.05-1.12; p = 5.9 × 10-6) and CFHR4 (OR = 1.11; 95% CI 1.06-1.16; p = 1.95 × 10-6).
