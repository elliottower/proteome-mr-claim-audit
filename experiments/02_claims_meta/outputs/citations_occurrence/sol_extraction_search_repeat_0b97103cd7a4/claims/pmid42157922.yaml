claims:
  c000:
    quotes:
    - exact: Here, we used an integrative multi-omics and experimental framework to identify cathepsin
        H (CTSH) as a candidate causal driver of proliferative DR (PDR). By combining GWAS, eQTL, pQTL,
        and mQTL datasets with Mendelian randomization, summary-data-based Mendelian randomization, and
        Bayesian colocalization, CTSH emerged as the strongest genetically supported candidate across
        discovery and validation analyses.
  c001:
    quotes:
    - exact: Here, we used an integrative multi-omics and experimental framework to identify cathepsin
        H (CTSH) as a candidate causal driver of proliferative DR (PDR). By combining GWAS, eQTL, pQTL,
        and mQTL datasets with Mendelian randomization, summary-data-based Mendelian randomization, and
        Bayesian colocalization, CTSH emerged as the strongest genetically supported candidate across
        discovery and validation analyses.
  c002:
    quotes:
    - exact: In the UK Biobank (UKB), circulating CTSH was elevated in diabetic retinopathy and independently
        predicted incident disease.
  c003:
    quotes:
    - exact: Single-cell transcriptomic analyses localized CTSH predominantly to myeloid compartments
        within fibrovascular membranes and linked CTSH-high states to inflammatory, hypoxic, and angiogenic
        programs.
  c004:
    quotes:
    - exact: In high-glucose-stimulated THP-1 monocytes, CTSH promoted reactive oxygen species accumulation,
        NF-κB activation, and increased IL-6, TNF-α, HIF-1α, and VEGF expression, whereas CTSH silencing
        reversed these effects.
