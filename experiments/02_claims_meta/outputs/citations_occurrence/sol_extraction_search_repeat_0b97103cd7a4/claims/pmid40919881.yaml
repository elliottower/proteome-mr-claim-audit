claims:
  c000:
    quotes:
    - exact: To further investigate causality, two-sample Mendelian Randomization (2SMR) and Cox proportional
        hazard regression were conducted, and we confirmed 18 potential causal proteins associated with
        MG, including those in the cardiometabolic panel (CEACAM8, OLR1, PGLYRP1, S100A11, and TNC), inflammation
        panel (CST7, HGF, IL1RN, IL-6, JCHAIN, OSM, PLAUR, and TGFA), neurology panel (CTSS, MMP8, TBC1D17,
        and VCAN), and oncology panel (S100A12).
