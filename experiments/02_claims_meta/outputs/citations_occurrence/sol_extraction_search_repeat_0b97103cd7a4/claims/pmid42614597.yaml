claims:
  c000:
    quotes:
    - exact: We applied Mendelian randomization analyses to examine the genetic associations between 2321
        plasma proteins and 47 DSDs using data from the FinnGen project, identifying 12 causal proteins
        and validating four (Tripartite Motif Containing 40, Sulfotransferase Family 2A Member 1, Peptidase
        Inhibitor 16, MHC Class I Polypeptide-Related Sequence B) of them in the UK Biobank.
