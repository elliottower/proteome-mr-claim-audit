  c006:
    quotes:
    - exact: We found that elevated levels of SULT2A1 may increase metabolism of approved drugs for cholelithiasis
        (i.e., ursodeoxycholic acid and chenodeoxycholic acid) by binding deoxycholic acid, thus reducing
        drug efficacy.
