claims:
  c000:
    quotes:
    - exact: Our analytic approach identified several known targets (e.g. ABO, OAS1), but also nominated
        new proteins such as soluble Fas (colocalisation probability >0.9, p=1 × 10-4), implicating Fas-mediated
        apoptosis as a potential target for COVID-19 risk.
  c001:
    quotes:
    - exact: Our analytic approach identified several known targets (e.g. ABO, OAS1), but also nominated
        new proteins such as soluble Fas (colocalisation probability >0.9, p=1 × 10-4), implicating Fas-mediated
        apoptosis as a potential target for COVID-19 risk.
  c002:
    quotes:
    - exact: The polygenic (pan) and cis-Mendelian randomisation analyses showed consistent associations
        of genetically predicted ABO protein with several COVID-19 phenotypes.
  c003:
    quotes:
    - exact: The polygenic (pan) and cis-Mendelian randomisation analyses showed consistent associations
        of genetically predicted ABO protein with several COVID-19 phenotypes.
  c004:
    quotes:
    - exact: The ABO signal is highly pleiotropic, and a look-up of proteins associated with the ABO signal
        revealed that the strongest association was with soluble CD209.
  c005:
    quotes:
    - exact: We demonstrated experimentally that CD209 directly interacts with the spike protein of SARS-CoV-2,
        suggesting a mechanism that could explain the ABO association with COVID-19.
  c006:
    quotes:
    - exact: Our work provides a prioritised list of host targets potentially exploited by SARS-CoV-2
        and is a precursor for further research on CD209 and FAS as therapeutically tractable targets
        for COVID-19.
