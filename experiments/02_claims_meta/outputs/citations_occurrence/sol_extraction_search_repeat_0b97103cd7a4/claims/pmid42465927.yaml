claims:
  c000:
    quotes:
    - exact: Through meta-GWAS, we identified one locus, OSTN, associated with RPVO (lead variant rs59109356
        associated with a ~2-fold increase of RPVO, p=3.92x10-8).
  c001:
    quotes:
    - exact: Through meta-GWAS, we identified one locus, OSTN, associated with RPVO (lead variant rs59109356
        associated with a ~2-fold increase of RPVO, p=3.92x10-8). A second locus, CCN4, previously reported
        to associate with pulmonary fibrosis, was also identified, with evidence of association approaching
        genome-wide significance (p=6.7x10-8).
  c002:
    quotes:
    - exact: We also identified a common haplotype spanning over AHSG/HRG/KNG1 associated with a ~3-fold
        increase of RPVO (p=2.96x10-8).
  c003:
    quotes:
    - exact: We also identified a common haplotype spanning over AHSG/HRG/KNG1 associated with a ~3-fold
        increase of RPVO (p=2.96x10-8).
  c004:
    quotes:
    - exact: We also identified a common haplotype spanning over AHSG/HRG/KNG1 associated with a ~3-fold
        increase of RPVO (p=2.96x10-8).
  c005:
    quotes:
    - exact: Using plasma protein-based MR, we demonstrated that one unit increase in genetically determined
        plasma levels of IL-1 R AcP encoding IL1RAP was associated with a 28% (p=1.32x10-6) reduction
        in RPVO.
  c006:
    quotes:
    - exact: We also observed statistical evidence that the CCN4 (p=0.06) and IL1RAP (p=0.02) loci associate
        with the risk of PE recurrence in a sample of 1,617 unprovoked PE patients.
  c007:
    quotes:
    - exact: We also observed statistical evidence that the CCN4 (p=0.06) and IL1RAP (p=0.02) loci associate
        with the risk of PE recurrence in a sample of 1,617 unprovoked PE patients.
