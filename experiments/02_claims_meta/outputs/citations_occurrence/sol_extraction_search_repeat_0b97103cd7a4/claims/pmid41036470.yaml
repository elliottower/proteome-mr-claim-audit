    - exact: Transcriptomic analysis demonstrated significant downregulation of KIAA0319 in AD patients
        (p < 0.0001).
  c001:
    quotes:
    - exact: 'These findings were consistent with our mediation analysis, which indicated that reduced
        KIAA0319 expression adversely affected PMM2 and thereby increased AD risk (mediation effect: 13.37%,
        95% CI: 1.68%-25.06%, p < 0.05).'
