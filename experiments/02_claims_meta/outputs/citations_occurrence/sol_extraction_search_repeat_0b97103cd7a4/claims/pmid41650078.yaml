claims:
  c000:
    quotes:
    - exact: Our multi-dimensional analysis ultimately identified 6 MR-ICTs causally associated with PH.
        Notably, the causal associations for lysozyme C (LYZ), gremlin-2 (GREM2), nidogen-1 (NID1), and
        platelet factor 4 variant 1 (PF4V1) were stringently validated by Bayesian colocalization analysis
        (posterior probability for hypothesis 4 [PPH4], indicating a shared causal variant, > 0.99).
