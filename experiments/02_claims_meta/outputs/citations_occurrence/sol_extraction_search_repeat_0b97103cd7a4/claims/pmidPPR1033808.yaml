  c000:
    quotes:
    - exact: Seven therapeutic genes (AKT1, ERBB3, FCGR1A, FGFR1, GUCY1B2, LPL, and NR1H3) encode targets
        for approved drugs with consistent directions of action in alleviating IR, with no significant
        potential side effects revealed by phenome-wide association study results.
