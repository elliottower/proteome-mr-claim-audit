claims:
  c000:
    quotes:
    - exact: We further integrated phenome-wide MR using the summary data from UK Biobank (N≤408 961)
        studies and clinical evidence based on DrugBank database to detect potential side effects associated
        with hypothetical therapeutic agents for CAD in diabetes and prioritize them. Our primary discovery
        MR analysis identified 4 prioritized proteins (F5, LPA, NPPB and TNFRSF11B) with both MR and colocalization
        evidence.
