claims:
  c000:
    quotes:
    - exact: Four plasma proteins, namely advanced glycosylation end product-specific receptor, butyrophilin
        subfamily 2 member A1, butyrophilin subfamily 3 member A2, and human leukocyte antigen E, were
        found to be significant in both the discovery set and validation sets, and their association with
        AIH was supported by both co-localization and sensitivity analyses.
