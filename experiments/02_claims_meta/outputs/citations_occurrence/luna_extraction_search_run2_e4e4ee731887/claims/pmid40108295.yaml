  c004:
    quotes:
    - exact: After false discovery rate (FDR) correction, signal transducer and activator of transcription
        3 (STAT3) was a significantly positive protein in the analysis of Icelandic plasma pQTLs.
  c005:
    quotes:
    - exact: After Bonferroni correction, AGER, CD58, EVI5, and TNF remained significantly positive proteins
        in the analysis of the UK Biobank database pQTLs.
  c006:
    quotes:
    - exact: In the analysis of the UK Biobank database pQTLs, advanced glycosylation end product-specific
        receptor (AGER), allograft inflammatory factor 1 (AIF1), butyrophilin subfamily 1 member A1 (BTN1A1),
        cluster of differentiation 58 (CD58), desmoglein 4 (DSG4), ecotropic viral integration site 5
        (EVI5), tumor necrosis factor (TNF), and tumor necrosis factor receptor superfamily member 14
        (TNFRSF14) were significantly positive proteins.
