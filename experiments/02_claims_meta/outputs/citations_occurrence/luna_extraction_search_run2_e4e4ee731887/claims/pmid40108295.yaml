claims:
  c000:
    quotes:
    - exact: In the MR analysis, the MR analysis of Icelandic plasma pQTLs and MS identified 88 positive
        plasma proteins, while the MR analysis of the UK Biobank database pQTLs and MS identified 122
        positive plasma proteins. By comparison, uroporphyrinogen III synthase (UROS) and glutathione
        S-transferase theta 2B (GSTT2B) were found to be the positive proteins shared by the two datasets.
