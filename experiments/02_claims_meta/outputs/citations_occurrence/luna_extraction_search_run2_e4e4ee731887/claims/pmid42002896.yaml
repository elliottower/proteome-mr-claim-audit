claims:
  c000:
    quotes:
    - exact: Under Bonferroni significance (P < 1.52 × 10-4), Mendelian randomization using cisexpression
        quantitative trait locus instruments revealed nine ferroptosis-related proteins (STAT3, MAPK1,
        MAPK3, MAP3K11, CISD2, KEAP1, ZEB1, PVT1, PARP1) with significant results in at least one tissue.
        Bayesian colocalization indicated that four of them (STAT3, PP.H4=0.97; MAPK1, PP.H4=0.95; MAPK3,
        PP.H4=0.99; ZEB1, PP.H4=0.96) share variation with MS.
