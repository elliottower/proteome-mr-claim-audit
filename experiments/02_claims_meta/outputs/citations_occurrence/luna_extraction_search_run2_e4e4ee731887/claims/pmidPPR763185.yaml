claims:
  c000:
    quotes:
    - exact: 'Proteins associated with an increased risk of MN in plasma include ABO [(Histo-Blood Group
        Abo System Transferase) (WR OR = 1.116, 95%CI:1.047-1.190, FDR=0.090, PPH4 = 0.795)], VWF [(Von
        Willebrand Factor) (WR OR = 1.412, 95%CI:1.157-1.725, FDR=0.018, PPH4 = 0.816)] and CD209 [(Cd209
        Antigen) (WR OR = 1.187, 95%CI:1.074-1.312, FDR=0.090, PPH4 = 0.795)], and proteins that have
        a protective effect on MN: HRG [(Histidine-Rich Glycoprotein) (WR OR = 1.814, 95%CI:1.345-2.445,
        FDR=0.018, PPH4 = 0.797)], CD27 [(Cd27 Antigen) (WR OR = 0.785, 95%CI:0.681-0.904, FDR=0.018,
        PPH4 = 0.797)], LRPPRC [(Leucine-Rich Ppr Motif-Containing Protein, Mitochondrial) (WR OR = 0.790,
        95%CI:0.688-0.907, FDR=0.090, PPH4 = 0.797)], TIMP4 [(Cd27 Antigen) (WR OR = 0.666, 95%CI:0.527-0.840,
        FDR=0.090PPH4 = 0.833)] and MAP2K4 [(Metalloproteinase Inhibitor 4) (WR OR = 0.815, 95%CI:0.723-0.919,
        FDR=0.090, PPH4 = 0.797)].'
