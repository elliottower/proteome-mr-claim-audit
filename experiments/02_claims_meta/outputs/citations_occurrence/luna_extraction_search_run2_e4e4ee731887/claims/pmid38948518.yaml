claims:
  c000:
    quotes:
    - exact: 'What''s more, DR is associated with a lower risk of IBD according to genetic prediction
        (IVW: OR=0.922; 95%CI= 0.873-0.972; P value= 0.002) (Weighted median: OR=0.924; 95%CI= 0.861-0.992;
        P value= 0.029). Fibroblast growth factor 21 (FGF21), phosphatidylcholine (PC), and triacylglycerol
        (TG) serve as mediators in these relationships.'
  c001:
    quotes:
    - exact: 'In reverse MR, it was shown that DR (IVW: OR=0.870; 95%CI= 0.828-0.914; P value= 2.79E-08)(Weighted
        median: OR=0.857; 95%CI= 0.801-0.916; P value= 6.40E-06) and DMP (IVW: OR=0.900; 95%CI= 0.865-0.937;
        P value= 3.34E-07)(Weighted median: OR=0.882; 95%CI= 0.841-0.924; P value= 1.82E-07) could reduce
        the risk of CD. What''s more, DR is associated with a lower risk of IBD according to genetic prediction
        (IVW: OR=0.922; 95%CI= 0.873-0.972; P value= 0.002) (Weighted median: OR=0.924; 95%CI= 0.861-0.992;
        P value= 0.029). Fibroblast growth factor 21 (FGF21), phosphatidylcholine (PC), and triacylglycerol
        (TG) serve as mediators in these relationships.'
