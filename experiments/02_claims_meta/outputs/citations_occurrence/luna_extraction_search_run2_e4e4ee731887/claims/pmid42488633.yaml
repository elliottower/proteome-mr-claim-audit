claims:
  c000:
    quotes:
    - exact: 'In the European population, genetically predicted higher FGF-21 levels were associated with
        an increased risk of T2D (OR = 1.141, 95% CI: 1.032-1.261, P = 0.010), and IL-5 also showed a
        positive association with T2D risk (OR = 1.114, 95% CI: 1.004-1.237, P = 0.042).'
