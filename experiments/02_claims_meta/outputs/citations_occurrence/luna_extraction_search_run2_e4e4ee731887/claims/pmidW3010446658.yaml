  c008:
    quotes:
    - exact: In the MR analyses testing the causal effects of the proteins on T2D, using cis-acting SNPs
        as IVs, sex hormone-binding globulin (SHBG) had nominally significant causal effect that went
        into the same direction as its result suggested.
  c009:
    quotes:
    - exact: Using an aptamer-based technique, we replicated previously reported prevalent and incident
        T2D-protein associations, including SHBG, complement C2 and renin as well as identified novel
        ones, like aminoacylase-1.
