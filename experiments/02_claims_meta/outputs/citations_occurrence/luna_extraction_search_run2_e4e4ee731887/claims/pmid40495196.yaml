claims:
  c000:
    quotes:
    - exact: Three metabolites (sphinganine-1-phosphate levels, X-23636 levels, 4-methyl-2-oxopentanoate
        levels), two circulating plasma proteins (fibroblast growth factor 23 levels, neurotrophin-3 levels),
        one gut microbiota (faecalibacterium abundance), one immunophenotype (HVEM on naive CD8 + T cells),
        23 miRNAs (miR-500a-3p, miR-555, miR-584-5p, miR-642a-5p, miR-671-3p, miR-1324, miR-6870-3p, miR-1468-5p,
        miR-146a-3p, miR-221-3p, miR-3121-5p, miR-3184-3p, miR-3185, miR-335-5p, miR-4302, miR-4506, miR-6808-5p,
        miR-6894-5p, miR-145-5p, miR-149-3p, miR-23a-3p, miR-3141, and miR-374b-5p), and three hub genes
        (ESR1, ERBB2, and GART) serve as warning markers for POI.
