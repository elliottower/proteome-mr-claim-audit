  c004:
    quotes:
    - exact: Four plasma proteins (PCSK9, FES, TMEM106B and FURIN) were identified as potential mediators
        of vascular aging, supported by strong MR causal effects and genetic colocalization evidence.
        Mediation MR analyses indicated that a substantial proportion (26.7%-75.3%) of their effects on
        vascular aging was mediated through low-density lipoprotein cholesterol and systolic blood pressure
        regulation.
