claims:
  c000:
    quotes:
    - exact: PWAS identified GLO1, along with GRWD1 and MAP2K5, as significantly associated with RLS.
  c001:
    quotes:
    - exact: GLO1 was identified by brain-based SMR (p = 0.0001), colocalization (PP.H4 = 0.96), TWAS
        (p = 0.048), and was confirmed by plasma-based SMR (p = 3.16 × 10-9) as the only protein associated
        with RLS.
