  c003:
    quotes:
    - exact: Mendelian randomization suggested causal effects of three proteins on MetS, namely apolipoprotein
        E2 (APOE2) (Wald-Ratio = - 0.12, Wald-p = 3.63e-13), apolipoprotein B (APOB) (Wald-Ratio = - 0.09,
        Wald-p = 2.54e-04) and proto-oncogene tyrosine-protein kinase receptor (RET) (Wald-Ratio = 0.10,
        Wald-p = 5.40e-04).
