claims:
  c000:
    quotes:
    - exact: Prevalent MetS was associated with 116 proteins, of which 53 replicated in HUNT. These included
        previously reported proteins like leptin, and new proteins like NTR domain-containing protein
        2 and endoplasmic reticulum protein 29.
