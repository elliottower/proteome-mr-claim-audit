claims:
  c000:
    quotes:
    - exact: Higher circulating granulins and apolipoprotein B levels, which were strongly affected by
        <italic>PSRC1</italic> and <italic>APOB</italic> variants, were significantly associated with
        higher LDL-C level (beta = 0.22 and 1.35) and CAD risk, with odds ratios of 1.15 (1.10-1.19) and
        1.45 (1.21-1.74), respectively.
