claims:
  c000:
    quotes:
    - exact: Using results from genomewide association studies and protein quantitative trait loci data,
        we genetically identified causal effects of levels of several circulating proteins on atherosclerosis
        risk, validated using multiple statistical approaches, and identified promising drug targets.
        These findings demonstrated promising targets worthy of further clinical study, especially lipoprotein
        (a) and proprotein convertase subtilisin/kexin type 9.
