claims:
  c000:
    quotes:
    - exact: TSMR further confirmed two proteins with robust causal associations with GBC. Among these
        two proteins, higher plasma complement receptor 2 (CR2) levels were significantly associated with
        a reduced risk of GBC (OR=0.258, 95%CI 0.071‒0.935, P=0.039), whereas higher plasma neural cell
        adhesion molecule 1 (NCAM1) levels were associated with an increased risk of GBC (OR=2.306, 95%CI
        1.432‒3.713, P<0.001).
