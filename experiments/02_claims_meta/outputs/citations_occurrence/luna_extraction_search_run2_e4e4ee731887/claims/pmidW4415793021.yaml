  c010:
    quotes:
    - exact: 'Mediation analysis showed that N-palmitoyl-sphingosine significantly mediated the effect
        of SMPD1 on AA (effect proportion: 23.1%, 95% CI: 3.3%–93.6%) and AAA (34.4%, 95% CI: 2.7%–66.0%).'
