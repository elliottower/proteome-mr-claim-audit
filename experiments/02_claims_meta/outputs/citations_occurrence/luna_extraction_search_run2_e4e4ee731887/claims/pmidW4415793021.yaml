  c007:
    quotes:
    - exact: 'SMPD1 emerged as a core therapeutic target for AAA, with significant associations in MR
        (OR = 1.39, 95% CI: 1.21–1.60, P = 2.04E-6), SMR (OR = 1.42, 95% CI: 1.21–1.67, P = 1.94E-5),
        and colocalization (PPH4 = 98.76%), and no adverse phenotypes detected in PheWAS.'
