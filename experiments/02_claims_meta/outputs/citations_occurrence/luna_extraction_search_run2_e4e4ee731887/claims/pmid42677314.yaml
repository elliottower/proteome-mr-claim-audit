claims:
  c000:
    quotes:
    - exact: MST1/MSP and CPNE1 were supported in both datasets with PP.H4 ≥ 0.80 and non-significant
        HEIDI tests. Genetically predicted circulating MSP was positively associated with breast cancer
        risk, whereas circulating CPNE1 showed an inverse association.
  c001:
    quotes:
    - exact: MST1/MSP and CPNE1 were supported in both datasets with PP.H4 ≥ 0.80 and non-significant
        HEIDI tests. Genetically predicted circulating MSP was positively associated with breast cancer
        risk, whereas circulating CPNE1 showed an inverse association.
  c002:
    quotes:
    - exact: TCGA-BRCA showed higher CPNE1 mRNA in tumors (P = 2.57×10⁻25) and lower MST1 mRNA (P = 3.04×10⁻23).
  c003:
    quotes:
    - exact: TCGA-BRCA showed higher CPNE1 mRNA in tumors (P = 2.57×10⁻25) and lower MST1 mRNA (P = 3.04×10⁻23).
  c004:
    quotes:
    - exact: CPNE1 expression was highest in triple-negative breast cancer and correlated positively with
        clinical stage (ρ = 0.211), whereas MST1 expression was lowest in triple-negative breast cancer
        and correlated inversely with stage (ρ = -0.164).
