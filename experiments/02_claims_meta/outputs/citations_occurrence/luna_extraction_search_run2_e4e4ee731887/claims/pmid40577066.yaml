claims:
  c000:
    quotes:
    - exact: Nine plasma proteins were independently associated with a kidney stone diagnosis, including
        reduced uromodulin (UMOD; β, −0.10; 95% confidence interval [CI], −0.15 to −0.05) and elevated
        scavenger receptor cysteine-rich domain-containing group B protein (SSC4D; β, 0.28; 95% CI, 0.17
        to 0.38) and were enriched in extracellular matrix pathways.
  c001:
    quotes:
    - exact: Nine plasma proteins were independently associated with a kidney stone diagnosis, including
        reduced uromodulin (UMOD; β, −0.10; 95% confidence interval [CI], −0.15 to −0.05) and elevated
        scavenger receptor cysteine-rich domain-containing group B protein (SSC4D; β, 0.28; 95% CI, 0.17
        to 0.38) and were enriched in extracellular matrix pathways.
  c002:
    quotes:
    - exact: Mendelian randomization analysis revealed that the presence of kidney stone contributed to
        elevated levels of matrix metalloproteinase 7.
  c003:
    quotes:
    - exact: Conversely, lower plasma UMOD (odds ratio [OR], 0.93; 95% CI, 0.90 to 0.97) and higher plasma
        SSC4D (OR, 1.10; 95% CI, 1.02 to 1.18) were associated with kidney stone risk.
  c004:
    quotes:
    - exact: Conversely, lower plasma UMOD (odds ratio [OR], 0.93; 95% CI, 0.90 to 0.97) and higher plasma
        SSC4D (OR, 1.10; 95% CI, 1.02 to 1.18) were associated with kidney stone risk.
  c005:
    quotes:
    - exact: Conversely, lower plasma UMOD (odds ratio [OR], 0.93; 95% CI, 0.90 to 0.97) and higher plasma
        SSC4D (OR, 1.10; 95% CI, 1.02 to 1.18) were associated with kidney stone risk. These associations
        were consistently replicated in the Mayo Clinic Biobank dataset (UMOD; OR, 0.92; 95% CI, 0.86
        to 0.98; SSC4D; OR, 1.13; 95% CI, 1.01 to 1.27) and further validated by a concentration-response
        analysis.
  c006:
