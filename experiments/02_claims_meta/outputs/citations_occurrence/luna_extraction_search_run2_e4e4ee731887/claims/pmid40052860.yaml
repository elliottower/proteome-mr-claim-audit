claims:
  c000:
    quotes:
    - exact: Notably, there was a significant correlation between SVEP1 and exfoliation glaucoma (odds
        ratio [OR] = 1.20, 95% confidence interval [CI] = 1.10 to 1.31, P = 0.0000428), with findings
        corroborated in an independent cohort.
