  c002:
    quotes:
    - exact: In MR phenome-wide association studies, SVEP1 was associated with complications of exfoliation
        glaucoma.
  c003:
    quotes:
    - exact: After multiple testing corrections, there was a tendency for SVEP1 to be associated with
        glaucoma (OR = 1.14, 95% CI = 1.11 to 1.16, P = 0.0000003) and type 2 diabetes (OR = 1.07, 95%
        CI = 1.05 to 1.08, P = 0.0000067).
