claims:
  c000:
    quotes:
    - exact: MEAF6 was validated as a protective gene and RNF40 as a risk gene for childhood asthma. Two-step
        MR identified FUT10 as a positive mediator mediating 19.3% of the causal effect, and CD200 and
        MANBA as negative mediator proteins.
