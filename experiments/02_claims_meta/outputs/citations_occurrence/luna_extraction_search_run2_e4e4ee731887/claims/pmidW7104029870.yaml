claims:
  c000:
    quotes:
    - exact: Results showed that PCSK9 inhibition had no significant adverse effect on T2D risk, supporting
        its safety for diverse populations.
  c001:
    quotes:
    - exact: However, HMGCR inhibition modestly increased T2D risk, emphasizing the need for therapeutic
        strategies tailored to population-specific genetic contexts.
  c002:
    quotes:
    - exact: Using MR integrated with cortical proteomic and cell-type transcriptomic data, the study
        identified novel molecular targets and pathways, such as SAMHD1 and VIPAS39, linking alcohol use
        behaviors to neural signaling, alcohol metabolism, and cardiometabolic health.
