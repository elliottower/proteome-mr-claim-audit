claims:
  c000:
    quotes:
    - exact: The inverse variance weighted method revealed that, following false discovery rate correction,
        39 plasma proteins and 3 plasma protein ratios exhibited significant associations with type 1
        diabetes. The genetically predicted risk of type 1 diabetes ranged from 0.05 for RBP2 to 394.51
        for FMNL1.
