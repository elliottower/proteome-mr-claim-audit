claims:
  c000:
    quotes:
    - exact: We identified 11 plasma proteins that were significantly associated with DU. Elevated levels
        of FLT4, IGSF3, IL6ST, EPHB4, DPEP2, SEMA6A, and IL1R1 were found to have a risk-conferring effect.
