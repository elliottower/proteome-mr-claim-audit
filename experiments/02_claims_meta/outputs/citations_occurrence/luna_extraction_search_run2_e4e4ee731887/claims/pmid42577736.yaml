  c007:
    quotes:
    - exact: Validation using ELISA in 26 pairs of UC patients and healthy controls showed a significantly
        elevated DLL1/TGFBR2 ratio in the UC group (p<0.001), while CCT5/DCTN1 and BCR/DCTN1 ratios showed
        no differences.
