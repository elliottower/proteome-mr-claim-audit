  c004:
    quotes:
    - exact: Single-cell sequencing further revealed significant differences in DLL1/TGFBR2 ratios between
        UC and healthy controls (p<0.0001), with a moderate yet significant elevation in CCT5/DCTN1 ratios
        (p<0.01) and no notable difference in BCR/DCTN1 ratios.
