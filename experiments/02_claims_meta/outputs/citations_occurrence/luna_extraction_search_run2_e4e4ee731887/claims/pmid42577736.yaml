  c000:
    quotes:
    - exact: 'UC susceptibility, per one standard deviation increase in genetically predicted protein
        ratios, ranged from 0.539 (DCTN1/IKBKG, 95 % CI: 0.408-0.712) to 2.078 (CCT5/DCTN1, 95 % CI: 1.607-2.686).'
