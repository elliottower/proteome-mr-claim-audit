claims:
  c000:
    quotes:
    - exact: 'Our findings showed that higher genetically predicted levels of CCL28 (odds ratio [OR] =
        0.83, 95% confidence interval [CI]: 0.69-0.99, P = .0394), CD40 (OR = 0.94, 95% CI: 0.89-0.99,
        P = .0170), and urokinase-type plasminogen activator (OR = 0.91, 95% CI: 0.85-0.99, P = .0212)
        were associated with a lower risk of COPD, whereas higher levels of Flt3L (OR = 1.09, 95% CI:
        1.01-1.18, P = .0344) and CD6 (OR = 1.06, 95% CI: 1.02-1.12, P = .0099) were associated with a
        higher risk.'
