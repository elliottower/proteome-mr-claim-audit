claims:
  c000:
    quotes:
    - exact: 'For frailty, GRPEL1 showed tissue-specific associations at methylation and expression levels
        (protective in blood: β = -.15, false discovery rate (FDR) = 1.5e-02; adverse in brain/muscle),
        while LRPPRC demonstrated consistent protective effects across tissues (β = -.05 to -.13, PPH4
        > 0.93).'
