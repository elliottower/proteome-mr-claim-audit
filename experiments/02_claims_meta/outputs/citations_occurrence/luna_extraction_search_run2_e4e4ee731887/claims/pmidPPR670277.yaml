claims:
  c000:
    quotes:
    - exact: These high confidence target-trait pairs assisted with causal gene identification and helped
        uncover translationally informative novel biology, especially from trans-colocalizing signals,
        such as the association of lower intestinal alkaline phosphatase with a higher risk of inflammatory
        bowel disease in FUT2 non-secretors.
  c001:
    quotes:
    - exact: For example, we found that most genetically predicted therapeutic targets for inflammatory
        bowel disease could potentially worsen allergic disease phenotypes, except for TNFRSF6B where
        we observed directionally consistent associations for both phenotypes.
