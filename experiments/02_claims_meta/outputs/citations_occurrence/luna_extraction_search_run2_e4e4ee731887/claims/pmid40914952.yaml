claims:
  c000:
    quotes:
    - exact: Our study reveals that increased expression of SLC22A5 and SLC22A4 in the blood is associated
        with higher risk of IA and subarachnoid hemorrhage (SAH), while higher expression of NT5C2 is
        linked to a reduced risk of IA and SAH.
