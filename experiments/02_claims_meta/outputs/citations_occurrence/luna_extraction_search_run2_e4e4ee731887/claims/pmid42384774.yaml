claims:
  c000:
    quotes:
    - exact: Whereas the African American PWAS identified one candidate [apolipoprotein E (APOE)] and
        multiple suggestive genes, the European American PWAS identified 18 genes with putative causal
        relationships with AD through cis regulation of plasma protein abundance.
  c001:
    quotes:
    - exact: Four of these proteins were not previously detected in AD GWAS [complement decay-accelerating
        factor (CD55), leukocyte immunoglobulin-like receptor B1 (LILRB1), scavenger receptor class A
        member 5 (SCARA5), and signal regulatory protein alpha (SIRPA)].
  c002:
    quotes:
    - exact: LILRB1 and SIRPA, two immunoregulatory proteins not previously implicated in AD GWAS, showed
        the strongest mechanistic link to AD in the European American PWAS.
