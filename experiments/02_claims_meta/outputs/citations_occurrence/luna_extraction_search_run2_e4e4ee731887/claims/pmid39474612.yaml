claims:
  c000:
    quotes:
    - exact: In plasma, every standard deviation increase in apolipoprotein B (APOB) was associated with
        an increased risk of hyperlipidemia (odds ratio [OR] = 9.37, 95% confidence interval [CI], 5.12-17.12;
        P = 3.58e-13; posterior probability of hypothesis 4 [PPH4] = 0.997), and the same was observed
        for proprotein convertase subtilisin/kexin type 9 (OR = 1.81, 95% CI, 1.51-2.16; P = 6.87e-11;
        PPH4 = 1) and neurocan (OR = 2.34, 95% CI, 1.82-3.01; P = 4.09e-11; PPH4 = 0.932).
