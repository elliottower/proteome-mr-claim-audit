  c005:
    quotes:
    - exact: 'Further validation using whole blood eQTL data revealed a positive association between CD14
        and OP risk (OR = 1.254, 95% CI: 1.016–1.547, p < 0.05).'
  c006:
    quotes:
    - exact: 'Further validation using whole blood eQTL data revealed a positive association between CD14
        and OP risk (OR = 1.254, 95% CI: 1.016–1.547, p < 0.05). The analysis of the GEO dataset further
        corroborated this finding.'
  c007:
    quotes:
    - exact: 'Bidirectional TSMR analysis showed a positive correlation between plasma protein CD14 and
        IgD + CD38-%B cells (Ivw beta = 0.349, OR = 1.418, 95% CI: 1.068–1.882, p < 0.05).'
  c008:
    quotes:
    - exact: In addition, mediation analysis results showed that IgD + CD38-%B cells mediates 12% of the
        effect of CD14 on OP risk.
  c009:
    quotes:
    - exact: 'Finally, in the drug target MR study and Phe-MR analysis, anti-CD14 exhibited a protective
        effect against OP (OR = 0.798, 95%CI: 0.646–0.984, p < 0.05).'
  c010:
