claims:
  c000:
    quotes:
    - exact: Our findings revealed that plasma MGP and TMEM38B proteins were negatively correlated with
        OP (p < 0.001), while CD14, RUFY1, and IL6ST were positively associated with the risk of OP (p < 0.001).
