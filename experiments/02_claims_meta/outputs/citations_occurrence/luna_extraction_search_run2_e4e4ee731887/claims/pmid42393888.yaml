        and pQTL analysis, FCN1 and ING4 were determined to be causally associated with UC.
  c002:
    quotes:
    - exact: With these DEGs as exposure factors and the GWAS data of UC as outcomes, along with eQTL
        and pQTL analysis, FCN1 and ING4 were determined to be causally associated with UC. Both genes
        were effective in differentiating between UC patients and healthy controls.
  c003:
    quotes:
    - exact: With these DEGs as exposure factors and the GWAS data of UC as outcomes, along with eQTL
        and pQTL analysis, FCN1 and ING4 were determined to be causally associated with UC. Both genes
        were effective in differentiating between UC patients and healthy controls.
  c004:
    quotes:
    - exact: Furthermore, ING4 was lowly expressed in UC intestinal tissues and in LPS-treated intestinal
        epithelial cells, and it was involved in inflammatory responses.
  c005:
    quotes:
    - exact: An in vitro functional experiment demonstrated that the knockdown or overexpression of ING4
        could regulate the phosphorylation-induced activation of the NF-κB pathway and affect the release
        of the inflammatory factor iNOS, thereby triggering the occurrence and development of UC.
