claims:
  c000:
    quotes:
    - exact: We identified autoimmune diseases-specifically hyperthyroidism and membranous nephropathy,
        as novel risk factors for LM. Mediation analysis revealed that promotilin, monounsaturated fatty
        acids (MUFAs), and glucose serves as key circulating mediators driving this risk.
  c001:
    quotes:
    - exact: Mechanistically, leucine exposure induced metabolic reprogramming characterized by the suppression
        of lipid biosynthesis pathways and reduced SREBF1/FASN-mediated de novo lipogenesis; pharmacological
        FASN inhibition recapitulated the anti-tumor effects of leucine.
