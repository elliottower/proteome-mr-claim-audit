claims:
  c000:
    quotes:
    - exact: Mendelian randomization analysis identified nine plasma proteins. MDGA2 (OR, 1.13; 95% CI,
        1.08–1.19), NTM (OR, 1.12; 95% CI, 1.09–1.16) , PMM2 (OR, 1.35; 95% CI, 1.18–1.53), RNASET2 (OR,
        1.15; 95% CI, 1.08–1.21), and TFPI (OR, 4.58; 95% CI, 3.02–6.94) increased the risk of LUAD, while
        ALAD (OR, 0.79; 95% CI, 0.72–0.87), FLT1 (OR, 0.39; 95% CI, 0.28–0.55) , ICAM5 (OR, 0.91; 95%
        CI, 0.88–0.95), and VWC2 (OR, 0.85; 95% CI, 0.79–0.92) decreased the risk.
