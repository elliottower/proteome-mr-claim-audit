claims:
  c000:
    quotes:
    - exact: We identified that 25-hydroxyvitamin D levels partially mediate the increased risk of cholelithiasis
        following the upregulation of SULT2A1 protein expression, with a mediation proportion of 21% (UKB)
        and 11% (FinnGen).
  c001:
    quotes:
    - exact: We identified that 25-hydroxyvitamin D levels partially mediate the increased risk of cholelithiasis
        following the upregulation of SULT2A1 protein expression, with a mediation proportion of 21% (UKB)
        and 11% (FinnGen).
  c002:
    quotes:
    - exact: In addition, Deoxycholic acid 25-sulfate levels partially mediate the increased risk of cholelithiasis
        following the upregulation of SULT2A1 protein expression, with a mediation proportion of 13.89%
        (UKB) and 12.83% (FinnGen).
  c003:
    quotes:
    - exact: In addition, Deoxycholic acid 25-sulfate levels partially mediate the increased risk of cholelithiasis
        following the upregulation of SULT2A1 protein expression, with a mediation proportion of 13.89%
        (UKB) and 12.83% (FinnGen).
  c004:
    quotes:
    - exact: Additionally, the negative correlation between SULT2A1 and 25- hydroxyvitamin D, along with
        the positive correlation with deoxycholic acid 25-sulfate levels, may potentially lead to cholelithiasis.
