claims:
  c000:
    quotes:
    - exact: We found that eight of these candidate protein markers were abnormally expressed in human
        postmortem brain tissue from patients with AD, although some of the proteins that were most strongly
        associated with dementia risk, such as GDF15, were not detected in these brain tissue samples.
  c001:
    quotes:
    - exact: Bidirectional two-sample Mendelian randomization genetically validated nine of our candidate
        proteins as markers of AD in midlife and inferred causality of SERPINA3 in AD pathogenesis.
