claims:
  c000:
    quotes:
    - exact: Several SMR-prioritized genes showed directional concordance between genetically predicted
        effects and tumor expression, including the protective candidate HGF (ORSMR = 0.37, P = 0.010)
        and the risk-associated AKT1 (ORSMR = 1.19, P = 0.024).
  c001:
    quotes:
    - exact: Several SMR-prioritized genes showed directional concordance between genetically predicted
