  c004:
    quotes:
    - exact: Higher tumor HGF expression correlated with better OS (HRCox = 0.70, P = 0.008) and PFI (HRCox
        = 0.72, P = 0.020), whereas higher AKT1 expression correlated with poorer OS (HRCox = 1.42, P
        = 0.010).
