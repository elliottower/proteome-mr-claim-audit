        and the risk-associated AKT1 (ORSMR = 1.19, P = 0.024).
  c002:
    quotes:
    - exact: 'Both were further supported by two-sample MR sensitivity analyses (HGF: ORIVW = 0.72, P
        = 0.007; AKT1: ORIVW = 1.17, P = 0.009), with no evidence of horizontal pleiotropy (Egger intercept
        P > 0.05).'
