  c004:
    quotes:
    - exact: Further mediation analysis indicated that the ferroptosis mechanism regulated by SMPD1 and
        SIRT3 partially mediated the association between specific plasma metabolites and childhood obesity,
        with the highest mediation proportion reaching 9.62%.
