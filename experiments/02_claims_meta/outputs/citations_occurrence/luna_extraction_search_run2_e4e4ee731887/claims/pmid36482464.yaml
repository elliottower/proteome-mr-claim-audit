claims:
  c000:
    quotes:
    - exact: The genetically determined protein level of C4A/C4B (OR = 0.70, p = 1.66E-07) in the brain
        and ACP5 (OR = 0.42, p = 3.73E-05), CNTN2 (OR = 0.62, p = 2.57E-04), and PLA2G7 (OR = 0.71, p
        = 1.48E-04) in the CSF was associated with a lower risk of SCZ, while the genetically determined
        protein level of TIE1 (OR = 3.46, p = 4.76E-05), BCL6 (OR = 3.63, p = 1.59E-07), and MICB (OR
        = 4.49, p = 2.31E-11) in the CSF were associated with an increased risk for SCZ.
