claims:
  c000:
    quotes:
    - exact: Among 4907 plasma proteins, MR identified prefoldin subunit 2 (PFDN2) as a protective factor
        against hypopharyngeal carcinoma, with no evidence of reverse causality.
  c001:
    quotes:
    - exact: Immune phenotype MR analyses revealed CD64 on monocyte (FCGR1A+ monocytes) as the only immune
        trait causally linked to both PFDN2 and cancer risk.
  c002:
    quotes:
    - exact: Immune phenotype MR analyses revealed CD64 on monocyte (FCGR1A+ monocytes) as the only immune
        trait causally linked to both PFDN2 and cancer risk.
  c003:
    quotes:
    - exact: Analysis using multiple deconvolution algorithms demonstrated a consistent negative correlation
        between PFDN2 expression and monocyte infiltration.
  c004:
    quotes:
    - exact: Virtual knockout of PFDN2 selectively activated monocyte-associated inflammatory programs.
  c005:
    quotes:
    - exact: Tissue analyses further confirmed PFDN2 downregulation and CD64 upregulation in HNSC, correlating
        with advanced tumor grade and stage.
  c006:
    quotes:
    - exact: Tissue analyses further confirmed PFDN2 downregulation and CD64 upregulation in HNSC, correlating
        with advanced tumor grade and stage.
  c007:
    quotes:
    - exact: Our findings establish PFDN2 as a protective plasma protein that restrains HNSC progression
        by suppressing CD64 on monocyte-mediated inflammatory immune microenvironments, highlighting the
        PFDN2-CD64 axis as a potential prognostic biomarker and therapeutic target.
