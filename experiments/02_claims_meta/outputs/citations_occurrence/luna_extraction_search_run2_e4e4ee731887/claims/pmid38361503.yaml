claims:
  c000:
    quotes:
    - exact: The MR results at both discovery and validation stages supported the causality (IVW-P < 0.00045)
        between plasma levels of 4 SRPs (C3b, CTNNB1, CCL1, and CCL3L1) and the risk of AMD and supported
        potential causality (IVW-P < 0.05) between other 10 SRPs and risk of AMD.
