claims:
  c000:
    quotes:
    - exact: 'Proteins related to an increased risk of MN in plasma include ABO [(Histo-Blood Group Abo
        System Transferase) (WR OR = 1.12, 95%CI:1.05-1.19, FDR=0.09, PPH4 = 0.79)], VWF [(Von Willebrand
        Factor) (WR OR = 1.41, 95%CI:1.16-1.72, FDR=0.02, PPH4 = 0.81)] and CD209 [(Cd209 Antigen) (WR
        OR = 1.19, 95%CI:1.07-1.31, FDR=0.09, PPH4 = 0.78)], and proteins that have a protective effect
        on MN: HRG [(Histidine-Rich Glycoprotein) (WR OR = 0.84, 95%CI:0.76-0.93, FDR=0.02, PPH4 = 0.80)],
        CD27 [(Cd27 Antigen) (WR OR = 0.78, 95%CI:0.68-0.90, FDR=0.02, PPH4 = 0.80)], LRPPRC [(Leucine-Rich
        Ppr Motif-Containing Protein, Mitochondrial) (WR OR = 0.79, 95%CI:0.69-0.91, FDR=0.09, PPH4 =
        0.80)], TIMP4 [(Metalloproteinase Inhibitor 4) (WR OR = 0.67, 95%CI:0.53-0.84, FDR=0.09, PPH4
        = 0.79)] and MAP2K4 [(Dual Specificity Mitogen-Activated Protein Kinase Kinase 4) (WR OR = 0.82,
        95%CI:0.72-0.92, FDR=0.09, PPH4 = 0.80)].'
