claims:
  c000:
    quotes:
    - exact: Elevated levels of 4 proteins (NCF1, ATRN, PIANP, and CD48) were associated with an increased
        risk of PHN, while higher levels of 10 proteins (GABARAPL2, MAP1LC3B, ARF3, KIR2DL5A, DLK1, COLEC12,
        GPI, SEMG2, EIF4B, and HFE2) were linked to a decreased risk.
