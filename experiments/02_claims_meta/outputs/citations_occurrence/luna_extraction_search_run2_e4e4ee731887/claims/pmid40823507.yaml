claims:
  c000:
    quotes:
    - exact: SMR identified ICAM1 as a causal protein for psoriasis, regulated by the TYK2 SNP rs34536443.
  c001:
    quotes:
    - exact: In TYK2-P1104A mutant THP-1 cells, LPS-induced ICAM1 expression was significantly reduced,
        with ICAM5 unaffected.
  c002:
    quotes:
    - exact: In TYK2-P1104A mutant THP-1 cells, LPS-induced ICAM1 expression was significantly reduced,
        with ICAM5 unaffected.
  c003:
    quotes:
    - exact: In TYK2-P1104A mutant THP-1 cells, LPS-induced ICAM1 expression was significantly reduced,
        with ICAM5 unaffected. The mutation also suppressed IL-1β, TNF-α, IL-6, and IL-18 expression,
        suggesting anti-inflammatory effects.
