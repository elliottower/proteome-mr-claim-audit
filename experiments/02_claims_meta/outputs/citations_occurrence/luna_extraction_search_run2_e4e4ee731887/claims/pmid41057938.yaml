claims:
  c000:
    quotes:
    - exact: Gene expression of QDPR, TGM1, NTSR1, CBR3, and NEK6 was positively correlated with osteomyelitis
        risk, whereas HLA-DRB1, LAMC1, LTB4R, MAPK3, FPR1, ABAT, and LTA4H were negatively correlated
        with this risk.
