claims:
  c000:
    quotes:
    - exact: 'Beta-crystallin B2 (CRYBB2) showed the most robust association (hazard ratio: 1.60; 95%
        confidence interval: 1.55-1.66, P = 5.28×10-164).'
  c001:
    quotes:
    - exact: Mendelian randomization analysis provided evidence supporting causal relationships for 4
        proteins (CRYBB2, V-set and immunoglobulin domain-containing protein 4, mevalonate kinase, and
        metalloproteinase inhibitor 1) with cataract, with genetically predicted CRYBB2 levels showing
        a significant association with cataract risk, which is strongly supported by colocalization evidence.
