claims:
  c000:
    quotes:
    - exact: We also identified novel risk proteins, including ENPP6, a choline phosphodiesterase overexpressed
        in glioma, for IDH-wildtype glioblastoma (OR=0.62, p=7.6×10-5), and galectin-3, a lectin encoded
        by a tumor fitness gene in CRISPR screens of glioma proliferation and a clinical drug target,
        for glioma overall (OR=1.37, p=1.3×10-5).
  c001:
    quotes:
    - exact: We also identified novel risk proteins, including ENPP6, a choline phosphodiesterase overexpressed
        in glioma, for IDH-wildtype glioblastoma (OR=0.62, p=7.6×10-5), and galectin-3, a lectin encoded
        by a tumor fitness gene in CRISPR screens of glioma proliferation and a clinical drug target,
        for glioma overall (OR=1.37, p=1.3×10-5).
  c002:
    quotes:
    - exact: Most risk signals were subtype-specific, such as CRELD1 (p=2.5×10-5) for triple-negative
        glioblastoma.
  c003:
    quotes:
    - exact: 'We found three candidate risk proteins for IDH-mutant 1p19q-intact glioma: immunoglobulin
        glycoprotein BCAM (p=9.6×10-8), neurotrophin receptor SorCS2 (p=3.6×10-5) and immune checkpoint
        PD-1 (p=1.1×10-5).'
  c004:
    quotes:
    - exact: 'We found three candidate risk proteins for IDH-mutant 1p19q-intact glioma: immunoglobulin
        glycoprotein BCAM (p=9.6×10-8), neurotrophin receptor SorCS2 (p=3.6×10-5) and immune checkpoint
        PD-1 (p=1.1×10-5).'
  c005:
    quotes:
    - exact: Interestingly, genetically-predicted PD-1 levels had a larger effect on IDH-mutant 1p19q-intact
        (OR=2.75, 95% CI=1.61-4.69) than IDH-wildtype (OR=0.73, 95% CI=0.51-1.05) tumors, suggesting germline
        differences in immune checkpoint mechanisms among subtypes.
  c006:
    quotes:
    - exact: Interestingly, genetically-predicted PD-1 levels had a larger effect on IDH-mutant 1p19q-intact
        (OR=2.75, 95% CI=1.61-4.69) than IDH-wildtype (OR=0.73, 95% CI=0.51-1.05) tumors, suggesting germline
        differences in immune checkpoint mechanisms among subtypes.
