claims:
  c000:
    quotes:
    - exact: Coupled with previous evidence that low circulating NeGR1 levels promote adiposity, its association
        with PA and potential causal role in T2D shown here suggest that NeGR1 may link PA exposure with
        metabolic outcomes.
  c001:
    quotes:
    - exact: 'Eighteen of these proteins were independently associated with incident T2D (p<1.25x10-3)
        including neuronal growth regulator 1 (NeGR1) (HR per SD: 0.85; p-value=7.5x10-11).'
  c002:
    quotes:
    - exact: 'Two-sample Mendelian randomization inverse variance weighted analysis indicated that higher
        NeGR1 reduces T2D risk (OR per SD: 0.92; p=0.03) and was consistent with MR-Egger, weighted median,
        and weighted mode sensitivity analyses.'
