  c004:
    quotes:
    - exact: 'Regarding PC, we found 15 protein markers: seven linked to increased risk (AGER, ALAD, CHMP2B,
        PEX14, ZG16B, PPP1R14A, SERPINA3) and eight to decreased risk (BTN2A1, CEACAM21, DNAJB9, MSMB,
        PYGL, HLA-E, SOD2, TOR1AIP1), enriched in epithelial cells, monocytes/macrophages in prostate
        tumors.'
