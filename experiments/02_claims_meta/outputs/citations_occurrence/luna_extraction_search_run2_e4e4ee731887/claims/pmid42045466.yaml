claims:
  c000:
    quotes:
    - exact: 'For BC, we identified four protein markers: one associated with increased risk (PSCA) and
        three with decreased risk (GSTM1, GSTM3, GSTM4), which are mainly expressed in pericyte, urothelial,
        and NK cells in bladder tumors.'
