claims:
  c000:
    quotes:
    - exact: We identified 92 causal proteins driving IPAH incidence (e.g., NOTCH3, FLT3IG) and 15 driving
        mortality (e.g., REG4, CA6), with 9 proteins (e.g., EDN1, LRRN1) serving as dual determinants.
