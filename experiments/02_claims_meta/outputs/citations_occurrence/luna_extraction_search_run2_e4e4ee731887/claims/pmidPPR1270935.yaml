  c008:
    quotes:
    - exact: Unsupervised clustering identified a high mortality-risk phenotype characterized by upregulated
        proteins associated with extracellular matrix-receptor interaction, transforming growth factor-β
        signaling, cardiac hypertrophy, and elastic fibre formation, together with reduced plasma levels
        of APOL1.
  c009:
    quotes:
    - exact: Notably, sex-stratified analysis revealed divergent pathogenic architectures that progression
        of IPAH in males was predominantly linked to right ventricular dysfunction mediators (e.g., NT-proBNP,
        GDF15), whereas in females, it was more strongly driven by vascular dysfunction mediators (e.g.,
        EDN1, BCL2L15).
