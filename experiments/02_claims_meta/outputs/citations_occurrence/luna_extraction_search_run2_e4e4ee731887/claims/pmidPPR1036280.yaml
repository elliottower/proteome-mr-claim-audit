claims:
  c000:
    quotes:
    - exact: C4BPA, a complement-regulatory macromolecule, emerged as a causal risk factor for NSCLC across
        multiple MR models, with consistent findings validated at both transcriptomic and proteomic levels.
  c001:
    quotes:
    - exact: Epigenetic activation of C4BPA via DNA methylation was observed, and C4BPA expression was
        shown to promote NSCLC progression through the inflammatory chemokine CCL8 signaling axis.
