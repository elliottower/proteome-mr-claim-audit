claims:
  c000:
    quotes:
    - exact: Reduced methylation at cg23090046 correlated with increased KLC1 transcription, protein abundance,
        and lung cancer risk.
  c001:
    quotes:
    - exact: Similarly, reduced methylation at cg12873919 and cg13989999 was associated with elevated
        BCL2L1 transcription and heightened lung cancer risk.
  c002:
    quotes:
    - exact: 'Patients with high BCL2L1 expression exhibited greater M2 macrophage infiltration, while
        those with high KLC1 expression exhibited greater B-cell immune suppression, with the high expression
        of both genes being associated with poor prognosis [KLC1: hazard ratio (HR) =1.29, 95% confident
        interval (CI): 1.14-1.45; BCL2L1: HR =1.17, 95% CI: 1.01-1.36].'
  c003:
    quotes:
    - exact: 'Patients with high BCL2L1 expression exhibited greater M2 macrophage infiltration, while
        those with high KLC1 expression exhibited greater B-cell immune suppression, with the high expression
        of both genes being associated with poor prognosis [KLC1: hazard ratio (HR) =1.29, 95% confident
        interval (CI): 1.14-1.45; BCL2L1: HR =1.17, 95% CI: 1.01-1.36].'
