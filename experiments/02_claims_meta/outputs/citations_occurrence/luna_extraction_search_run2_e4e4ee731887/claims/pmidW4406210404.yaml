  c012:
    quotes:
    - exact: Combining CEND1, GFAP, NEFL, and SYT1 with basic demographic data generated desirable predictions
        for 10‐year (AUC=0.901) and over‐10‐year AD (AUC=0.864), which were comparable to full model with
        proteomic and demographic data. In addition, CEND1 and SYT1 were potentially novel drug targets,
        as supported by Mendelian randomization (P<0.001) and colocalization analyses (Posterior Probability>0.8).
