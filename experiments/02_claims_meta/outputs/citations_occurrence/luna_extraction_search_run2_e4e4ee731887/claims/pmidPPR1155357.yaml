claims:
  c000:
    quotes:
    - exact: 'Using summary-data-based Mendelian randomization (SMR) with HEIDI filtering followed by
        Bayesian colocalization, we prioritized a fixed set of 13 mitochondrial genes with evidence of
        shared genetic regulation with the F11 phenotype. These signals converged on two pathway axes:
        fatty-acid β-oxidation (e.g., CPT2 and HADHB), for which genetically predicted higher transcript
        levels were associated with lower risk, and mitochondrial translation (e.g., MRPL21, MRPS17 and
        MTIF3), for which higher expression was associated with higher risk.'
