claims:
  c000:
    quotes:
    - exact: SMR analyses identified EIF2B2 and RPS6KL1 as causal protective genes for EAC; genetically
        elevated expression of both reduced EAC risk.
  c001:
    quotes:
    - exact: SMR analyses identified EIF2B2 and RPS6KL1 as causal protective genes for EAC; genetically
        elevated expression of both reduced EAC risk.
  c002:
    quotes:
    - exact: Functionally, overexpression of EIF2B2 and RPS6KL1 in OE33 cells significantly suppressed
        cell viability, invasion, and colony formation, while inducing apoptosis, thereby experimentally
        validating their tumor-suppressive effects.
