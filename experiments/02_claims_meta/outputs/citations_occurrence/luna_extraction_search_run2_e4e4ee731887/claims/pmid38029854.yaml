claims:
  c000:
    quotes:
    - exact: 'Low-density lipoprotein receptor-related protein 12 (LRP12: 34.3%-58.1%) and coagulation
        factor (F)XI (20.6%-39.6%) mediated most of the associations between 3 obesity indicators and
        VTE.'
  c001:
    quotes:
    - exact: Likewise, coagulation FXI mediated most of the smoking-VTE association (40%; 95% CI, 20%-60%)
        and insomnia-VTE association (27%; 95% CI, 5%-49%).
  c002:
    quotes:
    - exact: Likewise, coagulation FXI mediated most of the smoking-VTE association (40%; 95% CI, 20%-60%)
        and insomnia-VTE association (27%; 95% CI, 5%-49%).
  c003:
    quotes:
    - exact: Five proteins (interleukin-6 receptor subunit alpha, LRP12, prothrombin, angiopoietin-1,
        and low-density lipoprotein receptor-related protein 4) were associated with VTE and its cardiovascular
        comorbidities.
