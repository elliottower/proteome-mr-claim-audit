claims:
  c000:
    quotes:
    - exact: The results showed that 13 plasma proteins (CHST9, RACGAP1, IL18R1, FCRL3, ERAP1, GRN, MLN,
        TDGF1, SIRPB1, C1QTNF1, TAPBPL, TMPRSS11D, TPST2) had a causal relationship with gliomas, with
        five being risk factors (SIRPB1, RACGAP1, MLN, CHST9, TPST2) and eight being protective factors
        (TMPRSS11D, C1QTNF1, GRN, IL18R1, FCRL3, TAPBPL, ERAP1, TDGF1).
