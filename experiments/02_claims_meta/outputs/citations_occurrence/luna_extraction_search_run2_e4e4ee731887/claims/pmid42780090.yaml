claims:
  c000:
    quotes:
    - exact: Genetically predicted higher levels of proteins encoded by ABO, F11, F7, MLN, BTD, MEP1B,
        and VAMP8 increased EOS risk (ORs ~1.05-1.32 per SD), whereas higher levels of proteins encoded
        by FN1, GRK5, EHBP1, and FCN2 were protective.
