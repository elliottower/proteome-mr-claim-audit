claims:
  c000:
    quotes:
    - exact: After applying Bonferroni correction, sensitivity analyses, and reverse causation detection,
        we identified 12 potential druggable proteins significantly associated with LUSC risk. Five of
        these proteins (DOK2, FKBPL, NCF2, PDIA3, and TCL1A) showed strong evidence of colocalization.
