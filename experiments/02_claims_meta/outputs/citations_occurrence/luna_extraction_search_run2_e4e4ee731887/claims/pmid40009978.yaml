claims:
  c000:
    quotes:
    - exact: We identified 76 relationships between proteins and sarcopenia traits. The absolute values
        of causal effects (βIVW) ranging from 0.01 to 0.35. IL2, AIF1, GDNF, CXCL13, LRRTM3, and SLPI
        were the top six proteins ranked by causal effects.
