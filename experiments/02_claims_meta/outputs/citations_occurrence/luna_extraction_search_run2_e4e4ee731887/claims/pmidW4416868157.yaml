claims:
  c000:
    quotes:
    - exact: 'A total of 2,920 proteins were included in the final analysis, and 7 proteins were identified
        as having a purely forward causal effect on eGFR: Angiopoietin-2 (ANGPT2), Serum Amyloid P Component
        (APCS), Serine Protease 8 (prostasin, PRSS8), Cathepsin S (CTSS), Fc Receptor for IgA and IgM
        (FCAMR), Parathyroid Hormone (PTH), and Uromodulin (UMOD).'
