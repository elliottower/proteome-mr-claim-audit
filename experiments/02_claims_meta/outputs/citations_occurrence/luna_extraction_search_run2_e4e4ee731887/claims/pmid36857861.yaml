  c002:
    quotes:
    - exact: The associations of STAT3 (signal transducer and activator of transcription 3), MST1, CXCL5
        (C-X-C motif chemokine ligand 5), and ITPKA (inositol-trisphosphate 3-kinase A) with the risk
