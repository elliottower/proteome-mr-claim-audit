claims:
  c000:
    quotes:
    - exact: Using univariate Mendelian randomization (UVMR), we identified plasma proteins and genes
        associated with Alzheimer's disease (AD), PD, and amyotrophic lateral sclerosis (ALS), and validated
        their causal relationships through colocalization analysis. Cross-validation across multi-omics
        datasets revealed transcriptional enhancer factor (TEF) as a protective factor for PD, whereas
        increased counts of CD14+CD16+ monocytes were identified as a risk factor.
  c001:
    quotes:
    - exact: Cross-validation across multi-omics datasets revealed transcriptional enhancer factor (TEF)
        as a protective factor for PD, whereas increased counts of CD14+CD16+ monocytes were identified
        as a risk factor. Single-cell analysis and multivariate Mendelian randomization (MVMR) further
        suggested potential mediating roles of these factors in PD pathogenesis.
  c002:
    quotes:
    - exact: In vitro experiments demonstrated that TEF overexpression significantly enhanced the resistance
        of neuroblastoma cells to rotenone-induced damage, inhibited apoptosis, and preserved tyrosine
        hydroxylase (TH) expression.
