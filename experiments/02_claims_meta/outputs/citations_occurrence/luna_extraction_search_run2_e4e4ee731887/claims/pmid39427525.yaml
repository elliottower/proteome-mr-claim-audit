  c007:
    quotes:
    - exact: Mendelian randomization analysis shows a negative correlation between NRCAM and AD risk.
  c008:
    quotes:
    - exact: Additionally, colocalization analysis reveals a significant association between AD and SNP
        loci in APOE.
  c009:
    quotes:
    - exact: Transcriptomic analysis indicates a significant downregulation of NRCAM and PYY in the peripheral
        blood of AD patients (P < 0.01), while APOE, CGA, and NRCAM are significantly downregulated in
        the brains of AD patients (P < 0.0001).
