claims:
  c000:
    quotes:
    - exact: Cis-pQTL Mendelian randomisation pinpointed previously unrecognised immune-modulatory proteins
        influencing walking pace, including HLA-E, which also curtailed moderate-physical activity (β
        = –0.074, p=1.6×10 -46 ) and lowered brain-MRI-PC2 (iron content/structural connectivity) (β =
        –1.34, p=1.3×10 -46 ); ITIH4 decreased Usual Walking Pace (β = -0.01, p=6.0×10 -10 ). NCAN reduced
        liver fat (abdominal-MRI-PC4, β = –1.28, p=1.7×10 -290 ), while FKBP7 enhanced contractility (cardiac-MRI-PC2,
        β = 3.30, p=1.9×10 -28 ).
