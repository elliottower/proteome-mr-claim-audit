  c004:
    quotes:
    - exact: Subtype analyses revealed CD-specific associations with erythrocyte band 7 (OR = 0.82, 0.76-0.90)
        and IL1RL1 (OR = 1.10, 1.05-1.14), while UC risk correlated with ADH1B (OR = 0.85, 0.78-0.91)
        and high-affinity immunoglobulin gamma Fc receptor I (FCGR1A; OR = 0.82, 0.75-0.90).
