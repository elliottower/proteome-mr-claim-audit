claims:
  c000:
    quotes:
    - exact: 'Four proteins showed associations with overall IBD risk: erythrocyte band 7 integral membrane
        protein (OR = 0.84, 95% CI = 0.77-0.90), Interleukin-1 receptor-like 1 (IL1RL1; OR = 1.07, 1.04-1.10),
        Interleukin-18 receptor 1 (IL18R1; OR = 1.08, 1.04-1.12), and alcohol dehydrogenase 1 B (ADH1B;
        OR = 0.85, 0.79-0.91).'
