claims:
  c000:
    quotes:
    - exact: We identified 17 plasma proteins causally associated with HCC risk (PIVW < .05). Sixteen
        proteins were positively associated, including TMCC3, METTL1, SNRPF, KRT19, MED4, RFNG, IL26,
        NRXN1, MSH2, CLCA2, AKT2, CRYZL1, RDH16, CSF3, CPA4 and COPS7B, while EPHA2 was inversely associated.
