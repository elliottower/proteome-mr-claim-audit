claims:
  c000:
    quotes:
    - exact: After Bonferroni correction, 67 proteins were identified to be causally associated with estimated
        BMD (eBMD) (p < 4 × 10-5). We further replicated 38 of the 67 proteins to be associated with total
        body BMD, lumbar spine BMD, femoral neck BMD as well as fractures, such as RSPO3, IDUA, SMOC2,
        and LRP4.
