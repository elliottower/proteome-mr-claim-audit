claims:
  c000:
    quotes:
    - exact: FSTL3, an indicator of Activin/TGFβ signaling, was the most significantly upregulated protein
        associated with the heart failure biomarker, NTproBNP (β = 0.4;p adj =4.6x 10 - 7 ), while ADAMTS13,
        a vWF-cleaving protease whose loss-of-function causes microvascular thrombosis, was the most downregulated
        protein associated with myocardial injury (β=-0.4;p adj =8x 10 - 7 ).
