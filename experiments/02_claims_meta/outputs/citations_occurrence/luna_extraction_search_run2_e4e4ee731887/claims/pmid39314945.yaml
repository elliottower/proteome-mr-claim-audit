  c006:
    quotes:
    - exact: Two-sample Mendelian randomization analysis using cis-pQTLs genetic instruments revealed
        that a lower protein expression of apolipoprotein E and higher IL-10 receptor subunit B were causally
        linked to incident ADRD.
