claims:
  c000:
    quotes:
    - exact: In participants with a history of MDD at baseline (n=3,615), we found that plasma levels
        of NfL, GFAP, PSG1 were associated with higher risk (HR=1.38; 1.37; 1.34, respectively; all adjusted
        p-values<0.05), while VGF, GET3, and HPGDS were associated with lower risk of incident ADRD (n=150)
        (HR=0.73; 0.71; 0.66, respectively; all adjusted p-values<0.05) during a mean follow-up of 13.7
        years (SD=2.2).
