claims:
  c000:
    quotes:
    - exact: Genetically proxied adiposity (body mass index and obesity), triglyceride rich lipoproteins,
        glycoprotein acetyls (GlycA), and apolipoprotein E increased CRP levels, whereas HDL-related cholesterols,
        polyunsaturated fatty acids, and glutamine decreased CRP.
  c001:
    quotes:
    - exact: As expected, IL-6 had a large effect on CRP.
  c002:
    quotes:
    - exact: Bidirectional analyses indicated little evidence that CRP directly drives metabolic traits
        when restricting to  cis -acting instruments, whereas genetically proxied IL-6 signalling showed
        consistent downstream effects on HDL particle concentration and composition.
  c003:
    quotes:
    - exact: Bidirectional analyses indicated little evidence that CRP directly drives metabolic traits
        when restricting to  cis -acting instruments, whereas genetically proxied IL-6 signalling showed
        consistent downstream effects on HDL particle concentration and composition.
