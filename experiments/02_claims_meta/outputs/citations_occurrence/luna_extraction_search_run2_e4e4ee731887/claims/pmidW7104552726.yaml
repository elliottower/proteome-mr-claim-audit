claims:
  c000:
    quotes:
    - exact: 'We tested 1628 unique proteins in adults and 210 proteins in children, and we found four
        plasma proteins significantly associated with SSNS (HLA-E: p=2.95e-7, Odds Ratio [OR]=8.17, Confidence
        Intervals [CI] 3.66-18.25; C4A: p=1.63e-6, [OR]=0.12, [CI] 0.05-0.29; APOM: p=1.37e-5, [OR]=0.40,
        [CI] 0.27-0.61 ; TNXB: p=2.95e-4, [OR]=0.49, [CI] 0.33-0.72).'
