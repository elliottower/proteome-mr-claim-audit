claims:
  c000:
    quotes:
    - exact: In the main analysis, 38 plasma proteins were associated with a family history of early-onset
        CHD using a false discovery rate of 0.05, whereas 27 remained significant after adjusting for
        metabolic risk factors. Follistatin (FST) was positively associated with family history and only
        slightly attenuated when adjusting for metabolic risk factors.
  c001:
    quotes:
    - exact: In the main analysis, 38 plasma proteins were associated with a family history of early-onset
        CHD using a false discovery rate of 0.05, whereas 27 remained significant after adjusting for
        metabolic risk factors. Follistatin (FST) was positively associated with family history and only
        slightly attenuated when adjusting for metabolic risk factors.
  c002:
    quotes:
    - exact: In two-sample Mendelian randomization, there was evidence of causal associations between
        three proteins and CHD; the proprotein convertase subtilisin/kexin type 9 (PCSK9) enzyme, platelet
        endothelial cell adhesion molecule 1 (PECAM-1) and FST.
