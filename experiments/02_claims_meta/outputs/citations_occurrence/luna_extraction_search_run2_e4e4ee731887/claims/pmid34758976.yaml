claims:
  c000:
    quotes:
    - exact: We found that a genetically predicted SD increase in signal regulatory protein gamma (SIRPG)
        level was associated with increased risk of type 1 diabetes risk (MR odds ratio [OR] 1.66 [95%
        1.36-2.03]; P = 7.1 × 10-7).
  c001:
    quotes:
    - exact: The risk of type 1 diabetes increased almost twofold per genetically predicted standard deviation
        (SD) increase in interleukin-27 Epstein-Barr virus-induced 3 (IL27-EBI3) protein levels (MR OR
        1.97 [95% CI 1.48-2.62]; P = 3.7 × 10-6).
  c002:
    quotes:
    - exact: However, an SD increase in chymotrypsinogen B1 (CTRB1) was associated with decreased risk
        of type 1 diabetes (MR OR 0.84 [95% CI 0.77-0.90]; P = 6.1 × 10-6).
  c003:
    quotes:
    - exact: We found that a genetically predicted SD increase in signal regulatory protein gamma (SIRPG)
        level was associated with increased risk of type 1 diabetes risk (MR odds ratio [OR] 1.66 [95%
        1.36-2.03]; P = 7.1 × 10-7).
  c004:
    quotes:
    - exact: The risk of type 1 diabetes increased almost twofold per genetically predicted standard deviation
        (SD) increase in interleukin-27 Epstein-Barr virus-induced 3 (IL27-EBI3) protein levels (MR OR
        1.97 [95% CI 1.48-2.62]; P = 3.7 × 10-6).
  c005:
    quotes:
    - exact: However, an SD increase in chymotrypsinogen B1 (CTRB1) was associated with decreased risk
        of type 1 diabetes (MR OR 0.84 [95% CI 0.77-0.90]; P = 6.1 × 10-6). Sensitivity analyses using
        MR methods testing for pleiotropy while including trans-pQTL showed similar results.
