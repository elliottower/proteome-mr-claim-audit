  c000:
    quotes:
    - exact: Finally, several proteins, including GDF15, ITGAV, HPGDS, BCAN, and MENT, were found to mediate
        the relationship of PA with all-cause dementia, implicating processes such as synaptic plasticity,
        neurogenesis and inflammation, through which PA protects against dementia.
