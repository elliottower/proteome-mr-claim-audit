claims:
  c000:
    quotes:
    - exact: Five drug targets for EC (CBR3, GSTO1, HHIP, IGF2R, and MMP10), seven for endometrioid subtypes
        (ACAP2, CBR3, GSTO1, HHIP, IGF2R, MMP10, and TLR2), and seven for non-endometrioid subtypes (CST3,
        DNAJB14, FSTL5, GMPR2, IFI16, MAPK9, and NEO1) were identified.
