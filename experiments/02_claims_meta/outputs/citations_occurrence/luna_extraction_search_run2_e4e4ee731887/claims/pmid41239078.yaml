    - exact: ELISA validation confirmed significantly higher serum MICA levels in DM/CADM patients than
        in healthy controls (P = 0.001), with further elevation in DM/CADM patients with malignancy compared
        with those without malignancy (P = 0.004) and patients with malignancy alone (P = 0.033).
