claims:
  c000:
    quotes:
    - exact: Twenty proteins were associated with endometrial cancer risk in MR and colocalization analyses.
        GSTO1-1 and SKAP1 were positively and MMP10 was negatively associated with overall and endometrioid
        endometrial cancer; DTYMK and ABO were positively and TSSC4 was negatively associated with overall
        endometrial cancer; IGF2R was positively associated with endometrioid cancer; and MAPK9 was positively
        and DNAJB14, IFI16, LCN2, and SCT were negatively associated with nonendometrioid endometrial
        cancer.
