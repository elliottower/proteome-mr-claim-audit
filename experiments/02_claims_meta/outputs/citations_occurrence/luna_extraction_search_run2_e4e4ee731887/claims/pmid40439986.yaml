claims:
  c000:
    quotes:
    - exact: The study identified 26 proteins that may be causally related to PsA, of which 15 were positively
        correlated and 11 negatively correlated. According to the results of SMR analysis and colocalization
        analysis, these targets were further analyzed and classified into high, medium, and low confidence
        levels. High confidence targets include APOF, PRSS27, and DDX58, which were consistently supported
        by multiple analyses.
