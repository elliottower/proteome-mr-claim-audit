claims:
  c000:
    quotes:
    - exact: MMP9 and DC-SIGN were associated with increased spontaneous abortion risk (OR=1.11(1.03-1.19),
        P=3.70x10-3; OR=1.09(1.02-1.16), p=9.89x10-3), while HBAZ and NELL1 had protective effects (OR=0.96(0.94-0.99),
        p=5.20x10-3; OR=0.94(0.9-0.98), p=8.54x10-3). Additionally, TMM85 conferred higher spontaneous
        abortion risk (OR=1.06(1.02-1.1), p=4.72x10-3).
