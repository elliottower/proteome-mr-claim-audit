  c000:
    quotes:
    - exact: Through two-step mediation analysis, 13 causal pathways were identified. After excluding
        metabolic pathways and unidentified metabolites, we determined that galactonate and LAP-TGF-β1
        mediate the relationship between Bacteroides faecis, Alistipes finegoldii, and urolithiasis, with
        mediation proportions of 16.99% (P = 0.0371) and 9.61% (P = 0.0469), respectively.
