claims:
  c000:
    quotes:
    - exact: Leveraging genomic structural equation modeling to define three latent sleep factors, namely
        circadian preference, daytime sleep burden, and nighttime sleep adequacy, bidirectional Mendelian
        randomization (MR) identifies one protein (LTA) with robust cis-instrument and strong colocalization
        support (PP.H4 = 0.98) for a putative causal effect on nighttime sleep adequacy.
  c001:
    quotes:
    - exact: 'These genetically supported candidates are prospectively associated with incident cardiovascular
        disease, stroke, type 2 diabetes, dementia, chronic kidney disease, depression, and mortality
        over a median 13.6-year follow-up, with the strongest per-SD hazard ratio (HR) associations observed
        for chronic kidney disease (e.g., BTN2A1: HR = 2.33) and type 2 diabetes (e.g., RBP5: HR = 1.58).'
