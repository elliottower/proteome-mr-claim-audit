claims:
  c000:
    quotes:
    - exact: Using a mediation framework, we demonstrate that TNFSF11 confers risk of childhood-onset
        asthma (colocalization posterior probability =88.6%) but not adult-onset asthma (colocalization
        posterior probability =0.2%), highlighting its putative role as a causal intermediate between
        adiposity and asthma risk specific to early stages in the lifecourse.
