claims:
  c000:
    quotes:
    - exact: Our analyses identified TREM1 as a robust therapeutic candidate, with elevated TREM1 expression
        promoting the progression of CrNEN.
  c001:
    quotes:
    - exact: Epigenetic analysis revealed that hypomethylation at the cg04451353 locus was associated
        with increased TREM1 expression, mediating approximately 74% of the CrNEN risk attributable to
        this epigenetic mechanism.
  c002:
    quotes:
    - exact: Immune mediation analysis suggested that increased TREM1 expression may influence the infiltration
        of specific immune subsets (CD14 + CD16- monocytes, CD25 + + CD8br Tregs, CD3 on Tregs, CD3 on
        CD39 + secreting Tregs, CD3 on CD8br Tregs, and CD28 on CD39 + CD8br Tregs), with each subset
        contributing approximately 1-4% to the total 16.65% increase in CrNEN risk.
