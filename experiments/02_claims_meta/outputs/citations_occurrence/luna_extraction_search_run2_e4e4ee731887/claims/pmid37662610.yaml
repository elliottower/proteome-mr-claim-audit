claims:
  c000:
    quotes:
    - exact: Higher genetically proxied plasma myeloid cell surface antigen CD33 level was found to be
        associated with increased risk of AD (odds ratio [OR] 1.079, 95% confidence interval [CI] 1.047-1.112,
        p = 8.39×10-7).
  c001:
    quotes:
    - exact: We also discovered the causality between genetically proxied elevated prolactin and higher
        risk of epilepsy (OR = 1.068, 95% CI = 1.034-1.102; p = 5.46×10-5).
  c002:
    quotes:
    - exact: Negative associations were identified between cyclin-dependent kinase 8 and ischemic stroke
        (OR = 0.927, 95% CI = 0.896-0.959, p = 9.32×10-6), between neuralized E3 ubiquitin-protein ligase
        1 and migraine (OR = 0.914, 95% CI = 0.878-0.952, p = 1.48×10-5), and between Fc receptor-like
        protein 4 and multiple sclerosis (MS) (OR = 0.929, 95% CI = 0.897-0.963, p = 4.27×10-5).
