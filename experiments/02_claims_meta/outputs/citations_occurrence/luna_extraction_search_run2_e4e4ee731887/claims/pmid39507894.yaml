  c000:
    quotes:
    - exact: MR analyses showed metabolite Glycosyl-N-(2-hydroxynervonoyl)-sphingosine (GNS) and protein
        Keratin 19 (KRT19) were identified as significant markers in the context of PCOS and BMI adjustments.
