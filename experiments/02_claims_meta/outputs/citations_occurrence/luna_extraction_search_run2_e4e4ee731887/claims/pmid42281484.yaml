claims:
  c000:
    quotes:
    - exact: 'Cox regression identified 92 plasma proteins significantly associated with BPH risk (false
        discovery rate <0.05). Extreme Gradient Boosting model prioritised a three-protein signature:
        TSPAN1 (hazard ratio (HR) = 1.24) and KLK3 (HR = 1.34) as risk factors, and EDA2R (HR = 0.83)
        as a protective factor.'
