  c005:
    quotes:
    - exact: Five potential proteins (MMP8, BST1, ARL1, MRPL33 and SDF2L1) were causally related to both
        VTDR and risk factors. Mediation analysis revealed that the protein-mediating effects on VTDR
        outcomes were achieved through risk factors (body mass index; glycated haemoglobin).
