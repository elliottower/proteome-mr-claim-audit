claims:
  c000:
    quotes:
    - exact: 'Using Mendelian randomization, we identified 2 proteins with an effect on subsequent MACE
        after a stroke: CCL27 ([C-C motif chemokine 27], effect odds ratio, 0.77 [95% CI, 0.66-0.88];
        adjusted P=0.05) and TNFRSF14 ([tumor necrosis factor receptor superfamily member 14], effect
        odds ratio, 1.42 [95% CI, 1.24-1.60]; adjusted P=0.006).'
