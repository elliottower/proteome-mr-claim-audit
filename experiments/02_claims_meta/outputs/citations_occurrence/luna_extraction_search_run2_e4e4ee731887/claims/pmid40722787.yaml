    - exact: Proteome-wide MR mapping identified eight plasma proteins (CCL20, CSF1, CXCL9, CD40, TGFβ1,
        CLSTN2, TNFSF12, TGFα) causally associated with all-grade irAEs, and five (CCL20, CCL25, CXCL10,
