claims:
  c000:
    quotes:
    - exact: Systematic MR analysis identified 22 candidate targets for CeD. Among the proteins analyzed,
        BTN2A1 passed all subsequent verification analyses.
  c001:
    quotes:
    - exact: Additionally, three proteins, including CatH, IL-18R1, and PTPRC, passed the majority of
        the subsequent verification analyses.
  c002:
    quotes:
