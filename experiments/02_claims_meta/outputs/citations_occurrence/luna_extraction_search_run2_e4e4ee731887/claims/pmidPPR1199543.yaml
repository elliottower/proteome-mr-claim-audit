  c004:
    quotes:
    - exact: The other 18 proteins were also candidate targets (Trehalase, CD226, SH2B3, ICOSLG, ULK3,
        Park7, ALDH2, RABEP1, TNFRSF9, COL11A2, GNPDA1, IL-1RL1, B3galt6, TNFSF11, CCL21, BTN3A3, OLFM2
        and Colipase).
