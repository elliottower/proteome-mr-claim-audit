claims:
  c000:
    quotes:
    - exact: Electrophysiological experiments showed that although PalGly does not interact with Nav1.5,
        it enhances calcium sparks in ventricular cardiomyocytes. We determined that the calcium-modulating
        effect of PalGly is mediated by its binding to and activation of the transient receptor potential
        channel 5 (TRPC5) channel.
  c001:
    quotes:
    - exact: Transcriptomic and lipidomic analyses of PalGly-treated neonatal rat cardiomyocytes revealed
        significant negative modulation of immune pathways, akin to the effects observed with agonizing
        TRPC5.
