  c004:
    quotes:
    - exact: A 64-protein risk score derived in ATMOSPHERE predicted clinical events in PARADIGM-HF with
        greater discrimination (c-statistic 0.70) than the MAGGIC clinical score (c-statistic 0.61), NT-proBNP
        (c-statistic 0.65), or both (c-statistic 0.66) (Figure 1).
