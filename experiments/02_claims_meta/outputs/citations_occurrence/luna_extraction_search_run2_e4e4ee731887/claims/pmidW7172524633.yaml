claims:
  c000:
    quotes:
    - exact: 'MR analysis against individual MACE components identified four proteins with causal evidence:
        genetically higher AGER (soluble RAGE) was associated with lower heart failure risk, and higher
        MMP-12 with lower stroke risk, whereas higher VAMP5 and NCAN were associated with increased coronary
        heart disease risk.'
