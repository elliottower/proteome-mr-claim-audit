claims:
  c000:
    quotes:
    - exact: Across 15,611 protein-outcome tests, 12 associations for nine proteins were significant in
        European ancestry. SLMAP, AMBP, ENTPD6, and PLEKHA1 were associated with increased IA risk, whereas
        SIRT2, JAG1, ADH4, and NAGLU were associated with decreased IA risk; ADAM23 was associated with
        increased SAH risk.
