  c019:
    quotes:
    - exact: 'Finally, we also performed two-sample MR analyses using survival as the outcome and identified
        two proteins whose plasma levels were associated with overall EOC survival at FDR < 0.1: SULT1E,
        a phenol sulfotransferase that conjugates sulfates to estrogens, and MA2B2.'
