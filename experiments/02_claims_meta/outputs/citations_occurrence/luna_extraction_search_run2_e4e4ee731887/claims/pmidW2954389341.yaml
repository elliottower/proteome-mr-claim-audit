claims:
  c000:
    quotes:
    - exact: Among proteins that had only a single QTL variant available as a genetic instrument, we identified
        12 proteins whose circulating levels were associated with overall EOC risk at a False Discovery
        Rate (FDR) of < 0.1. For nine of the 12 proteins, the association was driven by variants near
        ABO, which is both a genome-wide significant high grade serous histotype risk locus and a hub
        QTL for several proteins. Three of these 12 proteins and their QTLs were, however, not linked
        to the ABO locus and included the products of the NOTCH signaling genes MFAP2 and DLK1.
