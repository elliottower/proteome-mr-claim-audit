claims:
  c000:
    quotes:
    - exact: 'A simple predictive model incorporating MMP12(macrophage metalloelastase-12), CXCL17(CXC
        motif chemokine-17), IL6(interleukin-6), and WFDC2(WAP four-disulfide core domain protein-2)-alone
        or in combination-along with age and sex, demonstrated comparable predictive performance(C-index:
        0.826-0.864) to the clinical risk factors model(C-index: 0.852).'
