claims:
  c000:
    quotes:
    - exact: Based on one of the largest genome-wide association studies on type 2 diabetes mellitus (T2DM)
        to date (N = 898,130), T2DM was causally linked to raised ACE2 expression (P = 2.91E-03; MR-IVW).
  c001:
    quotes:
    - exact: Significant associations (at nominal level; P < 0.05) with ACE2 expression were observed
        across multiple diabetes data sets and analytic methods for T1DM, T2DM, and related traits including
        early start of insulin.
  c002:
