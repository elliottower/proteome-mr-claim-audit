        early start of insulin.
  c004:
    quotes:
    - exact: Other diseases/traits having nominal significant associations with increased expression included
        inflammatory bowel disease, (estrogen receptor-positive) breast cancer, lung cancer, asthma, smoking,
        and elevated alanine aminotransferase.
