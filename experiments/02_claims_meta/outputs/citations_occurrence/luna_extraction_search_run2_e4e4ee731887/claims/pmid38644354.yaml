claims:
  c000:
    quotes:
    - exact: 'The up-regulation of HP [higher ALM (beta: 0.012, 95% CI: 0.007-0.018, P = 1.2*10-5) and
        higher grip strength (OR: 0.96, 95% CI: 0.94-0.98, P = 4.2*10-5)], MAP 3K3 [higher ALM (beta:
        0.24, 95% CI: 0.21-0.26, P = 1.8*10-94), higher grip strength (OR: 0.82, 95% CI: 0.75-0.90, P
        = 2.1*10-5), and faster walking pace (beta: 0.03, 95% CI: 0.02-0.05, P = 8.5*10-6)], and MFGE8
        [higher ALM (muscle eQTL, beta: 0.09, 95% CI: 0.06-0.11, P = 6.1*10-13; blood pQTL, beta: 0.05,
        95% CI: 0.03-0.07, P = 3.8*10-09)], as well as the down-regulation of HLA-DRA [lower ALM (beta:
        -0.09, 95% CI: -0.11 to -0.08, P = 5.4*10-36) and lower grip strength (OR: 1.13, 95% CI: 1.07-1.20,
        P = 1.8*10-5)] and COL15A1 [higher ALM (muscle eQTL, beta: -0.07, 95% CI: -0.10 to -0.04, P =
        3.4*10-07; blood pQTL, beta: -0.05, 95% CI: -0.06 to -0.03, P = 1.6*10-07)], decreased the risk
        of sarcopenia.'
