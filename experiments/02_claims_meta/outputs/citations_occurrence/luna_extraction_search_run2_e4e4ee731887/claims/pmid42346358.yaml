claims:
  c000:
    quotes:
    - exact: Multi-layered MR nominated PLXND1 as a robust causal driver of MASLD.
  c001:
    quotes:
    - exact: 'Single-cell eQTL-based MR revealed a functional dichotomy: PLXND1 upregulation in CD8+ effector
        memory T-cells decreased MASLD risk (OR = 0.486, 95% CI: 0.290-0.813, p = 0.006), whereas upregulation
        in natural killer cells (OR = 1.567, 95% CI: 1.337-1.837, p < 0.001), non-classical monocytes,
        and dendritic cells increased risk.'
