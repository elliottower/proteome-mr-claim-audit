claims:
  c000:
    quotes:
    - exact: Mediation analysis revealed that the DNA methylation site cg14524975 (beta_p = 45.64%) significantly
        increased the risk of CHD by positively regulating the expression of ITGB7.
  c001:
    quotes:
    - exact: MR analysis identified 17 genes significantly positively associated with CHD, with PCSK9
        and ITGB7 showing significant upregulation in the peripheral blood of CHD patients.
  c002:
    quotes:
    - exact: MR analysis identified 17 genes significantly positively associated with CHD, with PCSK9
        and ITGB7 showing significant upregulation in the peripheral blood of CHD patients.
  c003:
    quotes:
    - exact: In downstream mechanisms, ITGB7 significantly promoted CHD progression by regulating immune
        cells, such as CD4+ CD8dim AC (beta_p = 12.04%), and plasma metabolites, including N,N-dimethylalanine
        (beta_p = 18.96%), benzoate-to-oleoyl-linoleoyl-glycerol (18:1 to 18:2) ratio (beta_p = 34.63%),
        and serine-to-threonine ratio (beta_p = 12.58%).
