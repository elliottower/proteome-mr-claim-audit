claims:
  c000:
    quotes:
    - exact: 38 proteins, with biological features of inflammation, lipid metabolism and vascular function,
        were associated with family history using a false discovery rate of 0.05. The strongest associations
        were observed for follistatin and cathepsin D, neither of which were attenuated by adjusting for
        cardiovascular risk factors.
  c001:
    quotes:
    - exact: 38 proteins, with biological features of inflammation, lipid metabolism and vascular function,
        were associated with family history using a false discovery rate of 0.05. The strongest associations
        were observed for follistatin and cathepsin D, neither of which were attenuated by adjusting for
        cardiovascular risk factors.
  c002:
    quotes:
    - exact: In two-sample mendelian randomization, a novel association was found for follistatin and
        myocardial infarction, and previous associations for PCSK9 and PECAM1 were repeated.
  c003:
    quotes:
    - exact: In subjects with a family history of early-onset CHD, the LDL-receptor, transferrin receptor
        protein 1 and PECAM1 were more strongly associated with coronary atherosclerotic burden, as compared
        to in subjects without family history.
