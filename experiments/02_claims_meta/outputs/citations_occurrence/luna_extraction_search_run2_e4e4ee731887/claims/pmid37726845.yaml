claims:
  c000:
    quotes:
    - exact: Collectively, genetically predicted levels of 13 proteins were associated with CRC risk.
        Elevated levels of two proteins (GREM1, CHRDL2) and decreased levels of 11 proteins were associated
        with an increased risk of CRC, among which four (GREM1, CLSTN3, CSF2RA, CD86) were prioritized
        with the most convincing evidence.
