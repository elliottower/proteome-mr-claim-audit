  c003:
    quotes:
    - exact: This study inferred that the abundance of 30 proteins in the plasma was causally associated
        with CAD (P < 0.05/4408, Bonferroni correction), such as PLG, IL15RA, and CSNK2A1. PLG, PSCK9,
        COLEC11, ZNF180, ERP29, TCP1, FN1, CDH5, IL15RA, MGAT4B, TNFRSF6B, DNM2, and TGF1R were replicated
        in the confirmatory PMR (P < 0.05).
