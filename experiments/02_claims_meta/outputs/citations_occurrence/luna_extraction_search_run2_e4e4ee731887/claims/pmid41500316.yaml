claims:
  c000:
    quotes:
    - exact: Through DPAA, we identified 22 proteins associated with depression (Padjusted < 1.71 × 10-5),
        with each SD in protein levels corresponding to an 11 %-27 % difference in depression risk. Most
        proteins were positively associated, whereas LRRN1, CNTN5, and ADAMTS8 showed inverse relationships.
