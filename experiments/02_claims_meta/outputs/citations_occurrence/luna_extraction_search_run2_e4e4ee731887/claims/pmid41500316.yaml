  c003:
    quotes:
    - exact: Although MR suggested causal evidence for BTN3A2(Padjusted < 2.27 × 10-3), colocalization
        indicated likely confounding by linkage disequilibrium (PPH3 = 73.5 %).
  c004:
    quotes:
    - exact: Other proteins (LGALS4, ADAMTS8, TNFRSF10B, CXADR, IGFBP4, and PRSS8) showed weak causal
        associations (P < 0.05) with little colocalization support (PPH4 ≤ 6.3 %).
