  c003:
    quotes:
    - exact: 'Notably, TOP1MT expression conferred protective effects against primary Sjögren''s syndrome
        (OR: 0.57; 95% CI: 0.35-0.95, pSMR = 8.21e-03).'
  c004:
    quotes:
    - exact: 'Crucially, only UQCRH was identified with the same variant (rs41292543) exhibiting inverse
        effects on multiple myositis, including causal effects through cg11235697 methylation (OR: 1.56;
        95% CI: 1.23-1.98, pSMR = 3.02e-04) and protective effects through gene expression (OR: 0.83;
        95% CI: 0.72-0.95, pSMR = 2.78e-04).'
