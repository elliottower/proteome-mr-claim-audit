claims:
  c000:
    quotes:
    - exact: Downstream transcriptomic-level TWAS and SMR identified three gene expressions both linked
        to birth weight and at least one cortical structural phenotype (CNNM2, RABGAP1 and CENPW). Parallel
        PWAS and SMR analyses at the proteomic level identified four proteins linked to both phenotypes
        (CNNM2, RAB7L1, RAB5B and PPA2), of which CNNM2 was replicated.
