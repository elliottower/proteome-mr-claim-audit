claims:
  c000:
    quotes:
    - exact: 'The study identified that the LAT-IL23R metabolic axis mediates CRS through γ-glutamyltyrosine
        and trans-4-hydroxyproline.

        CONCLUSION: This study systematically reveals, for the first time, the promoting role of the LAT-IL23R-amino
        acid metabolic network in CRS, providing a theoretical basis for the development of targeted combination
        therapies.'
