claims:
  c000:
    quotes:
    - exact: Subsequent proteome-wide Mendelian randomization and colocalization analyses across four
        large proteomics cohorts identified 27 candidate causal proteins influencing OA via pathways not
        fully mediated by BMI. Among these, extracellular matrix and bone remodeling mediators such as
        COL6A2, SMAD3, SPP1, and TNFSF11 (RANKL) were highlighted as promising therapeutic targets.
