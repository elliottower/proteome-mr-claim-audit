  c003:
    quotes:
    - exact: Clinical tissue validation confirmed that IER3IP1 mRNA levels were significantly elevated
        in FL patient tissues.
  c004:
    quotes:
    - exact: Functional studies in an FL cell line demonstrated that IER3IP1 acts as an oncogene, promoting
        proliferation, colony formation, and migration while inhibiting apoptosis.
