  c008:
    quotes:
    - exact: Mechanistically, IER3IP1 depletion promoted FOXO1-mediated transcriptional upregulation of
        CD20 via the XBP1/FOXO1 signaling axis, which concomitantly activated the intrinsic apoptotic
        pathway and significantly enhanced the sensitivity of FL cells to Rituximab-mediated cytotoxicity
        and apoptosis.
