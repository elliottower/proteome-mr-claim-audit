claims:
  c000:
    quotes:
    - exact: 'Among them, MSMB (Odds ratio (OR) = 0.81; 95% confidence interval (CI) : 0.80–0.82; <italic>P</italic> = 2.52×10<sup>− 148</sup>),
        IGF2R (OR = 0.92; 95% CI: 0.90–0.94; <italic>P</italic> = 4.57×10<sup>− 10)</sup>, KDELC2 (OR = 0.89;
        95% CI: 0.86–0.93; <italic>P</italic> = 1.89×10<sup>− 8</sup>), TNFRSF10B (OR = 0.74; 95% CI:
        0.65–0.83; <italic>P</italic> = 2.41×10<sup>− 7</sup>), and GSTP1 (OR = 0.82; 95% CI: 0.75–0.90;
        <italic>P</italic> = 4.22×10<sup>− 5</sup>) were inversely associated with PCa risk, and upregulate
        level of SPINT2 (OR = 1.05; 95% CI: 1.03–1.05; <italic>P</italic> = 1.49×10<sup>− 6</sup>) increased
        PCa risk.'
