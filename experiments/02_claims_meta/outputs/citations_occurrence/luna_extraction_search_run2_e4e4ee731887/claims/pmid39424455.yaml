claims:
  c000:
    quotes:
    - exact: Our analysis identified 157 proteins associated with incident depression (P <1.71 × 10-5),
        including novel associations with proteins such as GAST, PLAUR, LRRN1, BCAN, and ITGA11.
  c001:
    quotes:
    - exact: Our analysis identified 157 proteins associated with incident depression (P <1.71 × 10-5),
        including novel associations with proteins such as GAST, PLAUR, LRRN1, BCAN, and ITGA11.
  c002:
    quotes:
    - exact: Notably, higher expression levels of GDF15 (P = 6.18 × 10-26) and PLAUR (P = 2.88 × 10-14)
        were linked to an increased risk of depression, whereas higher levels of LRRN1 (P = 4.28 × 10-11)
        and ITGA11 (P = 3.68 × 10-9) were associated with a decreased risk.
