    - exact: SMR analysis identified 80 methylation sites spanning 54 genes, 26 gene expressions, and
        three proteins significantly associated with paediatric asthma. Colocalization analysis confirmed
        strong evidence for 10 methylation sites (7 genes), the STX17 eQTL (PP.H4 = 0.98) and the UNG
        pQTL (PP.H4 = 0.84).
