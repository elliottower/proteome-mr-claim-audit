claims:
  c000:
    quotes:
    - exact: Mendelian randomization supported causal effects of 10 on HF, HF risk factors, or left ventricular
        size and function, including matricellular (e.g. SPON1, MFAP4), senescence-associated (FSTL3,
        IGFBP7), and inflammatory (SVEP1, CCL15, ITIH3) proteins.
