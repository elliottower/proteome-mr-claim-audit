claims:
  c000:
    quotes:
    - exact: Five proteins (SAA1, B4GALT5, GIT2, NAA15, and RPIA) were significantly associated with SLE
        Disease Activity Index-2K (SLEDAI-2K) scores and 1-year flare risk, implicating key pathways such
        as B-cell receptor signaling and platelet degranulation.
