        95% CI, 0.632-0.994; P = 0.044), GALNT16 (OR = 0.832; 95% CI, 0.727-0.952; P = 0.008), POGLUT1
        (OR = 0.836; 95% CI = 0.703-0.995; P = 0.043), and DKK3 (OR = 0.859; 95% CI, 0.777-0.950; P =
        0.003) have the protective effect on DR risk.
