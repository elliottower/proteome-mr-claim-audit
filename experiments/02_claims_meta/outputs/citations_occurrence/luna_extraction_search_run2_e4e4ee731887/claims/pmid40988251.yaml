claims:
  c000:
    quotes:
    - exact: MR analyses showed a significant causal link between GLP1RA use and chronic tubulo-interstitial
        nephritis (CTIN; OR = 2.32, 95% CI = 1.39-3.85, P = .001), with no significant association for
        acute tubulo-interstitial nephritis (ATIN; OR = 0.93, 95% CI = 0.83-1.04, P = .216). Colocalization
        analysis strongly supported the MR findings, showing a high posterior probability of shared genetic
        variants between GLP1R expression and CTIN (PP.H4 = 0.99).
