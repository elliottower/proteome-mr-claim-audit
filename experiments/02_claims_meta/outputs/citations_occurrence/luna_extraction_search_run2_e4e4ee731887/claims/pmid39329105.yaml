claims:
  c000:
    quotes:
    - exact: Through mediation analysis, 35 proteins have been determined mediating the genetically causal
        effects of selenium on the levels of eGFR, including Fibroblast growth factor receptor 4 (FGFR4),
        Fibulin-1, Cilia- and flagella-associated protein 45, Mothers against decapentaplegic homolog
        2 (SMAD2), and E3 ubiquitin-protein ligase ZNRF3, and the mediation effect rates of these proteins
        ranged from 1.59% to 23.70%.
