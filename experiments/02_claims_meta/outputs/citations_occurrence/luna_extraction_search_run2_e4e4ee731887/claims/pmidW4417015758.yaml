claims:
  c000:
    quotes:
    - exact: 'In this study, a total of 88 plasma proteins in the pQTL data have been found to be associated
        with AML using MR. Among these, TCL1A (OR: 1.66; 95% CI: 1.46-1.88 per 1-SD higher concentration)was
        the most strongly associated with AML.'
  c001:
    quotes:
    - exact: 'The IVW analysis revealed a positive correlation between TCL1A-eQTL and AML (P = 1.699 ×
        10−6, OR = 2.080, 95% CI: 1.541–2.808).'
  c002:
    quotes:
    - exact: Furthermore, rs78986913 was identified as a shared variant for both TCL1A and AML through
        B0ayesian colocalization analysis, suggesting this locus may be a key mechanism through which
        TCL1A influences AML pathogenesis.
  c003:
    quotes:
    - exact: High TCL1A expression was associated with low overall survival rates in AML patients (P <
        0.001), especially in the FAB M0 and M2 subgroups.
