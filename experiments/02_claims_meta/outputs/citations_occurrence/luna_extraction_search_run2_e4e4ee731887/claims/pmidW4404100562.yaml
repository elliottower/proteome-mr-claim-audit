claims:
  c000:
    quotes:
    - exact: Of 582 associations supported by evidence from MR, 29 were supported by results of colocalization
        analyses, including five proteins (NRXN3, NRXN3B, MAPK3, COMMD1, and PRSS27) in relation to chronic
        obstructive pulmonary disease, three proteins (TEF, CASP8, and IL7R) associated with asthma, and
        the FUT3_FUT5 linked to idiopathic pulmonary fibrosis.
