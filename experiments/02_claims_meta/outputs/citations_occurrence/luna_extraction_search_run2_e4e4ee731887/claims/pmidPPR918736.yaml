  note: abstract text exactly as sent to the extractor
claims:
  c000:
    quotes:
    - exact: According to the IVW method, 14 plasma proteins were associated with gastric cancer (p < 0.005).
        Specifically, CHST15 (OR = 0.7553, 95% CI = 0.6346 − 0.8988), L1CAM (OR = 0.7230, 95% CI = 0.5876 − 0.8896),
        FTMT (OR = 0.8246, 95% CI = 0.7241 − 0.9391), and PMM2 (OR = 0.5767, 95% CI = 0.3943 − 0.8433)
        were negatively correlated with gastric cancer, whereas ABO (OR = 1.1868, 95% CI = 1.0638 − 1.3240),
        FAM3D (OR = 1.2109, 95% CI = 1.0850 − 1.3515), FAM3B (OR = 1.2988, 95% CI = 1.0953 − 1.5402),
        ADH7 (OR = 1.3568, 95% CI = 1.1044 − 1.6670), MAP1LC3A (OR = 1.3704, 95% CI = 1.1194 − 1.6778),
        PGLYRP1 (OR = 1.4071, 95% CI = 1.1235 − 1.7623), PDE5A (OR = 1.7446, 95% CI = 1.2693 − 2.3978),
        GLUL (OR = 3.1203, 95% CI = 1.5017 − 6.4839), NFE2L1 (OR = 3.1759, 95% CI = 1.6163 − 6.2402),
        and MAFG (OR = 3.1945, 95% CI = 1.5329 − 6.6575) were positively correlated.
