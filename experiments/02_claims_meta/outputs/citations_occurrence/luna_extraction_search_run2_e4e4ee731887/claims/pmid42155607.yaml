claims:
  c000:
    quotes:
    - exact: In deCODE validation, KLK13 was the only candidate supported across both glycaemic trait-to-protein
        and protein-to-DKD analyses (OR 1.13, 95% CI 1.02-1.24).
  c001:
    quotes:
    - exact: Among 9,936 UK Biobank participants without baseline DKD, 107 developed incident DKD. Higher
        KLK13 was associated with incident DKD (HR 1.52, 95% CI 1.13-2.06), whereas serine peptidase inhibitor
        Kazal type 6 (SPINK6) showed stronger association (HR 2.02, 95% CI 1.49-2.74).
