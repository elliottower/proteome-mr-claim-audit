claims:
  c000:
    quotes:
    - exact: Forward MR identified five circulating proteins associated with depression risk after FDR
        correction. BTN3A2 (IVW β=0.029, FDR-p=3.3 × 10⁻⁹), LYPD3 (β=0.031, FDR-p=0.002), and CEACAM21
        (β=0.011, FDR-p=0.029) increased risk, while PILRA (β=−0.014, FDR-p=0.005) and CD302 (β=−0.041,
        FDR-p=0.01) showed protective associations.
