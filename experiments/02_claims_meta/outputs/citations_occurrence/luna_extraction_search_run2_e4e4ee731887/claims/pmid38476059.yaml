claims:
  c000:
    quotes:
    - exact: Ninety-one inflammation-related proteins had no statistically significant effect on PE following
        false discovery rate (FDR) correction. Certain proteins exhibited unadjusted low p-values that
        merited mention. These proteins include interleukin-10 (OR = 0.76, 95%CI = 0.63-0.93, p = .006),
        fibroblast growth factor 21 (OR = 1.23, 95%CI = 1.01-1.47, p = .035), and Caspase 8 (OR = 0.65,
        95%CI = 0.50-0.85, p = .001).
