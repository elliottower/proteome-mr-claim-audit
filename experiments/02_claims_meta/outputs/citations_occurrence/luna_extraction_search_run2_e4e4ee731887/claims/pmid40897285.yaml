claims:
  c000:
    quotes:
    - exact: 'Fc receptor-like 3 (FCRL3) was identified as a protective factor for MS, supported by MR
        analyses at multiple levels: circulating protein (OR = 0.912, 95 % CI = 0.882-0.942), blood-derived
        gene expression (OR = 0.772, 95 % CI = 0.598-0.997), and cerebral cortex expression (OR = 0.573,
        95 % CI = 0.455-0.721).'
