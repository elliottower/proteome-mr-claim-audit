claims:
  c000:
    quotes:
    - exact: We identified proteins with strong evidence of causal association with different stages of
        COVID-19. Some of these proteins were identified previously, such as BGAT and BCAT2, but we also
        identified the novel proteins, such as KLC1, MRVI1, CACO2, and PCNP.
