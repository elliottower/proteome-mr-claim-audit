    - exact: Further, a TSMR revealed that RHOC mediated the negative causal effect of total cholesterol
        on estimated BMD. Mediation analysis indicated that RHOC accounted for 41.05% of this effect.
  c002:
    quotes:
    - exact: While Bonferroni correction did not validate MR analysis results for RHOC and total body
