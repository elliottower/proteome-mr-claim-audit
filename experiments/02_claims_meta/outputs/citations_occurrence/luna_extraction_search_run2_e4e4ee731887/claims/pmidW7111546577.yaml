    - exact: While Bonferroni correction did not validate MR analysis results for RHOC and total body
        BMD (All age, 45-60 years), significance (P < 0.05) was retained.
  c004:
    quotes:
    - exact: Furthermore, the expression levels of RHOC were markedly decreased in the bones of individuals
        with osteoporosis.
  c005:
    quotes:
    - exact: Overexpressing RHOC had been shown to enhance the osteogenic differentiation of BMSCs, whereas
        suppressing its expression appeared to impede this process.
