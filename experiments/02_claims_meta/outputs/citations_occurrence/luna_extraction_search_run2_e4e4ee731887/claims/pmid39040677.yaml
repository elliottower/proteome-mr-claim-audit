claims:
  c000:
    quotes:
    - exact: MR approach indicated that elevated levels of interleukin 12B (IL-12B) (OR 1.691, 95%CI 1.179-2.427,
        P=4.34×10-3) and LIF interleukin 6 family cytokine (LIF) (OR 1.349, 95%CI 1.010-1.801, P=4.23×10-2)
        increased the risk of type 1 diabetes (T1D) with renal complications, while higher levels of fibroblast
        growth factor 19 (FGF19) (OR 1.202, 95%CI 1.009-1.432, P=3.93×10-2), fibroblast growth factor
        23 (FGF23) (OR 1.379, 95%CI 1.035-1.837, P=2.82×10-2), C-C motif chemokine ligand 7 (CCL7) (OR
        1.385, 95%CI 1.111-1.725, P=3.76×10-3), and TNF superfamily member 14 (TNFSF14) (OR 1.244, 95%CI
        1.066-1.451, P=5.63×10-3) indicated potential risk factors for type 2 diabetes (T2D) with renal
        complications.
