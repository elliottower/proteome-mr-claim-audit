  c005:
    quotes:
    - exact: 'TNF displayed an inverse association with the risk of hypercholesterolemia (eQTL, OR: 0.86,
        95% CI: 0.81–0.92, P fdr = 7.38 × 10 −4 ) and disorders of lipoprotein metabolism (eQTL, OR: 0.87,
        95% CI: 0.82–0.92, P fdr = 4.25 × 10 −5 ).'
  c006:
    quotes:
    - exact: 'TNF displayed an inverse association with the risk of hypercholesterolemia (eQTL, OR: 0.86,
        95% CI: 0.81–0.92, P fdr = 7.38 × 10 −4 ) and disorders of lipoprotein metabolism (eQTL, OR: 0.87,
        95% CI: 0.82–0.92, P fdr = 4.25 × 10 −5 ).'
  c007:
    quotes:
    - exact: 'Higher levels of HP were linked to a reduced likelihood of hypercholesterolemia (pQTL, OR:
        0.77, 95% CI: 0.71–0.84, P fdr = 1.07 × 10 −7 ) and disorders of lipoprotein metabolism (pQTL,
        OR: 0.76, 95% CI: 0.68–0.86, P fdr = 4.53 × 10 −4 ).'
