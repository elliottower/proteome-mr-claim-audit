claims:
  c000:
    quotes:
    - exact: SMR identified five OS‐related genes (myeloperoxidase [MPO], tumor necrosis factor [TNF],
        haptoglobin [HP], dynamin 2 [DNM2], and plasminogen [PLG]) associated with hyperlipidemia‐related
        traits.
  c001:
    quotes:
    - exact: SMR identified five OS‐related genes (myeloperoxidase [MPO], tumor necrosis factor [TNF],
        haptoglobin [HP], dynamin 2 [DNM2], and plasminogen [PLG]) associated with hyperlipidemia‐related
        traits.
  c002:
    quotes:
    - exact: 'Specifically, higher levels of MPO were linked to an increased risk of hypercholesterolemia
        (eQTL, OR: 1.13, 95% CI: 1.07–1.20, P fdr = 1.98 × 10 −3 ) and disorders of lipoprotein metabolism
        (pQTL, OR: 1.20, 95% CI: 1.06–1.36, P fdr = 4.99 × 10 −2 ; eQTL, OR: 1.10, 95% CI: 1.04–1.15,
        P fdr = 2.86 × 10 −2 ).'
  c003:
    quotes:
    - exact: 'Specifically, higher levels of MPO were linked to an increased risk of hypercholesterolemia
        (eQTL, OR: 1.13, 95% CI: 1.07–1.20, P fdr = 1.98 × 10 −3 ) and disorders of lipoprotein metabolism
        (pQTL, OR: 1.20, 95% CI: 1.06–1.36, P fdr = 4.99 × 10 −2 ; eQTL, OR: 1.10, 95% CI: 1.04–1.15,
        P fdr = 2.86 × 10 −2 ).'
  c004:
    quotes:
    - exact: 'Specifically, higher levels of MPO were linked to an increased risk of hypercholesterolemia
        (eQTL, OR: 1.13, 95% CI: 1.07–1.20, P fdr = 1.98 × 10 −3 ) and disorders of lipoprotein metabolism
        (pQTL, OR: 1.20, 95% CI: 1.06–1.36, P fdr = 4.99 × 10 −2 ; eQTL, OR: 1.10, 95% CI: 1.04–1.15,
