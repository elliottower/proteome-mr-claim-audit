claims:
  c000:
    quotes:
    - exact: 'Elevated GSN expression correlated with reduced ER + breast cancer risk (colocalization
        analysis: shared variant probability PP.H4.abf = 1.01%).'
  c001:
    quotes:
    - exact: Immunohistochemistry analysis demonstrated significantly lower GSN expression in ER + BC
        cases compared to normal samples, consistent with finding from TCGA cohorts.
