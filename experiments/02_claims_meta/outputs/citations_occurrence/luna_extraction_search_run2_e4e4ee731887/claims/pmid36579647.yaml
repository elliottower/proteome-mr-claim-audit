  c003:
    quotes:
    - exact: Mendelian randomization inverse variance weighted estimates suggested that AAA risk is promoted
        by lower levels of kit ligand (OR per SD=0.67; P=1.4×10-5) and neogenin (OR per SD=0.50; P=0.03).
