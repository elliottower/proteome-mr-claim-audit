claims:
  c000:
    quotes:
    - exact: Novel associations with clinical AAA incidence were observed for kit ligand (HR, 0.59 [95%
        CI, 0.42-0.82] for top versus first quintiles) and neogenin (HR, 0.64 [95% CI, 0.46-0.88]) over
        a median 21.2-year follow-up; neogenin was also associated with ultrasound-detected asymptomatic
        AAA (N=4295; 57 asymptomatic AAA cases).
