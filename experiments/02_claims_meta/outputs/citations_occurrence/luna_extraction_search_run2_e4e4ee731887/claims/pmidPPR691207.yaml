    - exact: 'In primary analysis, vascular endothelial growth factor (VEGF) and fibroblast growth factor
        basic (bFGF) levels were suggestively associated with IA [(VEGF→IA: odds ratio (OR) = 1.11, 95%
        confidence interval (95% CI) = 1.02–1.20, P = 0.01; bFGF→IA: OR = 0.68, 95% CI = 0.48–0.96, P = 0.03].
        Statistical significance failed to replicate in targeted analysis.'
  c003:
    quotes:
    - exact: 'In primary analysis, vascular endothelial growth factor (VEGF) and fibroblast growth factor
        basic (bFGF) levels were suggestively associated with IA [(VEGF→IA: odds ratio (OR) = 1.11, 95%
        confidence interval (95% CI) = 1.02–1.20, P = 0.01; bFGF→IA: OR = 0.68, 95% CI = 0.48–0.96, P = 0.03].
        Statistical significance failed to replicate in targeted analysis.'
  c004:
    quotes:
    - exact: 'Instead, suggestive protective effects for aneurysmal subarachnoid hemorrhage (aSAH) were
        identified in FGF-9 (FGF-9→aSAH: OR = 0.74, 95% CI = 0.62–0.89, P = 0.001) and FGF-16 (FGF-16→aSAH:
        OR = 0.84, 95% CI = 0.72–0.97, P = 0.017).'
  c005:
    quotes:
    - exact: 'Instead, suggestive protective effects for aneurysmal subarachnoid hemorrhage (aSAH) were
        identified in FGF-9 (FGF-9→aSAH: OR = 0.74, 95% CI = 0.62–0.89, P = 0.001) and FGF-16 (FGF-16→aSAH:
        OR = 0.84, 95% CI = 0.72–0.97, P = 0.017).'
  c006:
    quotes:
    - exact: Furthermore, reverse analyses identified suggestive effect of IA and its subtypes on IL-10,
        RANTES, MIF, GRO-alpha, FGF-16, and FGF-19. Result remained robust after applying sensitivity
        tests.
