claims:
  c000:
    quotes:
    - exact: 'In primary analysis, vascular endothelial growth factor (VEGF) and fibroblast growth factor
        basic (bFGF) levels were suggestively associated with IA [(VEGF→IA: odds ratio (OR) = 1.11, 95%
        confidence interval (95% CI) = 1.02–1.20, P = 0.01; bFGF→IA: OR = 0.68, 95% CI = 0.48–0.96, P = 0.03].'
  c001:
    quotes:
    - exact: 'In primary analysis, vascular endothelial growth factor (VEGF) and fibroblast growth factor
        basic (bFGF) levels were suggestively associated with IA [(VEGF→IA: odds ratio (OR) = 1.11, 95%
        confidence interval (95% CI) = 1.02–1.20, P = 0.01; bFGF→IA: OR = 0.68, 95% CI = 0.48–0.96, P = 0.03].'
