claims:
  c000:
    quotes:
    - exact: We found that the protein abundance of seven genes ( MMP12, F11, SH3BGRL3, ENGASE, SCARA5,
        SWAP70, and SPATA20 ) in the plasma was associated with stroke and its subtypes, with six genes
        ( MMP12, F11, SH3BGRL3, SCARA5, SWAP70, and SPATA20 ) causally related with stroke and its subtypes
        (P < 0.05/proteins identified for PWAS; P < 0.05/8 for MR; posterior probability of hypothesis
        4 ≥ 75 % for Bayesian colocalization).
