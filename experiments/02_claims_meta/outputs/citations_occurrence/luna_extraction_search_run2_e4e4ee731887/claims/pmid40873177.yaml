claims:
  c000:
    quotes:
    - exact: 'SMR analyses revealed 78 eQTLs and 67 pQTLs for T2DM, and 40 eQTLs and 38 pQTLs for NAFLD.
        Eight shared causal genetic signals were identified: ADAMTS4, ALDH2, GLO1, CDH1, PDHB, PRKAB1,
        TCF4, and EP300.'
