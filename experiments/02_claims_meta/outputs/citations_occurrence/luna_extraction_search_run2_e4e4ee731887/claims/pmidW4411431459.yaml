claims:
  c000:
    quotes:
    - exact: Subsequently, causal relationships between pQTLs and RA indicated that 21 proteins were causally
        related to RA, including MSRA, NFKB1, IRF3, MMP9, QDPR, TFRC, HAGH, HCLS1, GSTP1, ACADVL, CIAPIN1,
        TNFRSF1A, HIBCH, ATP5IF1, GZMB, YWHAB, RNASET2, CRAT, ARG2, ISCU, and HADH (P < 0.05).
