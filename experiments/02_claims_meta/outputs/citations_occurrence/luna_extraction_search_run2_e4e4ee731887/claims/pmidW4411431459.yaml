  c021:
    quotes:
    - exact: Finally, after rigorous quality control processing of RA-related scRNA-seq data, we found
        that both MMP9 and RNASET2 were highly expressed in RA, particularly RNASET2, in CD8 T cells,
        naive CD4 T cells, Tfh cells, Th2 cells, and Treg cells.
