claims:
  c000:
    quotes:
    - exact: The proteomic signature of incident AF consisted of 76 proteins, of which 63 (83%) were novel
        and 29 (38%) were replicated in CHS. The signature included both N-terminal prohormone of brain
        natriuretic peptide (NT-proBNP)-dependent (e.g. CHST15, ATP1B1, and SVEP1) and independent components
        (e.g. ASPN, AKR1B, and LAMA1/LAMB1/LAMC1).
