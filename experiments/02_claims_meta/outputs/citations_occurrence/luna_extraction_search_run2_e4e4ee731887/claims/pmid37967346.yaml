  c006:
    quotes:
    - exact: Nine causal candidates were identified (TAGLN, WARS, CHST15, CHMP3, COL15A1, DUSP13, MANBA,
        QSOX2, and SRL). The reverse causal analysis suggested that most AF-associated proteins were affected
        by the genetic liability to AF.
