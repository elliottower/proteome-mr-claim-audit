claims:
  c000:
    quotes:
    - exact: Genetically predicted higher serum concentration of MAP1LC3A, LRP12, VWF, F2, SYK, F11, KLKB1,
        and LRP4 were associated with an increased risk of DVT, while higher levels of the serum SERPINE2,
        XXYLT1, PMVK, and RGS18 can act as protective factors for DVT.
