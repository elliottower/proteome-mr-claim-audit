claims:
  c000:
    quotes:
    - exact: A total of 35 genetically regulated proteins associated with RA risk, including 10 potentially
        causal candidates, were identified. Notably, six potentially causal proteins (FCRL3, ICOSLG, MAPK3,
        WISP1, FAM213A, and IL1RN) were not implicated in the original GWASs.
