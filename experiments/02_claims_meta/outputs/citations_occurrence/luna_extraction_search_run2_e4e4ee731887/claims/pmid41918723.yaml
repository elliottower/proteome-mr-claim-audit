    - exact: Higher mucosal KLF4 levels predicted response to anti-TNF-α therapy with moderate discriminatory
        performance.
  c007:
    quotes:
    - exact: In DSS-induced colitis, KLF4 overexpression mitigated weight loss and disease activity, preserved
        colon length, improved histology, and reduced myeloperoxidase activity.
