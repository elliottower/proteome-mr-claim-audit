claims:
  c000:
    quotes:
    - exact: Among them, 13 were validated in the validation cohort. Nine of the 13 proteins are risk
        factors (ISG15, Fc receptor-like protein 2, tumor necrosis factor ligand superfamily member 14,
        Rab-2A, FcRL3, thrombomodulin, interferon [IFN]-lambda-1, platelet glycoprotein Ib alpha chain,
        IL-7RA) for hypothyroidism, whereas others are protective proteins (protein O-glucosyltransferase
        1 [POGLUT1], tumor necrosis factor ligand superfamily, 3-hydroxyisobutyryl-CoA hydrolase, transferrin
        receptor protein 1).
