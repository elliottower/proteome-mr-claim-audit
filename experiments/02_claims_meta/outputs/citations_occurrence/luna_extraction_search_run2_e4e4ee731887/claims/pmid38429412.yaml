claims:
  c000:
    quotes:
    - exact: Under Bonferroni correction (P < 4.8 × 10-5), we identified 11 plasma proteins significantly
        associated with GERD. Among these, 7 are protective proteins (MSP, GPX1, ERBB3, BT3A3, ANTR2,
        CCM2, and DECR2), while 4 are detrimental proteins (TMEM106B, DUSP13, C1-INH, and LINGO1).
