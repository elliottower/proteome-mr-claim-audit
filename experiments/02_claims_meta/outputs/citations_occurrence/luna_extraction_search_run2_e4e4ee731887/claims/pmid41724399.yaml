claims:
  c000:
    quotes:
    - exact: A proteome-wide mediation analysis identified 13 circulating proteins that significantly
        mediated this protective effect (P < 0.05), with KLRC4 (10.89%), THPO (9.49%), and PRLH (9.25%)
        accounting for the largest proportions. For all mediators, higher neuroticism was associated with
        elevated protein levels, which in turn were associated with lower cardiomyopathy risk.
