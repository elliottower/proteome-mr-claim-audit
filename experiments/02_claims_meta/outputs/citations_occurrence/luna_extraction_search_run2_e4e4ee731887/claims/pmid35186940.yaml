claims:
  c000:
    quotes:
    - exact: In network analysis to identify the underlying mechanism between VAT and CVDs, VAT mass was
        positively associated with 23 cardiovascular-related proteins (e.g., Leptin, Hepatocyte growth
        factor, interleukin-16), and inversely with 6 proteins (e.g., Galanin peptides, Endothelial cell-specific
        molecule 1).
