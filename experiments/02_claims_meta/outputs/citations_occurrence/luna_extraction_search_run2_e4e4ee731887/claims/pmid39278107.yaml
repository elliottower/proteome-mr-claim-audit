claims:
  c000:
    quotes:
    - exact: In the EPIC nested case-control study, IL-6 [OR per NPX (doubling of concentration) = 1.28
        (95% confidence interval (CI) 1.03-1.57)], HGF [1.48 (1.06-2.07)], PIK3AP1 [1.22 (1.00-1.50)]
        and CLEC4G [1.52 (1.00-2.32)] were positively associated; HSD11B1 [0.67 (0.49-0.91)], SCF [0.68
        (0.49-0.94)], and CCL25 [0.80 (0.65-0.99)] were inversely associated with endometrial cancer risk;
        all estimates had multiple comparisons adjusted P-value > 0.05.
