claims:
  c000:
    quotes:
    - exact: Three primary genes supported by multi-omics evidence-CASP3, GATM, and PDK1-were identified.
        Increased CASP3 methylation, expression, and protein were positively associated with IBS risk,
        indicating pro-apoptotic and pro-inflammatory mechanisms, whereas elevated GATM expression and
        protein were negatively associated, consistent with a protective role via creatine-mediated energy
        homeostasis.
