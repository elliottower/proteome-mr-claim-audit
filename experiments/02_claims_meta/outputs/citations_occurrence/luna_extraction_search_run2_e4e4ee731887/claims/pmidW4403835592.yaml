claims:
  c000:
    quotes:
    - exact: At nominal significance, 31 proteins were concordantly associated with PP in both analyses,
        and 19 had consistent directions of effect, including natriuretic peptide B (NPPB, βobservational=0.04,
        Standard Error (SE)=0.009, PFDR<0.001), thrombospondin-2 (THBS2, βobservational=0.05, SE=0.009,
        PFDR<0.001), paraoxonase-2 (PON2, βobservational=-0.03, SE=0.008, PFDR<0.001), and sclerostin
        (SOST, βobservational=-0.03, SE=0.009, PFDR<0.001).
