claims:
  c000:
    quotes:
    - exact: 'In the testing set, compared with the basic model (age and sex, C-index: 0.78; 95% confidence
        interval [CI] 0.74-0.82), the dementia protein risk score (C-index: 0.84; 95% CI 0.81-0.88) significantly
        improved the performance in predicting incident dementia (C-index increase: 0.06; 95% CI 0.02-0.12),
        while cardiovascular risk factors, ageing and dementia incidence risk factors (C-index: 0.80;
        95% CI 0.76-0.83) and apolipoprotein E (APOE; age and sex included, C-index: 0.81; 95% CI 0.77-0.85)
        had no significant improvement. Six key proteins (glial fibrillary acidic protein [GFAP], neurofilament
        light polypeptide [NEFL], Brevican core protein [BCAN], protein MENT [MENT], APOE and growth/differentiation
        factor 15 [GDF15]) captured the most predictive power.'
