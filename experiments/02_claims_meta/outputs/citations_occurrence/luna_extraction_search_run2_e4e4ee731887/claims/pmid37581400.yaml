claims:
  c000:
    quotes:
    - exact: Using a proteome-wide Mendelian randomization approach, we assessed the genetic predictive
        causality between thousands of proteins and AF risk and found that genetically predicted plasma
        levels of phosphomevalonate kinase, tumor necrosis factor ligand superfamily member 12, sulfhydryl
        oxidase 2, interleukin-6 receptor subunit alpha, and low-affinity immunoglobulin gamma Fc region
        receptor II-b might decrease AF risk, while genetically predicted plasma levels of beta-mannosidase,
        collagen alpha-1(XV) chain, ANXA4 (annexin A4), COF2 (cofilin-2), and RAB1A (Ras-related protein
        Rab-1A) might increase AF risk (P<3.4×10-5).
