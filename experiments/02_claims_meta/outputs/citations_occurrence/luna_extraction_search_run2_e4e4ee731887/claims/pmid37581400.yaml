  c010:
    quotes:
    - exact: The results of the phenome-wide Mendelian randomization analysis showed that changing the
        plasma levels of phosphomevalonate kinase, cofilin-2, annexin A4, Ras-related protein Rab-1A,
        sulfhydryl oxidase 2, and collagen alpha-1(XV) chain did not increase the risk of other diseases
        while decreasing the risk of AF.
