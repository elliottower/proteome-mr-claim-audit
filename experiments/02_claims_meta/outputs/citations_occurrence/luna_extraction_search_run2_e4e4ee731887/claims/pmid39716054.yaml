claims:
  c000:
    quotes:
    - exact: After false discovery rate (FDR) correction, MR analysis identified five plasma proteins,
        including BIRC2 [OR = 0.978, 95%CI (0.967-0.990)] and PSME1 [OR = 0.936, 95%CI (0.909-0.965)],
        as protective factors against frailty, and 49 proteins, including APOB [OR = 1.053, 95%CI (1.037-1.069)]
        and CYP3A4 [OR = 1.098, 95%CI (1.068-1.128)], as risk factors.
