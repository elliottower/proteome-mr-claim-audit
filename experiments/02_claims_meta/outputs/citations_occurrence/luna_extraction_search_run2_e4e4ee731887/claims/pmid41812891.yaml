  c000:
    quotes:
    - exact: 'Two core UC → depression mediators were identified: Ezrin (EZR, OR = 0.96, 95% CI: 0.93-1.00,
        P = 0.031) and albumin (ALB, OR = 1.05, 95% CI: 1.01-1.09, P = 0.0062).'
  c001:
    quotes:
    - exact: 'Two core UC → depression mediators were identified: Ezrin (EZR, OR = 0.96, 95% CI: 0.93-1.00,
        P = 0.031) and albumin (ALB, OR = 1.05, 95% CI: 1.01-1.09, P = 0.0062).'
  c002:
    quotes:
    - exact: 'Two core UC → depression mediators were identified: Ezrin (EZR, OR = 0.96, 95% CI: 0.93-1.00,
        P = 0.031) and albumin (ALB, OR = 1.05, 95% CI: 1.01-1.09, P = 0.0062). Immunohistochemistry showed
        reduced EZR in UCD colonic mucosa vs. UCN (P < 0.05); serum analyses revealed elevated ALB in
        UCD (P < 0.01), positively correlated with depressive severity (Pearson''s r = 0.372, P = 0.00181).'
