  c003:
    quotes:
    - exact: 'Fifteen proteins showed associations with lung cancer complications. Colocalization strongly
        supported causal roles for eight proteins: FKBP1B (OR 1.15, 95% CI 1.09-1.22; PFDR = 0.00264),
        F11(OR 1.01, 95% CI 1.01-1.01; PFDR = 1.47 × 10- 23), ABO (OR 1.11, 95% CI 1.06-1.21; PFDR = 5.82
        × 10- 9), F2 (OR 3.04, 95% CI 1.74-5.31; PFDR = 0.0102), and VSIG10L (OR 1.006, 95% CI 1.00-1.01;
        PFDR = 0.0159).'
