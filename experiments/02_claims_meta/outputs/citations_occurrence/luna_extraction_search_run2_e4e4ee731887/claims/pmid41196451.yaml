claims:
  c000:
    quotes:
    - exact: 'MR identified seven plasma proteins showing significant causal associations with specific
        lung cancer phenotypes: high GGT1 increased non-small cell lung cancer (NSCLC) risk (OR 1.27,
        95% CI 1.10-1.46; PFDR = 0.0261), GFRA2 increased the SCLC risk (OR 1.65, 95% CI 1.24-2.21; PFDR
        = 0.0462), and higher advanced glycosylation end-product specific receptor reduced the squamous
        cell carcinoma risk (OR 0.338 per SD increase, 95% CI 0.209-0.548; PFDR = 0.0138).'
