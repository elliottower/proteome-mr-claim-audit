claims:
  c000:
    quotes:
    - exact: Gene-based analysis of tau deposition highlighted APOE (P=2.55×10-6), CTNNA3 (P=2.86×10-6)
        and JARID2 (P=1.23×10-4), a component of the PRC2 multi-protein complex which regulates gene expression.
  c001:
    quotes:
    - exact: Mendelian randomization analysis of available circulating plasma proteins in the UK Biobank
        Pharma Proteomics Project (UKBPPP) identified LRRFIP1, a protein that binds with PRC2 multi-protein
        complex, as potentially causally linked to tau pathology.
