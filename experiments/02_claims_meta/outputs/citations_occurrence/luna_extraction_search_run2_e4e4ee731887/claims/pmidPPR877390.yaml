claims:
  c000:
    quotes:
    - exact: MR analysis identified 255 circulating plasma proteins associated with NISCM, with 16 remaining
        significant after FDR correction. Bayesian colocalization analysis identified LILRA5 and NELL1
        as significant, with PP.H4 > 0.8. LILRA5 has a protective effect (OR = 0.758, 95% CI, 0.670–0.857)
        while NELL displays the risk effect (OR = 1.290, 95% CI,1.199–1.387) in NISCM.
  c001:
    quotes:
    - exact: MR analysis identified 255 circulating plasma proteins associated with NISCM, with 16 remaining
        significant after FDR correction. Bayesian colocalization analysis identified LILRA5 and NELL1
        as significant, with PP.H4 > 0.8. LILRA5 has a protective effect (OR = 0.758, 95% CI, 0.670–0.857)
        while NELL displays the risk effect (OR = 1.290, 95% CI,1.199–1.387) in NISCM.
  c002:
    quotes:
    - exact: Decreased LILRA5 expression was found in NISCM such as diabetic, hypertrophic, dilated, and
        inflammatory cardiomyopathy, while NELL1 expression increased in hypertrophic cardiomyopathy.
