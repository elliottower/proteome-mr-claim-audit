claims:
  c000:
    quotes:
    - exact: 'Additionally, Mendelian randomization analyses identified 7 proteins as risk factors for
        recurrence: elevated plasma levels of coagulation factor XI, coagulation factor VIII, von Willebrand
        factor, histo-blood group ABO system transferase, and Golgi membrane protein 2; and decreased
        levels of proprotein convertase subtilisin/kexin 9 and pro-interleukin-16.'
