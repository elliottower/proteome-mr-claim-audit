  c014:
    quotes:
    - exact: Finally, qRT-PCR showed that FCRL3 and LY9 mRNA levels were significantly down-regulated
        in diffuse large B-cell lymphoma (DLBCL) cells. In CCK-8 assay, predicted drugs amiodarone and
        chrysin inhibited DLBCL cell proliferation in dose-dependent and time-dependent manner.
