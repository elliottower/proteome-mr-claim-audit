  c000:
    quotes:
    - exact: PW-MR analyses predicted 37 proteins associated with lymphoma. Therein, 8 proteins, including
        APOBEC3G, TNFAIP6, LY75, MAPK3, SERPING1, CSF2RB, FCRL3, and LY9, interacted with known lymphoma
        drug targets.
