claims:
  c000:
    quotes:
    - exact: Our analysis identified several plasma proteins associated with a lower risk of kidney and
        bladder cancer, including Eukaryotic translation initiation factor 4E-binding protein 1, Caspase
        8, Natural killer cell receptor 2B4, and Tumor necrosis factor ligand superfamily member 12.
