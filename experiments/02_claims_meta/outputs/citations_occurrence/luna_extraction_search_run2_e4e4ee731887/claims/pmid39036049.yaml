claims:
  c000:
    quotes:
    - exact: 'Six significant (p < 3.06 × 10-5) plasma protein-EM pairs were identified by MR analyses.
        These included EPHB4 (OR = 1.40, 95% CI: 1.20 - 1.63), FSHB (OR = 3.91, 95% CI: 3.13 - 4.87),
        RSPO3 (OR = 1.60, 95% CI: 1.38 - 1.86), SEZ6L2 (OR = 1.44, 95% CI: 1.23 - 1.68) and WASHC3 (OR
        = 2.00, 95% CI: 1.54 - 2.59) were identified as risk factors, whereas KDR (OR = 0.80, 95% CI:
        0.75 - 0.90) was found to be a protective factor.'
