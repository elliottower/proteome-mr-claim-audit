  c000:
    quotes:
    - exact: Among them, five proteins (MAX, TXNL4B, GLRX2, F13B, SNUPN) showed strong or moderate colocalization
        with BAT, suggesting shared genetic regulation. MAX and TXNL4B increased BAT by reducing SHBG,
        while GLRX2, F13B, and SNUPN decreased BAT via elevated SHBG levels.
