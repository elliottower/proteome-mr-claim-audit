claims:
  c000:
    quotes:
    - exact: Twenty-one druggable genes were identified as potentially associated with AF (ALB, BAZ2A,
        CASQ2, CEP68, F10, FLRT2, GYPC, HABP4, JAM2, KCNJ5, KDM1B, PMVK, PRKD3, PROZ, PSMC5, PXN, SF3B1,
        THRB, TNNT3, TPMT, WDR1), two of which (CEP68 and FLRT2) were significant in both cardiac and
        blood tissue.
