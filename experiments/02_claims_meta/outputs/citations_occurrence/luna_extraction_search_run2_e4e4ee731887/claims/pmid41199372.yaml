claims:
  c000:
    quotes:
    - exact: This study not only highlights the value of FCRL3, HTATIP2, RNASE6, and SF3B4 as potential
        diagnostic biomarkers and therapeutic targets for ALS but also provides new evidence for the involvement
        of environmental toxins, particularly benzo(a)pyrene, in the pathogenesis of ALS through gene-environment
        interactions.
