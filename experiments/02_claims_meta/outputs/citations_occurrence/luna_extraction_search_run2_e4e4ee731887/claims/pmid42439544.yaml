claims:
  c000:
    quotes:
    - exact: Of these 2339 proteins, 33 showed a statistically significant effect on RCC (false discovery
        rate < 5%), with 28 mapping outside RCC genome-wide association study loci. Using multivariable
        mendelian randomized, we estimated the mediation effects of associated plasma proteins, finding
        that proteins such as APOL1 mediated 2.76% of white blood cells' effect.
  c001:
    quotes:
    - exact: Convergent evidence from multiple downstream analyses prioritized TYMP, UMOD, and USP28 as
        key protein intermediaries of the risk factor effects on RCC. TYMP and USP28, both inversely associated
        with RCC risk, showed immune-related and tumor-suppressive effects, while UMOD was positively
        associated, potentially linking kidney biomarkers to carcinogenesis.
