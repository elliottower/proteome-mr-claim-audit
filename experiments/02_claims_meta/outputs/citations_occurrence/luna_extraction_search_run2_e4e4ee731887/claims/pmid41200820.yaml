  c007:
    quotes:
    - exact: In 2-sample Mendelian randomization, a novel association was found for follistatin and myocardial
        infarction, and previous associations for PCSK9 (proprotein convertase subtilisin/kexin type 9)
        and PECAM1 were repeated.
