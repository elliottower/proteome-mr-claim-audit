claims:
  c000:
    quotes:
    - exact: Thirty-eight proteins, with biological features of inflammation, lipid metabolism, and vascular
        function, were associated with family history using a false discovery rate of 0.05. The strongest
        associations were observed with cathepsin D, paraoxonase 3, renin andfollistatin, neither of which
        was attenuated by adjusting for cardiovascular risk factors.
