  c004:
    quotes:
    - exact: Eighteen proteins were statistical interactors with family history in the association between
        each protein and the coronary atherosclerotic burden, most notably the LDL (low-density lipoprotein)
        receptor, transferrin receptor protein 1, and PECAM1 (platelet endothelial cell adhesion molecule
        1).
