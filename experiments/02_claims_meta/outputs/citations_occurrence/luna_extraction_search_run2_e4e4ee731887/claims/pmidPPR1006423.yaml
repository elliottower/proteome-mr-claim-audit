claims:
  c000:
    quotes:
    - exact: 'Among 535 tested proteins, three colocalized and demonstrated decreasing effects on BMI:
        endoglin (ENG; MR beta: -0.07, 95% CI [-0.10, -0.04], P = 4.4×10⁻⁵), fatty acid binding protein
        4 (FABP4; MR beta: -0.33, 95% CI [-0.50, -0.16], P = 1.3×10⁻⁴), and Nectin-like protein-2 (MR
        beta: -0.26, 95% CI [-0.37, -0.15], P = 5.45×10⁻⁵).'
