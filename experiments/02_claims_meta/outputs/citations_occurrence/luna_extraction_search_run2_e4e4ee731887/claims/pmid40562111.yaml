claims:
  c000:
    quotes:
    - exact: Primary MR identified 159 ferroptosis-related genes, with BRPF1 exerting robust protection
        against PPD (IVW OR = 0.797, P = 0.009).
  c001:
    quotes:
    - exact: Chromatin modifier KDM3A governed BRPF1 expression (mediation β = 0.336, P < 0.0001), forming
        a causal hierarchy that suppressed ferroptosis.
