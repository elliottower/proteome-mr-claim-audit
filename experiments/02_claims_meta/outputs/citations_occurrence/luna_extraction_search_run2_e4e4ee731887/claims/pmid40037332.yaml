  c006:
    quotes:
    - exact: The newly associated proteins indicated the involvement of complement (C1S and C1R), microglia
        (SIRPA, SIGLEC9 and PRSS8) and lysosomes (CLN5) in Alzheimer's disease; the interleukin-6 pathway
        (CTF1) in Parkinson's disease; lysosomes (TPP1), blood-brain barrier integrity (MFAP2) and astrocytes
        (TNFSF13) in amyotrophic lateral sclerosis; and blood-brain barrier integrity (VEGFB), oligodendrocytes
        (PARP1), node of Ranvier and dorsal root ganglion (NCS1, FLRT3 and CDH15) and the innate immune
        system (CR1, AHSG and WARS) in multiple sclerosis.
