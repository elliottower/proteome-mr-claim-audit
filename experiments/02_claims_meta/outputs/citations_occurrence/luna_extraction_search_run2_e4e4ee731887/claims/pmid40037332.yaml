claims:
  c000:
    quotes:
    - exact: The two-sample Mendelian randomization and co-localization analysis also showed that APOE
        abundance in plasma was associated with three subcortical volumes (hippocampus, amygdala and nucleus
        accumbens) and white matter hyper-intensities, whereas PILRA and PILRB abundance in plasma was
        associated with caudate nucleus volume.
