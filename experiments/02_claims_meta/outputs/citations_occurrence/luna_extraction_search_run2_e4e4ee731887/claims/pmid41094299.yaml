claims:
  c000:
    quotes:
    - exact: After correction for multiple comparisons, elevated levels of complement factor B (CFB) and
        decreased levels of trem-like transcript 2 protein (TREML2) and tapasin (TAPBP) were associated
        with an increased risk of AS (odds ratio [OR] = 2.99, 95% confidence interval [CI] = 1.89-4.73,
        P = 2.76 × 10-6 for CFB; OR = 0.73, 95% CI = 0.63-0.83, P = 4.72 × 10-6 for TREML2; and OR = 0.67,
        95% CI = 0.56-0.80, P = 1.46 × 10-5 for TAPBP).
