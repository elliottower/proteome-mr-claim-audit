claims:
  c000:
    quotes:
    - exact: Among all inflammatory cytokines, a significant causal association was identified between
        C-X-C motif chemokine ligand 5 (CXCL5) and UC.
  c001:
    quotes:
    - exact: Using eQTL data, a significant genetic association was established between the mRNA expression
        of CXCL5 and its receptor, C-X-C motif chemokine receptor 2 (CXCR2), with UC.
  c002:
    quotes:
    - exact: Using eQTL data, a significant genetic association was established between the mRNA expression
        of CXCL5 and its receptor, C-X-C motif chemokine receptor 2 (CXCR2), with UC.
  c003:
    quotes:
    - exact: Differential expression analysis confirmed the dysregulation of the CXCL5/CXCR2 axis in UC
        patients.
  c004:
    quotes:
    - exact: Differential expression analysis confirmed the dysregulation of the CXCL5/CXCR2 axis in UC
        patients.
  c005:
    quotes:
    - exact: Immunohistochemistry further confirmed the dysregulation of the CXCL5/CXCR2 axis in colon
        tissues of UC patients.
  c006:
