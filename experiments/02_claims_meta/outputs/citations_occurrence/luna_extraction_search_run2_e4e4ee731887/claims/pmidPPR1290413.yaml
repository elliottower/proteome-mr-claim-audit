  c000:
    quotes:
    - exact: 'To separate candidate drivers from reactive markers, we used human genetics: Mendelian randomization
        linking plasma proteins to liver disease, which recovered established fibrosis drivers, including
        PAI-1 (SERPINE1), tenascin-C, thrombospondin-2 and nominated further candidates.'
