claims:
  c000:
    quotes:
    - exact: Among protein mediators, APOE, CGREF1, ITGA5, LSP1, NOS3, and NPPB were linked to HHD, whereas
        DUSP13, ITGA11, NID1, and SERPINA4 were related to HCM. Specifically, APOE, ITGA5, NOS3, NPPB,
        DUSP13, and ITGA11 acted as mediating factors, while CGREF1, LSP1, NID1, and SERPINA4 served as
        suppressing ones.
