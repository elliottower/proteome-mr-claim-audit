claims:
  c000:
    quotes:
    - exact: 'In detail, elevated levels of three genetically predicted proteins were significantly associated
        with increased risk of lung cancer, namely, SYSC (OR:4.75, 95%CI: 2.47-9.16, FDR=0.007), TM11D
        (OR: 1.34, 95%CI: 1.17-1.53, FDR=0.02), and PDC6I (OR: 2.35, 95%CI: 1.58-3.49, FDR=0.03).'
