claims:
  c000:
    quotes:
    - exact: 'For IBD, IVW estimates suggested that genetically predicted IL-10 and IL-13 were suggestively
        associated with an elevated risk of IBD (IL-10: OR: 1.12, 95% CI: 1.00-1.24, P = .04; IL-13: OR:
        1.09, 95% CI: 1.01-1.18, P = .023), while CXCL10 was suggestively linked to a lower risk of IBD
        (CXCL10: OR: 0.90, 95% CI: 0.82-0.99, P = .037).'
  c001:
    quotes:
    - exact: 'For IBD, IVW estimates suggested that genetically predicted IL-10 and IL-13 were suggestively
        associated with an elevated risk of IBD (IL-10: OR: 1.12, 95% CI: 1.00-1.24, P = .04; IL-13: OR:
        1.09, 95% CI: 1.01-1.18, P = .023), while CXCL10 was suggestively linked to a lower risk of IBD
        (CXCL10: OR: 0.90, 95% CI: 0.82-0.99, P = .037).'
  c002:
    quotes:
    - exact: 'For IBD, IVW estimates suggested that genetically predicted IL-10 and IL-13 were suggestively
        associated with an elevated risk of IBD (IL-10: OR: 1.12, 95% CI: 1.00-1.24, P = .04; IL-13: OR:
        1.09, 95% CI: 1.01-1.18, P = .023), while CXCL10 was suggestively linked to a lower risk of IBD
        (CXCL10: OR: 0.90, 95% CI: 0.82-0.99, P = .037).'
  c003:
    quotes:
    - exact: 'For Crohn disease (CD), the IVW approach provided evidence to sustain that genetically determined
        IL-13 and CCL3 had a suggestive association with a higher risk of CD (IL-13: OR: 1.13, 95% CI:
        1.02-1.26, P = .023; CCL3: OR: 1.22, 95% CI: 1.03-1.45, P = .018).'
  c004:
    quotes:
    - exact: 'For Crohn disease (CD), the IVW approach provided evidence to sustain that genetically determined
        IL-13 and CCL3 had a suggestive association with a higher risk of CD (IL-13: OR: 1.13, 95% CI:
        1.02-1.26, P = .023; CCL3: OR: 1.22, 95% CI: 1.03-1.45, P = .018).'
  c005:
    quotes:
    - exact: Our findings supported the causal relationships between 4 specific inflammatory proteins
        (IL-10, IL-13, CXCL10, and CCL3) and the risk of IBD and CD, thereby providing promising biomarkers
        of various subtypes stratification and new insights for the prevention and therapeutic target
        of IBD.
