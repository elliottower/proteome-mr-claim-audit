claims:
  c000:
    quotes:
    - exact: In observational analyses, 530 SOMAmers were associated with FEV1 after multiple testing
        adjustment (FDR < 0.05). The most significant were Retinoic Acid Receptor Responder 2 (RARRES2),
        R-Spondin 4 (RSPO4) and Alkaline Phosphatase, Placental Like 2 (ALPPL2).
