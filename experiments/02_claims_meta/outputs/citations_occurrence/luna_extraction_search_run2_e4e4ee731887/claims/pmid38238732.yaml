        R-Spondin 4 (RSPO4) and Alkaline Phosphatase, Placental Like 2 (ALPPL2).
  c003:
    quotes:
    - exact: Of the 257 SOMAmers with genetic instruments available, eight were associated with FEV1 in
        MR analyses. Three were directionally consistent with the observational estimate, Thrombospondin
        2 (THBS2), Endoplasmic Reticulum Oxidoreductase 1 Beta (ERO1B) and Apolipoprotein M (APOM).
