    quotes:
    - exact: Effect directions were concordant in an independent Asian meta-analysis for all six targets
        (and the African subset for FSHB, ITGA11 and RSPO3), and FSHB additionally colocalized with heavy
        menstrual bleeding (PP4 0.99).
