claims:
  c000:
    quotes:
    - exact: MR and colocalization prioritized four protein targets, FCRL3, ICAM5, ENTPD5 and OAS1 that
        showed effect on COVID-19 severity only in European ancestry and one protein target, SERPINA1,
        only showed effect in African ancestry (odds ratio [OR] in Africans=0.369, 95%CI=0.203 to 0.668,
        P=9.96×10 −4 ; OR in Europeans=1.021, P=0.745).
