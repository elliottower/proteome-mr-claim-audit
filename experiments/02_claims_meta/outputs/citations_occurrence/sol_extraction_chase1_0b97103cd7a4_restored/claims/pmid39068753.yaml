claims:
  c000:
    quotes:
    - exact: The findings indicated that elevated levels of four circulating inflammatory proteins, including
        C-C Motif Chemokine Ligand 11 (CCL11), Signaling Lymphocytic Activation Molecule Family Member
        1 (SLAMF1), TNF Superfamily Member 11 (TRANCE) and Vascular Endothelial Growth Factor A (VEGF-A)
        lead to the increased risk of AMD, while increased levels of two circulating inflammatory proteins,
        including Fibroblast Growth Factor 19 (FGF-19) and Interleukin 10 Receptor Subunit Alpha (IL-10RA),
        resulted in the decreased risk of AMD.
