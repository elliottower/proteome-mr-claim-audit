claims:
  c000:
    quotes:
    - exact: We outline 21 of 2644 druggable genes for insulin resistance by Mendelian randomization and
        colocalization, where six genes (AKT1, ERBB3, FCGR1A, FGFR1, LPL, NR1H3) encode targets for approved
        drugs with consistent directions in alleviating insulin resistance, with no significant side effects
        revealed by phenome-wide association study.
