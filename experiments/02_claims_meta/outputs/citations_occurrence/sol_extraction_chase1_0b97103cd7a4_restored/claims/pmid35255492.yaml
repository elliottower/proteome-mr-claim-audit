claims:
  c000:
    quotes:
    - exact: Using transcriptome-wide association and colocalization to infer the effect of gene expression
        on disease severity, we find evidence that implicates multiple genes-including reduced expression
        of a membrane flippase (ATP11A), and increased expression of a mucin (MUC1)-in critical disease.
  c001:
