claims:
  c000:
    quotes:
    - exact: Through Mendelian randomization and multiomics analyses, we identified retinoic acid receptor
        responder 2 (RARRES2) as a causal risk factor for keloid.
  c001:
    quotes:
    - exact: RARRES2 is highly expressed in keloid tissue and mainly enriched in fibroblasts of keloid.
  c002:
    quotes:
    - exact: We demonstrated that RARRES2 promotes the expression of HSPG2 by phosphorylating STAT3.
  c003:
    quotes:
    - exact: Moreover, we confirmed that RARRES2 exerts the pro-scarring effect through the STAT3/HSPG2
        pathway in primary fibroblasts and animal models.
