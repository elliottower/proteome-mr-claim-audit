  c003:
    quotes:
    - exact: In addition, population-level protein-altering variants (PAVs) analysis and in vitro experiments
        cross-validated FAM3C and IGFBP4 as potential new target candidates for DKD, through the classic
        NLR family pyrin domain containing 3 (NLRP3)-caspase-1-gasdermin D (GSDMD) apoptotic axis.
