claims:
  c000:
    quotes:
    - exact: Our prospective study confirmed that higher levels of three prioritized targets-insulin-like
        growth factor binding protein 4 (IGFBP4), family with sequence similarity 3 member C (FAM3C),
        and prostaglandin D2 synthase (PTGDS)-were associated with a 4.35, 3.51, and 3.57-fold increased
        likelihood of developing DKD, respectively.
