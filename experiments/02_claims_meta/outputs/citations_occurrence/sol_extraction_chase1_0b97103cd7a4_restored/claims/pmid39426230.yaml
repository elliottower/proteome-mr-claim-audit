claims:
  c000:
    quotes:
    - exact: GFPT1 has been identified as a cross-OA therapeutic candidate gene by MR analysis.
  c001:
    quotes:
    - exact: We observed a significant reduction in GFPT1 expression in OA cartilage compared to normal
        cartilage from public transcriptomic data of both humans and mice.
  c002:
    quotes:
    - exact: We observed a significant reduction in GFPT1 expression in OA cartilage compared to normal
        cartilage from public transcriptomic data of both humans and mice. In vitro experiments confirmed
        these findings at both mRNA and protein levels in OA chondrocytes.
  c003:
    quotes:
    - exact: IL-1β stimulation leads to downregulation of GFPT1.
  c004:
    quotes:
    - exact: GFPT1 upregulation with glutamine, in turn, further increases the expression of COL2A1 and
        decreases the expression of MMP13.
  c005:
    quotes:
    - exact: GFPT1 upregulation with glutamine, in turn, further increases the expression of COL2A1 and
        decreases the expression of MMP13.
  c006:
    quotes:
    - exact: Our findings demonstrate that GFPT1 is downregulated in OA, and overexpressing GFPT1 can
        restore the anabolic metabolism of cartilage.
