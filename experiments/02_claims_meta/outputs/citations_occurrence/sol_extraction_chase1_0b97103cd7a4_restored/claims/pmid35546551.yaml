claims:
  c000:
    quotes:
    - exact: The risk-increasing effect of DKK1 is particularly interesting-indicating a role for downregulation
        of β-catenin-dependent Wnt signalling in migraine risk, suggesting Wnt activators that restore
        Wnt/β-catenin signalling in brain could represent therapeutic tools against migraine.
  c001:
    quotes:
    - exact: We show that higher levels of DKK1 and PDGFB, and lower levels of FARS2, GSTA4 and CHIC2
        proteins have a significant causal effect on migraine.
