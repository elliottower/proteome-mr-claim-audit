  c005:
    quotes:
    - exact: In vitro , statins suppressed lipid accumulation and fibrotic markers; ALPP overexpression
        counteracted these protective effects.
  c006:
    quotes:
    - exact: In vitro , statins suppressed lipid accumulation and fibrotic markers; ALPP overexpression
        counteracted these protective effects.
  c007:
    quotes:
    - exact: In vivo , systemic statin administration attenuated ligamentum flavum thickening, whereas
        local viral-mediated ALPP overexpression reversed this benefit.
