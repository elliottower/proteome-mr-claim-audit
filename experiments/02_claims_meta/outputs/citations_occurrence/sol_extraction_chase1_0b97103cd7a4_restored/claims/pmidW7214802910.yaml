claims:
  c000:
    quotes:
    - exact: MR identified three proteins increasing disease risk, with placental alkaline phosphatase
        (ALPP) consistently replicating across platforms (colocalization at rs12478529, PP.H4 = 0.9979).
        Genetically inferred mediation analysis suggested that selected immune-cell traits may partially
        mediate the association between ALPP and lumbar spinal stenosis.
  c001:
    quotes:
    - exact: Genetically inferred mediation analysis suggested that selected immune-cell traits may partially
        mediate the association between ALPP and lumbar spinal stenosis.
  c002:
    quotes:
    - exact: In clinical specimens, ALPP was upregulated in hypertrophied tissues, co-localizing with
        fibrosis and lipid accumulation.
  c003:
