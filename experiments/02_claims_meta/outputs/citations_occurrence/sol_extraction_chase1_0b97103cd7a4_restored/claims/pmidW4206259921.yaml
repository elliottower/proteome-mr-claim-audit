claims:
  c000:
    quotes:
    - exact: 'The transcription factor ELF5 ( ELF5 ) showed robust and directionally consistent associations
        across different outcome definitions, including a >4-fold higher risk (odds ratio: 4.85; 95%-CI:
        2.65-8.89; p-value<3.1×10 −7 ) for severe COVID-19 per 1 s.d. higher genetically predicted plasma
        ELF5.'
  c001:
    quotes:
    - exact: We also observed a 25% reduced risk of severe COVID-19 per 1 s.d. higher genetically predicted
        plasma G-CSF, a finding corroborated by a clinical trial of recombinant human G-CSF in COVID-19
        patients with lymphopenia reporting a lower number of patients developing critical illness and
        death.
