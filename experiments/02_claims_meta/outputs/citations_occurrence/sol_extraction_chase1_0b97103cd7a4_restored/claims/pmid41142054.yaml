    - exact: MR analysis confirmed that AD significantly increases the risk of AA (odds ratio = 1.64,
        P < .001). Integrating drug-target MR and colocalization analysis, we identified Janus kinase
        2 (JAK2) as a potential causal gene (posterior probability [PP.H4] = 0.95), supported by functional
        enrichment, protein-protein interaction, and gene expression analyses.
