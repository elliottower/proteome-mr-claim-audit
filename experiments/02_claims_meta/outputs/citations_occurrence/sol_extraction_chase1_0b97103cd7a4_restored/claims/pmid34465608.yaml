claims:
  c000:
    quotes:
    - exact: In models adjusted for multiple covariates, including baseline eGFR and albuminuria, we identified
        13 distinct proteins that were significantly associated with the composite end point in both time
        periods, including TNF receptor superfamily members 1A and 1B, trefoil factor 3, and β-trace protein.
