claims:
  c000:
    quotes:
    - exact: 'Of these, the concentrations of 32 were influenced by variants close to a breast cancer
        susceptibility locus (ABO, 9q34.2). Many of these proteins, such as insulin receptor, insulin-like
        growth factor receptor 1 and other membrane receptors (OR: 0.82-1.18, p values: 6.96 × 10-4 -3.28
        × 10-8 ), are linked to insulin resistance and estrogen receptor signaling pathways.'
