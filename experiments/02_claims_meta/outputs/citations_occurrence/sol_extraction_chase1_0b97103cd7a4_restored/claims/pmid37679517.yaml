  c009:
    quotes:
    - exact: Proteins C2, MICA, AIF1, and CTSH were associated with increased lung cancer risk, while
        proteins SFTPB, HLA-DQA2, MICB, NRP1, and GMFG were associated with decreased lung cancer risk.
        Stratified analyses by histological types revealed the cross-subtype consistency of these nine
        associations and identified an additional protein, ICAM5, significantly associated with lung adenocarcinoma
        risk (FDR < 0.05).
