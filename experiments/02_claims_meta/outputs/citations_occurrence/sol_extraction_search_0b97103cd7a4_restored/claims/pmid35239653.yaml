claims:
  c000:
    quotes:
    - exact: After multiple testing correction, using genetic instruments and under the assumptions of
        Mendelian Randomization, our results were consistent with higher blood levels of five proteins
        GCNT4, CD207, RAB14, C1GALT1C1, and ABO being causally associated with an increased risk of hospitalization
        or respiratory support/death due to COVID-19 (ORs = 1.12-1.35).
