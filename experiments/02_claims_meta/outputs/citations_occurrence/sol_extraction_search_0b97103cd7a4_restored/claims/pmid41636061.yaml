claims:
  c000:
    quotes:
    - exact: Mendelian randomization analysis revealed 7 proteins genetically associated with HF at nominal
        significance; 2 were separately associated with HFpEF, and another 2 with HFrEF. Seven of these
        9 proteins (NPDC1 [neural proliferation differentiation and control protein 1], APOF [apolipoprotein
        F], LMAN2 [lectin, mannose-binding 2], ADIPOQ [adiponectin], CD14 [cluster of differentiation
        14], ARHGAP1 [Rho GTPase-activating protein 1], C9 [complement 9]) showed new, possibly causal
        associations, although we did not detect evidence for colocalization.
