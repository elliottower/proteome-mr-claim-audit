claims:
  c000:
    quotes:
    - exact: 'According to the IVW method, seven plasma proteins are significantly associated with cervical
        cancer risk (P < 0.05). Specifically, six proteins demonstrated protective factors: DEFB135 (OR
        = 0.201, 95% CI = 0.082-0.492, P < 0.001), FGL2 (OR = 0.104, 95% CI = 0.032-0.338, P < 0.001),
        FTMT (OR = 0.612, 95% CI = 0.465-0.804, P < 0.001), PDIA4 (OR = 0.088, 95% CI = 0.026-0.295, P
        < 0.001), SPHK2 (OR = 0.102, 95% CI = 0.030-0.350, P < 0.001), and TMED2 (OR = 0.045, 95% CI =
        0.008-0.246, P < 0.001).'
