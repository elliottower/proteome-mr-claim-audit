claims:
  c000:
    quotes:
    - exact: 'We demonstrated that an elevated level of CD27 on IgD + CD24 + B cell, a subset of B cells
        expressing both IgD and CD24, was associated with a higher risk of SS (OR = 1.119, 95% CI: 1.061-1.179,
        P < 0.001), while CD3 on CD45RA + CD4 + Treg was a protective factor (OR = 0.917, 95%CI: 0.877-0.959,
        P < 0.001).'
  c001:
    quotes:
    - exact: 'We demonstrated that an elevated level of CD27 on IgD + CD24 + B cell, a subset of B cells
        expressing both IgD and CD24, was associated with a higher risk of SS (OR = 1.119, 95% CI: 1.061-1.179,
        P < 0.001), while CD3 on CD45RA + CD4 + Treg was a protective factor (OR = 0.917, 95%CI: 0.877-0.959,
        P < 0.001).'
  c002:
    quotes:
    - exact: 'Finally, results of mediation analysis indicated that CD40L receptor levels had significant
        mediating effects (β = 0.0314, 95% CI: 0.0004-0.0624, P = 0.0471) at a mediation proportion of
        28% (95% CI: 0.364%-55.6%) in causal relationship between CD27 on IgD + CD24 + B cell and SS.'
