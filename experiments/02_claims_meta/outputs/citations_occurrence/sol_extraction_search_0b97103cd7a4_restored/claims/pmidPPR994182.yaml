claims:
  c000:
    quotes:
    - exact: 'CRELD1 emerged as a protective factor (OR = 0.909, 95% CI: 0.879–0.940), with consistent
        downregulation in ccRCC tissues.'
  c001:
    quotes:
    - exact: 'CRELD1 emerged as a protective factor (OR = 0.909, 95% CI: 0.879–0.940), with consistent
        downregulation in ccRCC tissues. KDEL2 also demonstrated a protective association (OR = 0.747),
        though it was paradoxically upregulated in tumor tissues, suggesting a possible compensatory response
        to cellular stress.'
