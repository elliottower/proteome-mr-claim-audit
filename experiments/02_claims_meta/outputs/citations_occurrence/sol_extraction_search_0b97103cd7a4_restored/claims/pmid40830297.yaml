claims:
  c000:
    quotes:
    - exact: In the mediation analysis, 26 plasma proteins were identified as mediators of this association,
        including N-terminal Xaa-Pro-Lys N-methyltransferase 1, Multiple PDZ domain protein, Asialoglycoprotein
        receptor 1, and Cilia- and flagella-associated protein 45, among others. These proteins mediated
        the relationship between lower serum zinc levels and the increased risk of DKD, with the mediation
        effect ranging from 3.31 to 22.06%.
