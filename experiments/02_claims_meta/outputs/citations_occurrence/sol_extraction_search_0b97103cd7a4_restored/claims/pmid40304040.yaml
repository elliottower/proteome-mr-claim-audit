  c010:
    quotes:
    - exact: Of these 10 proteins, 1 was not druggable (ABO), 3 had known primary (F11) or potentially
        repurposed (ALDH2, MMP12) drug targets for stroke, and 6 (PROCR, GRK5, FGF5, FURIN, KIAA0319,
        and TMPRSS5) had no evidence of any drug targets.
