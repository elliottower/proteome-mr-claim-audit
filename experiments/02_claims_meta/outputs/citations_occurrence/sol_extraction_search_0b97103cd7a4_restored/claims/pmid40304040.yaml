claims:
  c000:
    quotes:
    - exact: In Mendelian randomization analyses, the genetically predicted plasma levels of 10 proteins
        were significantly associated with IS in East Asians (n=2) and Europeans (n=9), with 6 proteins
        (FGF5 [fibroblast growth factor 5], TMPRSS5 [transmembrane protease serine 5], FURIN, F11 [coagulation
        factor XI], ALDH2 [aldehyde dehydrogenase 2], and ABO [histo-blood group ABO system transferase])
        showing positive and 4 (GRK5 [G protein-coupled receptor kinase 5], KIAA0319 [dyslexia-associated
        protein KIAA0319], PROCR [endothelial protein C receptor], and MMP12 [macrophage metalloelastase
        12]) showing inverse associations, all directionally consistent between East Asians and Europeans.
