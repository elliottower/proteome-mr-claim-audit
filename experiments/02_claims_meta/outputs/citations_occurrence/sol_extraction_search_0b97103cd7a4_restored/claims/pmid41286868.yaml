  c014:
    quotes:
    - exact: 'Meta-analysis provided robust evidence for IL27RA (OR = 0.97, 95% CI: 0.95-0.98, P = 1.0×10-6)
        and TIE1 (OR = 1.14, 95% CI: 1.07-1.21, P = 4.8×10⁻⁵), while IL17RD was nominally significant.'
