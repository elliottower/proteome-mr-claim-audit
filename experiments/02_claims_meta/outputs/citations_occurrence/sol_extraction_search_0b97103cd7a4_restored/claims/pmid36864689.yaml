claims:
  c000:
    quotes:
    - exact: At Bonferroni significance (P < 5.63 × 10-5), Mendelian randomization analysis revealed six
        protein-multiple sclerosis pairs. In plasma, per standard deviation increase in FCRL3, TYMP and
        AHSG had a protective effect.
