    quotes:
    - exact: MMEL1 was replicated in both UK Biobank and FinnGen cohorts. Our integrative analysis suggested
        that genetically determined levels of circulating FCRL3, TYMP, AHSG, CSF MMEL1 and SLAMF7 had
        causal effects on multiple sclerosis risk.
