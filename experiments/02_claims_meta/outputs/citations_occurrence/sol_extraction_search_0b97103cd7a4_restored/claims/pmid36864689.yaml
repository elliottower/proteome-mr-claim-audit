  c006:
    quotes:
    - exact: Bayesian co-localization suggested that FCRL3 [coloc.abf-posterior probability of hypothesis
        4 (PPH4) = 0.889], TYMP (coloc.susie-PPH4 = 0.896), AHSG (coloc.abf-PPH4 = 0.957, coloc.susie-PPH4
        = 0.973), MMEL1 (coloc.abf-PPH4 = 0.930) and SLAMF7 (coloc.abf-PPH4 = 0.947) shared the same variant
        with multiple sclerosis.
