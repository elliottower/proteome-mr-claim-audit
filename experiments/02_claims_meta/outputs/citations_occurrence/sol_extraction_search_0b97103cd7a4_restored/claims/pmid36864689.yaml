  c003:
    quotes:
    - exact: In CSF, per 10-fold increase in MMEL1 (OR, 5.03; 95% CI, 3.42-7.41) increased the risk of
        multiple sclerosis, while SLAMF7 (OR, 0.42; 95% CI, 0.29-0.60) and CD5L (OR, 0.30; 95%CI, 0.18-0.52)
        decreased the risk.
