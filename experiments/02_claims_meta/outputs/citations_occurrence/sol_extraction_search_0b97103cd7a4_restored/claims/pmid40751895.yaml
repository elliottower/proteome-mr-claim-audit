claims:
  c000:
    quotes:
    - exact: Ephrin type-A receptor 3 (EPHA3) was a significant risk factor for RA (odds ratio (OR) =
        1.312, 95% confidence interval (CI) [1.102, 1.562], Beta = 0.272, p < 0.01).
  c001:
    quotes:
    - exact: 'CD28 on CD28+ CD45RA+ CD8br regulatory T (Treg) cells mediated the relationship between
        EPHA3 levels and RA risk, with a mediation effect of 0.029 (95% CI: -0.111, 0.169), accounting
        for 10.7% of total effect.'
  c002:
    quotes:
    - exact: Plasma proteins and immunocyte phenotypes linked to RA have been identified using MR, including
        EPHA3, which may elevate RA risk by influencing CD28 on CD28+ CD45RA+ CD8br Treg cells.
