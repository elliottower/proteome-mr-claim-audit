  c006:
    quotes:
    - exact: 'In the observational clinical study, CXCL10 differentiated LADA from healthy controls (area
        under the receiver operating characteristic curve [ROC-AUC]: 0.889; precision-recall area under
        the curve [PR-AUC]: 0.919) and T2D (ROC-AUC: 0.838; PR-AUC: 0.921), with both models showing adequate
        calibration.'
