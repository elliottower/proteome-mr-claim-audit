claims:
  c000:
    quotes:
    - exact: 'Proteome-wide MR and colocalisation analyses indicated associations between genetically
        predicted plasma levels of C-X-C motif chemokine ligand 10 (CXCL10; OR [95% CI] per 1-SD increase
        in protein levels: 5.49 [1.74,17.32]), serum amyloid A1 (SAA1; 1.28 [1.14,1.45]), and SAA2 (1.22
        [1.11,1.34]) with LADA risk.'
