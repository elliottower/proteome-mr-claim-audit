  c000:
    quotes:
    - exact: 'COL6A3 was strongly increased by BMI (β = 0.32, 95% CI: 0.26-0.38, P = 3.7 × 10-8) and increased
        the risk of coronary artery disease (odds ratio = 1.47, 95% CI:1.26-1.70, P =4.5 × 10-7) per s.d.
        increase in COL6A3 level.'
  c001:
    quotes:
    - exact: 'COL6A3 was strongly increased by BMI (β = 0.32, 95% CI: 0.26-0.38, P = 3.7 × 10-8) and increased
        the risk of coronary artery disease (odds ratio = 1.47, 95% CI:1.26-1.70, P =4.5 × 10-7) per s.d.
        increase in COL6A3 level. Further analyses found that a C-terminal fragment of COL6A3 known as
        “endotrophin” mediated the effect.'
