claims:
  c000:
    quotes:
    - exact: Our findings confirmed a potential causal relationship between cytoplasmic tryptophanyl-tRNA
        synthetase 1 (WARS1) and a higher risk of AMD.
  c001:
    quotes:
    - exact: The observed causal impact of WARS1 on the two subtypes of AMD (dry and wet) align consistently
        with the aforementioned outcomes.
  c002:
    quotes:
    - exact: The observed causal impact of WARS1 on the two subtypes of AMD (dry and wet) align consistently
        with the aforementioned outcomes.
  c003:
    quotes:
    - exact: Three plasma metabolites-N-acetyl-kynurenine, N-acetyltyrosine, and caproate (6:0)-were identified
        as mediators of the causal effect of WARS1 on AMD, and subgroup analysis revealed that N-acetyltyrosine
        is a specific negative metabolite associated with WARS1 and dry AMD, whereas X-16580 is a specific
        positive metabolite linked to WARS1 and wet AMD.
  c004:
    quotes:
    - exact: Three plasma metabolites-N-acetyl-kynurenine, N-acetyltyrosine, and caproate (6:0)-were identified
        as mediators of the causal effect of WARS1 on AMD, and subgroup analysis revealed that N-acetyltyrosine
        is a specific negative metabolite associated with WARS1 and dry AMD, whereas X-16580 is a specific
        positive metabolite linked to WARS1 and wet AMD.
