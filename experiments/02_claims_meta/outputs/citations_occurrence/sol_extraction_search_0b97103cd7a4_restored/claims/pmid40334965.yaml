  note: abstract text exactly as sent to the extractor
claims:
  c000:
    quotes:
    - exact: We identified novel plasma proteins that possessed cross-psychiatric disorder effects, especially
        BTN2A1 and BTN3A2 associated with major depressive disorder (MDD), schizophrenia (SCZ), and bipolar
        disorder (BIP); ITIH1, ITIH3, ITIH4 and FES associated with SCZ and BIP, and the cross-effects
        of these proteins on SCZ and BIP were confirmed by validation analyses.
