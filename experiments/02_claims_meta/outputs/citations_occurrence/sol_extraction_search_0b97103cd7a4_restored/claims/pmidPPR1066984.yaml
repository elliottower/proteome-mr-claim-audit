claims:
  c000:
    quotes:
    - exact: Elevated levels of five proteins (GREM1, CHRDL, HHIP, IGFBP3, EPHA10) and decreased levels
        of two proteins (LRRC32, NTN4) were associated with an increased risk of CRC, among which four
        (GREM1, HHIP, CHRDL2, NTN4) were causal in CRC.
