claims:
  c000:
    quotes:
    - exact: Our analytic approach identified several known targets (e.g. ABO, OAS1), but also nominated
        new proteins such as soluble FAS (colocalisation probability > 0.9, p = 1 × 10  −4 ), implicating
        FAS-mediated apoptosis as a potential target for COVID-19 risk.
