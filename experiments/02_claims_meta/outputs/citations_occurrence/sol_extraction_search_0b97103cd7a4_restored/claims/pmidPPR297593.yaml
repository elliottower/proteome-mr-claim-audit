  c003:
    quotes:
    - exact: We also undertook polygenic (pan) and cis-Mendelian randomisation analyses that showed consistent
        associations of genetically predicted ABO protein with several COVID-19 phenotypes.
  c004:
    quotes:
    - exact: We also undertook polygenic (pan) and cis-Mendelian randomisation analyses that showed consistent
        associations of genetically predicted ABO protein with several COVID-19 phenotypes.
  c005:
    quotes:
    - exact: The ABO signal was associated with plasma concentrations of several proteins, with the strongest
        association observed with CD209 in several proteomic datasets.
  c006:
    quotes:
    - exact: We demonstrated experimentally that CD209 directly interacts with the spike protein of SARS-CoV-2,
        suggesting a mechanism that could explain the ABO association with COVID-19.
