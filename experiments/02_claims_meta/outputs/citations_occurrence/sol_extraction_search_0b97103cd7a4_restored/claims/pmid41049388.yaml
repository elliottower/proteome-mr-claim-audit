claims:
  c000:
    quotes:
    - exact: Bidirectional regulation of the Y-chromosomal gene RPS4Y1 (upregulated in AR, downregulated
        in AS) was linked to disease-specific immunometabolic reprogramming (P < 0.001). MR identified
        7 causal plasma proteins (GRAMD1C, GSTO1, IL1RAP, MMP9, PDXK, SAT2, SIGLEC12) intersecting transcriptomic
        signatures, implicating oxidative stress as a shared mechanism.
