claims:
  c000:
    quotes:
    - exact: A total of 10 plasma proteins were identified as significantly associated with anxiety disorders.
        Among these， SPATA9 （OR=0.856， 95% CI： 0.784–0.934， P<0.01） and PDE5A （OR=0.911， 95% CI： 0.864–0.961，
        P<0.01） were identified as protective factors， while CRYGD （OR=1.209， 95% CI： 1.095–1.334， P<0.01），
        BTN3A3 （OR=1.045， 95% CI： 1.018–1.073， P<0.01）， SERPINB13 （OR=1.102， 95% CI： 1.040–1.168， P<0.01），
        ERBB4 （OR=1.283， 95% CI： 1.109–1.484， P<0.01）， LSAMP （OR=1.096， 95% CI： 1.037–1.158， P<0.01），
        ICOSLG （OR=1.283， 95% CI： 1.104–1.490， P<0.01）， DNAJB11 （OR=1.172， 95% CI： 1.076–1.277， P<0.01），
        and TREML1 （OR=1.115， 95% CI： 1.054–1.179， P<0.01） were identified as risk factors.
