claims:
  c000:
    quotes:
    - exact: By leveraging bidirectional two-sample MR analysis, we identified CPXM1 (Carboxypeptidase
        X, M14 family member 1) as a novel gene that is causally linked to osteoporosis risk.
  c001:
    quotes:
    - exact: Through transcriptomic and proteomic validation, we demonstrate that CPXM1 was upregulated
        in aged bone tissues and osteoporotic conditions in both human and murine models.
