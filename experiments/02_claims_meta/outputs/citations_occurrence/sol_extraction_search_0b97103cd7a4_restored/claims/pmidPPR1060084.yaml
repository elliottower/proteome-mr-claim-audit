claims:
  c000:
    quotes:
    - exact: For repurposing, we prioritised 54 targets of compounds developed for other conditions with
        estimated beneficial effects on MDD (e.g., an inhibitor for a risk-increasing target). Ten high-priority
        targets of brain-penetrating compounds included ACE and NISCH (cardiovascular drugs), NDUFA2,
        NDUFB6, and NDUFS1 (metformin), CDK4, NTRK3, and MET (oncology inhibitors), and GLS and NOS2 (enzyme
        inhibitors).
