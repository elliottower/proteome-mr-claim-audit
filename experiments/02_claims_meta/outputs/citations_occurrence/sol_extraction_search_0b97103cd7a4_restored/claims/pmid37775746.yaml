  c013:
    quotes:
    - exact: 'Three of the causal proteins, SOCS3, FCGR3B, and NCF2, were enriched in the osteoclast differentiation
        pathway in KEGG enrichment analyses while GPC1 (marginal inclusion probability (MIP):0.993; model
        averaged causal effects (MACE): - 0.349), NAMPT (MIP:0.433; MACE: - 0.113), and NCF2 (MIP:0.324;
        MACE:0.066) ranked among the top three MM-associated proteins according to MR-BMA analyses.'
