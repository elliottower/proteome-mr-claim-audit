claims:
  c000:
    quotes:
    - exact: 'Six proteins were positively associated with the risk of MM, including nicotinamide phosphoribosyl
        transferase (NAMPT; OR [95% CI]: 1.35 [1.18, 1.55]), tyrosine kinase with immunoglobulin-like
        and EGF-like domains 1 (TIE1; 1.14 [1.06, 1.22]), neutrophil cytosol factor 2 (NCF2; 1.27 [1.12,
        1.44]), carbonyl reductase 1, cAMP-specific 3'',5''-cyclic phosphodiesterase 4D (PDE4D), platelet-activating
        factor acetylhydrolase IB subunit beta (PAFAH1B2).'
