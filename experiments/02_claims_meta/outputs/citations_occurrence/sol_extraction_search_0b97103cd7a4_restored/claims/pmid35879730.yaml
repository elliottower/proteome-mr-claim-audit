claims:
  c000:
    quotes:
    - exact: Proteins enriched in specific KEGG pathways, such as natural killer cell-mediated cytotoxicity,
        the Rap1 signaling pathway and the Ras signaling pathway, were affected by the RNAm-SNPs, and
        circulating levels of some of these proteins (ADH1B, DOCK9, MICB, PRDM1, STOM, TMPRSS11D and TXNDC12)
        were associated with BMI in MR analyses.
