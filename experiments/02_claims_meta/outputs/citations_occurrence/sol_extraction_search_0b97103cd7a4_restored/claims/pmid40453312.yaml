        0.992 (POLR2F) to 1.005 (PRKAB1); for osteoporosis, from 0.998 (AIF1) to 1.001 (CLC); for stroke,
        from 0.71 (TNFRSF1A) to 1.47 (TGM2); and for type 2 diabetes, from 0.79 (KRT18) to 1.47 (RAB37).'
