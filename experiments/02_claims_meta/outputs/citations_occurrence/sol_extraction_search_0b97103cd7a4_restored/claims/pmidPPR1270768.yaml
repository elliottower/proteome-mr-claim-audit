claims:
  c000:
    quotes:
    - exact: 'Pathway enrichment revealed distinct biological processes: T1 distributions reflected metabolic
        and coagulation activity, while spatial VAE dimensions reflected extracellular matrix organization
        and complement regulation. Mendelian randomization identified cathepsin S (CTSS) and extracellular
        matrix protein 1 (ECM1) as causal mediators with near-certain colocalization evidence (PP.H4>0.88),
        validated in an independent Icelandic cohort (n=35,559).'
