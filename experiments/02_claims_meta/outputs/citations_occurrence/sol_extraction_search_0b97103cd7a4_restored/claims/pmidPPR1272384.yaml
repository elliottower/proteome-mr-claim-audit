claims:
  c000:
    quotes:
    - exact: Combining longitudinal trajectory modelling with interpretable machine learning for labour
        timing prediction, we identified five proteins – AFP, ACTA2, ANGPT2, IL1RL1, and LMOD1 – that
        change in a reproducible sequential order preceding labour onset across all 40 women. IL1RL1,
        encoding both soluble and membrane-bound ST2, the receptors for IL-33, rose earliest and most
        consistently, preceding declining AFP and ANGPT2 and a late rise in the smooth muscle contractile
        proteins ACTA2 and LMOD1.
