  c000:
    quotes:
    - exact: 'For sarcopenia-related traits, GATM was associated with appendicular lean mass (ALM) across
        all omics levels with opposing tissue effects (negative in blood: β = -.03, FDR = 1.9e-09; positive
        in muscle), and ETFDH showed positive associations with ALM (β = .03, FDR = 1.4e-06).'
