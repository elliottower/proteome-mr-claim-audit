claims:
  c000:
    quotes:
    - exact: Ultimately, based on our prioritization criteria, we found that CD36 (glycoprotein IIIb),
        APOC1 (apolipoprotein C1), GSTA1 (glutathione S-transferase alpha 1), and FOLH1 (folate hydrolase
        1) were shown to influence lipids and heart diseases, and were uniquely represented in African-ancestry
        populations.
