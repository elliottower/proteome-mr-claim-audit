claims:
  c000:
    quotes:
    - exact: Elevated levels of ADGRF1 (OR=2.728, 95% CI [1.266-5.879], P=0.010), APP (OR=2.923, 95% CI
        [1.328-6.431], P=0.008), DUSP13 (OR=3.201, 95% CI [1.062-9.647], P=0.039), EPHA3 (OR=4.341, 95%
        CI [1.031-18.288], P=0.045), HSPA1B (OR=4.578, 95% CI [1.431-14.643], P=0.010), HYAL1 (OR=3.075,
        95% CI [1.375-6.881], P=0.006), KIRREL3 (OR=6.067, 95% CI [1.278-28.806], P=0.023), RAD23B (OR=6.825,
        95% CI [1.245-37.415], P=0.027), SERPINE1 (OR=3.768, 95% CI [1.452-9.777], P=0.006), SNPH (OR=4.019,
        95% CI [1.059-15.252], P=0.041), SRP14 (OR=6.292, 95% CI [1.193-33.189], P=0.030), and TMEFF1
        (OR=2.830, 95% CI [1.097-7.300], P=0.031) were associated with an increased risk of hydrocephalus.
