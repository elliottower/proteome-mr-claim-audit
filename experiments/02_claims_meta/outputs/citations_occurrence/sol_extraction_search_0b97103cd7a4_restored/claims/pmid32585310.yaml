claims:
  c000:
    quotes:
    - exact: Of these, a higher Hb1Ac in controls was associated with a lower IGFBP-2 level (p-value =
        4.1e-6).
  c001:
    quotes:
    - exact: We specifically identified IGFBP-2 to be associated with diabetes mellitus, although with
        no evidence for causality, which was specifically connected to citrulline metabolism.
  c002:
    quotes:
    - exact: In controls, IGFBP-2 was associated with 21 metabolite levels, but specifically connected
        to the metabolite citrulline in network analyses.
  c003:
    quotes:
    - exact: We observed no evidence, however, that the association between IGFBP-2 and diabetes mellitus
        was causal.
