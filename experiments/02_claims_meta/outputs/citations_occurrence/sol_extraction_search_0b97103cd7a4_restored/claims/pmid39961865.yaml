claims:
  c000:
    quotes:
    - exact: 'The findings revealed significant associations for several proteins, including CHCHD10,
        HBB, GZMB, LILRB2, MICB, IL21, FTMT, JPH4, and ISOC1 with the risk of urticaria. Specifically,
        three plasma protein phenotypes were identified as protective factors: GZMB (odds ratio [OR] =
        0.76, 95% confidence interval [CI] 0.65-0.88, P < 0.001), MICB (OR = 0.82, 95% CI 0.76-0.89, P
        < 0.001), and FTMT (OR = 0.79, 95% CI 0.74-0.83, P < 0.001).'
