claims:
  c000:
    quotes:
    - exact: 'Multi-stage genetic screening prioritized five candidate proteins stratified into two confidence
        tiers: three Tier 1 causal drivers supported by colocalization (PP4 > 0.80)-including risk factors
        CSF2, IL20RB, and WARS1 (also known as WARS)-alongside two Tier 2 candidates supported by SMR
        and HEIDI, comprising risk factor PILRA and inversely associated metabolic factor ACADSB.'
