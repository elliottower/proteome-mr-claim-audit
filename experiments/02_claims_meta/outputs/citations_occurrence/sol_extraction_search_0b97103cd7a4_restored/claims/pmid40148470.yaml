        95%CI = 0.5634-0.8566); in the MR analysis of MS, BTN1A1 (P_ivw = 0.0000, OR = 0.6101, 95%CI =
        0.4813-0.7733), EVI5 (P_ivw = 0.0000, OR = 0.3032, 95%CI = 0.1981-0.4642), OGA (P_ivw = 0.0005,
        OR = 0.4599, 95%CI = 0.2966-0.7131), TNFRSF14 (P_ivw = 0.0002, OR = 0.4026, 95%CI = 0.2505-0.6471);
        in the MR analysis of PsA, ICAM5 (P_ivw = 0.0281, OR = 1.1742, 95%CI = 1.0174-1.3552), CCDC50
        (P_ivw = 0.0092, OR = 0.7359, 95%CI = 0.5843-0.9269), IL17RD (P_ivw = 0.0006, OR = 0.7887, 95%CI
        = 0.6886-0.9034), UBLCP1 (P_ivw = 0.0021, OR = 0.6901, 95%CI = 0.5448-0.8741); in the MR analysis
        of Crohn's disease-related arthritis, GPT (P_ivw = 0.0006, OR = 0.0057, 95%CI = 0.0003-0.1111).
