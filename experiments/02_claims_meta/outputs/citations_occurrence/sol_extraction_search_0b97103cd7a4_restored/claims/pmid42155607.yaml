claims:
  c000:
    quotes:
    - exact: Fifty proteins were associated with genetically predicted HbA1c, and 10 were supported by
        independent HbA1c datasets. Cis-pQTL-based SMR analyses prioritized ITGBL1 and KLK13.
  c001:
    quotes:
    - exact: Fifty proteins were associated with genetically predicted HbA1c, and 10 were supported by
        independent HbA1c datasets. Cis-pQTL-based SMR analyses prioritized ITGBL1 and KLK13.
  c002:
    quotes:
    - exact: In deCODE validation, KLK13 was the only candidate supported across both glycaemic trait-to-protein
        and protein-to-DKD analyses (OR 1.13, 95% CI 1.02-1.24).
  c003:
    quotes:
    - exact: In deCODE validation, KLK13 was the only candidate supported across both glycaemic trait-to-protein
        and protein-to-DKD analyses (OR 1.13, 95% CI 1.02-1.24).
  c004:
    quotes:
    - exact: Higher KLK13 was associated with incident DKD (HR 1.52, 95% CI 1.13-2.06), whereas serine
        peptidase inhibitor Kazal type 6 (SPINK6) showed stronger association (HR 2.02, 95% CI 1.49-2.74).
