claims:
  c000:
    quotes:
    - exact: We identified 14, 24 and four proteins associated with prevalent prediabetes (i.e. impaired
        glucose tolerance and/or impaired fasting glucose), prevalent newly diagnosed type 2 diabetes
        and incident type 2 diabetes, respectively (28 overlapping proteins). Of these, IL-17D, IL-18
        receptor 1, carbonic anhydrase-5A, IL-1 receptor type 2 (IL-1RT2) and matrix extracellular phosphoglycoprotein
        were novel candidates.
