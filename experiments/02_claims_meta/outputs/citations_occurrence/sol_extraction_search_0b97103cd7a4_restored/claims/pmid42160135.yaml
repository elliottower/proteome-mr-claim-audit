claims:
  c000:
    quotes:
    - exact: 'A total of 462 proteins exhibited significant associations with hypertension: 328 proteins
        of them had significant associations with hypertension, SBP, and DBP. Both the Fine-Gray competing
        risk regression model and the Mendelian randomization analysis revealed eight proteins (ADM, ELN,
        NCAN, PRSS8, ZBTB17, FURIN, TINAGL1, and WARS) with consistent directional effects.'
