claims:
  c000:
    quotes:
    - exact: The observational analysis, including 86 individuals diagnosed with incident PAD during a
        median follow-up of 6.6-year, identified 13 proteins [trefoil factor two, matrix metalloproteinase-12
        (MMP-12), growth differentiation factor 15, V-set and immunoglobulin domain-containing protein
        two, N-terminal prohormone brain natriuretic peptide, renin, natriuretic peptides B, phosphoprotein
        associated with glycosphingolipid-enriched microdomains one, C-C motif chemokine 15, P-selectin,
        urokinase plasminogen activator surface receptor, angiopoietin-2, and C-type lectin domain family
        five member A] associated with the risk of PAD after multiple testing correction.
