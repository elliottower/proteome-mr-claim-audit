claims:
  c000:
    quotes:
    - exact: 'In primary analysis, vascular endothelial growth factor (VEGF) and fibroblast growth factor
        basic (bFGF) levels were suggestively associated with aneurysmal subarachnoid hemorrhage (aSAH)
        [VEGF → aSAH: OR = 1.15, 95%CI 1.04-1.26, P = 0.005; bFGF → aSAH: OR = 0.62, 95% CI 0.42-0.92,
        P = 0.02].'
