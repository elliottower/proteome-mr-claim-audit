  c004:
    quotes:
    - exact: 'Instead, suggestive protective effects for aSAH were identified in FGF-9 (FGF-9 → aSAH:
        OR = 0.74, 95% CI 0.62-0.89, P = 0.001) and FGF-16 (FGF-16 → aSAH: OR = 0.84, 95% CI 0.72-0.97,
        P = 0.017).'
