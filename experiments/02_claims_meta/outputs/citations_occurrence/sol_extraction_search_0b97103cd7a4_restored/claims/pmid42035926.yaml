claims:
  c000:
    quotes:
    - exact: 'After correction for multiple testing, MR identified three proteins associated with ASD
        risk: MICA (OR = 0.964, protective), SERPIND1 (heparin cofactor II; OR = 0.897, protective), and
        MAPKAPK3 (OR = 1.046, risk-increasing).'
