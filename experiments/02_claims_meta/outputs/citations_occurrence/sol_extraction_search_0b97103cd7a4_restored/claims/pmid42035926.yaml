  c003:
    quotes:
    - exact: Genetically predicted MAPKAPK3 showed moderate evidence of colocalization with ASD (PP·H4
        = 0.51), suggesting a shared causal variant.
  c004:
    quotes:
    - exact: Multi-omic analyses indicated that MAPKAPK3 is broadly expressed in brain tissues, significantly
        upregulated in the ASD cortex, and tightly co-expressed with inflammation-related genes.
  c005:
    quotes:
    - exact: Clinically, severe ASD was associated with elevated serum levels of IL-6, IL-1β, and IL-8;
        IL-1β level were positively correlated with the severity of ASD symptoms.
