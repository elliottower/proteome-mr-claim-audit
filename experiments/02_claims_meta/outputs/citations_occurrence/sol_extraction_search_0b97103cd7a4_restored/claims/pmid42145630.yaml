claims:
  c000:
    quotes:
    - exact: Cross-ancestry meta-analysis identified 12 candidate proteins associated with breast cancer
        risk (P < 2.5×10-5), including six previously reported and six newly implicated in MR studies.
        DNPH1 showed cross-ancestry heterogeneity, with a risk-increasing association in European populations
        and a nominally inverse association in East Asian populations.
