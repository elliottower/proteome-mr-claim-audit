  c009:
    quotes:
    - exact: 'MMP-12 (OR=0.93, 95% CI: 0.91-0.94, P <0.001), SWAP70 (OR=0.92, 95% CI: 0.90-0.94, P <0.001),
        and prekallikrein (OR=0.53, 95% CI: 0.33-0.72, P <0.001) may all be viable targets for IS, according
        to the combined meta-analysis results.'
