claims:
  c000:
    quotes:
    - exact: 'Prekallikrein (OR=0.41, 95% CI: 0.27-0.63, P =3.61×10 -5 ), a protein found in CSF, has
        a 10-fold protective impact in IS, while the plasma proteins SWAP70 (OR=0.85, 95% CI: 0.80-0.91,
        P =1.64×10 -6 ) and MMP-12 (OR=0.92, 95% CI: 0.89-0.95, P =4.49×10 -6 ) of each SD play a protective
        role in IS.'
