  c012:
    quotes:
    - exact: Additionally, no evidence of reverse causality was identified, and Bayesian colocalization
        revealed MMP-12 (PPH 4 =0.995), SWAP70 (PPH 4 =0.987), and prekallikrein (PPH 4 =0.894) shared
        the same variant with IS, supporting the robustness of the aforementioned causation.
