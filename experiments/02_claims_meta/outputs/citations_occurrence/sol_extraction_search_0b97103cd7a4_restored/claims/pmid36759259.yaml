    quotes:
    - exact: Our analyses showed targeting BIN1, GRN, and RET levels in blood as well as ACE, ICA1L, MAP1S,
        SLC20A2, and TOM1L2 levels in brain might reduce Alzheimer's disease risk, while ICA1L, SLC20A2,
        and TOM1L2 were not recommended as prioritized drugs due to the identified potential side effects.
