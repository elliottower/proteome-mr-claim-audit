claims:
  c000:
    quotes:
    - exact: Preliminary MR analysis identified two proteins (SPAG11B and DEFB135) associated with RA,
        and elevated plasma levels of both proteins would reduce the risk of RA (for SPAG11B, OR =0.49,
        95% CI =0.40-0.61, <italic>p</italic> =1.19×10<sup>-10</sup>; for DEFB135, OR =0.28, 95% CI =0.15-0.52,
        <italic>p</italic> =4.51×10<sup>-5</sup>, using the IVW method).
