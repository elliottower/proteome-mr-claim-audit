claims:
  c000:
    quotes:
    - exact: Of the 110 proteins available in plaque, 16 were associated with plaque vulnerability. This
        included positive control proteins targeted by drugs indicated for CHD, such IL6R (targeted by
        tocilizumab) and AT1B2 (targeted by digoxin), as well as a potential repurposing opportunity C1S
        (targeted by sutimlimab).
