claims:
  c000:
    quotes:
    - exact: MR analyses of 834 proteins found that a 1 sd increase in circulating galactoside 3(4)-l-fucosyltransferase
        (FUT3) and α-(1,3)-fucosyltransferase 5 (FUT5) was associated with a reduced risk of IPF (OR 0.81,
        95% CI 0.74-0.88; p=6.3×10-7 and OR 0.76, 95% CI 0.68-0.86; p=1.1×10-5, respectively).
  c001:
    quotes:
    - exact: MR analyses of 834 proteins found that a 1 sd increase in circulating galactoside 3(4)-l-fucosyltransferase
        (FUT3) and α-(1,3)-fucosyltransferase 5 (FUT5) was associated with a reduced risk of IPF (OR 0.81,
        95% CI 0.74-0.88; p=6.3×10-7 and OR 0.76, 95% CI 0.68-0.86; p=1.1×10-5, respectively).
  c002:
    quotes:
    - exact: MR analyses of 834 proteins found that a 1 sd increase in circulating galactoside 3(4)-l-fucosyltransferase
        (FUT3) and α-(1,3)-fucosyltransferase 5 (FUT5) was associated with a reduced risk of IPF (OR 0.81,
        95% CI 0.74-0.88; p=6.3×10-7 and OR 0.76, 95% CI 0.68-0.86; p=1.1×10-5, respectively). Sensitivity
        analyses including multiple cis-SNPs provided similar estimates both for FUT3 (inverse variance
        weighted (IVW) OR 0.84, 95% CI 0.78-0.91; p=9.8×10-6 and MR-Egger OR 0.69, 95% CI 0.50-0.97; p=0.03)
        and FUT5 (IVW OR 0.84, 95% CI 0.77-0.92; p=1.4×10-4 and MR-Egger OR 0.59, 95% CI 0.38-0.90; p=0.01).
