claims:
  c000:
    quotes:
    - exact: Genetically predicted levels of three proteins (APOE, NECTIN2, and PVR) were associated with
        EOAD risk, nine proteins (APOE, NECTIN2, PVR, EPHB4, SEMA3F, RNASET2, BTN1A1, PSAPL1, and GRN)
        were associated with LOAD risk, three proteins (APOE, NECTIN2, and PVR) were colocalized with
        EOAD, and six proteins (APOE, NECTIN2, PVR, SEMA3F, BTN1A1, and EPHB4) were colocalized with LOAD.
