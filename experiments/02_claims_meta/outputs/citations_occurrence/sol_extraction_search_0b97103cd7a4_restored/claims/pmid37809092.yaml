claims:
  c000:
    quotes:
    - exact: Specifically, in plasma, we found that an increase of one standard deviation in IL1R1 and
        ECM1 was associated with an increased risk of asthma, while an increase in ADAM19 was found to
        be protective. The corresponding odds ratios were 1.03 (95% CI, 1.02-1.04), 1.00 (95% CI, 1.00-1.01),
        and 0.99 (95% CI, 0.98-0.99), respectively.
