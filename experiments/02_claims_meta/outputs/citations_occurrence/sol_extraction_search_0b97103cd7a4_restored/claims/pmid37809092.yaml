        1.05; 95% CI, 1.04-1.07) increased the risk of asthma.
  c005:
    quotes:
    - exact: Bayesian co-localization found that ECM1 in the plasma (coloc.abf-PPH4 = 0.965) and in the
        brain (coloc.abf-PPH4 = 0.931) shared the same mutation with asthma.
  c006:
    quotes:
    - exact: Bayesian co-localization found that ECM1 in the plasma (coloc.abf-PPH4 = 0.965) and in the
        brain (coloc.abf-PPH4 = 0.931) shared the same mutation with asthma.
  c007:
    quotes:
    - exact: 'IL1R1 and PDLIM4 were validated in two replication cohorts.

        CONCLUSION: Our integrative analysis revealed that asthma risk is causally affected by the levels
        of IL1R1, ECM1, and PDLIM4.'
