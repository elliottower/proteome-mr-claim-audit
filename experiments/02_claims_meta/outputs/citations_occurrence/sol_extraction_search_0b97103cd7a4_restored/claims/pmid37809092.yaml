  c003:
    quotes:
    - exact: In the brain, per 10-fold increase in ECM1 (OR, 1.05; 95% CI, 1.03-1.08) and PDLIM4 (OR,
        1.05; 95% CI, 1.04-1.07) increased the risk of asthma.
  c004:
    quotes:
