  c012:
    quotes:
    - exact: Pathway enrichment implicated coagulation and γ-carboxylation pathways in CA strokes, and
        natriuretic peptide signaling and riboflavin metabolism in AF strokes. MR supported causal roles
        for NTproBNP (OR 1.26, 95%CI 1.11–1.41), ANGPT2 (OR 1.17, 1.01–1.34), ACP5 (OR 1.06, 1.01–1.15),
        APCS (OR 1.14, 1.01–1.15), and PAMR1 (OR 1.11, 1.01–1.20), with no evidence of pleiotropy or reverse
        causation.
