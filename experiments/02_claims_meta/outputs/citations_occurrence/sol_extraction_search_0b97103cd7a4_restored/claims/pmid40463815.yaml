claims:
  c000:
    quotes:
    - exact: 'We identified 127 plasma proteins linked to ED, of which 15 were influenced by T2DM. The
        mediation MR analysis indicated 9 plasma proteins with consistent mediation effects: SERPINA10,
        MATN4, NAB1, NUCB1, SLAMF6, and ANG were associated with negative effects, while NCAM1, CTSB,
        and WFIKKN2 demonstrated protective effects.'
