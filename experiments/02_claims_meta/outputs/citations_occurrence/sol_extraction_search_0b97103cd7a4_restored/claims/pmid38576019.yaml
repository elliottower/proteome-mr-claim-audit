claims:
  c000:
    quotes:
    - exact: We identified nine plasma proteins significantly associated with LUAD. Increased levels of
        ALAD, FLT1, ICAM5, and VWC2 exhibited protective effects, with odds ratios of 0.79 (95% CI 0.72-0.87),
        0.39 (95% CI 0.28-0.55), 0.91 (95% CI 0.72-0.87), and 0.85 (95% CI 0.79-0.92), respectively.
