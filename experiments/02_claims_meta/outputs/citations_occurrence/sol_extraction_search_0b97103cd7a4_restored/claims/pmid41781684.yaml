claims:
  c000:
    quotes:
    - exact: MR analysis demonstrated a significant causal association between CNTN2 and CAVD.
  c001:
    quotes:
    - exact: Colocalization analysis indicated that CNTN2 shares genetic loci with CAVD.
  c002:
    quotes:
    - exact: Gene Ontology (GO) analyses revealed that CNTN2 was downregulated in hVICs with an osteogenic
        phenotype.
  c003:
    quotes:
    - exact: Kyoto Encyclopedia of Genes and Genomes (KEGG) analysis revealed that CNTN2 is enriched in
        pathways associated with the osteogenic phenotype.
  c004:
    quotes:
    - exact: Immunoblotting further confirmed that CNTN2 protein expression was reduced in osteogenically
        induced hVICs and in clinical specimens obtained from patients with CAVD.
  c005:
    quotes:
    - exact: Immunoblotting further confirmed that CNTN2 protein expression was reduced in osteogenically
        induced hVICs and in clinical specimens obtained from patients with CAVD.
  c006:
    quotes:
    - exact: Additionally, overexpression of CNTN2 significantly inhibited the osteogenic phenotype of
        hVICs.
  c007:
    quotes:
    - exact: CNTN2 has a significant causal relationship with CAVD and contributes to protection during
        aortic valve calcification.
