claims:
  c000:
    quotes:
    - exact: Under strong supportive evidence from mQTL, eQTL, and pQTL, genetically predicted levels
        of NFKB1 are negatively correlated with the risk of OU.
  c001:
    quotes:
    - exact: With moderate supportive evidence from mQTL and pQTL, genetically predicted levels of FAIM3
        are negatively correlated with the risk of OU.
  c002:
    quotes:
    - exact: Meanwhile, under low supportive evidence from eQTL and pQTL, higher genetically predicted
        levels of JUND and lower levels of IL12β are associated with a higher risk of OU.
  c003:
    quotes:
    - exact: Meanwhile, under low supportive evidence from eQTL and pQTL, higher genetically predicted
        levels of JUND and lower levels of IL12β are associated with a higher risk of OU.
