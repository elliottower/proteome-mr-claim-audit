  c004:
    quotes:
    - exact: Subtype-specific analyses revealed distinct protein signatures, including S100A13 and TREM1
        in behavioral variant FTD, ING4 and TEX29 in FTD overlapping with motor neuron disease, SPINT2
        in progressive non-fluent aphasia, and UGDH in semantic dementia.
