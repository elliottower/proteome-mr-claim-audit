claims:
  c000:
    quotes:
    - exact: Thirty-four matched results from the two indirect-effect analyses were retained; 22 shared
        CD27-related B-cell traits between GSTM1- or TFRC-related gene-side results and ENPP2-related
        protein-side results.
  c001:
    quotes:
    - exact: Additional matched results involved MUC1, myeloid dendritic-cell or naive CD8bright T-cell
        traits, and HMOX1 or IDO1; ALOX15, CD38-related B-cell or activated Treg traits, and IL1B; and
        CISD2, a CD27-related B-cell trait, and IFNG.
