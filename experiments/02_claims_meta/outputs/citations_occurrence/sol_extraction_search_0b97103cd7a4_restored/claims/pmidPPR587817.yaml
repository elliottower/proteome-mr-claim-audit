  c008:
    quotes:
    - exact: Two interactive pairs of proteins (GREM1 and CHRDL2; MMP2 and TIMP2) were identified to be
        involved in osteoclast differentiation and tumorigenesis pathways; four proteins (POLR2F, CSF2RA,
        CD86, MMP2) have been targeted for drug development on autoimmune diseases and other cancers,
        with the potentials of being repurposed as therapeutic targets for CRC.
