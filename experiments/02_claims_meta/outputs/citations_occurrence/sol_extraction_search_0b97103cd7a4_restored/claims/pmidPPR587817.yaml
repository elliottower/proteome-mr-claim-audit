claims:
  c000:
    quotes:
    - exact: Elevated levels of two proteins (GREM1, CHRDL2) and decreased levels of 11 proteins were
        associated with an increased risk of CRC, among which six (CLSTN3, POLR2F, ADPGK, CSAG1, STXBP6,
        FUT3) were novel protein markers.
