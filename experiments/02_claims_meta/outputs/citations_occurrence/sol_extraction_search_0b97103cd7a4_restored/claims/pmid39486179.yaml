claims:
  c000:
    quotes:
    - exact: We identified 3 proteins (FAM151A, VEGF165, VEGF121) associated with PWD, 12 proteins (ABHD10,
        ADK, Cathepsin_S, DUSP13, Ephrin_A3, MAPRE2, OMG, PAM, PMM1, SH3BGRL3, TCP4, SYT11) linked to
        PR interval, 1 protein (PKC_A) related to QRS duration, and 2 proteins (MXRA7, SVEP1) associated
        with QT interval.
