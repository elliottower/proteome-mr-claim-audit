claims:
  c000:
    quotes:
    - exact: Among these, eight proteins were significantly associated with T2D in downstream MR analyses,
        representing potential pathways responsible for the heterogeneous link between obesity and T2D.
        These proteins include, for example, SNAP25, PAM, and FSTL3, suggesting that one of the underlying
        molecular pathways is tightly linked to insulin synthesis and secretion.
