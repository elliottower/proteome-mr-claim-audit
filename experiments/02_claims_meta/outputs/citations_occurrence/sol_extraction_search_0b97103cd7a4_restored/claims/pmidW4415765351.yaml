claims:
  c000:
    quotes:
    - exact: 'Three plasma proteins were associated with increased GC risk (SLURP1: OR = 1.15, 95 % CI
        1.08–1.22, P < 0.001; HSPA1A: OR = 1.12, 95 % CI 1.05–1.19, P < 0.001; LY6D: OR = 1.20, 95 % CI
        1.12–1.28, P < 0.001) and two with decreased risk (SCAMP3: OR = 0.85, 95 % CI 0.78–0.92, P < 0.001;
        LTB: OR = 0.88, 95 % CI 0.81–0.95, P < 0.001).'
