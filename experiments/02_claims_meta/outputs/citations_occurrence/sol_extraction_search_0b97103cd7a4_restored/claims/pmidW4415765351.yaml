  c010:
    quotes:
    - exact: LY6D was prioritized due to strong colocalization (PP.H4 > 0.80), upregulation in GC tissues
        (fold-change ≈ 2.5), expression in epithelial progenitors and macrophages, correlations with immunosuppressive
        cells (e.g., M2 macrophages, r = 0.42, P < 0.001), and PheWAS links to immune phenotypes without
        major adverse effects.
