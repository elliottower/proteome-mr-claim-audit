claims:
  c000:
    quotes:
    - exact: Genetically predicted levels of 14 circulating proteins were associated with visceral and
        ectopic fat (P < 4.99 × 10- 5, at a Bonferroni-corrected threshold). Colocalization analysis prioritized
        ten protein targets that showed effect on outcomes, including FST, SIRT2, DNAJB9, IL6R, CTSA,
        RGMB, PNLIPRP1, FLT4, PPY and IL6ST.
