claims:
  c000:
    quotes:
    - exact: Using cis -instrument Mendelian randomisation (MR), we infer causal relationships for 11
        proteins, recapitulating the previously reported relationship between PCSK9 and LDL cholesterol,
        replicating previous pQTL MR findings and discovering 16 causal relationships between protein
        levels and disease.
  c001:
    quotes:
    - exact: 'Our MR results highlight IL2-RA as a candidate for drug repurposing for Crohn’s Disease
        as well as 2 novel therapeutic targets: IL-27 (Crohn’s disease) and TNFRSF14 (Inflammatory bowel
        disease, Multiple sclerosis and Ulcerative colitis).'
