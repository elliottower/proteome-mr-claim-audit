    quotes:
    - exact: Specifically for Bipolar I disorder (BD_I), increased CSF AGRP levels are significantly linked
        to heightened BD_I risk, whereas elevated CSF levels of CTSF and LRP8, and plasma FLRT3, are associated
        with reduced BD_I risk.
