claims:
  c000:
    quotes:
    - exact: Genetically elevated circulating FXN protein was inversely associated with nephrolithiasis
        risk (OR 0.69, 95% CI 0.56-0.84).
  c001:
    quotes:
    - exact: For ureterolithiasis, higher GRHPR protein levels were protective (OR 0.81, 95% CI 0.71-0.91).
  c002:
    quotes:
    - exact: In a mouse kidney stone model, Fxn expression and frataxin protein levels were decreased,
        providing correlative in vivo support consistent with human genetic findings.
