claims:
  c000:
    quotes:
    - exact: Our analysis identified 455 unique proteins associated with at least one EOC subtype, with
        14 protein-cancer associations confirmed by further validation. Ten proteins were prioritized
        as potential therapeutic targets, including α1B-glycoprotein (A1BG) and ephrin-A1 (EFNA1), which
        interact with the known drug targets human epidermal growth factor receptor 2 (HER2) and vascular
        endothelial growth factor receptor (VEGFR).
