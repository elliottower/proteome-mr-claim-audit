claims:
  c000:
    quotes:
    - exact: With a lenient threshold of p < 0.005, we discovered regenerating family member 1A (REG1A),
        REG1B, tumor necrosis factor (TNF), and phospholipase A2 group IB (PLA2G1B) in association with
        incident PC, among which the two REG1 proteins were replicated using the UK Biobank Pharma Proteomics
        Project, with effect sizes increasing steadily as diagnosis time approaches the baseline.
