  c006:
    quotes:
    - exact: Mendelian randomization analysis further supported the potential causal effects of REG1 proteins
        on PC. Taken together, circulating REG1A and REG1B are promising biomarkers and potential therapeutic
        targets for the early detection and prevention of PC.
