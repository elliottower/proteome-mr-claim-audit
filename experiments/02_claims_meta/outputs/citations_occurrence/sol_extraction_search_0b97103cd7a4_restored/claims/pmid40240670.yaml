  c010:
    quotes:
    - exact: The results of the MR analysis for the five identified targets were consistent with the measured
        plasma concentrations of these targets in ICC patients and healthy volunteers. The differential
        RNA-seq analysis between tumor and adjacent normal tissues showed that STX12 was expressed at
        higher levels in tumor tissues, while A2M, CXADR, CD163, and FOXJ2 were expressed at higher levels
        in adjacent normal tissues.
