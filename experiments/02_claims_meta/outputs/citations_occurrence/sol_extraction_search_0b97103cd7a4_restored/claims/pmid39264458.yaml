  c006:
    quotes:
    - exact: Transcriptome analyses revealed that IL11RA, IL18R1, and IL16 were downregulated in tumor
        tissues compared with normal lung tissue, but only higher expression of IL11RA correlated with
        improved prognosis in patients with LUAD from different centers and persisted even in driver-gene
        negative patients.
