  c003:
    quotes:
    - exact: Colocalization analysis suggested that PPIE may share pathogenic variants with CLL (PP.H4
        = 0.758).
  c004:
    quotes:
    - exact: Phenomenon-wide MR analysis of PPIE also indicated associations with other clinical features,
        including rheumatic diseases and type 2 diabetes.
  c005:
    quotes:
    - exact: Phenomenon-wide MR analysis of PPIE also indicated associations with other clinical features,
        including rheumatic diseases and type 2 diabetes.
  c006:
    quotes:
    - exact: 'Protein-protein interaction and drug-gene interaction analyses highlighted CDC5L and SNW1
        as potential therapeutic targets. CONCLUSION: This study identifies nine plasma proteins linked
        to CLL risk, with PPIE offering new insights into the disease''s pathogenesis.'
