claims:
  c000:
    quotes:
    - exact: Increased levels of Peptidyl-prolyl cis-trans isomerase E (PPIE) (OR = 1.66, 95% CI 1.22-2.27,
        P = 0.001) were associated with an increased risk of developing CLL, whereas Protein O-Mannosyltransferase
        2 (POMGNT2) (OR = 0.62, 95% CI 0.41-0.91, P = 0.017) and C-C Motif Chemokine Ligand 14(CCL14)
        (OR = 0.80, 95% CI 0.67-0.94, P = 0.010) were associated with a reduced risk of CLL.
