claims:
  c000:
    quotes:
    - exact: The CD34/ITGAV ratio exhibited distinct effects on stroke risk, showing 34.9% increased odds
        of LAS (OR=1.349, 95% CI=1.097-1.658) while demonstrating protective effects against IS outcome
        progression (OR=0.564, 95% CI=0.380-0.838).
