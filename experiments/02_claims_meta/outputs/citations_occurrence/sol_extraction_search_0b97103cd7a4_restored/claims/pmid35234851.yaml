claims:
  c000:
    quotes:
    - exact: Among these, colocalization analysis further supported a role in type 2 diabetes for C-type
        mannose receptor 2 (MR odds ratio [OR] 0.85 [95% CI 0.79-0.92] per genetically predicted SD increase
        in protein level), MANS domain containing 4 (MR OR 0.90 [95% CI 0.88-0.92]), sodium/potassium-transporting
        ATPase subunit β2 (MR OR 1.10 [95% CI 1.06-1.15]), endoplasmic reticulum oxidoreductase 1β (MR
        OR 1.09 [95% CI 1.05-1.14]), spermatogenesis-associated protein 20 (MR OR 1.12 [95% CI 1.06-1.18]),
        haptoglobin (MR OR 0.96 [95% CI 0.94-0.98]), and α1-3-N-acetylgalactosaminyltransferase and α1-3-galactosyltransferase
        (MR OR 1.04 [95% CI 1.03-1.05]).
