claims:
  c000:
    quotes:
    - exact: We thoroughly evaluated the impact of 233 plasma proteins on the risk of IS, finding that
        26 of these proteins showed a potential association with the risk of outcome (P < 0.05). These
        proteins include PPP1R14A, IGF1R, PLG, PCDH10, IL15RA, RAB26, KNG1, HTATIP2, POMC, LILRA5, LYVE1,
        WISP1, LMAN2, NRXN1, TMEM9, HMBS, IL5RA, UNC5B, PTH, PUF60, STOML2, TFRC, KLRG2, VBP1, and HTATIP2.
