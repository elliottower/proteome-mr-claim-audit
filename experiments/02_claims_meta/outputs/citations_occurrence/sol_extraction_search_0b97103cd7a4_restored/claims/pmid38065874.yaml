claims:
  c000:
    quotes:
    - exact: Our analysis revealed 2 proteins, LPA and APOA5, as potential drug targets for MI, with causal
        effects on MI risk confirmed by multiple lines of evidence.
  c001:
    quotes:
    - exact: Our analysis revealed 2 proteins, LPA and APOA5, as potential drug targets for MI, with causal
        effects on MI risk confirmed by multiple lines of evidence.
  c002:
    quotes:
    - exact: LPA and APOA5 are involved in lipid metabolism and interact with target proteins of current
        MI medications. We also found 4 other proteins, IL1RN, FN1, NT5C, and SEMA3C, that may have potential
        as drug targets but require further confirmation.
