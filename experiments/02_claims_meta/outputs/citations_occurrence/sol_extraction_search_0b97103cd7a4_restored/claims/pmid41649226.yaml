  c000:
    quotes:
    - exact: 'Multicohort MR and meta‑analysis identified eight proteins with robust causal effects: NRP2,
        TSPAN1, and HAVCR2 for overall glaucoma; NRXN3 for PACG; MANSC4 for NTG; and LTBP2, CD69, and
        SMAD1 for POAG.'
