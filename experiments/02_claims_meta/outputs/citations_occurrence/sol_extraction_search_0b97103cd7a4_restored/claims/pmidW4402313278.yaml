claims:
  c000:
    quotes:
    - exact: The inverse variance weighting (IVW) results indicated significant associations for several
        proteins, including CCL25 (odds ratio (OR), 0.868; 95% confidence interval (CI), 0.790-0.954;p=0.003),DSG2
        (OR, 0.882; 95% CI, 0.795-0.979;p=0.018),EPHA4 (OR, 0.896; 95% CI, 0.824-0.975;p=0.011),EPHB4
        (OR, 0.876; 95% CI, 0.782-0.981;p=0.022),IL3RA (OR, 0.860; 95% CI, 0.788-0.938;p <0.001), MDGA2
        (OR, 0.906; 95% CI, 0.832-0.986;p=0.022),MET (OR, 0.871; 95% CI, 0.777-0.976;p=0.017),PEAR1 (OR,
        0.868; 95%CI, 0.766-0.985;p=0.028),PLXND1 (OR, 0.914; 95% CI, 0.849-0.985;p=0.018),SELE (OR, 0.889;
        95% CI, 0.821-0.963;p=0.004), and TLL1 (OR, 0.844; 95% CI, 0.725-0.982;p =0.028), all showing
        a reduced genetic susceptibility to AA.
