claims:
  c000:
    quotes:
    - exact: Mediation analysis indicated that hypothyroidism may contribute to anemia by elevating IgG
        levels.
  c001:
    quotes:
    - exact: Proteomic and colocalization analyses identified several proteins associated with anemia
        (e.g., MCCD1, TMEM106B), T1DM (e.g., CTRB1, CTRB2, IL7RA), RA (e.g., TGFBI, IL1RN), and PBC (e.g.,
        ALDH2, CXCL16).
