claims:
  c000:
    quotes:
    - exact: Mendelian randomization analyses indicated a causal relationship between predicted circulating
        furin and glycoprotein Nmb on breast cancer risk (odds ratio (OR) = 0.81, 95% confidence interval
        (CI) = 0.67-0.99, P-value = 0.03; and OR = 0.88, 95% CI = 0.78-0.99, P-value = 0.04 respectively),
        though these results were not supported in sensitivity analyses examining violations of MR assumptions.
