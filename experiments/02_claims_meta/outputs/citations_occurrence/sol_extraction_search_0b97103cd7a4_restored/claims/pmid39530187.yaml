  c022:
    quotes:
    - exact: 'Based on the PWAS and colocalization analysis results, the 22 target proteins were classified
        into 3 tiers: IL2, CPLX2, and LMAN2 as tier 1 proteins with the most compelling evidence, MST1,
        ITIH1, and ITIH3 as tier 2 proteins, and the rest as tier 3 proteins. Enrichment analysis and
        PPI showed that target proteins mainly affect the occurrence of kidney stones through leukocyte
        activation and cell junction assembly.'
