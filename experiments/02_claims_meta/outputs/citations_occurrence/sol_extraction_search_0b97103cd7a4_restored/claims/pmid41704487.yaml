claims:
  c000:
    quotes:
    - exact: Multi-omics integration consistently nominated RNASET2 as a causal protective factor against
        AIT.
  c001:
    quotes:
    - exact: Signals of pQTL and eQTL for RNASET2 were associated with decreased AIT risk, while three
        mQTLs were correlated with increased risk.
  c002:
    quotes:
    - exact: Signals of pQTL and eQTL for RNASET2 were associated with decreased AIT risk, while three
        mQTLs were correlated with increased risk.
  c003:
    quotes:
    - exact: Empirically, plasma RNASET2 levels were moderately elevated in AIT patients, potentially
        reflecting a compensatory anti-inflammatory response.
  c004:
    quotes:
    - exact: Crucially, recombinant RNASET2 effectively mitigated inflammation and apoptosis in the thyrocyte
        spheroid model, confirming its functional protective role.
  c005:
    quotes:
    - exact: Crucially, recombinant RNASET2 effectively mitigated inflammation and apoptosis in the thyrocyte
        spheroid model, confirming its functional protective role.
  c006:
    quotes:
    - exact: Consistently, RNASET2 knockdown heightened susceptibility to inflammatory cell death and
        cytokine expression, a phenotype reversed by recombinant RNASET2 supplementation.
  c007:
    quotes:
    - exact: Consistently, RNASET2 knockdown heightened susceptibility to inflammatory cell death and
        cytokine expression, a phenotype reversed by recombinant RNASET2 supplementation.
