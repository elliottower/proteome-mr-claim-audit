    quotes:
    - exact: Higher IL-2 receptor subunit beta (IL-2RB) levels were protective against CDC (OR = 0.827,
        95% CI = 0.718-0.953, P < .01), whereas increased IL-22 receptor subunit alpha-1 (IL-22RA1) levels
        elevated CDC risk (OR = 1.300, 95% CI = 1.078-1.570, P < .01).
