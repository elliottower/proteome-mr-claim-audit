claims:
  c000:
    quotes:
    - exact: MR analyses identified 280 mQTLs, 79 eQTLs, and 29 pQTLs with causal links to streptococcal
        septicemia. Integrative multi-omics analysis revealed PARK7 as the only gene consistently implicated
        across epigenetic, transcriptomic, and proteomic levels.
  c001:
    quotes:
    - exact: Single-cell RNA sequencing demonstrated significant PARK7 upregulation in T and NK cells
        from sepsis patients, corroborated by elevated PARK7 expression in septic shock patients across
        multiple timepoints.
  c002:
    quotes:
    - exact: Single-cell RNA sequencing demonstrated significant PARK7 upregulation in T and NK cells
        from sepsis patients, corroborated by elevated PARK7 expression in septic shock patients across
        multiple timepoints.
  c003:
