        from sepsis patients, corroborated by elevated PARK7 expression in septic shock patients across
        multiple timepoints.
  c004:
    quotes:
    - exact: Temporal correlation analyses indicated that PARK7 levels inversely correlated with depleted
        CD8 + T cells, naive CD4 + T cells, and resting NK cells.
  c005:
    quotes:
    - exact: Temporal correlation analyses indicated that PARK7 levels inversely correlated with depleted
        CD8 + T cells, naive CD4 + T cells, and resting NK cells.
  c006:
