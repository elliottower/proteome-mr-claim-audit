        CD8 + T cells, naive CD4 + T cells, and resting NK cells.
  c007:
    quotes:
    - exact: Critically, sc-eQTL MR confirmed that genetically predicted PARK7 upregulation in two immune
        subsets—CD4 + KLRB1+ T cells and CD4 + KLRB1- T cells—causally increased septicemia risk.
