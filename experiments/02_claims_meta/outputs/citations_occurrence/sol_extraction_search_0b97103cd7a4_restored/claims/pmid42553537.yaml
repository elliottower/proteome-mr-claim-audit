claims:
  c000:
    quotes:
    - exact: Gene prediction indicated that KDEL (Lys-Asp-Glu-Leu) Containing 2 and Keratin 18 (KRT18)
        were positively correlated with the risk of PE, whereas the other five proteins (Complement Factor
        B [CFB], FYN Proto-Oncogene [FYN], RAN Binding Protein 1 [RANBP1], Amphoterin-Induced Gene and
        ORF 1 [AMIGO1], and Arginase 2 [ARG2]) were negatively correlated.
