  c000:
    quotes:
    - exact: 'Network pharmacology analysis combined with Mendelian randomization identified TP53 (OR=3.325,
        95% CI: 1.805-6.124, P=0.0001), ARF4 (OR=0.173, 95% CI: 0.065-0.456, P=0.0003), and DPP4 (OR=0.463,
        95% CI: 0.302-0.711, P=0.0004) as the core targets in quercetin treatment of ccRCC.'
