  c000:
    quotes:
    - exact: Here we conduct a Mendelian randomization study by integrating plasma proteome and GWASs
        of schizophrenia, bipolar disorder and depression. The primate-specific immune-related protein
        BTN3A3 showed the most significant associations with all three psychiatric disorders.
