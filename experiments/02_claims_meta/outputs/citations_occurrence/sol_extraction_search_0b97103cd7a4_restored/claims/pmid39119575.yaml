  c001:
    quotes:
    - exact: Notably, Heme-binding protein 1 (HEBP1) was significant positively associated with osteonecrosis
        risk with convening evidence (OR, 1.40, 95% CI, 1.19 to 1.65, P = 3.96 × 10-5, P FDR = 0.044).
        This association was further confirmed in other MR analysis methods and did not detect heterogeneity
        and pleiotropy (all P > 0.05).
  c002:
    quotes:
    - exact: This comprehensive MR study identifies 71 plasma proteins associated with osteonecrosis,
        with HEBP1, ITIH1, SMOC1, and CREG1 showing potential as biomarkers of osteonecrosis.
