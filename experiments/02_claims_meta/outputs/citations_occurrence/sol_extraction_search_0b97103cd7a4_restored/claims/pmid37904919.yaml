claims:
  c000:
    quotes:
    - exact: 'We found that higher genetically-predicted maternal levels of NEC1 increased birth weight
        (mean-difference: 12g (95% CI [6g, 18g]) per 1 standard deviation protein level) as did PRS57
        (20g [10g, 31g]) and ULK3 (140g [81g, 199g]).'
