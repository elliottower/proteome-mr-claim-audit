claims:
  c000:
    quotes:
    - exact: Serum CD300LG exhibited positive associations with insulin sensitivity, and to angiogenesis-related
        gene expression in both muscle and fat.
  c001:
    quotes:
    - exact: Serum CD300LG exhibited positive associations with insulin sensitivity, and to angiogenesis-related
        gene expression in both muscle and fat.
  c002:
    quotes:
    - exact: Furthermore, serum CD300LG was positively associated with physical activity and negatively
        associated with glucose levels in the UK Biobank.
  c003:
    quotes:
    - exact: Furthermore, serum CD300LG was positively associated with physical activity and negatively
        associated with glucose levels in the UK Biobank.
  c004:
    quotes:
    - exact: In this sample, the association between serum CD300LG and physical activity was significantly
        stronger in men than in women.
  c005:
    quotes:
    - exact: Mendelian randomization analysis suggested potential causal relationships between levels
        of serum CD300LG and fasting glucose, 2-hour glucose after an oral glucose tolerance test, and
        HbA1c.
