claims:
  c000:
    quotes:
    - exact: 'With each incremental elevation of 1 standard deviation in the genetically anticipated protein-to-protein
        ratio, the susceptibility to type 2 diabetes oscillated from 0.93 (95% confidence interval: 0.87,
        1.00) for the CNTN3/NCSS1 protein level ratio to 1.13 (1.06, 1.22) for the DBNL/NCK2 protein level
        ratio.'
