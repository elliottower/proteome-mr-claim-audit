claims:
  c000:
    quotes:
    - exact: Notably, anti-Epstein-Barr virus nuclear antigen (EBNA) IgG levels exhibited the most significant
        causal effect on MS risk (OR = 225.62, P = 5.63E-208), replicated in the MS severity (OR = 1.11,
        P = 0.04).
