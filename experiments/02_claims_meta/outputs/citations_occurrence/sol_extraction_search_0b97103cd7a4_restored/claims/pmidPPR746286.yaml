claims:
  c000:
    quotes:
    - exact: Colocalization analysis (Posterior Probability H4>0.8) further supported the causality of
        three proteins (MAP2K1, GFRA1, and THBS3) in gastroesophageal reflux disease; LYPLAL1 in keratoconus;
        three proteins (PCSK9, ANGPTL4, and GCKR) in familial hyperlipidemia; CRAT in atopic eczema; three
        proteins (IRF3, CA12, and TNFRSF1B) in hypothyroidism; AIF1 in age-related hearing impairment;
        SCARF2 in male pattern baldness; IRF3 in basal cell carcinoma; and four proteins (RPS6KA1, ULK3,
        MPPED2, and BTN3A1) in prostate cancer.
