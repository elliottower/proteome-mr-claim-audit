claims:
  c000:
    quotes:
    - exact: TWAS identified shared genes potentially linking air pollutants with CKD, including upregulated
        transcripts (STX2, PHOSPHO2, NECAB3) and downregulated transcripts (CDK3, MEIOB, NDUFAF1, CRIPAK).
        Furthermore, proteome-wide MR analyses identified ALDH3A1, F12, and SNCG as potential risk proteins,
        and GNLY and MEGF10 as protective proteins.
