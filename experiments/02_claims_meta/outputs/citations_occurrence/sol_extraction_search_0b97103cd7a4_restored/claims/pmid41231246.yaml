  c011:
    quotes:
    - exact: 'Further mediation analysis revealed that three immune cell types mediated the effects of
        four plasma proteins on MDD: CD27 on IgD⁺ CD24⁺ cells mediated the effects of both COTL1 and RNF122
        (mediation proportions: 5.13% and 4.50%, respectively); IgD⁻ CD24⁻ % B cells mediated the effect
        of EDA (12.1%); and CD62L on CD62L⁺ DCs mediated the effect of GLRX (-9.46%).'
