claims:
  c000:
    quotes:
    - exact: We found that eleven plasma proteins (TRABD, CACNB4, EDA, SAR1A, GLRX, COTL1, STOM, CRP,
        FGF22, and EDA2R) were positively associated with MDD risk, while one protein (SPTLC1) exhibited
        a negative association.
