  c000:
    quotes:
    - exact: Our findings unveil a novel pathogenic axis where ALD risk is governed by a balance between
        pro-inflammatory, matrix-remodeling myeloid cells (driven by TREML2/MMP12) and homeostatic hepatocyte
        functions (mediated by PLA2R1/MAX).
