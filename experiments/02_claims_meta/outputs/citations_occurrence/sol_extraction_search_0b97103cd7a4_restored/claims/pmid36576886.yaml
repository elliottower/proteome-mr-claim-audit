claims:
  c000:
    quotes:
    - exact: 'Forward MR analysis using only cis-acting protein quantitative trait loci [cis-pQTLs] or
        trans-pQTLs further validated causal associations of two chemokines and the increased risk of
        UC: C-X-C motif chemokine ligand 9 [CXCL9] [OR 1.45, 95% CI 1.08, 1.95, p = 0.012] and C-C motif
        chemokine ligand 11 [CCL11] [OR 1.14, 95% CI 1.09, 1.18, p = 3.89 × 10-10].'
  c001:
    quotes:
    - exact: 'Forward MR analysis using only cis-acting protein quantitative trait loci [cis-pQTLs] or
        trans-pQTLs further validated causal associations of two chemokines and the increased risk of
        UC: C-X-C motif chemokine ligand 9 [CXCL9] [OR 1.45, 95% CI 1.08, 1.95, p = 0.012] and C-C motif
        chemokine ligand 11 [CCL11] [OR 1.14, 95% CI 1.09, 1.18, p = 3.89 × 10-10].'
  c002:
    quotes:
    - exact: 'Forward MR analysis using only cis-acting protein quantitative trait loci [cis-pQTLs] or
        trans-pQTLs further validated causal associations of two chemokines and the increased risk of
        UC: C-X-C motif chemokine ligand 9 [CXCL9] [OR 1.45, 95% CI 1.08, 1.95, p = 0.012] and C-C motif
        chemokine ligand 11 [CCL11] [OR 1.14, 95% CI 1.09, 1.18, p = 3.89 × 10-10]. Using both cis- and
        trans-acting pQTLs, an association of caspase-8 [CASP8] [OR 1.04, 95% CI 1.03, 1.05, p = 7.63
        × 10-19] was additionally identified.'
  c003:
    quotes:
    - exact: 'Reverse MR did not find any influence of genetic predisposition to UC on any of these three
        inflammation proteins.

        CONCLUSION: Pre-existing elevated levels of CXCL9, CCL11 and CASP8 may play a role in the pathogenesis
        of UC.'
  c004:
    quotes:
    - exact: 'Reverse MR did not find any influence of genetic predisposition to UC on any of these three
        inflammation proteins.

        CONCLUSION: Pre-existing elevated levels of CXCL9, CCL11 and CASP8 may play a role in the pathogenesis
        of UC.'
  c005:
    quotes:
    - exact: Using both cis- and trans-acting pQTLs, an association of caspase-8 [CASP8] [OR 1.04, 95%
        CI 1.03, 1.05, p = 7.63 × 10-19] was additionally identified. Reverse MR did not find any influence
        of genetic predisposition to UC on any of these three inflammation proteins.
