claims:
  c000:
    quotes:
    - exact: We identified four novel targets for MASLD (CD33, GRHPR, HMOX2, and SCG3), provided protein
        evidence supporting roles of AHCY, FCGR2B, ORM1, and RBKS in MASLD, and validated nine previously
        known targets.
