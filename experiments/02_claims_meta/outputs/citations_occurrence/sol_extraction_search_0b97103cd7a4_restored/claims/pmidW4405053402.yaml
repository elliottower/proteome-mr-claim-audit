  c017:
    quotes:
    - exact: We further evaluated the therapeutic effects of mTOR inhibition in vivo via administration
        of omipalisib, a potent dual PI3K/mTOR inhibitor, to JAK2V617F knock-in mice. Omipalisib treatment
        significantly ameliorated features of myeloid malignancies including splenomegaly and leukocytosis
        which were both significantly reduced following 4 weeks of treatment, without affecting body weight.
