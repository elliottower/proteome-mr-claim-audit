claims:
  c000:
    quotes:
    - exact: To identify a potential myeloid signature, we estimated causal effects of 2,940 plasma proteins
        on MPN via a two-sample MR framework and identified 55 candidates significantly associated with
        increased risk of MPN (P < 0.05, OR > 1). Utilizing data from the BEAT-AML cohort, we further
        screened the prognostic value of these candidates using Cox and log-rank test survival analyses
        and identified a 4-gene myeloid signature comprising MPO, CDCP1, CRISP3 and DXCR, with each conferring
        prognostic significance individually.
