claims:
  c000:
    quotes:
    - exact: For ACE, our analyses across methylation, expression, and protein levels revealed an overall
        odds ratio (OR) indicating a protective effect against AD.
  c001:
    quotes:
    - exact: 'CD33 demonstrated an increased risk of AD (OR = 1.17, 95% CI: 1.09-1.25).'
  c002:
    quotes:
    - exact: At the protein level, genetically predicted higher levels of TMEM106B (OR 1.44, 95% CI 1.24-1.68),
        SIRPA (OR 1.03, 95% CI 1.02-1.04) and CTSH (OR 1.04, 95% CI 1.03-1.06) was associated with an
        increased risk of AD; genetically predicted higher level of CLN5 were inversely associated with
        AD risk (OR 0.69, 95% CI 0.58-0.83).
