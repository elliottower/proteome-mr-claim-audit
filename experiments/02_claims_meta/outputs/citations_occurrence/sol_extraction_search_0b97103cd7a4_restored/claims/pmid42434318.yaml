claims:
  c000:
    quotes:
    - exact: After rigorous screening and Holm-Bonferroni correction, we identified 50 druggable genes
        (eQTL-derived) and 35 druggable proteins (pQTL-derived) with causal effects on LS. Integrative
        multi-omics analysis revealed integrin subunit beta 2 (ITGB2) and poly(ADP-ribose) polymerase
        1 (PARP1) as the most robust therapeutic targets.
