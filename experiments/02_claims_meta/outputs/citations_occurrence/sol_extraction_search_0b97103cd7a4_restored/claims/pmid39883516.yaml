claims:
  c000:
    quotes:
    - exact: MR analyses unveiled 19 unique circulating proteins that were associated with psoriasis,
        among which only AIF1, FCGR3A, NEU1, HSPA1A, TNXB, and ABO were the potential proteins that interacted
        with psoriasis risk after being analyzed with high evidence of colocalization (PP.H4 > 0.9).
