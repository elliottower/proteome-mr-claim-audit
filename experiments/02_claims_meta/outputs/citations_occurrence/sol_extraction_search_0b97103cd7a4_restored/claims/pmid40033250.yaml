claims:
  c000:
    quotes:
    - exact: Proteins such as C1QC, UMOD, SLITRK5, ASAP2, TREML2, DAPK2, ARHGEF10, POLM, SST, and SIGLEC1
        showed positive correlations with ALS risk, whereas ADPGK, BTNL9, COLEC12, ADGRF5, FAIM, CRTAM,
        PRSS3, BAG5, and PSMD11 exhibited negative correlations.
