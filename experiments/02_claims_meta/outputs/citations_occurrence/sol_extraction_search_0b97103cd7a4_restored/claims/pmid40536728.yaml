  c000:
    quotes:
    - exact: Four proteins (KLF4, MYL4, TNFRSF13C, TNFSF13B) were associated with lower vitiligo risk,
        while five proteins (ALPI, CDH1, ITGB1, SERPINH1, TNFSF10) were linked to higher risk.
