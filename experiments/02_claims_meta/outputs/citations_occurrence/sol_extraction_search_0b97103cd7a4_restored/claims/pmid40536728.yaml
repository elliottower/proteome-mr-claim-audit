  c009:
    quotes:
    - exact: Of these, three proteins (KLF4, TNFRSF13C, and TNFSF10) were high priority with the most
        convincing evidence. Bioinformatics analysis and model prediction of genes associated with vitiligo
        progression showed these three protein-coding genes were significantly associated with vitiligo
        occurrence, and their functions were related to cell cycle, apoptosis, oxidative stress, inflammatory
        response, and immune infiltration.
