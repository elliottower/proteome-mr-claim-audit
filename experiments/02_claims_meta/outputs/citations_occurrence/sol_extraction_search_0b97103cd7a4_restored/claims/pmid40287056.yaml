  c005:
    quotes:
    - exact: Notably, IL-6 (OR = 2.02; 95 % CI 1.54-2.64), 5-HT7R (OR = 2.73; 95 % CI 1.96-3.80), and
        EFNB1 (OR = 1.82; 95 % CI 1.59-2.08) were positively associated with MASLD risk, whereas α1-antitrypsin
        (OR = 0.84; 95 % CI 0.78-0.90) and CA056 (OR = 0.90; 95 % CI 0.86-0.94) appeared protective.
