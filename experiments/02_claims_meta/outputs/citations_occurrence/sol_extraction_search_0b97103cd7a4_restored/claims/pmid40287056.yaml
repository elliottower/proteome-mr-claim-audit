claims:
  c000:
    quotes:
    - exact: We identified 26 proteins associated with MASLD after Bonferroni correction (P < 1.16 × 10-5),
        with 19 of them showing no significant reverse association. Interleukin-6 (IL-6), alpha-1-antitrypsin
        (α1-antitrypsin), 5-hydroxytryptamine receptor 7 (5-HT7R), ephrin-B1 (EFNB1), and protein MENT
        (CA056) were replicated.
