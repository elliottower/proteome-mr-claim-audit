  c003:
    quotes:
    - exact: To disentangle the shared expression quantitative trait loci signal for IL10RB and IFNAR2,
        we conducted phenome-wide association scans and pathway enrichment analysis, which suggested that
        IFNAR2 is more likely to play a role in COVID-19 hospitalization.
