claims:
  c000:
    quotes:
    - exact: We found significant Mendelian randomization results for three proteins (ACE2, P = 1.6 ×
        10-6; IFNAR2, P = 9.8 × 10-11 and IL-10RB, P = 2.3 × 10-14) using cis-expression quantitative
        trait loci genetic instruments that also had strong evidence for colocalization with COVID-19
        hospitalization.
