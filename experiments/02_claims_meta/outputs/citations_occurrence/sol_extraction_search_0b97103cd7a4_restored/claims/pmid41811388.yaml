claims:
  c000:
    quotes:
    - exact: MR phenome-wide association study of European protein quantitative trait loci identified
        complement factor H (CFH) as a significant protective factor for IgA nephropathy (odds ratio [OR],
        0.54; 95% confidence interval [CI], 0.45 to 0.65; P = 1.47E-10), whereas CFH-related protein 1
        (OR, 1.21; 95% CI, 1.12 to 1.31; P = 8.49E-7) and endoplasmic reticulum aminopeptidase 2 (OR,
        1.14; 95% CI, 1.07 to 1.21; P = 7.33×E-6) were risk factors.
