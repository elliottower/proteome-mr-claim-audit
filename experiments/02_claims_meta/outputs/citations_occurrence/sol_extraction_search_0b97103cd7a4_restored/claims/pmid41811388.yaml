  c003:
    quotes:
    - exact: Single-cell transcriptomic analysis revealed elevated expression of CFH, endoplasmic reticulum
        aminopeptidase 2, lectin, mannose binding 2 like, α -L-iduronidase, and gamma-glutamyl hydrolase
        in mesangial cells from IgA nephropathy patients, and higher plasma levels of iduronidase and
        pyrin domain containing 1 (PYDC1) in IgA nephropathy cases.
