claims:
  c000:
    quotes:
    - exact: Our SMR analysis identified suggestive associations between NLRP6 expression (OR = 0.528,
        95%CI = 0.291-0.96) and p27Kip1 protein abundance (OR = 0.269, 95%CI = 0.08-0.904) with SLE susceptibility
        in the discovery cohort, supported by colocalization evidence.
  c001:
    quotes:
    - exact: Our SMR analysis identified suggestive associations between NLRP6 expression (OR = 0.528,
        95%CI = 0.291-0.96) and p27Kip1 protein abundance (OR = 0.269, 95%CI = 0.08-0.904) with SLE susceptibility
        in the discovery cohort, supported by colocalization evidence.
  c002:
    quotes:
    - exact: Additionally, we found that the methylation of the NLRP6 promoter (cg06432119) was significantly
        increased, while NLRP6 expression and p27Kip1 level were significantly decreased in SLE patients
        compared to controls.
  c003:
    quotes:
    - exact: Additionally, we found that the methylation of the NLRP6 promoter (cg06432119) was significantly
        increased, while NLRP6 expression and p27Kip1 level were significantly decreased in SLE patients
        compared to controls.
  c004:
    quotes:
    - exact: Furthermore, NLRP6 mRNA expression was significantly negatively correlated with the SLE severity
        (SLEDAI-2000).
