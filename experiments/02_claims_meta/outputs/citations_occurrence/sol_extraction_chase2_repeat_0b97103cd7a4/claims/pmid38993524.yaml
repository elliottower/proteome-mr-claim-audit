claims:
  c000:
    quotes:
    - exact: We found interferon-gamma (IFN-γ, p = 2.14 × 10-6, OR = 0.870, 95% CI = 0.821-0.921), interleukin-1
        beta (IL-1b, p = 0.012, OR = 0.951, 95% CI = 0.914-0.989), interleukin-4 (IL-4, p = 0.034, OR
        = 0.946, 95% CI = 0.899-0.996), interleukin-18 (IL-18, p = 0.028, OR = 0.964, 95% CI = 0.934-0.996),
        granulocyte colony-stimulating factor (GCSF, p = 0.010, OR = 0.919, 95% CI = 0.861-0.980), and
        Stromal cell-derived factor 1a (SDF1a, p = 0.014, OR = 1.072, 95% CI = 1.014-1.134) were causally
        associated with risk of IVDD.
