claims:
  c000:
    quotes:
    - exact: Our MR analysis demonstrated a reliable causative effect of Interleukin-9 (IL-9) and macrophage
        migration inhibitory factor (MIF) on reducing HDP risk, while macrophage inflammatory protein
        1-beta (MIP1b), Interleukin-13 (IL-13), and Interleukin-16 (IL-16) were associated with promoting
        HDP risk.
