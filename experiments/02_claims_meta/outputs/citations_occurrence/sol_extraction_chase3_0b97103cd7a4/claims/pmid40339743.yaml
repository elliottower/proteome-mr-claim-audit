claims:
  c000:
    quotes:
    - exact: 'Our MR analysis identified several significant associations: elevated artemin [odds ratio
        (OR) = 1.195], glial cell line-derived neurotrophic factor (hGDNF) (OR = 1.173), and tumor necrosis
        factor (TNF) (OR = 1.179) levels increased peripheral atherosclerosis (PA) risk; higher CUB domain-containing
        protein 1 (OR = 0.534), interleukin (IL)-8 (OR = 0.274), monocyte chemoattractant protein-3 (OR
        = 0.373), transforming growth factor-alpha (OR = 0.306), and tumor necrosis factor receptor superfamily
        member 9 (OR = 0.423) levels decreased cerebral artery atherosclerosis risk; fibroblast growth
        factor 21 (FGF-21) (OR = 1.122), hGDNF (OR = 1.108), and IL-22 receptor subunit alpha-1 (IL-22RA1)
        (OR = 1.235) levels were positively associated with coronary artery atherosclerosis (COA) risk;
        while IL-13 (OR = 0.909) and TNF-beta levels (OR = 0.954) were negatively associated with COA
        risk.'
