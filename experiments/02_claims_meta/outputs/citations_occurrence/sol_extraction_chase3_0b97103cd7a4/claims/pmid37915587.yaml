claims:
  c000:
    quotes:
    - exact: 'We found evidence to support the causal role of genetically predicted circulating levels
        on decreased risk of sepsis, including RANTES (OR = 0.920, 95% CI: 0.849-0.997, P = 0.041) and
        basic fibroblast growth factor (basic-FGF) (OR = 0.869, 95% CI: 0.766-0.986, P = 0.029).'
