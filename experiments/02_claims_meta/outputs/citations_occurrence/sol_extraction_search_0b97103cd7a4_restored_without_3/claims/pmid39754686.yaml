  c002:
    quotes:
    - exact: Seven CPLRs, such as REG1A/TFF3 and LAT/SPARC, were associated with reduced PTC risk, potentially
        reflecting protective mechanisms. In contrast, five CPLRs, including MAD1L1/PSIP1 and CIAPIN1/TYMP,
        were linked to increased risk, suggesting their role in promoting drug resistance.
