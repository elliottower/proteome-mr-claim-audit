  c010:
    quotes:
    - exact: In blood proteomics, one significant protein (PEAR1) and three near-significant proteins
        (NDE1, EVA1C, B4GALT2) were identified, but lacked colocalization evidence. Moreover, despite
        the limited correlation between the same protein in brain and blood, the PPI network analysis
        provided new insights into the interaction between brain and blood in SA.
