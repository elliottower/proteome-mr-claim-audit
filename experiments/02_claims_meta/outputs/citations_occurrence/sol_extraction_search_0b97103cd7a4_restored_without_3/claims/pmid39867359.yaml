claims:
  c000:
    quotes:
    - exact: Both conventional observational and MR study designs converged on proteins that appear to
        increase as a result of PA, including integrin proteins such as ITGAV and ITGAM, as well as MXRA8,
        CLEC4A, CLEC4M, GFRA1, and ADGRG2; and on proteins that appear to decrease as a result of PA such
        as LEP, LPL, INHBC, CLMP, PTGDS, ADM, OGN, and PI3.
