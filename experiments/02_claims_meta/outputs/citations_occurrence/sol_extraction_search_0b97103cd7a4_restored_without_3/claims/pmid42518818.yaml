  c008:
    quotes:
    - exact: Single-cell, spatial and multiplex immunofluorescence analyses localized these hubs to epithelial,
        fibroblast and endothelial compartments, with TGFB3 enriched at tumor-stroma interfaces and associated
        with poor survival.
  c009:
    quotes:
    - exact: Virtual screening nominated TGFB3-binding ligands and proflavine hemisulfate formed a stable
        complex with TGFB3 in silico while attenuating TGFB3-driven proliferation, migration and PI3K-dependent
        survival signaling in AGS cells.
