claims:
  c000:
    quotes:
    - exact: Proteome-wide MR highlighted 29 circulating proteins with putative causal effects on gastric
        cancer, of which eight (ERBB3, LGR4, BMP4, CD248, MGP, TGFB3, GRP and ETS2) occupied central positions
        in the interaction network.
