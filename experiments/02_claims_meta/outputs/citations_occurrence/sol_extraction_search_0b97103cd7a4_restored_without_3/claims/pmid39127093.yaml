  c003:
    quotes:
    - exact: Multivariable MR suggested that well-known lipid profiles do not mediate the relationship
        between PCSK9 and vitiligo, whereas 2-step MR analyses identified 5 potential protein mediators
        (CCN5, CXCL12, FCRL1, legumain, and FGF2).
