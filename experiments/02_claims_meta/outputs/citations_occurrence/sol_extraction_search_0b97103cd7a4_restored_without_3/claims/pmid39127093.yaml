claims:
  c000:
    quotes:
    - exact: 'Lipid-lowering MR indicated a potential role of PCSK9 in reducing the vitiligo risk (OR
        [95% confidence interval] = 0.71 [0.52-0.95]), which was replicated in PCSK9-inhibition MR analyses
        across 2 separate biobanks (UK Biobank: OR [95% confidence interval] = 0.82 [0.71-0.96]; deCODE:
        OR [95% confidence interval] = 0.78 [0.67-0.91]).'
