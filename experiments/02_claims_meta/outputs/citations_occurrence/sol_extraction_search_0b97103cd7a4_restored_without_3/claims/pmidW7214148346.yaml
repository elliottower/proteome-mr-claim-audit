  c002:
    quotes:
    - exact: We identified associated regulatory variants (eQTLs, pQTLs) and pinpointed a core network
        of nine inflammatory proteins (e.g., TNF, PD-L1) significantly associated with self-perceived
        facial aging. These inflammatory mediators causally influenced a distinct profile of 137 systemic
        aging-associated metabolites, predominantly lipids (e.g., LDL), revealing an inflammation-lipid
        metabolism axis driving self-perceived facial aging.
