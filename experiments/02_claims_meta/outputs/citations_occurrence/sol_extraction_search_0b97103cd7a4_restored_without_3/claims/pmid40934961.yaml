claims:
  c000:
    quotes:
    - exact: 'Through integrated observational and MR analyses, we identified a total of 45 proteins significantly
        associated with CKD in participants with abnormal glucose metabolism, among which 11 represent
        novel discoveries: CD300C, CD300LG, CDNF, CDSN, CHRDL1, ENPP6, LEFTY2, MOG, RSPO3, TNFRSF13B,
        and MYLPF.'
