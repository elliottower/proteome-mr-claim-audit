  c010:
    quotes:
    - exact: 'Observational analyses demonstrated a hazard ratio (HR) of 0.75 (95% CI: 0.63-0.89), while
        one-sample MR revealed an odds ratio (OR) of 0.32 (95% CI: 0.14-0.73), and two-sample MR produced
        an OR of 0.60 (95% CI: 0.37-0.98), supporting a protective role of ENPP6 in CKD development.'
