claims:
  c000:
    quotes:
    - exact: Among these, 3 were successfully replicated in other independent pQTL datasets, including
        2 (HYOU1 and FLT3) that were novel and not identified in the original GWAS. Further integration
        with expression quantitative trait locus (eQTL) data from 3 diabetes-related tissues (blood, adipose
        tissue, and pancreas) revealed that 5 of the causal proteins also showed significant associations
        with T2DM at their cis-regulatory mRNA levels.
