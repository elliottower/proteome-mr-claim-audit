  c008:
    quotes:
    - exact: After combining single-cell sequencing, Mendelian randomization, and Bayesian co-localization
        analyses, we identified 1 gene (TAPBP) that is strongly associated with prostate cancer and explored
        the potential mechanisms of its pathogenicity and its clinical relevance.
