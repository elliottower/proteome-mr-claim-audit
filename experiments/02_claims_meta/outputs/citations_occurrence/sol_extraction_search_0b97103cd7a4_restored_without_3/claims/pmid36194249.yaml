claims:
  c000:
    quotes:
    - exact: 'Two-sample Mendelian randomisation indicated that complement C2 may be causally related
        to greater type 2 diabetes risk (inverse variance weighted estimate: OR 1.65 per SD; p=7.0 × 10-3),
        while neuropilin-2 was inversely associated (OR 0.44 per SD; p=8.0 × 10-3).'
