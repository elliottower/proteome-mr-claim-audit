claims:
  c000:
    quotes:
    - exact: Genetically predicted elevated levels of β-NGF are associated with a reduced risk of sepsis
        (odds ratio [OR] 0.77, 95% confidence interval [CI] = 0.60-0.99; P = 0.039).
  c001:
    quotes:
    - exact: Genetically predicted elevated levels of β-NGF are associated with a reduced risk of sepsis
        (odds ratio [OR] 0.77, 95% confidence interval [CI] = 0.60-0.99; P = 0.039). Among sepsis patients
        aged below 75 years, the risk was reduced by 30% (OR, 0.70; 95% CI = 0.52-0.93; P = 0.013).
  c002:
    quotes:
    - exact: Genetically predicted increases in TRAIL (OR, 1.11; 95% CI = 1.02-1.20; P = 0.020) and VEGF-A
        (OR, 1.18; 95% CI = 1.02-1.37; P = 0.031) were positively associated with sepsis incidence, while
        genetically predicted levels of CST5 (OR, 0.81; 95% CI = 0.69-0.94; P = 0.006) and MCP-1 (OR,
        0.64; 95% CI = 0.45-0.92; P = 0.015) were inversely associated with sepsis-induced mortality.
