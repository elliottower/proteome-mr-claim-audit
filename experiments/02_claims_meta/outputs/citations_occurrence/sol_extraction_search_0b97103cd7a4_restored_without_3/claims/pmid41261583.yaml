  c002:
    quotes:
    - exact: C2, HS3ST3A1, MAPK3, PRSS57, and TNFAIP8 are potential risk factors; AIF1, ATF6, CXCL16,
        HMBS, DNASE1L2, and USP25 are protective. Inverse MR confirmed ATF6's negative correlation with
        RA risk.
