claims:
  c000:
    quotes:
    - exact: 'For example, genetically higher C2 levels increased RA risk (odds ratio per 1-standard deviation
        = 1.38; 95% confidence interval: 1.21-1.58), whereas higher USP25 decreased risk (odds ratio per
        1-standard deviation = 0.61; 95% confidence interval: 0.48-0.79).'
