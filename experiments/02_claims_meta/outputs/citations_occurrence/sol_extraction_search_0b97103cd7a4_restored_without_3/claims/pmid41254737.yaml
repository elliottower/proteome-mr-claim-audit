claims:
  c000:
    quotes:
    - exact: Among 2,711 plasma proteins analyzed, 28 showed strong genetic associations with atherosclerosis.
        Of these, five proteins (ADK, ANGPTL4, CD4, MGAT1, SYT11) met strict validation criteria through
        colocalization (posterior probability of colocalization, PP.H4 > 0.8) and SMR.
