claims:
  c000:
    quotes:
    - exact: We integrated multi-omics data-including GWAS, eQTL, and pQTL-with Mendelian randomization
        to identify genes associated with breast cancer risk and therapy response. Our analyses revealed
        CTSF and GSTM3 as key candidates, showing consistent associations at both RNA and protein levels.
