claims:
  c000:
    quotes:
    - exact: We identify proteins as candidates for drug targets and engagement (e.g., plasma furin and
        cardiovascular diseases) by comparing cis-based genetic evidence with protein-disease associations.
  c001:
    quotes:
    - exact: Systematic triangulation of trans-protein QTLs (pQTLs) with genetic and protein associations
        across many diseases highlights potential drug repurposing opportunities, e.g., tyrosine kinase
        2 (TYK2) inhibitors for rheumatoid arthritis.
