  c006:
    quotes:
    - exact: The clinical analysis showed that severe COVID-19 patients had altered neutrophil, lymphocyte,
        and platelet counts, and elevated levels of muscle enzymes and IgE.
  c007:
    quotes:
    - exact: After age and sex adjustment, lymphocyte count, CK-MB, LDH, and HBDH remained independently
        associated with severe COVID-19 (all adjusted p < 0.05).
