claims:
  c000:
    quotes:
    - exact: 'MR analysis suggested a potential causal effect of severe COVID-19 on PM (IVW OR = 1.65,
        95% CI: 1.36-2.01, p < 0.01) with no reverse causality. Mediation analysis highlighted several
        candidate mediators (KIAA1024, RNASE1, EGFLAM, CAPZA1, NRG3, IL31).'
