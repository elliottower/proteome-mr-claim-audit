  c008:
    quotes:
    - exact: Four immune proteins ( KIR2DL3 , HLA-E , LTA , MICB ) were identified as causal risk factors
        for CeA, acting primarily by downregulating FTMT (all β 1 < 0, P < 0.001). Mediation analysis
        revealed FTMT explained up to 53% of the immune protein effect.
  c009:
    quotes:
    - exact: 'Single-cell MR demonstrated striking cell-type specificity for MICB : higher MICB in NK
        cells and IgJ + B cells was strongly associated with CeA risk (e.g., β = 0.90, P = 4.3 × 10 −6
        ), while higher MICB in dendritic cells was protective (β = − 0.57, P = 2.1 × 10 −30 ).'
