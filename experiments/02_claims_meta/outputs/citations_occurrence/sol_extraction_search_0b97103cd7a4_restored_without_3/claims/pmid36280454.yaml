claims:
  c000:
    quotes:
    - exact: A 1 standard deviation increase in the genetically predicted circulating TIMP4 level was
        associated with a reduced risk of anorexia nervosa (minimum odds ratio [OR] = 0.83; 95% CI, 0.76-0.91)
        and bipolar disorder (minimum OR = 0.88; 95% CI, 0.82-0.94).
  c001:
    quotes:
    - exact: A 1 standard deviation increase in the genetically predicted circulating TIMP4 level was
        associated with a reduced risk of anorexia nervosa (minimum odds ratio [OR] = 0.83; 95% CI, 0.76-0.91)
        and bipolar disorder (minimum OR = 0.88; 95% CI, 0.82-0.94).
  c002:
    quotes:
    - exact: A 1 standard deviation increase in the genetically predicted circulating ESAM level was associated
        with an increased risk of schizophrenia (maximum OR = 1.32; 95% CI, 1.22-1.43).
  c003:
    quotes:
    - exact: For instance, a 1 standard deviation increase in the ERLEC1-201-to-ERLEC1-202 splice variant
        ratio was associated with a reduced risk of schizophrenia (OR = 0.94; 95% CI, 0.90-0.97).
