claims:
  c000:
    quotes:
    - exact: 'Using single-nucleotide polymorphisms as instruments, the study suggested increased levels
        of MAPKAPK3 (OR: 1.09; 95% CI: 1.05-1.13; P = 1.43 × 10-6) and MRPL33 (OR: 1.07; 95% CI: 1.04-1.11;
        P = 5.37 × 10-6) were causally associated with a higher risk of ASD, and increased MANBA level
        was associated with a lower risk of ADHD (OR: 0.91; 95% CI: 0.88-0.95; P = 8.97 × 10-6).'
