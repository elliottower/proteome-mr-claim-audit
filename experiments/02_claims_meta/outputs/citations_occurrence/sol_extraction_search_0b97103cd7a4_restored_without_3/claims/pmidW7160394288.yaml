claims:
  c000:
    quotes:
    - exact: Of 11 proteins passing steps 1-2, only Paralemmin-1 (PALM) satisfied both MR (inverse-variance
        weighted OR 1.47, 95% CI 1.18-1.80) and mediation criteria. PALM accounted for 16% of the total
        effect of APOE ε4 on ICH risk (P = 0.007).
