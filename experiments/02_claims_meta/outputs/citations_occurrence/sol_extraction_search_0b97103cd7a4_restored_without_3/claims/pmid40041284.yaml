  c006:
    quotes:
    - exact: Using multivariate and mediated MR analysis, it was found that the protective effect of obesity-related
        indicators against osteoporosis may be mediated by histone-lysine N-methyltransferase in plasma
        proteins and alanine in blood metabolites.
  c007:
    quotes:
    - exact: Obesity may confer a protective effect against osteoporosis, potentially mediated by EHMT2
        in plasma proteins and alanine in blood metabolites.
