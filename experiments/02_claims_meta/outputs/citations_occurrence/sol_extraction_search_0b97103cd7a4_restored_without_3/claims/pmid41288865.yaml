claims:
  c000:
    quotes:
    - exact: Specifically, CALCB is associated with an increased risk of migraine, whereas TBC1D17 is
        associated with a reduced risk.
  c001:
    quotes:
    - exact: 'These included 6 double-positive proteins (CALCB, COLEC11, SEMA6C, SERPING1, TBC1D17, UBE2L6)
        and 2 single-positive proteins (HYOU1, SERPINA1), all meeting criteria in the HEIDI test (PHEIDI
        > 0.05) and colocalization analysis (PP.H4 > 0.7). External validation using an alternate migraine
        GWAS dataset (non-cancer illness code, self-reported: migraine ukb-b-16868) confirmed the findings
        for 5 proteins.'
