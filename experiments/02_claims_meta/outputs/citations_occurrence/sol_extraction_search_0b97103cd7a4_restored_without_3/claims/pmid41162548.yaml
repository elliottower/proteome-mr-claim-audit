claims:
  c000:
    quotes:
    - exact: Through SMR analysis (P-SMR-multi < 0.05, P-SMR < 0.05, P-HEIDI > 0.01), we identified 301
        mQTLs, 27 eQTLs, and 11 pQTLs associated with the risk of GD in our discovery cohort. The validation
        cohort and colocalization analysis (PP.H4 > 0.5) confirmed 79 mQTLs, 5 eQTLs, and 1 pQTL (MMP9).
  c001:
    quotes:
    - exact: IRGs, particularly FGFRL1, play a causal role in the pathogenesis of GD, providing insights
        into the molecular mechanisms of GD and potential therapeutic targets for future research.
