  c012:
    quotes:
    - exact: Two-sample bi-directional MR analyses using cis-pQTLs identified in CKB GWAS found eight
        proteins (ITIH3, LRP11, SCAMP3, NUDT5, OGN, EFEMP1, TXNDC15, PRDX6) significantly affect levels
        of BMI, with NUDT5 also showing bi-directional association.
