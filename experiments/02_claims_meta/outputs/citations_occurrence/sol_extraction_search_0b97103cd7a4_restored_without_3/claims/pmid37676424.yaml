claims:
  c000:
    quotes:
    - exact: 'Measured and genetically-instrumented BMI was significantly associated at FDR < 0.05 with
        levels of 1096 (positive/inverse: 826/270) and 307 (positive/inverse: 270/37) proteins, respectively,
        with FABP4, LEP, IL1RN, LSP1, GOLM2, TNFRSF6B, and ADAMTS15 showing the strongest positive and
        PON3, NCAN, LEPR, IGFBP2 and MOG showing the strongest inverse genetic associations.'
