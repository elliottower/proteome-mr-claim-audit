claims:
  c000:
    quotes:
    - exact: 'After False Discovery Rate correction, we identified that biotinidase (BTD) (odds ratio
        [OR = 0.6489, 95% confidence interval [CI]: 0.5520-0.7628, P = 1.59 × 10-7) and Fc alpha receptor
        (OR = 0.6798, 95% CI: 0.5620-0.8223, P = 7.03 × 10-5) reduced the risk of IA, while versican (VCAN)
        (OR = 1.4190, 95% CI: 1.1976-1.6815, P = 5.29 × 10-5) increased the risk of IA according to the
        inverse variance weighting method.'
