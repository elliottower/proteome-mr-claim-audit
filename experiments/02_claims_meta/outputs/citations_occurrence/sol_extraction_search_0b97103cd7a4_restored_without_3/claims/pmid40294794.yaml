  c003:
    quotes:
    - exact: 'During the replication phase, BTD (OR = 0.9141, 95% CI: 0.8383-0.9967, P = 0.04) was found
        to potentially decrease IA risk; however, the association among VCAN (OR = 0.9602, 95% CI: 0.9136-1.0092,
        P = 0.11), Fc alpha receptor (OR = 1.0031, 95% CI: 0.9576-1.0507, P = 0.90), and the risk of IA
        was not verified.'
