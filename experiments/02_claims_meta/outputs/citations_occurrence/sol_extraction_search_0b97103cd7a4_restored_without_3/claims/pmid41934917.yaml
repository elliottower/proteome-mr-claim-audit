claims:
  c000:
    quotes:
    - exact: We identified 20 subtype-specific protein-immune-EOC regulatory axes, with FCGR2B emerging
        as a causal plasma protein in immune regulation and high-grade serous ovarian cancer (HGSOC) progression.
  c001:
    quotes:
    - exact: We identified 20 subtype-specific protein-immune-EOC regulatory axes, with FCGR2B emerging
        as a causal plasma protein in immune regulation and high-grade serous ovarian cancer (HGSOC) progression.
  c002:
    quotes:
    - exact: FCGR2B was highly expressed in tumor-associated macrophages and was associated with an M2-like
        polarization phenotype.
  c003:
    quotes:
    - exact: Functional characterization revealed that FCGR2B was associated with shorter progression-free
        survival and an immunosuppressive tumor microenvironment.
  c004:
    quotes:
    - exact: Functional characterization revealed that FCGR2B was associated with shorter progression-free
        survival and an immunosuppressive tumor microenvironment.
  c005:
    quotes:
    - exact: Transcriptomic analyses revealed altered NF-κB signaling upon FCGR2B knockdown, and drug-response
        data suggested a potential association between high FCGR2B expression and sensitivity to NF-κB
        inhibitors.
