claims:
  c000:
    quotes:
    - exact: Furthermore, increased expression of Fc gamma receptor 3A (also known as CD16a, an activating
        receptors of NK cells) in plasma and the hippocampus correlated with enhanced CD8+ T-cell infiltration
        and accelerated Alzheimer’s disease progression in 5×FAD mice.
  c001:
    quotes:
    - exact: Furthermore, increased expression of Fc gamma receptor 3A (also known as CD16a, an activating
        receptors of NK cells) in plasma and the hippocampus correlated with enhanced CD8+ T-cell infiltration
        and accelerated Alzheimer’s disease progression in 5×FAD mice.
  c002:
    quotes:
    - exact: Mediation analysis revealed that Fc gamma receptor 3A mediates the effects of CD8+ T cells
        on Alzheimer’s disease risk.
  c003:
    quotes:
    - exact: Additionally, Fc gamma receptor 3A gene expression levels were significantly higher in patients
        with Alzheimer’s disease compared with individuals with mild cognitive impairment and cognitively
        normal participants, as revealed by an analysis of the Alzheimer’s Disease Neuroimaging Initiative
        database.
