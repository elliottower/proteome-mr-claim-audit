    - exact: 'By integrating summary-based Mendelian randomization (SMR) results with bioinformatics findings,
        CASP7 showed a consistent protective-direction association with cataract risk (mQTL: OR [95% CI]
        = 0.959 [0.941-0.977], FDR-adjusted P = .039; eQTL: OR [95% CI] = 0.897 [0.860-0.937], FDR-adjusted
        P = .0046; pQTL: OR [95% CI] = 0.597 [0.483-0.738], FDR-adjusted P = .00083).'
