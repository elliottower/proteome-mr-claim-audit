claims:
  c000:
    quotes:
    - exact: A total of 15 relevant positive genes were identified by SMR, and the gene cadherin EGF LAG
        seven-pass G-type receptor 2( CELSR2 ) was verified as a key gene. Subsequent RT-qPCR and immunofluorescence
        of human carotid atherosclerotic plaques confirmed that CELSR2 showed different expression in
        the pathological state of AS.
  c001:
    quotes:
    - exact: Subsequent RT-qPCR and immunofluorescence of human carotid atherosclerotic plaques confirmed
        that CELSR2 showed different expression in the pathological state of AS.
  c002:
    quotes:
    - exact: RT-qPCR combined with single-cell sequencing analysis led us to conclude that CELSR2 is a
        key target in the pathogenesis of AS.
