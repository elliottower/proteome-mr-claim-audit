claims:
  c000:
    quotes:
    - exact: GSTO1-1 and SKAP1 were positively associated and MMP10 was negatively associated with both
        overall and endometrioid endometrial cancer; DTYMK and ABO were positively associated and TSSC4
        was negatively associated with overall endometrial cancer; IGF2R was positively associated with
        endometrioid cancer; MAPK9 was positively associated and DNAJB14, IFI16, LCN2, and SCT were negatively
        associated with non-endometrioid endometrial cancer.
