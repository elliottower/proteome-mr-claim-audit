claims:
  c000:
    quotes:
    - exact: Our MR analysis identified 16 potential druggable genes significantly associated with IS,
        three of which were significant in the two QTL datasets. Colocalization analysis revealed six
        druggable genes (two in the blood eQTL [CALCRL, KCNJ11], two in the brain eQTL [NEK3, THSD1],
        one in the blood pQTL [MMP12], and one in the brain pQTL [HSD17B12]) had a PP.H4 greater than
        0.75.
