        MASP1 was correlated with decreased IPF risk (ORmeta = 0.46, 95% CImeta: 0.22‒0.99, Pmeta = 0.0478,
        PPH4 = 0.92).'
  c002:
    quotes:
    - exact: With suggestive colocalization support (PPH4 = 0.50), the levels of S100A11 were inversely
        related to IPF risk, with odds ratios of 0.53 (95% CIMR1 0.34-0.83, PMR1 = 0.0053).
  c003:
    quotes:
    - exact: Conversely, the gene-predicted WFIKKN2 was associated with an increased risk of IPF (ORmeta
        = 1.31, 95% CImeta 1.15-1.48, Pmeta = 2.48E-05, PPH4 = 0.50).
  c004:
