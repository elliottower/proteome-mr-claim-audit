  c000:
    quotes:
    - exact: 'With strong evidence of colocalization and consistent support from SMR analysis, the gene-predicted
        MASP1 was correlated with decreased IPF risk (ORmeta = 0.46, 95% CImeta: 0.22‒0.99, Pmeta = 0.0478,
        PPH4 = 0.92).'
