claims:
  c000:
    quotes:
    - exact: The research findings indicate a causal relationship between obesity and allergic asthma.
        Plasma proteins such as TPST1, ROR1, and DAPK1 mediate this relationship, with TPST1 accounting
        for over 10% of the mediation effect.
