  c003:
    quotes:
    - exact: 'The drug-targeted MR analysis suggests that SIGLEC12, BOLA1, HOMER2, and TPST1 all have
        the potential to be drug target genes.

        CONCLUSION: This study suggests that obese patients defined by BMI may promote the development
        of allergic asthma by influencing the expression of plasma proteins such as TPST1, ROR1, and DAPK1.'
