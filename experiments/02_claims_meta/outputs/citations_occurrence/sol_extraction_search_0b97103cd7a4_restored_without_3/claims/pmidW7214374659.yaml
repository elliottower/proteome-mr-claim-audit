claims:
  c000:
    quotes:
    - exact: Derived result tables, analysis scripts and figures supporting a cis-pQTL Mendelian randomization
        study of actinic keratosis, cutaneous squamous cell carcinoma and basal cell carcinoma (FinnGen
        R13, replicated in UK Biobank C44). Colocalization identifies the ASIP/NXPH4 pigmentation locus
        as the only protein-layer signal shared with disease within the primary window, while replicated
        immune-protein and cell-type eQTL signals fail colocalization.
