        levels were associated with a higher risk of AN (IVW Odd''s ratio [OR]: 1.12; 95% confidence interval
        [CI]: 1.08-1.16; P = 2.35 × 10-10), while another protein ADH1B showed the opposite effect (IVW
        OR: 0.89; 95% CI: 0.85-0.93; P = 2.99 × 10-7). The causal associations were robust in multivariable
        models, genome-wide significant models, and with additional MR methods.'
