  c002:
    quotes:
    - exact: MR based on cis-pQTL located in proximity to the encoding gene for proteins that were prognostic
        and distinguished PAH from health estimated an adverse effect for higher levels of netrin-4 (odds
        ratio [OR], 1.55; 95% confidence interval [CI], 1.16-2.08) and a protective effect for higher
        levels of thrombospondin-2 (OR, 0.83; 95% CI, 0.74-0.94) on PAH. Both proteins tracked the development
        of PAH in previously healthy relatives and changes in thrombospondin-2 associated with pulmonary
        arterial pressure at disease onset.
