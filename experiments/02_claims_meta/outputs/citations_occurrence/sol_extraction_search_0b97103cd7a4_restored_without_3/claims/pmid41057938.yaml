claims:
  c000:
    quotes:
    - exact: Five potential drug repurposing opportunities and three drugs that may increase osteomyelitis
        risk were identified. Sensitivity analyses highlighted LTA4H, LAMC1, QDPR, and NEK6 as having
        the strongest genetic evidence based on MR-Egger regression and protein QTL tests.
