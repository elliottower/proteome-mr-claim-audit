claims:
  c000:
    quotes:
    - exact: 'The MR analysis initially identified 3 key proteins - CTSH, IL6R, and OLFM1 - with higher
        genetically predicted CTSH levels associated with increased sepsis risk, supported by external
        validation (Primary: odds ratio = 1.10, 95% confidence interval = 1.03-1.17, P = .004; SameVariant:
        odds ratio = 1.07, 95% confidence interval = 1.02-1.13, P = .004).'
