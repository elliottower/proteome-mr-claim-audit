  c000:
    quotes:
    - exact: Protein Quantitative Trait Locus and Mendelian Randomization analyses further identified
        elevated plasma levels of coagulation factor XI and GOLM2 as risk factors for recurrence, while
        decreased levels of PCSK9 and pro-IL16 were linked to reduced VT recurrence risk.
