claims:
  c000:
    quotes:
    - exact: Specifically, leukocyte immunoglobulin-like receptor subfamily B member 2 (LILRB2), asporin
        (ASPN), and contactin-2 (CNTN2) had potential causal effects on appendicular lean mass, and ecto-ADP-ribosyltransferase
        4 (ART4) and superoxide dismutase 2 (SOD2) had putative causal effects on the handgrip strength,
        respectively.
