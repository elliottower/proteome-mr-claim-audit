claims:
  c000:
    quotes:
    - exact: Higher levels of PF4V1 (OR = 0.47; 95% CI, 0.29-0.78; p = 3.39 × 10-3) and FAM3B (OR = 0.12;
        95% CI, 0.03-0.45; p = 1.65 × 10-3) were associated with a reduced risk of NMOSD, whereas elevated
        SERPINA1 (OR = 2.28; 95% CI, 1.29-4.04; p= 4.71 × 10-3) and CLEC11A (OR = 13.45; 95% CI, 1.29-4.04;
        p = 4.71 × 10-3) were related to an increased risk of NMOSD.
