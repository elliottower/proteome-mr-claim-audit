claims:
  c000:
    quotes:
    - exact: 'Additionally, the genetic variants associated with elevated levels of eukaryotic translation
        initiation factor 4E-binding protein 1 (OR = 1.0590, 95% CI: 1.0050-1.1170) were found to increase
        the risk of coronary atherosclerosis through modulation of octadecanedioate and octadecanedioylcarnitine
        (C18-DC) levels, while leukemia inhibitory factor receptor (OR = 0.9400, 95% CI: 0.8890-0.9930)-associated
        variants reduced its risk through modulation of campesterol levels.'
