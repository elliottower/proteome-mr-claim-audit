claims:
  c000:
    quotes:
    - exact: Three of these 12 proteins and their QTLs were, however, not linked to the ABO locus and
        included the products of the NOTCH signaling genes MFAP2 and DLK1. Among proteins that had multiple
        QTL variants available for the creation of more robust multi-variant genetic instruments, we identified
        33 protein level-EOC risk associations at FDR < 0.1.
  c001:
    quotes:
    - exact: Three of these 12 proteins and their QTLs were, however, not linked to the ABO locus and
        included the products of the NOTCH signaling genes MFAP2 and DLK1. Among proteins that had multiple
        QTL variants available for the creation of more robust multi-variant genetic instruments, we identified
        33 protein level-EOC risk associations at FDR < 0.1.
  c002:
    quotes:
    - exact: 'Nine of the 14 remaining associations were for overall and high grade serous EOC risk and
        included predominantly immune system proteins: ARTS1 (HLA class I), CPNE1 (involved in innate
        immunity), Macrophage mannose receptor (HLA class I), DQA2 (HLA class II), RGAP1 (innate immunity),
        Cathepsin H (innate immunity), and FCG2B (the low affinity receptor for the Fc region of immunoglobulin
        gamma).'
