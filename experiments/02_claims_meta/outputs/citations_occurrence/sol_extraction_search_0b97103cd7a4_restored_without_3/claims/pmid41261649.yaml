claims:
  c000:
    quotes:
    - exact: With the adjusted P-value <.05, 1-SD increase in genetically determined APOE (apolipoprotein
        E) was associated with increased risk of sepsis (OR = 1.07, 95%CI = 1.04-1.11, P = 5.36 × 10-5).
  c001:
    quotes:
    - exact: With the adjusted P-value <.05, 1-SD increase in genetically determined APOE (apolipoprotein
        E) was associated with increased risk of sepsis (OR = 1.07, 95%CI = 1.04-1.11, P = 5.36 × 10-5).
        The findings were consistent in the validation analyses.
  c002:
    quotes:
    - exact: Multi-SNPs SMR analysis (P = 1.42 × 10-3), HEIDI test (P = .53), and colocalization analysis
        (PP4 = 0.95) further supported the causality of APOE. Protein-protein interaction analysis suggested
        that APOE was interacted with multiple drug targets tested in the clinical trials for sepsis.
