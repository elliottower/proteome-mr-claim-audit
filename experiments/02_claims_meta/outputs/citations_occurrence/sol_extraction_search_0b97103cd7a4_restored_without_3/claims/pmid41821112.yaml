claims:
  c000:
    quotes:
    - exact: 'Additionally, DNMT3B, PROM2, and KIF11 were the intersection genes of mQTL and eQTL analysis,
        and were validated by the UKB cohort in eQTL analysis, and NFKB1 was validated by the UKB cohort
        in pQTL analysis.

        CONCLUSION: This multi-omics analysis reveals that pyroptosis-related genes, particularly ADAR,
        DNMT3B, PROM2, KIF11, and NFKB1, may be involved in psoriasis development, providing important
        insights into its molecular mechanisms and potential therapeutic targets.'
