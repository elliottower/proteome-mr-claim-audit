claims:
  c000:
    quotes:
    - exact: Genetic evidence from this study indicated an association between GLP1R agonists and higher
        risk of chronic tubulo-interstitial nephritis.
  c001:
    quotes:
    - exact: MR analyses showed a significant causal link between GLP1RA use and chronic tubulo-interstitial
        nephritis (CTIN; OR = 2.32, 95% CI = 1.39-3.85, P = .001), with no significant association for
        acute tubulo-interstitial nephritis (ATIN; OR = 0.93, 95% CI = 0.83-1.04, P = .216). Colocalization
        analysis strongly supported the MR findings, showing a high posterior probability of shared genetic
        variants between GLP1R expression and CTIN (PP.H4 = 0.99).
  c002:
    quotes:
    - exact: Colocalization analysis strongly supported the MR findings, showing a high posterior probability
        of shared genetic variants between GLP1R expression and CTIN (PP.H4 = 0.99).
  c003:
    quotes:
    - exact: Colocalization analysis strongly supported the MR findings, showing a high posterior probability
        of shared genetic variants between GLP1R expression and CTIN (PP.H4 = 0.99). Mediation analysis
        identified 4 plasma proteins (HYAL1, NMNAT1, IL12RB2, and DPP6) as partial mediators of the effect.
