  c000:
    quotes:
    - exact: Our analysis revealed a significant protective effect of BTN3A2 expression against PSC risk
        (IVW OR 0.838, 95% CI 0.792-0.887, P = 1.12E-09).
  c001:
    quotes:
    - exact: Mediation analysis indicated that methylation at cg23465465 had a largely mediated effect
        on PSC risk through BTN3A2 regulation (89.3% mediated effect).
  c002:
    quotes:
    - exact: Mediation analysis indicated that methylation at cg23465465 had a largely mediated effect
        on PSC risk through BTN3A2 regulation (89.3% mediated effect). Additionally, BTN3A2 exerted partial
        protection via CD14+CD16+ monocytes (4.7% mediation).
