claims:
  c000:
    quotes:
    - exact: 'Mendelian randomization associations were found for six proteins, of which four are druggable
        targets: FCG2B, IGFBP3, CAH6, and ASGR1. For the primary outcome, the C-statistic (95% confidence
        interval [CI]) for the 48-protein model in CRIC was 0.790 (0.735, 0.844) vs. 0.703 (0.644, 0.762)
        for the PCP-HF model (P = .001).'
