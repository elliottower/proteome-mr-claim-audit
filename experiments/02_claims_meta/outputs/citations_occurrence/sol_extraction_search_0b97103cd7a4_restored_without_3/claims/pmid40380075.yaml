claims:
  c000:
    quotes:
    - exact: Our findings revealed that 21 plasma proteins, including CTF1 and STX4, may demonstrate causal
        relationships with PD.
  c001:
    quotes:
    - exact: Our findings revealed that 21 plasma proteins, including CTF1 and STX4, may demonstrate causal
        relationships with PD.
  c002:
    quotes:
    - exact: Furthermore, our study demonstrates that plasma proteins, including CTF1, STX4, HPGDS, and
        APOA1, exhibit therapeutic potential for drug development based on gene-drug interaction predictions.
        While these findings provide a theoretical basis for the exploration of diagnostic markers and
        potential therapeutic targets for PD, extensive experimental validation is essential to confirm
        their potential in the future.
