    - exact: Among these, the cg10760299 locus of GATM was negatively associated with the risk of cardiac
        arrest (OR = 0.875, 95% CI 0.832–0.921, p < 0.001), whilst gene expression (OR = 1.396, 95% CI
        1.194–1.633, p = 0.005) and protein abundance (OR = 1.513, 95% CI 1.228–1.863, p = 0.015) were
        positively associated with the risk of cardiac arrest.
