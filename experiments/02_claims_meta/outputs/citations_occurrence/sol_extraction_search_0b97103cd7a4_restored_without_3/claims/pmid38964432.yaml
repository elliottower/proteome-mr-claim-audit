  c000:
    quotes:
    - exact: Our findings indicated that genetically predicted higher levels of TNXB and CD59 were associated
        with a lower risk of MS, whereas higher levels of PLEK, CASP3, CR1, TAPBPL, and ATXN3 were associated
        with an increased risk of MS.
