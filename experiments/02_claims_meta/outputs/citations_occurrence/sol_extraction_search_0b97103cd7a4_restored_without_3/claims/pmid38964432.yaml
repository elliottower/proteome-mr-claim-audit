    - exact: Our findings indicated that genetically predicted higher levels of TNXB and CD59 were associated
        with a lower risk of MS, whereas higher levels of PLEK, CASP3, CR1, TAPBPL, and ATXN3 were associated
        with an increased risk of MS. Three plasma proteins (PLEK, CR1, CD59) were validated by colocalization
        analysis.
  c008:
    quotes:
    - exact: Three plasma proteins (PLEK, CR1, CD59) were validated by colocalization analysis. Among
        these, CR1 was prioritized as a target for Eculizumab due to its significant association with
        MS risk.
