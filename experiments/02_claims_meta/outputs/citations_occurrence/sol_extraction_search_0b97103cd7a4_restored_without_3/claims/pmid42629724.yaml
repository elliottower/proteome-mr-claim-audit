claims:
  c000:
    quotes:
    - exact: 'PM significantly increased IPF risk (odds ratio [OR]: 1.06, 95% confidence interval [CI]:
        1.02-1.09, P < .01), with no significant reverse causal evidence. Five circulating proteins (AMH,
        CHCHD10, CRABP2, HERC5, HSPA5) and 5 metabolites mediated this association, enriched in endoplasmic
        reticulum stress and transforming growth factor (TGF-β) signaling.'
