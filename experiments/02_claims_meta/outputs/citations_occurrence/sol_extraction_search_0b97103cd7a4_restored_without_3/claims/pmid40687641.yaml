claims:
  c000:
    quotes:
    - exact: This integrative analysis identified 25 plasma proteins exhibiting significant associations
        with BPH risk (adjusted P<0.05), including two proteins (AIF1 and RSPO3) independently validated
        in the conventional BPH GWAS dataset.
