  c004:
    quotes:
    - exact: MR analyses established causal relationships for 18 proteins (adjusted P<0.05), with Bayesian
        colocalization confirming shared causal variants between BPH and key proteins AIF1 [posterior
        probability 4 (PP4) =0.999], RSPO3 (PP4 =0.714), and COL2A1 (PP4 =0.920).
