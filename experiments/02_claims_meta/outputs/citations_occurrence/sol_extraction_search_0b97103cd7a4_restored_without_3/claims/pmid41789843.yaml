claims:
  c000:
    quotes:
    - exact: After comprehensive adjustment, 136 proteins were significantly associated with glaucoma
        risk (false discovery rate < 0.05), with EDA2R showing the strongest association (hazard ratio
        [HR] = 1.21, 95% confidence interval [CI] = 1.16-1.25, P = 2.99 × 10-17).
  c001:
    quotes:
    - exact: 'After comprehensive adjustment, 136 proteins were significantly associated with glaucoma
        risk (false discovery rate < 0.05), with EDA2R showing the strongest association (hazard ratio
        [HR] = 1.21, 95% confidence interval [CI] = 1.16-1.25, P = 2.99 × 10-17). MR analysis identified
        four causal proteins: LTBP2 (odds ratio [OR] = 1.52, 95% CI = 1.36-1.71, P = 1.07 × 10-12), NRP2
        (OR = 0.85, 95% CI = 0.78-0.92, P = 4.73 × 10-5), TNFSF13, and HAVCR1-implicating extracellular
        matrix remodeling and immune dysregulation in disease pathogenesis.'
