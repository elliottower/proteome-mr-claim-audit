  c018:
    quotes:
    - exact: Colocalization analyses supported shared genetic signals for 10 proteins (ABO, CTRB1, AMY2B,
        GRP, PSCA, PACS2, ZFYVE19, MST1, KRT18, and SDCCAG8) with posterior probability (PPH4) >0.70 in
        either UKB or deCODE. In prospective analyses, higher plasma levels of ABO (hazard ratio [HR]=1.21;
        95% confidence interval [CI]=1.05–1.39) and ITIH3 (HR=1.19; 95% CI=1.03–1.37) were associated
        with incident PDAC risk in the meta-analysis of UKB and ARIC.
