claims:
  c000:
    quotes:
    - exact: Second, potential drug targets of KOA in plasma were explored, SPOCK2 as the causal protein
        for plasma with KOA, and increased SPOCK2 (OR 0.84; 95% CI 0.77 – 0.92; P = 5.52 × 10 − 5), decreased
        the risk of KOA.
  c001:
    quotes:
    - exact: Second, potential drug targets of KOA in plasma were explored, SPOCK2 as the causal protein
        for plasma with KOA, and increased SPOCK2 (OR 0.84; 95% CI 0.77 – 0.92; P = 5.52 × 10 − 5), decreased
        the risk of KOA. Integrated transcriptomic analysis (P = 0.0285) and in vivo (P = 0.0395) showed
        consistent results.
