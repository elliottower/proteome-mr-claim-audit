    - exact: 'Seventeen proteins were independently associated with AMI after Bonferroni correction (P
        < 3.43 × 10-5), with the strongest associations observed for NEFL (HR: 1.70, 95% CI: 1.43-2.01),
        EDA2R (HR: 2.25, 95% CI: 1.69-2.97), and CHRDL1 (HR: 2.69, 95% CI: 1.83-3.94).'
