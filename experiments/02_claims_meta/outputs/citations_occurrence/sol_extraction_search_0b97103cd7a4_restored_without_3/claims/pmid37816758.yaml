claims:
  c000:
    quotes:
    - exact: 'A 65-protein risk model for the primary outcome has excellent discrimination (C-statistic[95%CI]
        0.862 [0.835, 0.889]), and 14/65 proteins are druggable targets. Potentially causal associations
        for five proteins, to our knowledge not previously reported, are supported by Mendelian randomization:
        EGFL9, LRP-11, MXRA7, IL-1 sRII and ILT-2.'
