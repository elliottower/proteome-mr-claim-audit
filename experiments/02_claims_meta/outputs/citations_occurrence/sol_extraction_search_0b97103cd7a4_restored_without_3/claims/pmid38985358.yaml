claims:
  c000:
    quotes:
    - exact: A significant causal association between A Disintegrin and metalloproteinase domain-containing
        protein 23 (ADAM23) and head and neck cancer was noted.
  c001:
    quotes:
    - exact: Multivariate analysis showed that the effect for ADAM23 remained significant after adjusting
        for the indirect effects of obesity, diabetes mellitus and smoking. In sum, this study showed
        a significant causal role of genetically dysregulated ADAM23 protein with head and neck cancer
        risk.
