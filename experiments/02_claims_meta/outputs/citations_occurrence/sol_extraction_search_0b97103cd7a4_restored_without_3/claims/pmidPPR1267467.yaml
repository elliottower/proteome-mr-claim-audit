claims:
  c000:
    quotes:
    - exact: We then prioritized proteins that replicated across cohorts, exhibited concordant effect
        directions, and were likely to be active in circulation, yielding 18 high-confidence causal proteins
        for BMD and fracture risk. These included established skeletal regulators such as sclerostin (SOST)
        and R-spondin-3 (RSPO3), which showed opposing effects consistent with their known biology, along
        with less well-characterized proteins.
