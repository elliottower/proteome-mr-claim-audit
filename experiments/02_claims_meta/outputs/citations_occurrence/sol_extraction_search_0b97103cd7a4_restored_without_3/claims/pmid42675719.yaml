        ratio = 0.895, P = .005, 95% confidence interval: 0.830-0.966); no reverse causal relationships
        were detected for either protein.'
  c002:
    quotes:
    - exact: Mediation effect analysis revealed 20 plasma metabolites with significant mediating associations
        with KOA; notably, insulin-like growth factor-binding protein 3 could downregulate the levels
        of N-acetylmethionine and 2-O-methylascorbic acid, thereby promoting the progression of KOA.
