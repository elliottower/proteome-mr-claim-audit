claims:
  c000:
    quotes:
    - exact: 'Inverse variance weighting analysis identified 2 plasma proteins with significant causal
        associations with KOA: insulin-like growth factor-binding protein 3 was positively correlated
        with KOA susceptibility (β = 0.065, odds ratio = 1.067, P = .004, 95% confidence interval: 1.021-1.115),
        whereas collagen type XVIII alpha 1 chain was negatively correlated with KOA (β = -0.111, odds
        ratio = 0.895, P = .005, 95% confidence interval: 0.830-0.966); no reverse causal relationships
        were detected for either protein.'
