claims:
  c000:
    quotes:
    - exact: Of 142 proteins with mediating effects, scavenger receptor class A member 5 (SCARA5), membrane
        cofactor protein (CD46), and alpha-1-antichymotrypsin (SERPINA3) may contribute to the early-stage
        adverse cardiovascular effect of obesity, whereas apolipoprotein C-III (APOC3), mitochondrial
        aldehyde dehydrogenase 2 (ALDH2), and chordin-like protein 2 (CHRDL2) may further promote the
        development of obesity-driven HF.
