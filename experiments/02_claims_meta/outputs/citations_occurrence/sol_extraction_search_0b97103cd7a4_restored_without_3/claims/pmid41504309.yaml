    quotes:
    - exact: 'Notably, BST1 emerged as a shared causal protein, increasing PD risk in both Europeans (odds
        ratio [OR] = 1.04, 95% confidence interval [CI]: 1.02-1.06) and East Asians (OR = 1.18, 95% CI:
