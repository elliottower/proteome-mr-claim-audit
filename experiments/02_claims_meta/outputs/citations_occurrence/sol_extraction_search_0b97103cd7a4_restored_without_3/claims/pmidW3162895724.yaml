claims:
  c000:
    quotes:
    - exact: 'Mendelian randomization identified 13 putatively causal proteins for seven cardiovascular
        traits: FGF-5, IL-6RA, LPL , and TFPI for CAD; CAPG, IGG_FCrrec, LPL, and TFPI for HDL; KIM1,
        LPL, and TNFB for TG, ENTPD6 for BMI; FGF-5, TFPI, UMOD, IGFBP3, PXN, and NUCB2 for blood pressure
        traits.'
