claims:
  c000:
    quotes:
    - exact: Specific plasma proteins mediated the impact of blood pressure on cardiac remodeling, with
        FGF5 (fibroblast growth factor 5) contributing 2.96% (P=0.024) and 4.15% (P=0.046) to the total
        effect of SBP and DBP on myocardial wall thickness at end diastole in the apical anterior segment
        and leptin explaining 15.21% (P=0.042) and 23.24% (P=0.022) of the total effect of SBP and DBP
        on radial strain in the mid-anteroseptal segment.
