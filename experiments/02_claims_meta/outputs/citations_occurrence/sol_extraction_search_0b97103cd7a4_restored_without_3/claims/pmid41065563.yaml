claims:
  c000:
    quotes:
    - exact: Proteome-wide MR identified 242 proteins associated with BP, of which 48 were also linked
        to CAD or stroke, with four (ACOX1, FGF5, FURIN, MST1) also supported by genetic colocalization
        analyses (FDR 5% and PP ≥70%).
