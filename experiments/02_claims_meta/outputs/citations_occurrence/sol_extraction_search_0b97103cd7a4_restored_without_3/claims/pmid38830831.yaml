claims:
  c000:
    quotes:
    - exact: We first enrolled 3622 plasma proteins with conditionally independent genetic variants; three
        proteins (histo-blood group ABO system transferase, activating signal cointegration 1 complex
        subunit 1, and calcium/calmodulin-dependent protein kinase I [CAMK1]) were significantly associated
        with the risk of pulmonary heart disease in the UK Biobank cohort.
