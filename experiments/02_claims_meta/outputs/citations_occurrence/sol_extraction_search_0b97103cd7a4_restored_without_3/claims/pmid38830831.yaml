  c003:
    quotes:
    - exact: 'We first enrolled 3622 plasma proteins with conditionally independent genetic variants;
        three proteins (histo-blood group ABO system transferase, activating signal cointegration 1 complex
        subunit 1, and calcium/calmodulin-dependent protein kinase I [CAMK1]) were significantly associated
        with the risk of pulmonary heart disease in the UK Biobank cohort. Only CAMK1 was successfully
        replicated (odds ratio: 1.1056, 95% confidence interval: 1.019-1.095, p = 0.0029) in the FinnGen
        population.'
  c004:
    quotes:
    - exact: In addition, the level of CAMK1 in 40 patients with PHD was significantly higher (p = 0.023)
        than that in the control group.
