claims:
  c000:
    quotes:
    - exact: This study identified ECM1 as a risk factor for the pathogenesis of KOA and showed promising
        therapeutic targets for KOA treatment.
  c001:
    quotes:
    - exact: Further support from colocalization analysis suggested that ECM1 might serve as a potential
        drug target for KOA.
  c002:
    quotes:
    - exact: Validation of clinical samples indicated that ECM1 levels were higher in the KOA group than
        in the control group and that ECM1 demonstrated significant diagnostic efficacy for KOA (area
        under the curve = 0.85).
  c003:
