claims:
  c000:
    quotes:
    - exact: Proteome-wide MR analysis showed that FGF5 (fibroblast growth factor 5) had a causal effect
        on IA and SAH risk (Pfdr < 0.05).
  c001:
    quotes:
    - exact: Proteome-wide MR analysis showed that FGF5 (fibroblast growth factor 5) had a causal effect
        on IA and SAH risk (Pfdr < 0.05).
  c002:
    quotes:
    - exact: Moreover, genetic variants affecting FGF5 expression levels showed strong evidence of colocalization
        with IA risk (PPH4 = 0.993) and SAH risk (PPH = 0.988), suggesting that this protein represents
        a potential direct target for IA intervention.
