claims:
  c000:
    quotes:
    - exact: In TOPMed (SomaScan), we identified 9 causal pairs (FDR<0.05) among 35 (24 examined) significant
        CHIP-protein pairs, with TET2 causally increasing MPO levels being the strongest (beta [SE]:0.022[0.008];
        P=3.6x10 -3 ).
  c001:
    quotes:
    - exact: In UK Biobank (Olink), among 473 (318 examined) significant CHIP-protein pairs, 121 were
        causal, with TET2 showing the strongest effects on increased LCN2 (beta[SE]:0.056[0.008]; P=4.3x10
        -11 ) and decreased FLT3LG (beta[SE]:-0.089[0.015]; P=1.1x10 -9 ).
  c002:
    quotes:
    - exact: In UK Biobank (Olink), among 473 (318 examined) significant CHIP-protein pairs, 121 were
        causal, with TET2 showing the strongest effects on increased LCN2 (beta[SE]:0.056[0.008]; P=4.3x10
        -11 ) and decreased FLT3LG (beta[SE]:-0.089[0.015]; P=1.1x10 -9 ).
  c003:
    quotes:
    - exact: The causal effect of TET2 on LCN2 was consistent across platforms.
  c004:
    quotes:
    - exact: 'Murine experiments corroborated these findings: hematopoietic Tet2 -/- mice exhibited significantly
        increased plasma MPO and LCN2 levels compared to WT controls.'
  c005:
