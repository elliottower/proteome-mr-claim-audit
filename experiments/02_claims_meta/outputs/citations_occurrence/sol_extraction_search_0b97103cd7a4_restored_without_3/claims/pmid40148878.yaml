claims:
  c000:
    quotes:
    - exact: Genetically predicted levels of seven proteins and twelve genes were associated with an increased
        risk of AKI. Of these, six targets (NCF1, TNFRSF1B, APEH, ACADSB, ADD1, and FAM3B) were prioritized
        based on robust evidence and validated in independent cohorts.
