    - exact: CD55 and NDST1 are promising therapeutic candidates for EAC.
  c002:
    quotes:
    - exact: Most significant esophageal SNP-tissue associations were directionally concordant with the
        corresponding plasma pQTL effects, and the tissue-specific Wald estimates for CD55 and NDST1 were
        consistent with the primary plasma-based findings. Immune infiltration analysis showed significant
        changes in immune cell composition in EAC, particularly natural killer cells, plasma cells, and
        mast cells.
