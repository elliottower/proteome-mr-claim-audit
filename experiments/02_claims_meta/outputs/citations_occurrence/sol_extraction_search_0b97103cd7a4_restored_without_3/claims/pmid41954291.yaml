claims:
  c000:
    quotes:
    - exact: Six disease pairs (AA-AR, AA-AD, AR-AA, AR-AD, AD-AA, and AD-AR) showed robust causal relationships
        independent of type 2 inflammation markers. Mediation analyses identified key inflammatory mediators,
        including immune cell subsets (e.g., CD45 on granulocytes), plasma metabolites (e.g., pentose
        acid), gut microbiota (e.g., Bacteroides intestinalis), and notably, serum proteins such as ABHD12
        and SEZ6L2.
