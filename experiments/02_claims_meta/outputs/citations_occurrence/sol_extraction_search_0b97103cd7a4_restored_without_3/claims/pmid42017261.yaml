claims:
  c000:
    quotes:
    - exact: Mendelian randomization analysis identified 7 proteins (BMPER [BMP-binding endothelial regulator
        protein], GFRA1 [GDNF family receptor alpha-1], CST3 [cystatin-C], CXCL16 [C-X-C motif chemokine
        16], FOLR1 [folate receptor alpha], AMBP [protein AMBP], and STC1 [stanniocalcin-1]) with nominally
        significant associations with hypertensive CKD, all with higher levels increasing risk.
