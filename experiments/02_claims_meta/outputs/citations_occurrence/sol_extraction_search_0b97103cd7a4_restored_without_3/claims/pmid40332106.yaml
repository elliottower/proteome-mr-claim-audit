claims:
  c000:
    quotes:
    - exact: Subsequent MR analysis, using pheno12 as the outcome and plasma protein as the exposure,
        highlighted Fas-Associated protein with Death Domain (FADD) as a significant protein.
  c001:
    quotes:
    - exact: Further exploration within the protein-protein interaction (PPI) network identified FADD,
        Cysteinyl Aspartate Specific Proteinase 8 (CASP8), and Receptor-Interacting Serine/Threonine-Protein
        Kinase 1 (RIPK1) as potential drug targets. Gene Ontology (GO) and Kyoto Encyclopedia of Genes
        and Genomes (KEGG) analyses indicated that these proteins are involved in the extrinsic apoptotic
        pathway, providing new insights for pharmacological strategies in post-ischemic stroke recovery.
