claims:
  c000:
    quotes:
    - exact: 'Inverse variance weighted analysis revealed that electron transport flavoprotein dehydrogenase
        (ETFDH) inhibitors were associated with a reduced risk of IgAN (odds ratio [OR] = 0.948, 95% confidence
        interval [CI]: 0.923-0.973, p < 0.001).'
  c001:
    quotes:
    - exact: 'Synaptosome-associated protein 29 was identified as a plasma risk factor for IgAN (OR =
        1.118, 95% CI: 1.025-1.218, p = 0.012) and negatively correlated with ETFDH inhibitor use (OR
        = 0.775; 95% CI, 0.709-0.848; p < 0.001).'
  c002:
    quotes:
    - exact: 'Synaptosome-associated protein 29 was identified as a plasma risk factor for IgAN (OR =
        1.118, 95% CI: 1.025-1.218, p = 0.012) and negatively correlated with ETFDH inhibitor use (OR
        = 0.775; 95% CI, 0.709-0.848; p < 0.001).'
  c003:
    quotes:
    - exact: 'Synaptosome-associated protein 29 was identified as a plasma risk factor for IgAN (OR =
        1.118, 95% CI: 1.025-1.218, p = 0.012) and negatively correlated with ETFDH inhibitor use (OR
        = 0.775; 95% CI, 0.709-0.848; p < 0.001). This protein appeared to mediate the effects of ETFDH
        inhibitors on the risk of IgAN (total effect: 0.054; mediation ratio: 52.524%).'
