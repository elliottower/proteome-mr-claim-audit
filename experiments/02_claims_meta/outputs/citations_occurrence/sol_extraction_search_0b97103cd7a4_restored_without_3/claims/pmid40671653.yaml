claims:
  c000:
    quotes:
    - exact: Among the smoking-related proteins, genetically proxied levels of 22 were associated with
        AAA risk. Eight mediation pathways were identified, with ADAMTS15 (a disintegrin and metalloproteinase
        with thrombospondin motifs 15), IL1RN (interleukin-1 receptor antagonist protein), MMP12 (matrix
        metalloproteinases 12), PGF (placental growth factor), PCSK9 (proprotein convertase subtilisin/kexin
        type 9), and UXS1 (UDP-glucuronic acid decarboxylase 1) representing key mediators.
