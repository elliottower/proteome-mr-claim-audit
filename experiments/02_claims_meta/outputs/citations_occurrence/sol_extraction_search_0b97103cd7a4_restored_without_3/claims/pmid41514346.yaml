claims:
  c000:
    quotes:
    - exact: In the two-sample MR, each cluster was associated with many proteins (70, 369 and 44 respectively,
        FDR q-value < 0.05), and the mediation analysis identified that three proteins significantly mediate
        cluster-specific effects on breast cancer risk. Among these proteins, MET is known to be involved
        in breast cancer, while little is known about the roles of CPM and CST6.
