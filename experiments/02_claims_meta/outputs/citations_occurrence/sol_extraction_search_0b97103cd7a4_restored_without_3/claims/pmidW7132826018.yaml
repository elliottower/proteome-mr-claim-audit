claims:
  c000:
    quotes:
    - exact: Nephronectin (NPNT) and neuronal growth regulator 1 (NEGR1) were found to be statistically
        significantly associated with a noticeable protective effect against asthma, tumor necrosis factor,
        alpha-induced protein 3 (TNFAIP3) showed a suggestive statistical association with a protective
        effect against asthma in MR analyses.
