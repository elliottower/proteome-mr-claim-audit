  c003:
    quotes:
    - exact: Nephronectin (NPNT) and neuronal growth regulator 1 (NEGR1) were found to be statistically
        significantly associated with a noticeable protective effect against asthma, tumor necrosis factor,
        alpha-induced protein 3 (TNFAIP3) showed a suggestive statistical association with a protective
        effect against asthma in MR analyses. COLOC indicated that NPNT and NEGR1 have greater potential
        as drug targets.
  c004:
    quotes:
    - exact: Nephronectin (NPNT) and neuronal growth regulator 1 (NEGR1) were found to be statistically
        significantly associated with a noticeable protective effect against asthma, tumor necrosis factor,
        alpha-induced protein 3 (TNFAIP3) showed a suggestive statistical association with a protective
        effect against asthma in MR analyses. COLOC indicated that NPNT and NEGR1 have greater potential
        as drug targets.
  c005:
    quotes:
    - exact: Compared with normal tissues, NPNT exhibited a higher expression level in Type II pneumocytes;
        NEGR1 was upregulated in smooth muscle cells, regulatory T cells, plasmacytoid dendritic cells,
        helper T cells; TNFAIP3 expression was decreased in Cluster of differentiation 4 (CD4)-positive
        alpha-beta T cells, lung ciliated cell 1, smooth muscle cells, whereas it was elevated in CD8-positive
        alpha-beta T cell 1, helper T cells, and myelocytes in asthma lung tissues.
