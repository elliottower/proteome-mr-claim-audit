  c003:
    quotes:
    - exact: 'Additionally, the protein CFHR5 (OR: 0.82, 95 % CI: 0.70 to 0.96, pFDR = 0.157) was linked
        to a decreased incidence of left bundle branch block with suggestive significance.'
  c004:
    quotes:
    - exact: PheWAS and MVMR analyses suggested that hyperkalemia may serve as a potential mediating pathway
        between CASP9 and atrioventricular block.
