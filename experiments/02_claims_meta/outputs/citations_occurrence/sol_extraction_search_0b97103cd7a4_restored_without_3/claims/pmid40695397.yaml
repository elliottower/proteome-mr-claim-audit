claims:
  c000:
    quotes:
    - exact: 'Genetically predicted CASP9 (OR: 2.65, 95 % CI: 1.65 to 4.26, pFDR = 0.007) and ASPH (OR:
        2.03, 95 % CI: 1.32 to 3.11, pFDR = 0.024) were significantly associated with a higher risk of
        atrioventricular block, while genetically predicted SRA1 (OR: 0.54, 95 % CI: 0.39 to 0.75, pFDR
        = 0.009) was markedly associated with a lower risk of atrioventricular block.'
