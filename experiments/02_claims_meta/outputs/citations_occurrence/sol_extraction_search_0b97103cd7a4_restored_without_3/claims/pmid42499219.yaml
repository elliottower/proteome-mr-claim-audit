claims:
  c000:
    quotes:
    - exact: 'We performed two-sample Mendelian randomization (MR) using cis-pQTL instruments for 2923
        plasma proteins from the UK Biobank Pharma Proteomics Project against HS summary statistics from
        FinnGen R12. Following multiple-testing correction and Bayesian colocalization with a prior-sensitivity
        grid, the intersection of false-discovery rate (FDR)-significant MR with colocalization evidence
        (PP.H4 ≥ 0.5) yielded three putative protective candidates: TNFRSF6B (OR = 0.748, 95% CI 0.666-0.840;
        PP.H4 = 0.648), FCRL2 (OR = 0.896, 95% CI 0.819-0.979; PP.H4 = 0.550), and APOD (OR = 0.789, 95%
        CI 0.647-0.963; PP.H4 = 0.503).'
