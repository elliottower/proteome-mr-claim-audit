        associated with rates of cortical Aβ accumulation measured with positron emission tomography (PET).
  c003:
    quotes:
    - exact: Longitudinal changes in a subset of candidate proteins also predicted Aβ progression, and
        the mid- to late-life (20-year) trajectory of one protein, CAT, was associated with late-life
        Aβ-positive status in the Atherosclerosis Risk in Communities (ARIC) study.
  c004:
    quotes:
    - exact: Genetic variation that influenced plasma levels of CAT, CD36 and KRT19 predicted rates of
        Aβ accumulation, including causal relationships with Aβ PET levels identified with two-sample
        Mendelian randomization.
