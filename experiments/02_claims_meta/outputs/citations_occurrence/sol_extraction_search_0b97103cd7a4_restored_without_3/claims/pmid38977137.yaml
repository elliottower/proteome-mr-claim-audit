claims:
  c000:
    quotes:
    - exact: In the Baltimore Longitudinal Study of Aging, we quantified 942 immunological proteins in
        plasma and identified 32 (including CAT [catalase], CD36 [CD36 antigen], and KRT19 [keratin 19])
        associated with rates of cortical Aβ accumulation measured with positron emission tomography (PET).
