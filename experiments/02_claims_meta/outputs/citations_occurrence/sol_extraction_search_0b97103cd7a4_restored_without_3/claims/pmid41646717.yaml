claims:
  c000:
    quotes:
    - exact: Among cardiometabolic mediators, blood lipids accounted for >40% of mediation effect linking
        LDLR-associated CpGs to AAA risk. Among immune/inflammation-related mediators, platelet count
        and circulating proteins including NEXN, IL1RN, ADH1B, and MMP12 emerged as key intermediates.
