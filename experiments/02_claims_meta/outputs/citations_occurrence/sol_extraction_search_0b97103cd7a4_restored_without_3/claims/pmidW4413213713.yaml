claims:
  c000:
    quotes:
    - exact: The strongest associations were for immune checkpoints (PDCD1, CD5, TIGIT, LAG3), chemokines
        and innate immune system proteins (NCR1, KLRB1). Whilst PDCD1 is a known cause of monogenic autoimmune
        diabetes, neither it nor most of the core proteins identified here were previously reported as
        GWAS hits for type 1 diabetes.
