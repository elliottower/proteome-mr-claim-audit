claims:
  c000:
    quotes:
    - exact: We analyze 912 plasma proteins using the large-scale UK Biobank proteomics data in 54,306
        participants and identify 7 proteins (TREM2, PILRB, PILRA, EPHA1, CD33, RET, CD55) significantly
        associated with the risk of Alzheimer's disease.
