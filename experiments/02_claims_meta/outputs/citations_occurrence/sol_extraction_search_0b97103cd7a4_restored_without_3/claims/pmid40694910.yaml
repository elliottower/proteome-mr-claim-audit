claims:
  c000:
    quotes:
    - exact: Using MR, molecular docking, MD simulations, and clinical data validation, we demonstrated
        that BPS stably binds to its target proteins, AZU1 and CTSD, and exhibits a significant causal
        relationship with depressive symptoms.
