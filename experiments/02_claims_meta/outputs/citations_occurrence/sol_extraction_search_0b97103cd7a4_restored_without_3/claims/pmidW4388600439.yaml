claims:
  c000:
    quotes:
    - exact: Analyses of the blood proteome suggest potential causal roles for several serum proteins,
        including proteins involved in redox balance (glutathione synthetase; β=-0.34, SE=0.05), mTORC1
        signalling (LAMTOR3; β=0.08, SE=0.01), and the pentose phosphate pathway (G6PE; β=0.09, SE=0.02).
        Conclusion Our analyses link several new genomic regions with DCM, and implicate redox disbalance
        and alternative usage of (gluco)metabolic pathways as putative causal mechanisms of disease.
