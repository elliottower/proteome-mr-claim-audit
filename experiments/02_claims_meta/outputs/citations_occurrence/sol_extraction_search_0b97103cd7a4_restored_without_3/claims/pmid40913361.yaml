claims:
  c000:
    quotes:
    - exact: 'Among the 2088 evaluated proteins, three showed robust evidence of causal association with
        periodontitis: FGF2 (fibroblast growth factor 2) (odds ratio [OR]: 1.06, 95% confidence interval
        [CI] 1.032-1.082), AZGP1 (zinc-alpha-2-glycoprotein) (OR: 1.12, 95% CI 1.058-1.189) and BTC (betacellulin)
        (OR: 0.86, 95% CI 0.789-0.942).'
