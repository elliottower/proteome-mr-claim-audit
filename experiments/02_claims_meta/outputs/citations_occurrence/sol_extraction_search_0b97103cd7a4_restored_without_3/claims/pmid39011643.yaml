  c000:
    quotes:
    - exact: Utilizing bidirectional MR and co-localization analyses, we identify novel associations,
        highlighting inverse relationships between plasma proteins SFTPB and KDELC2 in lung adenocarcinoma
        (LUAD) and positive associations of TCL1A with lung squamous cell carcinoma (LUSC) and CNTN1 with
        small cell lung cancer (SCLC).
