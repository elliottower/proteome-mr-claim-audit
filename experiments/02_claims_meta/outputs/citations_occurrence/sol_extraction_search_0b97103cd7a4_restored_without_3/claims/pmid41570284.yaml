claims:
  c000:
    quotes:
    - exact: Integrated multi-omics analyses identified tubulin-folding cofactor B (TBCB) as a promising
        therapeutic target for sepsis.
  c001:
    quotes:
    - exact: Quantitative analyses in both in vivo and in vitro models consistently demonstrated significant
        upregulation of TBCB during sepsis-induced liver injury.
  c002:
    quotes:
    - exact: Functional knockdown of TBCB significantly attenuated inflammatory signaling.
  c003:
    quotes:
    - exact: Mechanistically, TBCB appears to contribute to sepsis progression by modulating intracellular
        lipid metabolism and metabolic homeostasis.
