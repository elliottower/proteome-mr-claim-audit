claims:
  c000:
    quotes:
    - exact: Two plasma proteins, CX3CL1 and uromodulin (UMOD), were identified as significantly and positively
        causally associated with AKI risk, supported by genetic colocalization evidence.
  c001:
    quotes:
    - exact: Two plasma proteins, CX3CL1 and uromodulin (UMOD), were identified as significantly and positively
        causally associated with AKI risk, supported by genetic colocalization evidence.
  c002:
    quotes:
    - exact: Mediation analysis indicated that CX3CL1’s effect on AKI may be partially mediated by metabolites
        such as 1,6-anhydroglucose and Mannitol.
  c003:
    quotes:
    - exact: Mediation analysis indicated that CX3CL1’s effect on AKI may be partially mediated by metabolites
        such as 1,6-anhydroglucose and Mannitol. PheWAS revealed associations of these proteins with hypertension,
        carbohydrate metabolism disorders, and infections, suggesting potential off-target effects that
        should be considered in drug development.
