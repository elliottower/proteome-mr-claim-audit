claims:
  c000:
    quotes:
    - exact: The bidirectional MR analysis revealed different proteomic characteristics, including elevated
        levels of cathepsin H (CTSH), signal regulatory protein alpha (SIRPA), and transmembrane protein
        106B (TMEM106B) in plasma, and increased bone sialoprotein (BSP), interleukin-34 (IL-34), and
        immunoglobulin-like transcript 2 (ILT-2) in CSF, all exhibiting a positive correlation with AD
        risk.
