claims:
  c000:
    quotes:
    - exact: Followed by merging nine plasma protein datasets from six studies, a total of 5538 plasma
        proteins and three BC datasets (ieu-b-4874, ukb-b-8193, FinnGen_R11_C3_ BLADDER_EXALL) were used
        to perform proteome‑wide MR to estimate the contribution of plasma proteins to BC, separately.
        To ensure the robustness of the results, Veen intersection operation on MR results revealed that
        14 meaningful candidate pathogenic plasma proteins (ANKRD27, BIN1, FAHD1, IL17RB, MRPL21, PPT1,
        PSCA, SLC16A3, SLURP1, SPON2, TACSTD2, TMEM87B, YWHAB) were obtain from three datasets.
