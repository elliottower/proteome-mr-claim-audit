  c014:
    quotes:
    - exact: Mediation MR implicated CD11c-expressing monocytes (Z = –2.197, p = 0.028) in the GSTM-breast
        cancer pathway.
  c015:
    quotes:
    - exact: Notably, lower GSTM1/4 expression levels correlated with poorer clinical outcomes in breast
        cancer patients.
