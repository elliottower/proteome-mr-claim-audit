claims:
  c000:
    quotes:
    - exact: Several proteins [glutathione S-transferase mu (GSTM) 1, N-acylsphingosine amidohydrolase
        2 (ASAH2), TNF superfamily member 12 (TNFSF12), hematopoietic prostaglandin D synthase (HPGDS),
        nidogen 2 (NID2), SEMA4D, snurportin 1 (SNUPN), GSTM3, MYC-associated factor X (MAX), pregnancy
        zone protein (PZP), GSTM4, and uroporphyrinogen decarboxylase (UROD)] were significantly associated
        with breast cancer.
