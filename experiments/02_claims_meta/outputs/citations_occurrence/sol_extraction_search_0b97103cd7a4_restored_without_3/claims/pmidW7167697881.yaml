claims:
  c000:
    quotes:
    - exact: In the most informative MTAG model, genetically predicted higher IVD protein abundance in
        blood increased PCOS susceptibility (OR = 1.21, 95% CI 1.06-1.39), and multiple IVD CpG instruments
        showed risk-enhancing methylation effects (e.g. cg02378269,OR=1.10; cg08129084,OR=1.05; cg20069584,OR=1.21).
  c001:
    quotes:
    - exact: Pituitary eQTL instruments indicated lower PCOS risk with higher IVD expression (OR = 0.94;
        95% CI, 0.89-0.98).
  c002:
    quotes:
    - exact: In ovarian RNA-seq, IVD expression was reduced in PCOS versus controls (P < 0.05).
  c003:
    quotes:
    - exact: In ovarian RNA-seq, IVD expression was reduced in PCOS versus controls (P < 0.05). In primary
        granulosa cells, IVD was downregulated and inversely correlated with androstenedione, anti-Müllerian
        hormone (AMH) and antral follicle count.
