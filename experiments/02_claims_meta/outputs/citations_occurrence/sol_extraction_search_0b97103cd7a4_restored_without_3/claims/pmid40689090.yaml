claims:
  c000:
    quotes:
    - exact: We identified 29 genetically proxied proteins potentially causal to at least one lipid measure,
        12 of which showed strong colocalisation and GMR evidence, including angiopoietin-related protein
        3 (ANGPTL3), proprotein convertase subtilisin/kexin type 9 (PCSK9), and cadherin EGF LAG seven-pass
        G-type receptor 2 (CELSR2).
