  c003:
    quotes:
    - exact: Notably, PCSK9 demonstrated a stronger association with LDL-C in Europeans compared to South
        Asians (βEuropean = 0.37; 95% CI 0.36, 0.38, βSouth Asian = 0.16; 95% CI 0.11, 0.21).
  c004:
    quotes:
    - exact: Notably, PCSK9 demonstrated a stronger association with LDL-C in Europeans compared to South
        Asians (βEuropean = 0.37; 95% CI 0.36, 0.38, βSouth Asian = 0.16; 95% CI 0.11, 0.21).
  c005:
    quotes:
    - exact: Observational analysis suggested statistically significant interaction between PCSK9 levels
        with LDL-C levels in South Asians with South Asians having a significantly lower effect compared
        to other ethnicities (PCSK9∗South Asian; β = -0.14; 95% CI -0.174, -0.107).
  c006:
    quotes:
    - exact: Additionally, we showed that CELSR2 is also linked with coronary artery disease in South
        Asians.
  c007:
    quotes:
    - exact: Our study highlighted potential causal links between plasma proteins, dyslipidaemia, and
        CVDs in South Asians and highlighted protein targets, including CELSR2, PCSK9, ANGPTL3, and Apolipoprotein(a)
        (LPA).
