claims:
  c000:
    quotes:
    - exact: We found that high DHCR24 mRNA expression is associated with poorer patient prognosis and
        is elevated in luminal and HER2+ subtypes.
  c001:
    quotes:
    - exact: We found that high DHCR24 mRNA expression is associated with poorer patient prognosis and
        is elevated in luminal and HER2+ subtypes.
  c002:
    quotes:
    - exact: Surprisingly, DHCR24 knockdown enhanced malignant phenotypes in MCF7 cells, contrasting its
        pro-tumor role in patients.
  c003:
    quotes:
    - exact: Integrated analysis resolved this paradox, revealing that DHCR24 promotes BC progression
        non-cell-autonomously by remodeling an immunosuppressive tumor microenvironment, rather than by
        intrinsically driving cancer cell proliferation.
  c004:
    quotes:
    - exact: Mechanistically, DHCR24 depletion upregulated TP53 and downregulated SQLE.
  c005:
    quotes:
    - exact: Mechanistically, DHCR24 depletion upregulated TP53 and downregulated SQLE.
  c006:
    quotes:
    - exact: This study establishes DHCR24 as a pivotal metabolic-immune node and a promising therapeutic
        target for disrupting the cholesterol-immune axis in luminal and HER2+ BC.
