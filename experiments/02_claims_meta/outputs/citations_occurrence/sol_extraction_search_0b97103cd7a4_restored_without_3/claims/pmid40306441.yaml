claims:
  c000:
    quotes:
    - exact: We found that CHIT1, OSM, SIRT2, CDCP1 and 5 other factors were significantly increased in
        sporadic ALS patients in both cohorts and that SIRT2, CDCP1 and 6 other factors were different
        between genetic ALS patients and HCs.
