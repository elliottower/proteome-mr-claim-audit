  c006:
    quotes:
    - exact: Using XGBoost and binary logistic regression analysis, we developed a two-serum protein diagnostic
        panel (CHIT1 and CDCP1), and the area under the curve (AUC) was 0.904 in the original cohort and
        0.907 in the replication cohort. Based on Mendelian Randomization (MR), OSM and SIRT2 are significantly
        associated with the risk of ALS.
