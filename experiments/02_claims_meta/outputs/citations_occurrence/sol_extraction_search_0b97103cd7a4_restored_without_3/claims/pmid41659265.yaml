claims:
  c000:
    quotes:
    - exact: Our unbiased genetic screen identified Rac GTPase-activating protein 1 (RACGAP1) as a high-confidence
        causal risk factor for LUAD.
  c001:
    quotes:
    - exact: Clinically, elevated RACGAP1 expression served as a robust, independent prognostic biomarker
        associated with poor survival across multiple cohorts.
  c002:
    quotes:
    - exact: Single-cell profiling revealed that RACGAP1 defines a specific expanding epithelial subpopulation
        characterized by chromosomal instability (CIN) and apoptosis resistance.
  c003:
    quotes:
    - exact: Single-cell profiling revealed that RACGAP1 defines a specific expanding epithelial subpopulation
        characterized by chromosomal instability (CIN) and apoptosis resistance.
  c004:
    quotes:
    - exact: Mechanistically, RACGAP1 transcends its canonical role in cytokinesis to function as a pivotal
        oncogenic hub. It disables p53-mediated tumor suppression by upregulating MDM2, while concurrently
        activating the pro-survival PI3K/AKT and MEK/ERK signaling cascades.
