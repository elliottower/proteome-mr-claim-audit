claims:
  c000:
    quotes:
    - exact: By combining the genetic determinants of 1159 circulating proteins from the Prospective Urban
        and Rural Epidemiological cohort with those of Df using Mendelian randomization, we identified
        eight causal mediators, including MMP12 and IgG-Fc receptor IIb, which link higher inflammation
        to lower Df, increased cardiovascular disease risk, and shorter life span.
