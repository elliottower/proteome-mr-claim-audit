[project]
name = "proteome-mr-claim-audit"
version = "0.1.0"
description = "Preregistered census of proteome-wide Mendelian-randomization protein-outcome claims"
requires-python = "==3.12.*"
dependencies = [
    "httpx==0.28.1",
    "modal==1.4.3",
    "numpy==2.5.3",
    "openpyxl==3.1.5",
    "pyarrow==21.0.0",
    "pydantic==2.13.5",
    "pypdf==5.9.0",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.6",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false
