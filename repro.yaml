# Numbers this repository states, and the files they were read from.
#
# Before the freeze the only numbers stated are the PubMed feasibility counts in PREREG.md,
# §Explanation of foreknowledge, item 8. Each is bound to the counts file that produced it. The
# plan itself is not pinned here: its whole-file sha256 changes with every `prereg log` line, and
# `prereg check` is its record. Manuscript claims are added as the manuscript is written, each
# bound to the ledger run behind it (experiments/02_claims_meta/RUNBOOK.md, §Results ledger).
